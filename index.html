rong>聖經自己就有不順服的例子，而且是被稱讚的：希伯來收生婆「敬畏神，不照埃及王的吩咐行，竟存留男孩的性命」（出 1:17）；使徒在公會前說「順從神，不順從人，是應當的」（徒 5:29）。保羅自己把「搶人口」列為敵正道的罪（提前 1:10）。無條件順服會讓施暴的丈夫、剝削的老闆、不義的權力，躲在經文後面；這正是提多書最不願意看見的：讓「神的道理被毀謗」。</p>"],["權宜策略說（三段順服只是當時的宣教策略，今天已經作廢）","","<p>部分學者與社會關懷的讀者主張：保羅生活在一個奴隸制、父權、帝國統治的社會，他要信徒順服，是為了不讓剛起頭的教會被看成叛亂團體；今天的社會結構已經改變，這些吩咐就不再適用。這派的優點是看見了經文的處境，也看見了每一段都附帶的宣教目的（2:5、2:10、3:1--2），並且誠實承認這幾段經文在歷史上被誤用過。</p><p><strong>難處：</strong>若一律作廢，就連同把經文裡真實的生命教導一起丟了：「不可私拿東西，要顯為忠誠」（2:10）、「不要毀謗，不要爭競，總要和平，向眾人大顯溫柔」（3:2），今天一樣是基督徒在職場與社會中的見證。而且這三段的根據不只是社會風俗，3:3 立刻說「我們從前也是無知、悖逆」——順服與溫柔的根是蒙了憐憫的記性，這一點不會因社會結構改變而作廢。</p>"],["選擇性順服說（只順服我認同的權柄）","","<p>這是許多信徒實際上的作法：好的丈夫、好的老闆、我支持的政府，我就順服；不好的，我就不必順服，甚至可以公開毀謗。這派的優點是有道德感，不願為不義背書，也看見了順服有界線。</p><p><strong>難處：</strong>提多書寫給克里特的信徒時，他們上面的作官的、掌權的，多半不認識神；保羅仍然要他們「預備行各樣的善事」「不要毀謗」（3:1--2）。界線不在「我喜不喜歡這個人」，而在「這個要求是不是叫我犯罪、違背良心、或危害生命」。把順服變成按好惡挑選，很容易讓教會被某一種立場綁住，失去向「眾人」大顯溫柔的能力。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場（本卷新立）：三段順服都朝外——為了福音的名聲，不是為了任何人的權力；三段都只對順服的一方說話，沒有一句授權丈夫、主人、官長拿這幾節去要求別人——誰拿這幾節去管人，誰就離開了本位。</strong></p><p>順服有界線：遇到要求犯罪、違背良心、或危害生命安全時，「順從神，不順從人」（徒 5:29）。具體說：①<strong>家暴不在順服的範圍</strong>——先保護生命、依法求助、教會協助通報（見 ISS00_2）；②<strong>新約不為奴隸制背書</strong>——保羅在提前 1:10 把「搶人口」列為罪；2:9--10 落到今天的職場，重點是「顯為忠誠」，<strong>忠誠是品格，不是無條件服從</strong>；剝削、霸凌、欠薪、違法的命令都不在順服的範圍，使用勞動法、申訴管道與離職的自由，不違背 2:9；③<strong>本講義不為任何當代政權背書，也不攻擊任何當代政權，不點名政黨或政治人物</strong>；3:1 要信徒作好公民、預備行善，3:2 同時要信徒「向眾人大顯溫柔」——包括和自己政治立場不同的弟兄姊妹。為在位者禱告與順服，沿用提摩太前書紅線九（提前 2:1--2）。</p><p><strong>321 的落點：「謙卑是放下權力回到本位」「讓人作人，讓神作神」。</strong>順服的人，是在神面前放下自己；要求別人順服的人，若是為了自己，就是離開本位、抓住權力。全卷的權柄最終屬於「至大的神和我們救主耶穌基督」（2:13），所有地上的權柄都在他之下。長老、權柄與屬靈虐待，回指彼得前書立場五。</p>"],["【四】這件事該不該影響你的信心","","<p>教會在順服的界線上有不同的實踐，這不該影響你的信心；各宗派都同意：順服是為了神，界線也是神定的。</p><p>但有一件事該問自己：<strong>我讀這幾節，是在問「我要怎樣活出福音的美」，還是在找經文要求別人聽我的？</strong>三段順服的中心都不是權力，是一個要被尊榮的名字：「以致凡事尊榮我們救主神的道」（2:10）。而那位救主，自己是「為我們捨了自己」（2:14）的；他沒有要求別人順服他來成就自己，他順服到死，來成就我們。</p>"]],"con":[],"say":"本講義的全卷立場（本卷新立）：三段順服（2:5；2:9--10；3:1--2）都朝外，是為了福音的名聲，不是為了任何人的權力；三段都只對順服的一方說話，沒有授權任何人強迫別人順服。遇到要求犯罪、違背良心或危害生命時，順從神，不順從人（徒 5:29）；家暴與剝削不在順服的範圍；本講義不為任何政權背書或攻擊，也不點名政黨或政治人物。","care":"席上會有被老闆欠薪、被主管霸凌卻以為「基督徒要順服」而不敢申訴的弟兄姊妹；有在家裡被控制、被打卻被勸「再順服一點」的妻子；有在不同國家、不同政治處境下生活，對「順服作官的」有截然不同感受的肢體——在國度321空中團契裡，他們常常在同一個聚會裡。牧者要陪受剝削的人看清：申訴、求助、離開都不是不屬靈；陪受暴力的人先確保安全、依法求助、教會協助通報。不要說「順服就是不問理由」「申訴就是不順服」「你被欺負是神在磨練你」；也不要在講台上評價任何國家的領袖、替任何政黨拉票，讓不同立場的弟兄姊妹在同一張桌前都還坐得下。"},{"id":"ISS00_6","t":"寫作年代與保羅的行程——尼哥坡里在哪裡？","r":"1:5；3:12","ch":[],"why":"六、約主後 63--65 年，保羅第一次羅馬監禁獲釋之後、提摩太後書之前；3:12 尼哥坡里多數認為在希臘西岸的伊庇魯斯。年代與地點看起來只是背景知識，卻決定我們怎樣讀這封信的語氣：這是一位剛出監、知道日子不多的老使徒，趕在冬天以前安排同工、交接工作的信。讀出這個處境，3:12--15 那幾行名單就不是可以跳過的附錄，而是一個人在有限的時間裡，把教會交到可託付之人手上的最後安排。","pos":[["【一】經文問的是甚麼","","<p>提多書給了幾個時間與地點的線索：保羅「從前留你在克里特」（1:5），表示兩人曾一同在克里特工作，保羅先離開；保羅要派「亞提馬或是推基古」去接替提多，並說「你要趕緊往尼哥坡里去見我，因為我已經定意在那裡過冬」（3:12）；又要提多「趕緊給律師西納和亞波羅送行」（3:13），看來亞波羅此時正路過克里特。</p><p>新約只在這裡提到「尼哥坡里」，但古代地中海世界至少有幾個叫這名字的城（意思是「勝利之城」）：希臘西岸伊庇魯斯的尼哥坡里（奧古斯都為紀念亞克興海戰勝利所建）、色雷斯的尼哥坡里、基利家的尼哥坡里。<strong>經文問的是：提多書寫在保羅一生的哪一段？3:12 的尼哥坡里是哪一個？這和提摩太後書「提多往撻馬太去」（提後 4:10）怎樣接？</strong></p>"],["獲釋後再旅行說（約主後 63--65 年）","","<p>這是持保羅作者說的學者最常見的排法：使徒行傳停在保羅在羅馬租屋「住了足足兩年」（徒 28:30）；之後他獲釋，再次旅行，到過克里特、以弗所、馬其頓，打算在伊庇魯斯的尼哥坡里過冬；後來再次被捕，在羅馬寫提摩太後書，約主後 67 年前後殉道。伊庇魯斯的尼哥坡里位在愛奧尼亞海邊、亞克興灣口，是往西去的港口，正好接得上保羅想去西班牙的計畫（羅 15:24、28），也接得上提摩太後書說提多後來「往撻馬太去」——撻馬太就在伊庇魯斯北邊。</p><p><strong>難處：</strong>這一排法依賴使徒行傳以外的資料——新約沒有直接記載保羅獲釋，要靠腓立比書與腓利門書的盼望（腓 1:25；門 1:22）、以及初代教會的傳統來補。它是最順的排法，但誠實地說，是「最可能的重建」，不是經文直接寫出來的時間表。</p>"],["使徒行傳期間說（克里特之行發生在以弗所工作期間）","","<p>少數學者主張，提多書可能寫在使徒行傳記載的時期之內：保羅在以弗所前後三年（徒 20:31），其間可能有一次短暫的克里特之行，使徒行傳沒有記載（路加本來就沒有記下保羅所有的行程，這使我們想起保羅說自己「遇著船壞三次」（林後 11:25），寫哥林多後書以前的這三次，使徒行傳一次也沒記）。這派的優點是不必依賴使徒行傳以外的傳統，也解釋了為甚麼亞波羅（以弗所、哥林多時期的人物）出現在 3:13。</p><p><strong>難處：</strong>使徒行傳在以弗所時期的敘述相當詳細，要插進一段「留提多在克里特、各城設立長老」的工作，空間很緊；3:12 要在尼哥坡里過冬的計畫，也很難和使徒行傳 20 章從馬其頓到希臘、再上耶路撒冷的行程接上。而且提多書的語氣、用字與提摩太前書、提摩太後書最接近，三封放在一起寫在晚年，比較自然。</p>"],["託名說的年代（主後 80--100 年或更晚）","","<p>持託名說的學者，把教牧書信放在保羅死後，主後一世紀末甚至二世紀初；信中的地名與人名，被看成作者為了營造「保羅晚年」的場景而設計的文學細節。這派的優點是一致：既然認為作者不是保羅，年代自然也就晚了。</p><p><strong>難處：</strong>這一說最難解釋的，就是這些細節本身：一個冒名者為甚麼要寫「亞提馬或是推基古」這種還沒決定的安排？為甚麼要提一個「律師西納」？為甚麼要讓保羅打算在某個城過冬？這些話在保羅死後沒有任何教導的用途。它們最自然的解釋，是一封真實的信裡真實的交代。託名說的處理見 ISS00_1。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：約主後 63--65 年，保羅第一次羅馬監禁獲釋之後、提摩太後書之前；與提摩太前書寫在相近的時間（見 ISS00_7）。3:12 的尼哥坡里採希臘西岸伊庇魯斯的尼哥坡里，其他兩城並陳。</strong>這是最可能的重建，講台上可以說「多半是」，不必說成定論。</p><p>這個年代讓我們讀出信的溫度：保羅已經不年輕，剛從羅馬的軟禁出來，知道自己還有一段路，但不知道多長。他在一封短信的結尾，安排了四個同工的動向——亞提馬、推基古接替，西納、亞波羅送行；<strong>他沒有在信末寫自己的成就，只寫「叫他們沒有缺乏」（3:13）。</strong>一個在晚年忙著照顧別人行程的使徒，是 321「建立屬神的體系」最動人的樣子：體系不是一套組織圖，是一群彼此成全的人。</p>"],["【四】這件事該不該影響你的信心","","<p>年代早幾年、晚幾年，尼哥坡里是哪一個城，這些不該影響你的信心；福音的真實不靠我們把每一個行程都排得精準。</p><p>但有一件事該問自己：<strong>如果我知道自己能服事的日子有限，我會把時間花在哪裡？</strong>保羅把最後的力氣花在「在各城設立長老」（1:5）、在安排同工、在給亞波羅送行。他相信接下來的路，是那位「神我們救主」親自帶領的；所以他可以在冬天以前，把工作安心地交出去。</p>"]],"con":[],"say":"本講義的全卷立場：提多書約寫於主後 63--65 年，保羅第一次羅馬監禁獲釋之後、提摩太後書之前；3:12 的尼哥坡里多半是希臘西岸伊庇魯斯的尼哥坡里，其他說法並陳。這是最可能的重建，不是定論，講台上只說「多半是」，把重點放在保羅晚年怎樣把工作交給可託付的人。","care":"席上會有年紀大、覺得自己快要「退場」的長輩同工，他們聽到保羅晚年的安排會很有感觸；也有被派到一個陌生地方、不知道要待多久的年輕同工。牧者可以用 3:12--13 陪長輩想：怎樣把手上的服事交給下一代，而不是覺得自己沒有用了；陪年輕同工想：被留下來收拾殘局，不是被放棄。不要用年代的討論在講台上炫學問，也不要說「這些背景不重要，跳過就好」；更不要把「過冬」講成任何末世時間表。"},{"id":"ISS00_7","t":"提多書與提摩太前書——誰先寫？為甚麼內容相近？","r":"1:5--16","ch":[],"why":"七、兩封信寫在相近的時間、處理相近的問題；提摩太前書講「家的秩序」，提多書講「恩典教人行善」；先後並陳，不影響兩卷的權威。讀過提摩太前書講義的人，一打開提多書就會發現很多熟悉的句子：長老的資格、「只作一個婦人的丈夫」、假教訓與家譜、「這話是可信的」。有人因此以為提多書只是提摩太前書的縮寫版，可以略過；也有人藉著兩封信的相似，論證它們是同一位作者的公式化作品。這一題要說清楚兩卷的關係與分工。","pos":[["【一】經文問的是甚麼","","<p>兩封信相似的地方很多：開頭都稱收信人是「真兒子」（提前 1:2；多 1:4）；都有長老（監督）的資格清單（提前 3:1--7；多 1:5--9），而且都要求「只作一個婦人的丈夫」；都有假教訓與家譜的問題（提前 1:4；多 3:9）；都有「這話是可信的」（提前 3:1；多 3:8）。提多書 1:5--16 讀起來，幾乎就是提摩太前書第 1 章與第 3 章的合併。</p><p>可是兩封信也有明顯的不同：提摩太在以弗所，那裡的教會已經建立十多年，有長老、有寡婦名冊；提多在克里特，教會剛起頭，「各城」都還沒有長老（1:5）。提摩太前書有執事的資格清單（提前 3:8--13），提多書沒有；提多書兩段福音總綱（2:11--14；3:4--7），則比提摩太前書任何一段都完整。<strong>經文問的是：兩封信誰先寫？為甚麼內容這麼相近？讀過提摩太前書，還需要細讀提多書嗎？</strong></p>"],["提摩太前書先寫說","","<p>這是傳統排列，也是多數學者的看法：保羅往馬其頓去時，留提摩太在以弗所（提前 1:3），寫了提摩太前書；不久之後，他寫信給在克里特的提多，用了相近的材料，但寫得更精簡，因為克里特的教會比以弗所年輕、問題比較基本。理由之一是提多書沒有提到執事，而提摩太前書有——新教會先設長老，等教會長大才需要執事。</p><p><strong>難處：</strong>「精簡」不一定代表「後寫」；一位作者也可能先寫短的、再寫長的。而且提多書的福音總綱比提摩太前書更完整，若是後寫，為甚麼反而加長了福音的部分？這說明兩封信的長短與內容，取決於兩地的需要，不太能用來排先後。</p>"],["提多書先寫說","","<p>部分學者主張提多書先寫：克里特之行可能在以弗所之前；提多書處理的問題比較初步（設立長老、堵住假師傅的口），提摩太前書處理的是更成熟教會的問題（寡婦名冊、對長老的控告、富足的人）。照教會發展的次序，先有提多書那樣的「奠基」，後有提摩太前書那樣的「整理」。</p><p><strong>難處：</strong>兩封信處理的是兩個不同年齡的教會，教會發展的先後，不等於寫信的先後；保羅可能在同一段時間裡，同時照顧一個老教會和一個新教會。這一說和「提摩太前書先寫」一樣，都只能是推測；新約沒有給我們足夠的線索作定論。</p>"],["同一份公式的兩個版本說（兩封信是同一位作者為不同地點量身改寫的範本）","","<p>持託名說的學者，常把兩封信的相似看成證據：同一位第二代作者，用一套教會秩序的範本，配上不同的人名、地名，寫成兩封「保羅的信」。這派的優點是認真處理了兩封信用字的高度重疊，提醒我們不要只看相同之處。</p><p><strong>難處：</strong>若是同一份範本，兩封信的差異就很難解釋：為甚麼一封有執事、一封沒有？為甚麼一封有寡婦名冊、一封有老年婦人帶少年婦人？為甚麼提多書特別點出「那奉割禮的」（1:10）和克里特詩人的話（1:12）？這些差異正好對應兩地不同的處境，反而說明兩封信是寫給真實的、不同的教會。託名說的處理見 ISS00_1。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：兩封信寫在相近的時間（約主後 63--65 年，見 ISS00_6），處理相近的問題；誰先誰後並陳，不定案，也不影響兩卷的權威。</strong></p><p>兩卷的分工，本系列這樣定：<strong>提摩太前書講「家的秩序」——神的家當怎樣行；提多書講「恩典教人行善」——恩典怎樣把一群「常說謊話」的人，教成「熱心為善」的子民</strong>；提摩太後書（尚未製作）講「傳承與受苦」。凡提摩太前書講義已講過的——長老與監督的資格（第 3 章）、性別與家庭（第 2 章）、寡婦與孝道（第 5 章）、錢（第 6 章）——本卷只講提多書自己多出來的那一筆，不重講。</p><p>提多書多出來的，正是它最寶貴的：兩次「顯明」（2:11；3:4）、「至大的神和我們救主耶穌基督」（2:13）、「重生的洗和聖靈的更新」（3:5）、「我們從前也是」（3:3）。<strong>提摩太前書的中心是一座家，提多書的中心是一場醫治：病人是克里特，也是我們；醫生是「神我們救主」。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>兩封信誰先誰後，不該影響你的信心；兩封都是神藉著使徒賜給教會的話。</p><p>但有一件事該問自己：<strong>我是不是因為覺得「這些我都聽過了」，就錯過了神要對我說的新話？</strong>提多書和提摩太前書像兩位醫生開出相近的藥方，給兩個不同的病人；你今天比較像以弗所那個已經很有秩序、卻可能失去起初之愛的教會，還是像克里特那個剛起頭、一切都還沒有辦完的教會？不論哪一個，這封信都在說同一句話：「神救眾人的恩典已經顯明出來」（2:11）。</p>"]],"con":[],"say":"本講義的全卷立場：提多書與提摩太前書寫在相近的時間，處理相近的問題；誰先誰後並陳，不影響兩卷的權威。提摩太前書講「家的秩序」，提多書講「恩典教人行善」；凡提摩太前書講義講過的，本卷只講提多書多出來的那一筆。","care":"席上會有剛讀完提摩太前書、覺得提多書「都一樣」而失去胃口的人；也有在老教會裡服事多年、覺得一切都已經上軌道的同工，以及在新植堂、小組或網路團契裡，凡事都要從零開始、常常灰心的帶領者。牧者可以用兩卷的對照陪他們看見：老教會需要的是不失去起初的愛，新教會需要的是不被「沒有辦完的事」壓垮。不要說「提多書只是提摩太前書的縮寫，大概看看就好」，也不要拿兩個教會互相比較，說誰比較屬靈。"},{"id":"ISS00_8","t":"書信的處境——克里特是怎樣的教會？「克里特人常說謊話」該怎樣讀？","r":"1:5；1:10--14；2:1","ch":[],"why":"八、原則照守、落點隨處境——沿用哥林多前書立場一（林前 ISS00_1）；本卷補述：一個剛起頭、各城還沒有長老、有「奉割禮的」教師在敗壞全家的教會；1:12 是克里特人的自白，不是保羅貼的族群標籤。提多書是一封寫給特定地方的信，地方的特色又特別鮮明：一句「克里特人常說謊話」，讓這卷書在歷史上被拿來開過不少族群、地域的玩笑。若不在開卷講定怎樣讀這封信的處境，會眾不是把處境整個搬到今天，就是把整封信當成與己無關的古代史。","pos":[["【一】經文問的是甚麼","","<p>克里特是地中海東部的大島，荷馬稱它「百城之島」。五旬節的時候，耶路撒冷的聽眾裡就有「克里特和阿拉伯人」（徒 2:11），福音可能比保羅更早到了島上。保羅留提多在那裡，是因為工作還沒有辦完：「各城」還沒有長老（1:5）；「因為有許多人不服約束，說虛空話欺哄人；那奉割禮的更是這樣。這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家」（1:10--11）。</p><p>然後保羅引了一句話：「有克里特人中的一個本地先知說：『克里特人常說謊話，乃是惡獸，又饞又懶。』」（1:12）這句詩傳統歸給克里特本地的詩人厄庇墨尼得斯；保羅在雅典也引過希臘詩人的話（徒 17:28）。<strong>經文問的是：這封信寫給一個怎樣的教會？1:12 是保羅對一個民族下的判斷嗎？今天讀這封信的人，該怎樣把克里特的處境轉到自己身上？</strong></p>"],["照搬說（信中的吩咐原封不動就是今天的規條）","","<p>這種讀法把書信當成法典：凡保羅對克里特說的，今天一字不改照做。優點是尊重經文的權威，不讓人用「時代不同」輕易繞過不想聽的話。</p><p><strong>難處：</strong>照搬說最危險的一處，就是 1:12：若把「克里特人常說謊話」照搬成「某某地方的人就是愛說謊」，就把一句一個民族對自己的自嘲，變成了對另一群人的定罪。照搬說也讀不出每一段吩咐背後的「因為」——保羅自己一再說明理由：「免得神的道理被毀謗」（2:5）、「叫那反對的人……便自覺羞愧」（2:8）。不問「因為」，就容易把處境性的落點當成永遠的條文，又把真正永遠的原則講輕了。</p>"],["純處境說（提多書寫給第一世紀的克里特，與今天無關）","","<p>這種讀法看重歷史背景：克里特的假教訓、奉割禮的教師、本地詩人的評語，都是那時那地的事；今天的教會有自己的問題，不必從這封信裡找答案。優點是誠實面對經文的處境，提醒讀者不要用自己的時代去扭曲古代的文字。</p><p><strong>難處：</strong>若只剩處境，這封信就失去了它最核心的話：「神救眾人的恩典已經顯明出來」（2:11），「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫」（3:5）——這些話保羅寫的時候，就是寫給所有世代的福音。而且今天的教會一樣有「說是認識神，行事卻和他相背」（1:16）的人，一樣有在網路上「敗壞人的全家」的教導；克里特離我們沒有那麼遠。</p>"],["族群評價說（1:12 是保羅對克里特人的民族性判斷）","","<p>有些讀者認為，保羅說「這個見證是真的」（1:13），就是贊同這句對整個民族的評語；有人因此認為聖經容許對某些族群作整體的道德評價。這派的優點是不迴避 1:13 那句令人不安的話，承認保羅確實引用了它，也確實說它「是真的」。</p><p><strong>難處：</strong>1:13 接著說的是「所以，你要嚴嚴地責備他們，使他們在真道上純全無疵」——「他們」是指 1:10--11 那些說虛空話的教師，不是全體克里特人；保羅的目的是醫治，不是定罪。更重要的是，到了 3:3，保羅把自己也放進去：「我們從前也是無知、悖逆、受迷惑」；同一個「悖逆」（ἀπειθεῖς），1:16 用在「他們」，3:3 用在「我們」。而這封信的結局，是這群人要成為神「特作自己的子民，熱心為善」（2:14）。保羅沒有給克里特人貼標籤，他給他們帶來福音。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由一定要講出來。</strong>全卷每一章照「書信」三問來讀：①克里特的教會遇到甚麼？②保羅從福音推出甚麼原則？③今天這原則落在哪裡？</p><p>本卷補兩點。第一，<strong>克里特是一個剛起頭的教會</strong>：各城沒有長老、假教訓「敗壞人的全家」、社會風氣連本地詩人都自嘲——<strong>神沒有把福音送到最好的地方，而是送到最難的地方。</strong>今天的克里特，是剛起頭、同工不夠的植堂與小組，是假教訓在網路上流竄的地方，也是國度321空中團契散在各國、需要「在各城設立」可託付之人的弟兄姊妹。</p><p>第二，<strong>1:12 是克里特人自己詩人的話，是一個民族自己承認的病，不是保羅貼的族群標籤。</strong>本講義在任何地方講到 1:12，都必說明這一點，並在同一章帶出 2:14「特作自己的子民」；<strong>絕不用 1:12 對任何族群、地域、國籍的人貼標籤或開玩笑。</strong>開頭的「那無謊言的神」（1:2）對上「常說謊話」的克里特人（1:12），這個對比要說的不是克里特人多壞，而是神多信實：他偏偏把真理送到一群說謊的人中間。</p>"],["【四】這件事該不該影響你的信心","","<p>克里特的詳細歷史、厄庇墨尼得斯是不是那位詩人、奉割禮的教師到底教了甚麼，學者仍有討論，這些不該影響你的信心。</p><p>但有一件事該問自己：<strong>我讀 1:12，是在想「那些人就是這樣」，還是在想「我從前也是」？</strong>每一個民族、每一個地方、每一個人都有自己的「克里特病」；福音不是讓我們看不起別人的病，而是讓我們承認自己的病，然後一同被那位「神我們救主」醫治。克里特就是一個反敗為勝的地方。</p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，每一章照「書信」三問來讀。克里特是一個剛起頭、各城還沒有長老、有假教訓敗壞全家的教會；1:12 是克里特人自己詩人的話，是一個民族自己承認的病，不是保羅貼的族群標籤；講到 1:12，同時講 2:14 神「特作自己的子民」。","care":"席上會有從小被人用地域、族群、口音取笑過的人——新住民、外籍配偶、在異鄉工作的弟兄姊妹、少數族群的肢體；在國度321空中團契這樣散在各國的群體裡，一句不小心的地域玩笑，就可能讓螢幕另一端的人默默離線。牧者講 1:12 要先說清楚這是克里特人的自白，再講 3:3「我們從前也是」，最後講 2:14 神「特作自己的子民」。不要說「某某地方的人就是這樣」，不要用任何族群、地域、國籍開玩笑，即使是自己的族群；也不要把網路上的假教訓，套到某一個地方或某一群人身上。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"全卷；2:13；3:5；1:6","ch":[],"why":"九、2:13 一位或兩位、3:5 重生的洗、1:6 兒女信主——三個最大的爭議，都不動搖本卷的中心：「他便救了我們……乃是照他的憐憫」（3:5）。提多書只有三章，卻碰到新約最重要的基督論經節之一（2:13）、宗派之間爭論最久的洗禮經文（3:5）、最容易傷害牧者家庭的資格經文（1:6），還有作者、年代、處境種種討論。一位認真讀完議題頁的信徒很可能會問：這麼多不確定，我還能確定甚麼？這一題要把全卷的爭議放回正確的位置。","pos":[["【一】經文問的是甚麼","","<p>提多書有三個最大的爭議。第一，2:13「等候至大的神和我們救主耶穌基督的榮耀顯現」——原文一個冠詞 τοῦ 管著「至大的神」與「救主」兩個名詞，可以讀成一位（耶穌基督就是至大的神與我們的救主），也可以讀成兩位（至大的神，和我們的救主耶穌基督）；和合本註腳作「或譯：神－我們救主」。第二，3:5「藉著重生的洗和聖靈的更新」——這「洗」是水禮本身、水禮所印證的內在工作、還是聖靈潔淨的比喻？第三，1:6「兒女也是信主的」——πιστά 是「信主的」還是「忠實可靠的」？</p><p>同時，保羅在這封信裡也明說，有些爭論要遠避：「要遠避無知的辯論和家譜的空談，以及紛爭，並因律法而起的爭競，因為這都是虛妄無益的」（3:9）。<strong>經文問的是：面對這些爭議，一個信徒該怎樣自處？問問題是不是不信？保羅叫人遠避的爭論，和我們認真研究的問題，有甚麼不同？有沒有甚麼是不會因爭議而動搖的？</strong></p>"],["爭議證明聖經不可靠","","<p>這是懷疑者常有的推論：連 2:13 到底說耶穌是不是神都有兩種讀法，連洗禮能不能使人重生各宗派都說不一致——可見聖經意思含糊，不值得全然信靠。這派的優點是誠實，它不假裝問題不存在，也逼著教會不能只用「信就對了」回答。</p><p><strong>難處：</strong>這些爭議幾乎全部發生在「怎樣理解某一節」的層次，不在「神做了甚麼」的層次。主張 2:13 是兩位的人，大多同樣相信基督的神性，因為新約別處說得很清楚：多馬說「我的主！我的神！」（約 20:28），保羅說基督「是在萬有之上，永遠可稱頌的神」（羅 9:5）；彼得後書也有同樣的句型（彼後 1:1）。對 3:5 有不同理解的宗派，都同意同一節的前半：「並不是因我們自己所行的義，乃是照他的憐憫」。爭議多，表示這卷書被認真讀了兩千年，不表示它不可信。</p>"],["只要信，不要問（遠避一切辯論）","","<p>這是教會裡常見的反應：保羅都說了「要遠避無知的辯論」（3:9），所以這些爭議不要在教會裡講，信徒只要單純地信就好。這派的優點是保護軟弱的信徒不被過多的資訊淹沒，也提醒我們：信心不是靠學問得來的，而且教會確實常因為爭論而分裂。</p><p><strong>難處：</strong>3:9 要遠避的是「無知的」辯論、「家譜的空談」、「因律法而起的爭競」——是那些不求真理、只求贏的爭論；保羅同時要長老「堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人駁倒了」（1:9），這需要認真讀經、回答問題。不准問的信心最脆弱，一旦有一天在別處聽見這些問題，就會以為教會一直在隱瞞甚麼；而把提問的人當成「分門結黨的人」（3:10），正是紅線七要防備的誤用——αἱρετικός 是製造分裂的人，不是提出問題的人。</p>"],["每一題都要分出勝負（爭議就是信仰的戰場）","","<p>另一端的反應，是把每一個爭議都當成必須打贏的仗：2:13 讀成兩位的人就是否認基督神性，對 3:5 理解不同的宗派就是傳了別的福音，1:6 採寬鬆讀法的教會就是妥協。這派的優點是認真看待真理，不願意含糊其辭。</p><p><strong>難處：</strong>這正是 3:9--10 要防備的：把枝節當根基，把弟兄當敵人。保羅在同一章說「不要毀謗，不要爭競，總要和平，向眾人大顯溫柔」（3:2），還把自己放在「我們從前也是」（3:3）的行列裡。本講義在 2:13 採一位讀法為主軸，但明說基督的神性不靠這一節成立，也不用這一節攻擊任何群體；在 3:5 陳列三讀而不裁判，不以這一節判定任何宗派的弟兄姊妹有沒有得救。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。</strong>全卷的爭議，本講義都已經在 ISS00_1--8 交代：作者（ISS00_1）、性別與家庭（ISS00_2）、長老與兒女（ISS00_3）、恩典與善行（ISS00_4）、順服的界線（ISS00_5）、年代（ISS00_6）、與提摩太前書的關係（ISS00_7）、克里特的處境（ISS00_8）；2:13 與 3:5 在第 2、3 章的議題頁詳細處理。每一題都列出各家的理由與難處，因為只給結論不給過程，是剝奪讀者思考的權利。</p><p>三個最大的爭議，有一件事是共同的：<strong>它們都不動搖本卷的中心。</strong>不論 2:13 讀成一位或兩位，等候的都是「我們救主耶穌基督的榮耀顯現」，而且「他為我們捨了自己」（2:14）；不論 3:5 的「洗」怎樣理解，救我們的都是「照他的憐憫」，不是我們所行的義——連洗禮也不是「我們所行的義」；不論 1:6 的 πιστά 怎樣翻，兒女的得救都在神手中。<strong>「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫」（3:5）——這是提多書的根基，也是本講義全卷的根基。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>派別之爭不該影響你的信心。問問題不是不信；在問題面前轉身離開，或者用問題去攻擊弟兄，才是保羅擔心的。</p><p>但有一件事該影響你：<strong>這些討論，讓我更被恩典吸引、更樂意行善，還是讓我更會檢查別人？</strong>提多書最需要防備的，不是講錯一個希臘字，而是把一封講恩典的信，講成一份檢查行為的清單。保羅在信末沒有說「你們要把一切弄明白」，他說的是：「並且我們的人要學習正經事業……免得不結果子」（3:14），最後一句是「願恩惠常與你們眾人同在」（3:15）。行善從恩惠開始，也回到恩惠。</p>"]],"con":[],"say":"本講義的全卷立場：2:13 一位或兩位、3:5 重生的洗、1:6 兒女信主，三個最大的爭議都發生在「怎樣理解」的層次，本講義分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。它們都不動搖本卷的中心：「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫」（3:5）。","care":"席上會有因為聽到「2:13 有兩種讀法」而擔心「耶穌到底是不是神」的初信者；有在不同宗派受洗、被人質疑「你那樣受洗不算數」而心裡受傷的弟兄姊妹；也有喜歡在小組裡挑起辯論、把每次查經都變成戰場的人。牧者要先穩住初信者：基督的神性在新約裡有許多經文見證，不靠一節成立；再接納受傷的人：本講義不以洗禮的方式判定任何人的得救；然後溫柔地提醒愛辯論的人：3:2 的溫柔先適用在我們自己身上。不要說「有疑問就是信心不夠」，也不要說「某某宗派的人都沒有得救」，更不要把提出問題的人當成分門結黨的人。"},{"id":"ISS01_1","t":"作者是使徒保羅嗎？保羅到過克里特嗎？","r":"1:1；1:5；3:12","ch":[1],"why":"這封信的第一個字是「保羅」，第一個任務句是「我從前留你在克里特」。可是使徒行傳只記保羅以囚犯身份在克里特南岸停過船，沒有記他在那裡傳道、建立教會。學界也有人主張教牧書信是後人託名所寫。這兩件事決定我們怎樣聽這封信：是一位晚年的使徒在交託同工，還是一份後人編成的教會手冊？","pos":[["【一】經文問的是甚麼","","<p>「神的僕人，耶穌基督的使徒保羅」（1:1）——作者自稱保羅，而且只在這裡自稱「神的僕人」。1:5 說「我從前留你在克里特」，3:12 說他決定在尼哥坡里過冬。問題有兩層：寫信的是不是使徒保羅本人？使徒行傳裡找不到保羅在克里特建立教會的記載，那麼他甚麼時候「留」提多在那裡？</p>"],["保羅親筆或口授說：保羅獲釋後再訪克里特","","<p>傳統的看法是：保羅在第一次羅馬監禁（徒 28 章）之後獲釋，再往東方工作，與提多同到克里特，留下提多，自己往尼哥坡里去，後來再次被捕，寫下提摩太後書。早期教會普遍承認這封信出自保羅（第二世紀的馬吉安不收教牧書信，是著名的例外）；用字與保羅其他書信不同，可以用晚年的處境、題目的不同、代筆同工的參與來解釋。</p><p><strong>難處：</strong>這段行程在新約裡沒有直接記載，是從三封教牧書信重建出來的；重建得再合理，也只是「最可能」，不是定論。</p>"],["託名說：保羅過世後，門生託他的名寫成","","<p>一些學者認為教牧書信是保羅過世後，由他的門生託名寫成，用來在下一代教會建立秩序。理由是用字與風格和保羅其他書信差別很大、教會組織看起來較晚、對假教訓的描述較像第二世紀。持這一說的學者多半仍然尊重這封信的教導，只是不把它當作保羅親筆。</p><p><strong>難處：</strong>信中滿是具體的人名與行程（亞提馬、推基古、西納、亞波羅、尼哥坡里過冬），託名者很難編得這麼瑣碎而無用；這裡的長老與監督還是同一群人，組織其實相當簡單；除了馬吉安等少數例外，早期教會普遍接受保羅是作者。</p>"],["【三】本講義站在哪裡","","<p><strong>作者是使徒保羅（1:1），沿用提摩太前書立場一；託名說的理由與回應並陳。</strong>保羅到過克里特，最自然的解法是第一次羅馬監禁獲釋後再訪：囚犯保羅曾經在佳澳（一般譯作美港）停船（徒 27:7--13），幾年後他自由地回來，留下了提多。講台可以說「保羅說」，但每一處都要落在「神我們救主」身上。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論學者怎樣重建行程，這封信的福音沒有改變：「神救眾人的恩典已經顯明出來」（2:11）。對你今天最重要的，不是保羅哪一年到過克里特，是那位把福音送到最難的地方的神，也願意把福音送到你所在的地方。時間線的全卷立場見 ISS00_6，爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：作者是使徒保羅，託名說並陳；保羅多半是在第一次羅馬監禁獲釋後再訪克里特，留下提多。講台可以說「保羅說」，但焦點在神我們救主。本講義的全卷立場見 ISS00_1、ISS00_6。","care":"會眾席上可能有讀神學、或在網路上第一次聽說「教牧書信是託名」的年輕人，心裡很慌，以為整本聖經都靠不住了。不要用「那都是不信派的說法」把他打發掉，也不要在講台上嘲笑學者。陪他把理由和回應一條一條看過，讓他知道誠實面對問題本身就是信心的一部分，而福音的核心不在這一題上。"},{"id":"ISS01_2","t":"1:2「在萬古之先所應許」——永恆裡的應許是對誰說的？","r":"1:2；1:3；提後 1:9","ch":[1],"why":"「萬古之先」在時間開始以前，那時候還沒有人可以聽應許。那麼神是對誰應許的？這一題牽動三一神永恆的旨意、舊約的應許、揀選與預定，也直接關係到一個人敢不敢相信：神對我的應許，比我的失敗更早。華人教會常在揀選的題目上彼此論斷，需要一個安穩的讀法。","pos":[["【一】經文問的是甚麼","","<p>「盼望那無謊言的神在萬古之先所應許的永生」（1:2）。原文 πρὸ χρόνων αἰωνίων 直譯是「在永世的時間以前」。1:3 接著說「到了日期，藉著傳揚的工夫把他的道顯明了」。問題是：時間開始以前的應許，聽的人是誰？是父對子的應許，還是「很久以前」對先祖的應許，或是指神對選民的預定？</p>"],["三一神內部的應許：父在永恆裡對子所應許的","","<p>許多解經家讀「萬古之先」為時間以前：那時只有三一神，所以這應許是父在永恆裡對子的應許，要藉著子把永生賜給屬他的人。這使我們想起提後 1:9 同一句型：恩典是「萬古之先在基督耶穌裡賜給我們的」。這一讀的長處，是把救恩的根放在神自己的心意裡，比人的罪更早。</p><p><strong>難處：</strong>「應許」通常要有一個聽的對象，說父「應許」子，是把人間的語言用到三一神裡面，要小心不把它講成一份冷冰冰的合約，也不在講台上替永恆裡的對話編出細節。</p>"],["歷史中的應許：「很久以前」對先祖與先知的應許","","<p>另一讀認為 αἰωνίων 在這裡是「古時」的意思（如羅 16:25「永古」），所以 1:2 指的是神很久以前在舊約裡給人的應許：從創世記 3 章女人的後裔，到亞伯拉罕、大衛與先知。這一讀把 1:2 和 1:3「到了日期……顯明了」接得很順：古時應許，如今在傳揚中顯明。</p><p><strong>難處：</strong>「永世的時間以前」的說法很強，比較像在說時間開始以前；而且提後 1:9 同一句型明說是「在基督耶穌裡」，不只是指舊約的某一次應許。</p>"],["預定說：應許就是神對選民的揀選","","<p>還有一些人把 1:2 直接讀成預定的證據：神在萬古之先已經揀選了一些人得永生。1:1 也說「神選民」，所以這一讀並非憑空而來；它的長處是提醒人，得救的根在神，不在人。</p><p><strong>難處：</strong>1:2 的重點是神不說謊、應許比人的失信更早，不是在處理揀選的範圍；把這一節變成預定論的戰場，會讓一節安慰人的經文變成彼此論斷的工具（揀選與「眾人」的處理回指以弗所書立場二）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義取第一讀為主軸：這是神在永恆裡、在基督裡的定意；舊約歷史中的應許，是這永恆定意在時間裡一步一步展開。</strong>所以第二讀不是錯，而是同一條河的下游。揀選的爭論不在本節展開，回指以弗所書立場二。講台的落點只有一句：在任何一個人失信以前，神已經定意要給人永生。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種讀法都同意一件事：這應許是那位「無謊言的神」說的。你不必先弄清楚永恆裡的對話，才能安心；你只要知道，在你的失敗以前，在你被人騙、或騙了人以前，神已經說了話，而且他不收回。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：「萬古之先所應許」主要是神在永恆裡、在基督裡的定意，舊約的應許是它在歷史中的展開；揀選的爭論回指以弗所書立場二，不在本節展開。落點是：應許比人的失信更早。本講義的全卷立場見 ISS00_9。","care":"會眾席上有人一聽到「萬古之先」「選民」就緊張，擔心自己是不是不在名單上；也有人被人騙過很多次，很難相信任何應許。不要用預定論的術語回答一個害怕的人，也不要把神講成一位冷冰冰的設計者。陪他讀 1:2 的那個形容詞：無謊言的；讓他先認識說話的那一位，再談其餘的事。"},{"id":"ISS01_3","t":"1:5--7「長老」與「監督」是同一個職分嗎？教會體制怎樣看？","r":"1:5--7；徒 20:17、28；提前 3:1--7","ch":[1],"why":"1:5 說「在各城設立長老」，1:7 接著說「監督既是神的管家」，中間用一個「因為」接起來。今天的教會有主教制、長老制、會眾制，各自從新約找根據，彼此常有張力。這一題關係到弟兄姊妹怎樣看自己教會的體制，也關係到怎樣不拿體制去論斷別的教會。","pos":[["【一】經文問的是甚麼","","<p>「在各城設立長老」（1:5）之後，1:6 列資格，1:7 用 γὰρ（因為）接上：「監督既是神的管家，必須無可指責」（1:7）。同一段話裡，前面叫「長老」，後面叫「監督」，講的是同一群被設立的人。問題是：在新約裡，長老與監督是同一個職分嗎？今天哪一種教會體制最合乎聖經？</p>"],["同一職分說：長老是身分，監督是職責","","<p>大多數解經家認為，新約時代長老與監督是同一群人：「長老」說的是成熟、被尊重的身分（源自猶太會堂），「監督」說的是看顧、照管的職責（源自希臘城市）。最清楚的證據就是本段，加上徒 20:17、28：保羅請以弗所教會的長老來，又對他們說聖靈立他們作全群的監督。長老制與會眾制多半採這一說。</p><p><strong>難處：</strong>新約只描述了起初的樣子，並沒有規定以後的教會不可以發展出別的安排；提摩太、提多本身的角色，就在地方長老之上。</p>"],["三級制說：監督（主教）在長老之上","","<p>主教制的傳統認為，到了第二世紀初（伊格那丟的書信，約主後 110 年），教會已經分出監督（主教）、長老、執事三級；提摩太、提多被使徒差派去設立長老，正是後來主教職分的雛形。這一說看重教會歷史的延續與合一。</p><p><strong>難處：</strong>本段經文本身把長老與監督當成同一群人；提摩太、提多的角色是使徒的特派同工，不容易直接等同於後來駐在一城的主教。把後來的發展讀回提多書，需要很多經文以外的前提。</p>"],["【三】本講義站在哪裡","","<p><strong>在本段經文裡，長老與監督是同一群人：1:5 說他們是誰，1:7 說他們做甚麼——作「神的管家」。</strong>本講義沿用提摩太前書立場三，不以本卷裁判任何教會體制；主教制、長老制、會眾制裡都有忠心的僕人。提多書多出來的那一筆是：資格幾乎全是品格，而監督管的是主人的家，不是自己的家。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。體制是器皿，福音是寶貝；同一個器皿可以盛得很好，也可以盛得很糟。對你今天最重要的，不是你的教會叫領袖甚麼頭銜，是那些人是不是「神的管家」：在家裡可信、不任性、不貪財、堅守真道。提多書與提摩太前書的關係見 ISS00_7。</p>"]],"con":[],"say":"本講義的立場：在 1:5--7，長老與監督是同一群人，監督是「神的管家」；本講義不以本卷裁判任何教會體制，重點是資格幾乎全是品格。本講義的全卷立場見 ISS00_3、ISS00_7。","care":"會眾裡有人從不同宗派轉來，帶著對舊教會體制的傷，或對新教會體制的懷疑；也有人曾經被頭銜壓過。不要在講台上嘲笑別的教會的體制，也不要讓「我們的體制最合聖經」變成驕傲。陪受過傷的人分辨：傷他的是濫用權柄的人，不一定是體制本身；而任何體制裡的領袖，都要向主交帳。"},{"id":"ISS01_4","t":"1:6「只作一個婦人的丈夫」——離婚再婚、單身的人可以作長老嗎？","r":"1:6；提前 3:2；提前 5:9","ch":[1],"why":"這一句在提摩太前書已經出現過，可是每一間教會設立長老時都要再面對一次：離過婚的人、再婚的人、喪偶再婚的人、單身的人，可不可以被設立？答案直接影響許多正在服事、或渴望服事的弟兄姊妹，也影響他們怎樣看自己的過去。","pos":[["【一】經文問的是甚麼","","<p>「若有無可指責的人，只作一個婦人的丈夫」（1:6）。原文 μιᾶς γυναικὸς ἀνήρ，直譯是「一個女人的男人」，和提前 3:2 同一句，提前 5:9 又有反過來的「一個丈夫的妻子」。問題是：這一句排除的是多妻、離婚、再婚，還是在說一種對妻子的忠誠？單身的人是否因此不能作長老？</p>"],["婚姻史說：排除離婚或任何再婚的人","","<p>有一派讀作「一生只結過一次婚」：凡離過婚、或離婚後再婚，甚至喪偶後再婚的人，都不能作長老。這一讀看重字面，也看重領袖在婚姻上要成為榜樣，在離婚普遍的社會裡顯得特別嚴肅。</p><p><strong>難處：</strong>保羅在別處准許喪偶的人再婚（羅 7:2--3；林前 7:39），很難說他在這裡把喪偶再婚當作缺陷；而且把一個人信主以前的婚姻史當成終身的記號，和 3:3--5「我們從前也是……乃是照他的憐憫」的福音有張力。</p>"],["品格說：一心一意對妻子忠誠的人","","<p>另一派讀作品格的描述：「一個女人的男人」，就是對妻子忠誠、不拈花惹草、不在婚外留情的人。這和前後的資格都是品格的方向一致；1:6 的總綱是「無可指責」，看的是現在的生命，而不是把過去當成判決。這一讀也不要求長老一定已婚，因為保羅自己就是單身。</p><p><strong>難處：</strong>若只講品格，容易把這一句講得太寬，讓婚姻上有嚴重問題、尚未處理好的人也被設立；教會仍然需要看一個人的婚姻在鄰舍面前是否可信。</p>"],["【三】本講義站在哪裡","","<p><strong>四種讀法（禁多妻、禁離婚再婚、一生只結一次婚、一心一意忠誠）在提摩太前書講義第 3 章已經並陳，本卷不重開戰場。</strong>本講義取主軸：一心一意對妻子忠誠，看的是現在的生命與家中的名聲；單身不是缺陷。各教會可以按自己的良心與傳統訂出更細的做法，但不可以把任何人的過去講成神不能用他的證明。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一句是職分的資格，不是得救的條件，也不是一個人在神面前價值的標籤。如果你的婚姻破碎過，請你聽見同一卷書說：「乃是照他的憐憫」（3:5）。神的家的秩序的全卷立場見 ISS00_3。</p>"]],"con":[],"say":"本講義的立場：「只作一個婦人的丈夫」回指提摩太前書講義第 3 章的四讀並陳，本卷取主軸「一心一意對妻子忠誠」；單身不是缺陷，任何人的過去都不是神不能用他的證明。本講義的全卷立場見 ISS00_3。","care":"會眾席上有離過婚的人、再婚的人、被配偶拋棄的人、一直單身的人，他們聽到這一節常常低下頭。不要在講台上用他們的故事當例子，也不要用「你這樣不能服事」把人推開。陪他們分辨職分資格和神的愛是兩件事；需要時私下談，按教會的規定誠實說明，同時讓他知道，他在這個家裡有位子。"},{"id":"ISS01_5","t":"1:6「兒女也是信主的」——兒女還沒有信主或正在叛逆，父親還可以服事嗎？","r":"1:6；提前 3:4--5；結 18:20","ch":[1],"why":"這是本章最容易傷人的一句。許多忠心的長輩同工，有已經成年卻還沒有信主、甚至離開教會的兒女；他們讀到這一句，常常自責，以為自己該退下來。這一題同時牽動原文的讀法、家庭教會的處境，以及信心能不能被父母代替決定。","pos":[["【一】經文問的是甚麼","","<p>「兒女也是信主的，沒有人告他們是放蕩不服約束的，就可以設立」（1:6）。原文 τέκνα ἔχων πιστά，πιστά 可以是「信主的」，也可以是「忠實可靠的」；同一句後半「沒有人告他們是放蕩不服約束的」在解釋它。問題是：保羅要求的是兒女的信仰，還是家中的秩序？成年兒女的選擇，算不算在父親的資格裡？</p>"],["「信主的」讀法：長老的兒女應當已經信主","","<p>和合本與許多譯本讀作「信主的」：πιστός 在新約常指信徒，保羅在一個剛起頭、家就是聚會的教會裡，希望長老的家本身就是福音的見證。這一讀提醒父母，屬靈的傳承從家裡開始，教會也要看領袖在家中有沒有把信仰活出來。</p><p><strong>難處：</strong>信心是神的恩典與個人的回應，父母無法替兒女決定；若照字面嚴格執行，等於讓一個成年人的選擇決定另一個人的職分，這和「兒子必不擔當父親的罪孽，父親也不擔當兒子的罪孽」（結 18:20）的原則有張力。</p>"],["「忠實可靠的」讀法：兒女守秩序、不放蕩","","<p>另一派讀作「忠實可靠的」：πιστός 在本卷 1:9、3:8 都作「可信的」，提前 3:4 對應的要求是「使兒女凡事端莊順服」。照這一讀，保羅看的是還在父親管教之下的兒女有沒有秩序，不是兒女內心的信仰；同一句後半的「放蕩不服約束」正好是它的反面。</p><p><strong>難處：</strong>這一讀若講得太快，容易把屬靈的傳承降成管教技巧，好像只要孩子乖就夠了；保羅在一個家庭教會的處境裡，確實盼望長老的家是信主的家。</p>"],["【三】本講義站在哪裡","","<p><strong>πιστά 兩讀並陳；同句後半是解釋，重點是家中的秩序與名聲。這裡說的是還在父親家中、在他管教之下的兒女；成年兒女不信主，不自動使父親失去資格。</strong>本講義沿用提摩太前書立場三。這一節真正問的是：這個人在最近的人面前，是不是一個可信的人？</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你的孩子還沒有信主，不代表神看不見你的眼淚，也不代表你的信仰是假的。提多書的福音說，神是「我們救主」，他救人「乃是照他的憐憫」（3:5）——這憐憫也向著你的孩子。神的家的秩序的全卷立場見 ISS00_3。</p>"]],"con":[],"say":"本講義的立場：1:6 的 πιστά 有「信主的／忠實可靠的」兩讀，同句後半是解釋，重點是家中的秩序與名聲；成年兒女不信主，不自動使父親失去資格。本講義的全卷立場見 ISS00_3。","care":"會眾席上有為兒女流淚多年的父母、有兒子離開教會的長老、有正在叛逆的青少年本人。不要在講台上把任何同工的孩子當反面例子，也不要說「孩子不信主，是父母沒有做好」。陪自責的父母把重擔交給主，繼續為孩子禱告；也讓那個離開的孩子知道，教會不是議論他的地方，而是一扇沒有關上的門。"},{"id":"ISS01_6","t":"1:7「不因酒滋事」——基督徒可以喝酒嗎？","r":"1:7；2:3；提前 3:3；提前 5:23；弗 5:18","ch":[1],"why":"華人教會對喝酒的看法差異很大：有的教會全面禁酒，有的允許適量。應酬文化、聖餐用酒、家族聚餐、戒酒中的弟兄姊妹，都讓這一題變得很實際。1:7 的監督資格常被引來支持某一方，需要看清楚它到底說甚麼。","pos":[["【一】經文問的是甚麼","","<p>「監督既是神的管家，必須無可指責，不任性，不暴躁，不因酒滋事，不打人，不貪無義之財」（1:7）。原文 μὴ πάροινον，字面是「不在酒旁邊」，指的是喝酒後失控、吵鬧、傷人。2:3 也要求老年婦人「不給酒作奴僕」。問題是：這是禁止喝酒，還是禁止醉酒與因酒失控？</p>"],["節制說：聖經禁醉，不禁酒","","<p>許多教會傳統認為，聖經沒有把酒本身定為罪：主耶穌在迦拿把水變酒，保羅勸提摩太「稍微用點酒」（提前 5:23 的意思），弗 5:18 禁止的是醉酒。所以 1:7 要求的是自制，不讓酒控制人；適量、在不絆倒人的前提下，是基督徒的自由。</p><p><strong>難處：</strong>「自由」很容易被講成「沒關係」，忘了 1:7 這一串資格的方向是自制；在酗酒普遍、或應酬灌酒成風的處境裡，只講自由會讓軟弱的人跌倒。</p>"],["禁酒說：為了見證與保護人，全面不喝","","<p>另一些教會（特別是經歷過酗酒之害的地區與傳統）主張全面戒酒：為了不絆倒人（羅 14:21），為了在一個以酒應酬的文化裡作出分別的見證，也為了保護家庭。這一說看見酒對人的實際傷害，用愛心訂出界線。</p><p><strong>難處：</strong>若把全面戒酒說成聖經的命令，就是在經文上加了一條；也容易讓偶爾喝一杯的弟兄姊妹被看成不屬靈，變成 1:14 說的「人的誡命」。</p>"],["【三】本講義站在哪裡","","<p><strong>1:7 的重點是自制與不因酒失控傷人，不是在講台上訂一條全體適用的新律法。</strong>酒的處理回指提摩太前書紅線八：不用經文為醉酒找理由，也不把喝酒與否變成量屬靈的尺。教會可以為了牧養的需要訂出自己的做法，但要說明那是愛心的安排，不是在經文上加條文。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你的教會怎樣處理酒，真正的問題是：甚麼在控制你？1:7 的第一個否定詞是「不任性」，酒只是任性的其中一種出口。讓那位為你捨己的主作王，比喝不喝更根本。恩典與自由的全卷立場見 ISS00_4。</p>"]],"con":[],"say":"本講義的立場：1:7「不因酒滋事」的重點是自制，不因酒失控傷人；不為醉酒找理由，也不把全面禁酒說成聖經命令。酒的處理回指提摩太前書紅線八；本講義的全卷立場見 ISS00_4。","care":"會眾裡有正在戒酒的人、家裡有酗酒家人而受過傷的人、被公司逼著應酬的人，也有在不同傳統裡長大的人。不要拿酒的話題開玩笑，也不要當眾問誰喝不喝。陪戒酒中的人找到支持團體與專業協助，陪受過傷的家人說出他的痛；教會的聚會與聚餐，要讓這兩種人都感到安全。"},{"id":"ISS01_7","t":"1:11「這些人的口總要堵住」——教會怎樣面對網路上的異端教師？","r":"1:10--11；1:9；1:13","ch":[1],"why":"今天「敗壞人的全家」常常發生在手機上：一段影片、一個群組、一個收費的課程。弟兄姊妹問：教會要不要公開點名？可不可以檢舉、封鎖、提告？同時也要分辨：誰是為錢說虛空話的教師，誰只是提出問題、意見不同的弟兄姊妹？","pos":[["【一】經文問的是甚麼","","<p>「這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家」（1:11）。原文 ἐπιστομίζειν 是給馬套上嚼環。保羅說的「這些人」，是 1:10「不服約束，說虛空話欺哄人」的教師。問題是：「堵住」用甚麼方法？今天面對網路上的錯誤教導，教會要做到哪一步？</p>"],["公開警告說：點名揭露，保護群羊","","<p>一派主張：既然錯誤教導已經公開、正在敗壞人的全家，牧者就有責任公開點名警告，像保羅在提前 1:20 點名許米乃和亞歷山大一樣；沉默等於讓狼進羊圈。這一說看重保護軟弱的信徒，也看重真理的清楚。</p><p><strong>難處：</strong>公開點名若沒有查證、沒有先私下勸，很容易變成網路公審；也容易把「和我意見不同」與「異端」混在一起，傷到真正只是在問問題的人。</p>"],["教導真道說：不點名，把真的講清楚","","<p>另一派主張：講台的主要責任是用 1:9「純正的教訓」把真道講清楚，讓會眾自己有分辨力，像打疫苗一樣；除非錯誤已經直接進入本教會，否則不必一一點名網路上的人。這一說看重健康，也避免教會變成筆戰的戰場。</p><p><strong>難處：</strong>若一律不點名，當某一位教師已經在群組裡拉走一個個家庭時，會眾可能不知道危險就在身邊；牧者在必要時仍然需要清楚說出來。</p>"],["【三】本講義站在哪裡","","<p><strong>「堵住」的工具是 1:9：用健康的教訓勸化人、駁倒錯誤，不是用權勢、威脅或暴力壓下聲音。</strong>平時以教導真道為主；當錯誤教導已經敗壞本教會的家庭時，牧者經過查證、私下勸告，必要時可以清楚警告。分辨的標準就在 1:11：為貪不義之財、敗壞人的全家；提出問題、表達不同意見的弟兄姊妹，不在這一節的範圍。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。假教訓存在，正說明真道值得守護。你不必聽遍每一個網紅，也不必和每一個留言吵架；你要做的，是在真道上健康起來，「使他們在真道上純全無疵」（1:13）。書信處境的全卷立場見 ISS00_8；長老與權柄的界線回指彼得前書立場五。</p>"]],"con":[],"say":"本講義的立場：「堵住」是用 1:9 健康的教訓駁倒錯誤，不是用權勢壓下聲音；平時教導真道，必要時查證後清楚警告。提出問題的人不是 1:11 說的那些人。本講義的全卷立場見 ISS00_8。","care":"會眾裡可能有人的家人正被某個網路教師帶走，心裡又急又無助；也有人曾經只是提出問題，就被說成異端而受傷。不要把每一個發問的人都當成敵人，也不要在講台上點名而沒有查證。陪焦急的家人用愛與耐心保持關係，陪受過傷的人知道，教會願意聽他的問題。"},{"id":"ISS01_8","t":"1:12--13「克里特人常說謊話」——聖經可以引用異教詩人嗎？保羅在貼族群標籤嗎？","r":"1:12--13；2:14；徒 17:28","ch":[1],"why":"這一節是全卷最容易被講壞的一節。有人讀到這裡，覺得保羅在罵一個民族；也有人拿它來替自己對某些族群的偏見找根據。同時，一封受聖靈默示的信，為甚麼要引一位異教詩人的話？這關係到聖經怎樣看世上的文化，也關係到會眾席上每一個被貼過標籤的人。","pos":[["【一】經文問的是甚麼","","<p>「有克里特人中的一個本地先知說：『克里特人常說謊話，乃是惡獸，又饞又懶。』」（1:12）這是一句希臘六音步詩行，傳統上歸給克里特本地詩人厄庇墨尼得斯。保羅接著說：「這個見證是真的」（1:13）。問題有兩個：引用異教詩人，是否等於認可他？保羅說「是真的」，是不是在替一個民族定罪？</p>"],["普遍恩典說：真理在哪裡說中了，就可以引用","","<p>保羅不只一次引用希臘詩人：在雅典他引過「我們也是他所生的」（徒 17:28）。這一說認為，神的普遍恩典讓世上的詩人、哲人有時也說中了真話；保羅引用一句話，不等於認可那位詩人的全部，只是承認這一句說中了。這一說讓我們可以尊重文化，又不被文化牽著走。</p><p><strong>難處：</strong>若只講「說中了」，容易忽略這一句本身的殺傷力；在今天的講台上，一句「說中了」的族群評語，可能正是壓在某些人身上的刻板印象。</p>"],["自我承認說：保羅引的是他們自己承認的病","","<p>另一些解經家強調保羅兩次說「他們中間的一個」「他們自己的先知」：這不是外人的嘲笑，是克里特人自己的自白；希臘人甚至造了一個動詞「像克里特人那樣」來指說謊，克里特的信徒從小就聽這句話。保羅說「這個見證是真的」，是承認病是真的，目的在 1:13 後半：「使他們在真道上純全無疵」——要他們健康。</p><p><strong>難處：</strong>即使是自我承認的話，被外人拿來重複，仍然可能傷人；這一說若只停在「是他們自己說的」，也會讓講道的人以為自己可以照樣說。</p>"],["族群偏見說：這一節反映了古代的族群刻板印象","","<p>也有學者指出，這句話在古代確實是一個流行的族群刻板印象，保羅也活在那個文化裡；今天讀這一節，要承認它的文化色彩，不可把它當成對任何民族永遠的描述。這一說的長處，是誠實面對經文對今天讀者的衝擊。</p><p><strong>難處：</strong>若只讀成保羅的偏見，就看不見保羅的落點：他把同樣的病放在自己身上，「我們從前也是無知、悖逆、受迷惑」（3:3），又宣告神要從這群人裡「特作自己的子民」（2:14）。</p>"],["【三】本講義站在哪裡","","<p><strong>1:12 是克里特人自己詩人的話，是一個民族自己承認的病，不是保羅貼的族群標籤；保羅引它，是為了醫治。</strong>講台絕不可以用這一節對任何族群、地域、國籍的人貼標籤或開玩笑。凡講到 1:12，同時講 2:14：神要從這群人裡「特作自己的子民，熱心為善」（2:14）——神沒有把福音送到最好的地方，而是送到最難的地方。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而會堅固你的信心。每一個民族、每一個地方都有自己承認的病；福音不是說某一群人比較好，是說同一位救主為每一群人捨了自己。如果你自己也曾經被人說「你們那裡的人就是這樣」，請你看見：神正是在這樣的地方，造出熱心為善的子民。書信處境的全卷立場見 ISS00_8。</p>"]],"con":[],"say":"本講義的立場：1:12 是克里特人自己詩人的話、一個民族自己承認的病，不是保羅貼的標籤；保羅引它是為了醫治，同章必帶 2:14「特作自己的子民」。本講義的全卷立場見 ISS00_8。","care":"會眾席上有移工、新住民、留學生、從不同地方來的弟兄姊妹，他們很可能在生活裡被人用一句話概括過。不要在講台上拿任何地方、任何國籍的人開玩笑，連「開玩笑的」也不要說；也不要讓這一節變成小組裡的笑話。陪被貼過標籤的人說出他的委屈，讓他知道，在神的家裡，他是「自己的子民」，不是一個刻板印象。"},{"id":"ISS01_9","t":"1:15「在潔淨的人，凡物都潔淨」——基督徒甚麼都可以看、可以吃、可以做嗎？","r":"1:15；1:14；可 7:15；羅 14:20","ch":[1],"why":"這一節常被只引前半句，用來替各種選擇開綠燈；也有人反過來，用一長串「不可以」來定義潔淨。飲食、娛樂、影視、網路內容、傳統習俗，弟兄姊妹每天都在面對。這一題關係到恩典是不是放縱的許可證，也關係到教會會不會變成一張規條清單。","pos":[["【一】經文問的是甚麼","","<p>「在潔淨的人，凡物都潔淨；在污穢不信的人，甚麼都不潔淨，連心地和天良也都污穢了」（1:15）。前一節說的是「猶太人荒渺的言語和離棄真道之人的誡命」（1:14），多半是關於吃甚麼、碰甚麼的規條。問題是：「凡物都潔淨」是對誰說的？它的範圍是食物與禮儀，還是一切行為？</p>"],["自由說：心裡潔淨，外面的事就不必拘束","","<p>有人讀這一節為基督徒自由的宣言：既然主耶穌說「從外面進去的不能污穢人，惟有從裡面出來的乃能污穢人」（可 7:15），那麼食物、節期、各種外在的規矩都不再能定人的罪。這一讀抓住了福音的自由，也正確地拒絕了 1:14 那一類人的誡命。</p><p><strong>難處：</strong>若把「凡物」擴大到一切行為與內容，就忽略了同一節的後半「連心地和天良也都污穢了」；保羅在下一節馬上說，口裡認識神、行事卻相背的人是可憎惡的。把這一節讀成放縱，是只讀了半節。</p>"],["規條說：用清楚的「不可」保護聖潔","","<p>另一種做法是為了保護信徒，訂出許多具體的界線：不可以看哪些影片、不可以去哪些地方、不可以吃哪些東西。這一做法看見了這個世代的試探，也願意幫助軟弱的人。</p><p><strong>難處：</strong>這正是 1:14 保羅所反對的方向——「人的誡命」以為潔淨在外面的東西上；規條可以約束手，卻不能潔淨心，還會養出論斷別人的驕傲。這一點利未記講義第 11 章的潔淨條例也已經指向更深的地方。</p>"],["【三】本講義站在哪裡","","<p><strong>潔淨是心與良心的事，不是食物的事；這一節也不是「甚麼都可以」的許可證。</strong>1:15 的範圍首先是 1:14 那些關於飲食與禮儀的人的誡命；它的原則是：決定一個人潔不潔淨的，是他的心與天良，而心的潔淨來自神的憐憫（3:5）。所以引 1:15 前半，必帶後半。恩典與善行的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而會讓你的信心更自由、也更乾淨。你不必靠一張清單證明自己潔淨，也不必拿「凡物都潔淨」安撫一顆不安的良心。可以自己問：這件事，我能在主面前坦然做嗎？我的天良是越來越敏銳，還是越來越麻木？這使我們想起羅 14:20 保羅說的：凡物固然潔淨，但不要因此叫人跌倒。</p>"]],"con":[],"say":"本講義的立場：1:15 說潔淨是心與良心的事，不是食物的事；它既拒絕人的誡命，也不是放縱的許可證——引前半必帶後半。本講義的全卷立場見 ISS00_4。","care":"會眾裡有從很嚴格的教會背景出來、被規條壓得喘不過氣的人，也有正在用「凡物都潔淨」掩蓋上癮問題的人。不要用更多規條去壓前者，也不要用一句「你自由了」放過後者。陪前者認識恩典的自由，陪後者誠實面對良心，必要時轉介輔導；兩種人都需要聽見，潔淨是神的憐憫做成的。"},{"id":"ISS02_1","t":"2:2--6 老年人與少年人——教會的世代傳承怎樣接棒？","r":"2:2--6；1:8；2:12；帖前 1:3","ch":[2],"why":"許多華人教會正在面對世代斷層：年長的一代撐起了教會，卻覺得年輕人不再委身；年輕的一代想要參與，卻覺得自己永遠被當成孩子。2:2--6 一口氣點名老年人、老年婦人、少年婦人、少年人，是新約裡最完整的一張「世代表」。這一題要問：保羅給各個年齡的話，是一套按年齡分配的規矩，還是一條世代接棒的路？這關係到教會怎樣排座位，也關係到誰被聽見。","pos":[["【一】經文問的是甚麼","","<p>「勸老年人要有節制、端莊、自守，在信心、愛心、忍耐上都要純全無疵」（2:2）；「又勸少年人要謹守」（2:6）。保羅用 ὡσαύτως（hōsautōs）「照樣」把每一種年齡接在同一條線上，又用 σώφρων（sōphrōn）家族的字貫穿老年人、少年婦人、少年人，到 2:12 恩典教訓「我們」自守，同一個字第六次出現。問題是：這段經文的重點是年齡之間的分工與次序，還是同一個恩典在不同年齡身上長出不同的樣子？兩種讀法會帶出很不一樣的教會生活。</p>"],["年齡秩序說：各守本分，長幼有序","","<p>這一讀法看重經文按年齡分段的結構：年長的要作榜樣、年輕的要受教，教會應當尊重年齡帶來的經歷與秩序。它和華人文化裡的敬老傳統很接近，也提醒年輕人不要輕看走過路的人；保羅給少年人的唯一一個字「謹守」，正是要他們有分寸。這一說保住了尊重與次序，使教會不至於只追逐年輕、新潮的聲音。</p><p><strong>難處：</strong>經文並沒有說年長的就自動成熟；保羅對老年人的勸勉恰恰是「節制」「純全無疵」，可見年紀大的人也需要被教。把年齡秩序講得太重，容易讓年輕人只剩下聽話，也讓年長者免於被勸勉，這和 2:15 要提多勸戒眾人（年長的也在其中）的吩咐並不一致。</p>"],["世代同工說：同一個恩典，在每一個年齡長出健康","","<p>這一讀法注意到 2:1 的「純正的道理」原文是「健康的」，2:2 老年人「純全無疵」也是同一個字：保羅給每一個年齡的不是位階，是健康的樣子。老年人的健康是信、愛、忍耐（這使我們想起帖前 1:3 的信、愛、望，望在這裡長成了忍耐）；少年人的健康是有分寸。世代之間不是上下級，是同工；接棒不是交出位子，是把自己被恩典教過的經歷，交在下一代手裡。</p><p><strong>難處：</strong>這一說若講得太快，容易抹平經文確實存在的差別：保羅的確對不同年齡說不同的話，也確實要年長的去教、年輕的去學。只講「同工」不講「傳承」，可能讓年輕人覺得不必向誰學，教會失去了屬靈父母。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採世代同工說為主，同時保留傳承的次序：同一個恩典在每一個年齡長出不同的健康；年長的有經歷可以交託，年輕的有分寸可以學習，兩代都在 2:12 同一位老師的底下。</strong></p><p>性別、家庭與世代傳承的大題，本講義沿用全卷立場 ISS00_2，不在本章另立說法。提多書在這裡多出來的一筆是：世代接棒不是一個制度，是一頓一頓的飯、一段一段的陪伴；而第一個被要求「凡事顯出善行的榜樣」的，正是那位要去勸戒眾人的傳道人自己（2:7）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：每一個年齡都需要被恩典教；年長者的經歷值得尊重，年輕人的生命同樣寶貴；教會是一家人。爭的是年齡次序在教會生活裡要佔多重。</p><p>對你今天最重要的，不是決定哪一代說了算，而是問自己：我在哪一代人身上學到了恩典？我又正在把恩典交給哪一個比我年輕的人？如果你已經年長，你的忍耐本身就是一篇講章；如果你還年輕，你的分寸也是。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:2--6 給每一個年齡的不是位階，是同一個恩典長出來的健康；年長的有經歷可以交託，年輕的有分寸可以學習，兩代都是 2:12 那位老師的學生。世代傳承的大題，本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有覺得自己被教會「淘汰」的老弟兄老姊妹，也可能有覺得自己永遠插不上話的年輕人。不要在講台上用「老人家就是固執」或「年輕人就是不委身」開玩笑，那一句話會讓一整代人關上心門。陪年長的人說出他們的經歷，陪年輕的人說出他們的疑問；最好的作法，是把兩代人安排在同一張桌子上吃飯。"},{"id":"ISS02_2","t":"2:3--4「老年婦人……指教少年婦人」——教會裡屬靈母親的職事是甚麼？","r":"2:3--4；2:5；提前 5:2","ch":[2],"why":"2:3 的 καλοδιδασκάλους（kalodidaskalous）「用善道教訓人」，整本新約只出現這一次，直譯是「教美善的老師」。可是許多教會給年長姊妹的服事只有煮飯、打掃、探訪，很少讓她們「教」；另一頭，也有教會的「屬靈媽媽」變成管別人家務事的長輩。這一題要問：屬靈母親是一個職分、一份恩賜，還是一種關係？她教甚麼、教到哪裡為止？","pos":[["【一】經文問的是甚麼","","<p>「又勸老年婦人，舉止行動要恭敬，不說讒言，不給酒作奴僕，用善道教訓人，好指教少年婦人，愛丈夫，愛兒女」（2:3--4）。σωφρονίζωσι（sōphronizōsi）是「使人清醒、懂分寸」；教的內容是愛丈夫、愛兒女、謹守、良善，教的人先要通過「不說讒言」這一關。問題是：這是一個教會正式設立的職分，還是年長姊妹自然的生命影響？她們的「教」只限於家務與婚姻，還是可以更廣？</p>"],["職分說：教會應當正式設立、裝備屬靈母親","","<p>這一讀法認為，保羅把教導少年婦人的責任明確交給年長姊妹，並且列出資格（恭敬、不說讒言、不被酒奴役），很像 1:6--9 對長老的資格；所以教會應當有意識地揀選、裝備、差派年長姊妹作屬靈母親，例如成立姊妹門徒小組、婚姻陪伴計畫。這一說的長處是讓屬靈母親不再只是「有空就做」，而是被看見、被肯定的服事。</p><p><strong>難處：</strong>經文沒有給這份工作一個職稱，也沒有說要按立；把它制度化，可能把一段應當自然流動的生命關係，變成一張排班表，甚至讓沒有被「設立」的年長姊妹以為自己不夠資格陪伴人。</p>"],["關係說：屬靈母親是生命自然的傳承","","<p>這一讀法看重經文的場景：一個家庭聚會，老姊妹與年輕媳婦本來就坐在同一個廚房裡。保羅不是要建立新組織，是要年長姊妹用自己被恩典教過的生命，在客廳、在病床邊、在深夜的電話裡陪年輕的姊妹。「教」不只靠講，更靠活出來；這一說保住了陪伴的溫度，也讓每一位年長姊妹都知道自己可以作屬靈母親。</p><p><strong>難處：</strong>只靠自然發生，常常就不會發生；許多年長姊妹不知道自己可以教、也沒有人邀請她們教，年輕的姊妹也不知道可以去找誰。沒有任何安排的「關係」，容易只留給少數外向的人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義看屬靈母親首先是一段生命關係，教會可以有意識地促成它，卻不必把它變成一個頭銜。教的方式是陪伴與帶領，不是接管別人的婚姻；教的人先要過 2:3「不說讒言」那一關。</strong></p><p>性別與家庭的大題，本講義沿用全卷立場 ISS00_2（提摩太前書立場二、以弗所書講義第 5 章），互補派與平等派並陳。提多書在這裡多出來的一筆是：保羅沒有叫提多一個男傳道人挨家挨戶去教少婦，他把這份工作交給走過這條路的姊妹——一個教會若只讓年長姊妹煮飯，就浪費了神給這個家的老師。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：年長姊妹有被恩典教過的經歷，年輕姊妹需要有人陪伴；「愛丈夫，愛兒女」是可以學的愛；教導的人自己要先活出恭敬與節制。爭的只是這份服事要不要制度化。</p><p>對你今天最重要的，是一個很具體的問題：誰是你的屬靈母親（或父親）？如果沒有，這一週可以去找一位；如果你已經走過很長的路，誰是你可以陪的那一位？爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:3--4 的屬靈母親首先是一段生命關係，教會可以有意識地促成，卻不必變成頭銜；她用陪伴與帶領教人，不是接管別人的家。性別與家庭的大題，本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有一生在廚房服事、從來沒有被請去「教」的老姊妹；也可能有被教會長輩過度干涉、婆媳關係受傷的年輕媳婦；還有沒有母親、或與母親關係破碎的姊妹，聽到「屬靈母親」會心裡一緊。不要把屬靈母親講成年輕人必須服從的長輩，也不要假設每一個人都有好母親的記憶。陪受傷的人慢慢認識一位溫柔、守口的長輩。"},{"id":"ISS02_3","t":"2:4--5「順服自己的丈夫」「料理家務」——姊妹可以出外工作嗎？受暴的妻子該怎麼辦？","r":"2:4--5；弗 5:21--33；彼前 3:1--7；箴 31:10--31","ch":[2],"why":"這兩節是全卷最常被誤用的經文之一。有人用「料理家務」說已婚姊妹不該出外工作、不該帶小組；更沉重的是，有受暴的妻子被勸「再順服一點、多禱告」，因而留在危險裡。這一題不只是性別角色的學術討論，它直接關係到會眾席上某一位姊妹的安全與自由，也關係到福音的名聲。","pos":[["【一】經文問的是甚麼","","<p>「謹守，貞潔，料理家務，待人有恩，順服自己的丈夫，免得神的道理被毀謗」（2:5）。這一節有兩個要釐清的地方：第一，「料理家務」SBLGNT 作 οἰκουργούς（oikourgous）「在家作工的」，RP 作 οἰκουρούς（oikourous）「看守家的」，這是勤勞還是禁足？第二，ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν（hypotassomenas tois idiois andrasin）「順服自己的丈夫」的範圍到哪裡，它和最後一句「免得神的道理被毀謗」是甚麼關係？</p>"],["家庭角色說：經文為今天的家庭定下分工","","<p>這一讀法（多為互補派的立場）認為 2:4--5 為今天的家庭定下了一個創造秩序：丈夫承擔帶領的責任，妻子以家庭為主要的事奉場所，在家庭裡甘心順服丈夫的帶領；它常與弗 5:22--33、彼前 3:1--6 一起讀。這一說的長處是認真看待經文的字面，也提醒今天忙碌的家庭，家本身就是一個值得投入的事奉。</p><p><strong>難處：</strong>若從這裡推出已婚姊妹一律只能留在家裡，那不是經文的意思，是說得比經文多：οἰκουργούς（oikourgous）的重點是勤勞作工，箴言末章才德的婦人一面管家、一面做買賣（箴 31:24）。而且經文全段只對妻子說話，沒有一句授權丈夫拿這節去要求妻子。</p>"],["處境宣教說：順服的目的朝外，是為了福音的名聲","","<p>這一讀法（平等派與許多互補派都看重）抓住這一節的目的子句：「免得神的道理被毀謗」。在克里特那樣一個社會裡，一群信了主的妻子若輕看家庭、輕看丈夫，外人會說這個新信仰破壞家庭；保羅要她們的家成為福音的櫥窗。所以順服是為了福音，不是為了丈夫的權力；今天的落點，是問怎樣的家庭生活在我們的處境裡讓福音被尊重。</p><p><strong>難處：</strong>這一說若講得太遠，容易讓人以為經文只是一世紀的文化策略，今天可以完全不理；可是「愛丈夫，愛兒女」、謹守、良善，在任何處境都是美好的。處境決定落點，卻不取消原則。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：順服的目的是「免得神的道理被毀謗」——朝外，為了福音的名聲，不是為了丈夫的權力；οἰκουργούς（oikourgous）是勤勞作工，不是禁足，不用來限制姊妹出外工作或服事；家暴不在順服的範圍。</strong></p><p>一位妻子若人身安全受到威脅，先保護生命、離開危險、依法求助；教會要協助通報，陪她找到安全的地方。叫她留下來忍，不會使神的道理得榮耀，反而正是讓神的道理被毀謗。互補派與平等派的大題，本講義沿用全卷立場 ISS00_2 並陳而不裁判；順服的界線見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：婚姻是神所設立的；丈夫要愛妻子，「又當存敬畏基督的心，彼此順服」（弗 5:21）；暴力是罪，不是家務事；一個敬虔的家能讓福音被看見。爭的是家庭分工的形式。</p><p>如果你正處在暴力裡，請你聽清楚：神沒有要你留在危險裡證明你的信心。你可以求助，教會應當站在你身邊。保護你的生命，正是尊榮那位「為我們捨了自己」的主。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:5 順服的目的是免得神的道理被毀謗，為了福音的名聲，不是為了丈夫的權力；「料理家務」是勤勞，不是禁足，不用來限制姊妹工作或服事；家暴不在順服的範圍——先保護生命、依法求助、教會協助通報。本講義的全卷立場見 ISS00_2、ISS00_5。","care":"會眾席上可能就坐著一位正在受暴力的姊妹，她最怕聽見的是「你要再順服一點」；也可能有因為上班而被教會長輩指責的媽媽，還有拿這節經文管妻子的丈夫。不要在講台上把家暴說成「夫妻吵架」，不要勸她為了見證不要報警。牧者要知道當地的求助專線與庇護資源，陪她把安全放在第一位；對施暴的一方，要清楚指出這是罪，同時轉介專業協助。"},{"id":"ISS02_4","t":"2:7--8、15 傳道人的榜樣——「不可叫人輕看你」與牧者權柄的界線在哪裡？","r":"2:7--8；2:15；提前 4:12；彼前 5:1--4","ch":[2],"why":"2:15 說「用各等權柄責備人；不可叫人輕看你」，這句話很容易被拿來替牧者的權威背書：誰對傳道人有意見，就是「輕看神的僕人」。同時，許多年輕傳道人、小組長真的常常被輕看，不知道怎樣帶領比自己年長的人。這一題要分辨：傳道人的權柄從哪裡來？用到哪裡為止？怎樣才不被輕看，又不變成轄制？","pos":[["【一】經文問的是甚麼","","<p>「你自己凡事要顯出善行的榜樣；在教訓上要正直、端莊，言語純全，無可指責」（2:7--8）；「這些事你要講明，勸戒人，用各等權柄責備人；不可叫人輕看你」（2:15）。ἐπιταγῆς（epitagēs）「權柄」與 1:3「命令」同字，περιφρονείτω（periphroneitō）是「繞過你去想、把你當空氣」。問題是：提多的權柄是職位本身帶來的，還是從所交託的道與他的生命來的？它的範圍有多大？</p>"],["職位權柄說：被設立的傳道人有神所賦予的權柄","","<p>這一讀法強調保羅親自差派提多、交託他「辦整齊」與設立長老（1:5），所以提多的權柄是真實的，教會應當尊重；2:15「各等權柄」說明他可以正式地責備與糾正。這一說保住了教會的秩序，也提醒會眾：不可以因為傳道人年輕、或是外邦人（提多正是未受割禮的希臘人），就繞過他、不把他放在眼裡。</p><p><strong>難處：</strong>這一說若不加界線，很容易變成「職位就是一切」：只要被設立，說甚麼都對；可是保羅在同一章把權柄放在榜樣之後（2:7），又把權柄的內容限定在「這些事」，也就是 2:1--14 的純正道理與恩典。</p>"],["榜樣權柄說：權柄來自所交託的道與看得見的生命","","<p>這一讀法看重 2:7--8 與 2:15 的呼應：保羅沒有叫提多去證明血統或頭銜，叫他「凡事顯出善行的榜樣」；τύπος（typos）是模子，提前 4:12 保羅對提摩太也說同樣的話。權柄的來源是那交託保羅的命令（1:3），權柄的範圍是「這些事」，權柄的憑據是生命。一個被恩典教養的傳道人，不必靠聲量取得尊重；這也合乎彼得說長老「不是轄制」的吩咐。</p><p><strong>難處：</strong>這一說若講得太快，可能讓人以為只要傳道人有一點軟弱，大家就可以不聽他的，使牧者在每一次責備前都要先證明自己完美；而經文確實給了提多責備人的責任，不只是陪伴。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採榜樣權柄說，同時承認職分的真實：提多的權柄來自那交託保羅的命令，只能用在「這些事」上——純正的道理與恩典，不能用來管人的私事、壓下不同的聲音；怎樣不被輕看，答案是 2:7 的榜樣。</strong></p><p>長老、權柄與屬靈虐待的大題，本講義回指彼得前書立場五：「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）；神的家的秩序見全卷立場 ISS00_3。提多書多出來的一筆是 2:8 的「我們」：一個傳道人的失敗，外人說的是整個教會。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神在教會裡設立牧養的人；牧者要作榜樣；權柄是為了建立人，不是為了控制人。爭的是權柄的來源要多看職位、還是多看生命。</p><p>如果你曾經被屬靈權柄傷害過，請你知道：那不是這一節的意思，也不是那位為羊捨命的大牧人的樣子。如果你是年輕的帶領者、常被輕看，也請你知道：保羅給你的答案不是更大的聲音，是更真實的生命。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:15 的權柄來自那交託保羅的命令，只能用在「這些事」——純正的道理與恩典——上，不是轄制；不被輕看的路是 2:7 的榜樣。長老與權柄回指彼得前書立場五；本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有被牧者或同工用權柄壓過、至今不敢在教會說真話的人；也可能有年輕的小組長，常被年長的組員看輕而灰心。不要在講台上用這一節說「對我有意見就是輕看神」；也不要用它鼓勵人看不起年輕的同工。陪受過傷的人分辨健康的牧養長甚麼樣子；陪年輕的同工建立看得見的生命，並且為他們站台。"},{"id":"ISS02_5","t":"2:9--10「僕人要順服自己的主人」——聖經替奴隸制背書嗎？今天的勞資關係怎樣應用？","r":"2:9--10；提前 1:10；林前 7:21；門 1:15--16；弗 6:5--9","ch":[2],"why":"歷史上曾有人用這類經文替奴隸制辯護；今天也仍有基督徒老闆用它要求員工「凡事討老闆喜歡、不可頂撞」，甚至替欠薪與霸凌找屬靈理由。同時，非信徒常以這幾節質疑聖經的道德。這一題要說清楚：新約對奴隸制的立場是甚麼，2:9--10 今天在職場上該怎樣活，又不該怎樣用。","pos":[["【一】經文問的是甚麼","","<p>「勸僕人要順服自己的主人，凡事討他的喜歡，不可頂撞他，不可私拿東西，要顯為忠誠，以致凡事尊榮我們救主－神的道」（2:9--10）。δοῦλος（doulos）是法律上屬於主人的奴隸，不是今天簽約受僱的員工。問題有兩層：第一，保羅勸奴隸順服，是不是等於承認奴隸制是好的？第二，這兩節要怎樣跨過兩千年，落到今天有勞動法、有合約、可以辭職的職場？</p>"],["制度默許說：保羅沒有反對，可見制度本身可以接受","","<p>這一讀法在十八、十九世紀曾被一些人採用：既然新約多次勸奴隸順服，卻沒有直接下令廢除奴隸制，可見這個制度本身不是罪，只要主人善待奴隸即可。今天較溫和的版本，是把 2:9 直接套用在雇傭關係上：員工就該像僕人一樣凡事順服老闆。</p><p><strong>難處：</strong>這一說忽略了新約自己的證據：保羅把「搶人口」（提前 1:10）列為違背純正道理的罪，勸奴隸「若能以自由，就求自由更好」（林前 7:21；這一句原文 μᾶλλον χρῆσαι 也有人讀作「寧可善用現在的處境」，但兩種讀法都不是為奴隸制背書），又請腓利門收回阿尼西謀作「親愛的兄弟」。歷史上用這一說為奴隸制辯護，正是教會必須認罪的一頁；把它套在今天的職場，也會讓剝削披上屬靈的外衣。</p>"],["福音種子說：保羅對身在制度裡的人說話，福音從裡面瓦解制度","","<p>這一讀法認為保羅在這裡不是評價制度，而是對一群沒有選擇的弟兄姊妹說話：你們今天怎樣活，才能讓福音被看見？同時，福音本身埋下了瓦解奴隸制的種子：在基督裡，「自主的、為奴的，或男或女……都成為一了」（加 3:28），主人與奴隸同有一位主人（弗 6:9）。後來廢奴運動中的許多基督徒，正是從這些經文得著力量。</p><p><strong>難處：</strong>有人覺得這一說替保羅「沒有更早、更直接地反對」找了太多理由；誠實地說，新約沒有一份廢奴宣言，這個張力需要承認，而不是用護教把它講得太輕。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採福音種子說：新約沒有為奴隸制背書；2:9--10 是對身在制度裡的人說，怎樣在最低的位置尊榮神。2:10 的重點是「顯為忠誠」——忠誠是品格，不是無條件服從。</strong></p><p>今天應用到職場：這兩節不用來要求員工忍受剝削、霸凌、欠薪或違法的命令；使用勞動法、申訴管道、離職的自由，不違背 2:9。它真正要問的是：在可以偷懶的地方不偷懶，在可以多報的地方不多報。順服的界線，本講義的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：每一個人都按神的形像被造；在基督裡沒有人比人高；工作可以榮耀神。爭的是新約為甚麼用這種方式處理一個不公義的制度。</p><p>對你今天最重要的，是 κοσμῶσιν（kosmōsin）那個字：一個奴隸的忠誠，可以替神的道妝飾。沒有一個位置低到不能尊榮神；可是神也從不要求你在不公義面前沉默。忠誠與求助，可以同時是你的見證。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：新約沒有為奴隸制背書（提前 1:10）；2:9--10 的重點是顯為忠誠，忠誠是品格，不是無條件服從；今天不用這兩節要求員工忍受剝削、霸凌、欠薪或違法命令，使用勞動法與申訴不違背 2:9。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有正被欠薪、被主管霸凌的人，也可能有在外地工作、證件被雇主扣住的移工；還有身為老闆、想用經文要求員工的人。不要用這兩節勸受欺壓的人「忍耐就是見證」；也不要只講員工的本分，卻不講雇主的公義（弗 6:9）。陪受欺壓的人整理事實、找到正當的求助管道；陪作老闆的弟兄姊妹檢視自己的薪資與工時。"},{"id":"ISS02_6","t":"2:11「神救眾人的恩典」——所有人都得救嗎？","r":"2:11；提前 2:4；提前 4:10；約 3:16--18","ch":[2],"why":"「神救眾人的恩典已經顯明出來」是全卷地勢最高的一句。有人據此主張普救論：既然恩典是「救眾人的」，最後所有人都會得救；也有人反過來，把「眾人」解成「各樣的人」，擔心恩典並不真的臨到每一個人。這一題關係到傳福音的迫切，也關係到一個自覺太糟的人，敢不敢相信恩典也照到他。","pos":[["【一】經文問的是甚麼","","<p>「因為神救眾人的恩典已經顯明出來」（2:11）。原文 ἡ χάρις τοῦ θεοῦ σωτήριος πᾶσιν ἀνθρώποις（hē charis tou theou sōtērios pasin anthrōpois），σωτήριος（sōtērios）是「帶來拯救的」，πᾶσιν ἀνθρώποις（pasin anthrōpois）可以接「顯明」（向眾人顯明），也可以接「帶來拯救」（為眾人帶來拯救）。問題是：「眾人」是每一個人，還是各樣的人？恩典向眾人顯明，是否等於眾人都已得救？</p>"],["普救說：恩典既救眾人，最後所有人都得救","","<p>這一讀法把 2:11 與提前 2:4、4:10 放在一起，認為神的恩典最終必定成就：所有人最後都會得救，地獄若存在也只是暫時的煉淨。這一說看重神的慈愛與大能，也回應了許多人對「神怎能讓人永遠滅亡」的痛苦。</p><p><strong>難處：</strong>同一章緊接著說恩典「教訓我們」除去不敬虔，等候基督的顯現，又說他贖的是「自己的子民」（2:14）；新約也一再呼召人悔改信主，並說「不信的人，罪已經定了」（約 3:18）。普救說很難解釋這些經文，也容易削弱傳福音與悔改的迫切。</p>"],["各樣的人說：「眾人」指各種身份、各個族群的人","","<p>這一讀法注意上下文：2:2--10 剛點名老年人、婦人、少年人、奴僕，1:12 又提到克里特人；所以「眾人」是說恩典不分年齡、性別、身份、族群，連奴隸與克里特人都在裡面。這一說貼近上下文，也合乎改革宗傳統對揀選的理解。</p><p><strong>難處：</strong>這一說若講得太緊，容易讓「眾人」縮成「某一類人」，使人懷疑恩典有沒有真的向自己發出；而保羅說神「願意萬人得救，明白真道」（提前 2:4），語氣是真誠的普遍邀請。</p>"],["普遍邀請說：恩典向每一個人顯明，接受的人得救","","<p>這一讀法讀 πᾶσιν ἀνθρώποις（pasin anthrōpois）為「向所有的人」：恩典的光真實地照向每一個人，救恩為每一個人預備，但要藉著信心領受。這一說同時保住恩典的廣闊與信心的必要，也是許多福音派傳統的讀法。</p><p><strong>難處：</strong>這一說仍要面對「為甚麼有人信、有人不信」的更深問題，以及它與揀選教義怎樣並存；這些問題各傳統的答案不同，經文本身沒有在這一節處理。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：恩典向眾人顯明，不等於眾人都已經得救；這是真誠的邀請，不是普救論。「眾人」至少包括每一種身份與族群——連 2:9 的奴隸、1:12 的克里特人都在裡面。</strong></p><p>揀選與「眾人」的大題，本講義回指以弗所書立場二與提摩太前書講義第 2 章的處理，不在本章另立說法；恩典與善行見全卷立場 ISS00_4。提多書多出來的一筆是：這恩典一顯明就開始「教」，被救的人會被教成熱心為善的子民。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：恩典是神白白給的；耶穌是唯一的救主；恩典的範圍跨越一切人為的界線。爭的是「眾人」與揀選怎樣一起理解。</p><p>如果你覺得自己太糟、不像會被救的人，請你記得那一群連自己的詩人都說「常說謊話」的克里特人：恩典照到了他們。你不在恩典的範圍外面。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:11 的恩典向眾人顯明，不等於眾人都已經得救；這是真誠的邀請，不是普救論，連奴隸與克里特人都在「眾人」裡面。揀選回指以弗所書立場二；本講義的全卷立場見 ISS00_4、ISS00_9。","care":"會眾席上可能有親人過世時沒有信主、心裡一直懸著的人；他聽見「不是普救論」，會覺得被刺了一下。不要在講台上替任何一位已經離世的人下判斷，那是神的事。陪他把親人交在公義又憐憫的神手裡；也陪那些覺得自己太糟的人，看見恩典的光正照在他身上。"},{"id":"ISS02_7","t":"2:12「除去不敬虔的心」——恩典叫人放鬆，還是叫人嚴格？","r":"2:11--12；2:14；3:5--8；羅 6:1--2；雅 2:14--26","ch":[2],"why":"華人教會常在兩個方向之間擺盪：一邊是規條很多的嚴格，誰的生活不夠「屬靈」就被檢查；一邊是「恩典時代不講行為」的放鬆，講善行就被說成律法主義。2:11--12 一口氣說恩典「教訓我們除去不敬虔」，正好站在這兩條路中間。這一題關係到一個人怎樣看待自己的軟弱，也關係到教會的空氣是被恩典吸引，還是被檢查。","pos":[["【一】經文問的是甚麼","","<p>「因為神救眾人的恩典已經顯明出來，教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日」（2:11--12）。παιδεύουσα（paideuousa）是父母教養孩子的字，包括管教；ἀρνησάμενοι（arnēsamenoi）「除去」與 1:16 假師傅「否認」神同字。問題是：恩典與嚴格的生活要求是甚麼關係？是恩典取消了要求，還是恩典本身就帶著要求？</p>"],["放鬆說：恩典已經成全一切，不必再強調行為","","<p>這一讀法強調得救本乎恩，不在乎行為；既然恩典已經完全，信徒就不需要再被行為的要求綑綁，講太多善行反而會讓人回到律法之下。它的長處是保護軟弱的人，不讓他們活在定罪裡，也提醒教會不可把行為當成得救的條件。</p><p><strong>難處：</strong>2:12 說的正是恩典「教訓我們除去不敬虔」；保羅在羅馬書也問「我們可以仍在罪中、叫恩典顯多嗎？斷乎不可！」（羅 6:1--2）。把恩典讀成不必改變，就把一位天天教你的父母，變成一張蓋了章就不再過問的許可證。</p>"],["嚴格說：恩典之後，要用紀律與規條守住聖潔","","<p>這一讀法看重「除去」「自守」：被恩典救的人要認真對付罪，教會應當有清楚的生活標準，彼此督責。它的長處是認真看待聖潔，也提醒今天的教會不可以對罪輕描淡寫。</p><p><strong>難處：</strong>保羅給的是三個方向（自守、公義、敬虔），不是一份規條；而且動詞的主詞是恩典，不是同工會。把嚴格講成恩典的替代品，容易滑進 1:14 那些「人的誡命」，也容易把教會變成互相檢查的地方——這正是假師傅的病。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：恩典既不叫人放縱，也不叫人靠自己變嚴格；恩典本身會教人。是恩典先來，教導在後——我們並不是靠行善得救，是被救的人學會行善；而真正的恩典，也不會讓一個孩子停在原地。</strong></p><p>恩典與善行的大題，本講義的全卷立場見 ISS00_4；信心與行為回指雅各書講義第 2 章。引 3:8「留心做正經事業」時必帶 3:5「並不是因我們自己所行的義，乃是照他的憐憫」。提多書在這裡多出來的一筆是 παιδεύω（paideuō）：恩典不是一次的宣判，是一位住在家裡的父母。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：得救是本乎恩；被救的人要過聖潔的生活；罪是嚴重的。爭的是兩者之間的動力從哪裡來。</p><p>如果你今天又跌倒了，請你不要以為恩典不要你了，也不要以為反正有恩典、不必改。恩典這位老師正蹲在你旁邊，握著你的手，說：再來一次。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:11--12 的恩典既不叫人放縱，也不叫人靠自己變嚴格——恩典本身會教人；恩典先來，教導在後，善行是被教出來的果子，不是得救的條件。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有在嚴格規條的教會裡長大、一想到「聖潔」就害怕的人；也可能有因為長期軟弱、覺得自己不配再聽恩典的人。不要用這一題替任何一份生活規條背書，也不要拿「恩典」淡化正在傷害人的罪。陪害怕的人重新認識一位溫柔管教的父親；陪軟弱的人一步一步被教，不急著要他一次改完。"},{"id":"ISS02_8","t":"2:13「至大的神和我們救主耶穌基督」——指一位還是兩位？","r":"2:13；1:4；彼後 1:1；約 1:1；約 20:28；羅 9:5","ch":[2],"why":"這是基督神性討論中最常被引用的經文之一。有人把它當成「耶穌是神」最重要的證據，誰讀成兩位就被懷疑不正統；也有人拿這一節的文法爭議，說新約其實沒有稱耶穌為神。和合本正文的語序容許兩讀，註腳又作「或譯：神－我們救主」。這一題要把兩種讀法誠實地陳列出來，也要說清楚信仰的根基不懸在一個冠詞上。","pos":[["【一】經文問的是甚麼","","<p>「等候所盼望的福，並等候至大的神和我們救主耶穌基督的榮耀顯現」（2:13）。原文 τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ（tou megalou theou kai sōtēros hēmōn Iēsou Christou）：一個冠詞 τοῦ（tou）管 θεοῦ（theou）與 σωτῆρος（sōtēros）兩個單數人稱名詞。問題是：「至大的神」與「我們救主耶穌基督」是同一位，還是兩位——父與子？</p>"],["一位讀法：至大的神和救主，都是耶穌基督","","<p>理由有四：第一，一個冠詞管兩個以 καί（kai）連接的單數人稱名詞，按希臘文的慣例（格蘭維爾・夏普整理為「夏普規則」）指同一位；第二，新約的 ἐπιφάνεια（epiphaneia）「顯現」一貫指基督的顯現；第三，2:14 緊接著只說 ὃς（hos）「他」，捨了自己的只有一位；第四，「神與救主」在當時正是皇帝崇拜的稱號，保羅把它給了耶穌。彼後 1:1「我們的神和救主耶穌基督」是同一個句型。</p><p><strong>難處：</strong>保羅在別處多半把「神」用在父身上；而夏普規則在專有名詞與某些稱號上有例外，「神」是否算普通名詞，學者仍有討論。</p>"],["兩位讀法：至大的神是父，我們的救主是耶穌基督","","<p>理由是：保羅書信多半分開稱呼父與子，例如本卷 1:4「父神和我們的救主基督耶穌」；θεός（theos）在保羅筆下多指父；而 σωτῆρος ἡμῶν（sōtēros hēmōn）後面有「我們的」與專名，可能使它自成一個稱號。和合本正文的語序也容許這樣讀，許多敬虔的學者採這個讀法，他們同樣相信基督的神性。</p><p><strong>難處：</strong>若讀成兩位，就要說「榮耀的顯現」同時是父與子的顯現，這在新約用法裡很少見；而 2:14 只用單數的「他」接下去，讀起來也較不自然。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義以一位讀法為主軸：我們所等候的，是「至大的神和我們救主」耶穌基督——全卷最高的稱號；和合本註腳「或譯：神－我們救主」也指向這個方向。同時並陳兩位讀法，承認敬虔的學者有不同判斷。</strong></p><p>講台要明說：基督的神性不靠這一節成立。新約說「道就是神」（約 1:1），多馬承認「我的主！我的神！」（約 20:28），保羅稱基督為「在萬有之上，永遠可稱頌的神」（羅 9:5）。所以本講義不拿這一節攻擊讀法不同的人，也不用它把任何群體劃出門外；同一句型的處理見彼得後書講義第 1 章。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。本題並陳的兩種讀法，都出自敬拜同一位主的敬虔學者：都相信耶穌是神的兒子、道成肉身、為我們捨己、要再來。爭的是一個冠詞，敬拜的是同一位主。</p><p>如果你曾經被人用這一節辯論得心裡不安，請你放心：信仰的根基不懸在一個文法規則上，而在那位「為我們捨了自己」（2:14）的主身上。這是 2:13、3:5 與 1:6 三個大爭議的共同原則：在根基上站穩，在枝節上謙卑。本講義的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：2:13 以一位讀法為主軸——耶穌基督就是至大的神和我們的救主；兩位讀法並陳；但基督的神性不靠這一節成立，本講義不拿這一節攻擊任何群體。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有被異端團體用這一節「考倒」而動搖的人，也可能有讀過不同解經書、怕被當成不正統的弟兄姊妹。不要把這一題講成正統與否的試金石，也不要在講台上嘲笑任何讀法。陪動搖的人從約 1:1、約 20:28 這些清楚的經文重新站穩；陪好辯的人回到敬拜——我們爭的是冠詞，跪下來敬拜的是同一位主。"},{"id":"ISS02_9","t":"2:13「等候……榮耀顯現」——不算日子的盼望怎樣活？","r":"2:13；2:12；帖前 5:1--2；太 24:36；腓 3:20","ch":[2],"why":"主再來的話題在華人教會常走向兩個極端：一邊是熱衷推算日子、把每一則新聞排進末世時間表；另一邊是幾乎不再談主再來，盼望只剩下今生的平安順利。2:13 把等候放在「在今世自守、公義、敬虔度日」的後面，給了第三條路。這一題關係到信徒怎樣面對焦慮的時事，也關係到怎樣在漫長的日子裡持守盼望。","pos":[["【一】經文問的是甚麼","","<p>「等候所盼望的福，並等候至大的神和我們救主耶穌基督的榮耀顯現」（2:13）。προσδεχόμενοι（prosdechomenoi）是現在分詞，掛在 2:12「度日」底下；ἐπιφάνειαν（epiphaneian）與 2:11 ἐπεφάνη（epephanē）同字根——第一次顯現是恩典，第二次顯現是榮耀。問題是：「等候」是甚麼樣的活法？基督徒可不可以、應不應該推算主再來的時間？</p>"],["時間表說：從預言與時事推算主再來的時期","","<p>這一讀法認為聖經給了許多末世的徵兆，信徒應當儆醒地對照時事，判斷主再來已經近了，甚至推算出大約的時期；它的長處是認真看待主再來的真實與迫切，也提醒教會不可以過得好像主不會再來。</p><p><strong>難處：</strong>主自己說「但那日子，那時辰，沒有人知道」（太 24:36）；保羅也說「主的日子來到，好像夜間的賊一樣」（帖前 5:2）。教會歷史上一次又一次的推算都落空，留下的是失望的信徒、被嘲笑的福音，以及停下了今天該做的善事的人。</p>"],["淡化說：主再來是遙遠的教義，信仰重在今生","","<p>這一讀法（多半不是明說，而是在講台上實際如此）把主再來當成信經裡的一條教義，承認但很少談；信仰的焦點放在今生的平安、家庭與事業。它的長處是避開了推算日子的狂熱，也鼓勵信徒在世上負責任地生活。</p><p><strong>難處：</strong>保羅把「等候」放在恩典教導的核心裡；沒有盼望的「自守、公義、敬虔」，很容易變成一套道德規範。保羅對腓立比的信徒說「我們卻是天上的國民，並且等候救主」（腓 3:20），等候給了他們在苦難中不放棄的力量。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：不算日子，只管預備。2:13 的等候不是停下來，是一面自守、公義、敬虔地度日一面等；我們活在兩次顯現的中間——第一次是恩典，第二次是榮耀。</strong></p><p>主再來與「等候」的大題，本講義回指帖撒羅尼迦前書立場二，不在本章另立說法。提多書多出來的一筆是：等候的人是「熱心為善」的人（2:14）——盼望不是讓人離開世界，是讓人在世界裡更願意行善，因為我們等的那一位，已經為我們捨了自己。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：主耶穌必要再來；他再來的時候要使一切更新；信徒要預備。爭的是要不要、能不能推算時間。</p><p>如果你被某一個末世預言弄得焦慮，請你放下時間表，拿起今天：今天自守、公義、敬虔地過，就是最好的預備。如果你的盼望已經很久沒有被提起，請你抬頭：那一位會再一次顯現。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：不算日子，只管預備；2:13 的等候是一面自守、公義、敬虔地度日、熱心為善，一面盼望主的榮耀顯現。主再來回指帖撒羅尼迦前書立場二；本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有被末世預言嚇過、甚至為此辭職賣屋的人或家庭；也可能有在漫長的病痛與等待裡，盼望快要熄滅的人。不要在講台上推算日子，也不要嘲笑曾經被預言騙過的人。陪焦慮的人回到今天的日常與善事；陪疲倦的人一起抬頭，把盼望重新說一次：那一位會再來，而且認得我們。"},{"id":"ISS03_1","t":"3:1「順服作官的、掌權的」——政府要求違背良心時怎麼辦？","r":"3:1；3:2；徒 5:29；羅 13:1--7","ch":[3],"why":"3:1 是全卷第三段順服，也是最容易被政治化的一節。國度321空中團契的弟兄姊妹散在不同國家、不同制度底下：有的地方信仰自由，有的地方聚會受到限制；有人面對的是稅務與公民責任，有人面對的是信仰與良心的試驗。會眾真正想問的是：順服到哪裡為止？說「不」的時候，又該怎樣說？","pos":[["【一】經文問的是甚麼","","<p>3:1 原文用兩個緊緊相連、沒有連接詞的不定詞：ὑποτάσσεσθαι（hypotassesthai）講位置，排在秩序之下；πειθαρχεῖν（peitharchein）講行動，聽從權柄的吩咐。克里特在羅馬治下，向來以難管出名；一群剛信主的人，很容易把「我們屬天」誤會成「地上的秩序與我無關」。保羅要提多「提醒」他們——是本來知道、只是會忘的舊功課。這一節的目的寫在後半：「預備行各樣的善事」（3:1），與 1:16「在各樣善事上是可廢棄的」一字一字對照；下一節又說「向眾人大顯溫柔」（3:2）。經文問的是：這個順服有沒有界線？界線在哪裡？</p>"],["常態順服說：權柄出於神，基督徒是守法的好公民","","<p>許多福音派與改革宗傳統從羅 13 讀 3:1：「在上有權柄的，人人當順服他，因為沒有權柄不是出於神的」（羅 13:1）。基督徒納稅、守法、為在位的人禱告（提前 2:1--2），在社會上作預備好行善的人；只有當政府直接命令人犯罪時，才可以不從，而且範圍很窄。這一說的長處是認真看待經文，防止信徒用「屬靈」作藉口逃避公民責任。</p><p><strong>難處：</strong>教會歷史上，不只一次有教會引用羅 13 為不義的政權沉默，甚至替它背書；若把「權柄出於神」講成「每一項政策都出於神」，就忘了寫羅 13 的保羅，按教會的傳統，最後也死在同一個帝國的刀下。</p>"],["良心界線說：順從神是界線，必要時溫柔地說「不」","","<p>不少解經者注意到，3:1 的 πειθαρχεῖν（peitharchein）在新約只出現四次，最有名的一次是彼得在公會前：「順從神，不順從人，是應當的」（徒 5:29）。同一個字，在保羅筆下是「遵他的命」，在彼得口中是「不順從人」——順從官長是常態，順從神是界線。當權柄要求人拜偶像、作假見證、傷害無辜或禁止傳福音時，使徒自己已經示範了怎樣說「不」：不使用暴力，不咒罵，願意承擔後果，「心裡歡喜，因被算是配為這名受辱」（徒 5:41）。</p><p><strong>難處：</strong>「違背良心」由誰來界定？若講得太寬，任何不喜歡的政策都可以說成違背良心；個人的良心也可能被誤導，需要在群體中、在聖經面前被檢驗，不能每個人自己說了算。</p>"],["先知見證說：教會也要為公義發聲，不只消極不從","","<p>另有一些傳統強調，教會除了順服與不從，還有先知的角色：施洗約翰當面對希律說「你娶這婦人是不合理的」（太 14:4），舊約先知也一再為孤兒寡婦向君王說話。這一說認為，基督徒在合法的範圍內參與公共事務、為受壓迫的人發聲，正是「預備行各樣的善事」的一部分。</p><p><strong>難處：</strong>這一說最容易滑向黨派政治——講台變成競選場、教會被綁在一方的勝負上，那就違背了同一章的「不要毀謗，不要爭競」；而且先知說話的對象常常先是神的百姓自己，不只是外面的政權。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：順從官長是常態，順從神是界線。</strong>三段順服（2:5；2:9--10；3:1--2）都朝外，是為了福音的名聲，不是為了任何人的權力；三段都只對順服的一方說話，沒有授權任何人拿這幾節去強迫別人。遇到要求犯罪、違背良心或危害生命的命令，順從神，不順從人；說「不」的方式仍然是 3:2——不毀謗、不爭競、向眾人大顯溫柔，不使用暴力，願意承擔後果。</p><p>講台不為任何當代政權背書，也不攻擊任何當代政權；不點名政黨、政治人物或政策。弟兄姊妹作為公民怎樣參與公共事務，由各人在神面前憑良心決定，彼此尊重。本講義的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。散在不同國家、不同制度底下的弟兄姊妹，對政治的看法可以很不一樣，卻同屬一位主——2:13 說他是「至大的神和我們救主耶穌基督」，他的國度在一切地上的政權之上，也不靠任何一個政權存續。</p><p>如果你正活在一個信仰受限的地方，你不是次等的基督徒；如果你活在自由的地方，也不要輕看別人的處境。這一題最後要問的是：在我的政治立場裡，耶穌還是不是王？我對持不同看法的弟兄姊妹，還溫柔嗎？</p>"]],"con":[],"say":"本講義的立場：順從官長是常態，順從神是界線（3:1 的 πειθαρχεῖν 與徒 5:29 同字）；當權柄要求人犯罪、違背良心或危害生命，順從神，並以不毀謗、不使用暴力、願意承擔後果的方式持守。講台不為任何政權背書或攻擊，不點名政黨或政治人物。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有人正在信仰受限的地方聚會，心裡一直害怕；有人曾經因為信仰被約談、失去工作；也有人覺得教會對不義太沉默而受傷。不要說「不順服政府就是不屬靈」，也不要說「某些地方的基督徒都在妥協」，更不要拿別人的處境作講台上的例子。線上團契要特別保護弟兄姊妹的身分與聚會資料，不要求任何人公開表態。陪他們在禱告中分辨，尊重各人的良心與處境，讓每一個人都知道：無論在哪一個國家，他都不是一個人。"},{"id":"ISS03_2","t":"3:2「不要毀謗」——基督徒在網路上怎樣評論公眾人物？","r":"3:2；2:5；弗 4:15；弗 4:29","ch":[3],"why":"今天的毀謗常常不用嘴巴，用手指：一張轉傳的梗圖、一句嘲諷的留言、一段斷章取義的影片。很多基督徒在主日聽道很溫柔，在網路上評論公眾人物卻很兇；也有人因此乾脆甚麼都不說，覺得談公共議題就不屬靈。3:2 說「不要毀謗」任何人，那麼基督徒還可以批評公眾人物嗎？界線在哪裡？","pos":[["【一】經文問的是甚麼","","<p>3:2 的 μηδένα βλασφημεῖν（mēdena blasphēmein）字面是「不毀謗任何一個人」，緊接在 3:1 的「作官的、掌權的」後面——作官的也在這「任何一個人」裡面。βλασφημεῖν（blasphēmein）與 2:5「免得神的道理被毀謗」同字：我們不要神的道被毀謗，我們自己也不毀謗任何人。接著是 ἀμάχους（amachous）不打架、ἐπιεικεῖς（epieikeis）肯讓步，最後收在「向眾人大顯溫柔」。經文問的是：「不毀謗」是不是等於「不評論」？</p>"],["沉默說：基督徒不應評論任何公眾人物","","<p>有些弟兄姊妹認為，既然不可毀謗，最安全的做法就是對公眾人物一概不評論，只為他們禱告（提前 2:1--2）；網路上的言論太容易失控，不如不碰。這一說的長處是看見了網路言論的危險，也看見了禱告比評論更有力量。</p><p><strong>難處：</strong>聖經同時要我們「用愛心說誠實話」（弗 4:15）；保羅自己在同一封信裡就直說有人「因貪不義之財」（1:11）教導人。對明顯的不義完全沉默，也不是中立；而且這一說若變成教會文化，連教會內部的問題也會被一併壓下去。</p>"],["就事論事說：可以評論公共作為，不可羞辱人格","","<p>多數牧養傳統認為，毀謗是惡意抹黑、散布不實、羞辱人格；評論一個公眾人物公開的言行與政策，並不等同於毀謗。基督徒作為公民可以表達看法，但要守幾條界線：先查證再轉傳；就事論事，不嘲笑外貌、家人或出身；不用綽號、不用嘲諷的梗圖；說的話要能「叫聽見的人得益處」（弗 4:29）。</p><p><strong>難處：</strong>「事」和「人」的界線在網路上常常很模糊；演算法獎勵激烈的言論，人很容易在不知不覺中越線。這一說需要很強的自我檢查，不是一條規則能解決的。</p>"],["身分區分說：個人可以發聲，講台與教會帳號要節制","","<p>還有一些教會區分個人與群體的身分：弟兄姊妹作為公民可以有自己的政治看法；但講台、教會的官方帳號、牧者以職分身分發言時，要格外節制，不替任何一方背書，也不攻擊任何一方，免得把福音綁在一個陣營上，叫另一個陣營的人聽不見福音。</p><p><strong>難處：</strong>牧者與同工的個人帳號，在會眾眼中常常就代表教會；這條界線需要有職分的人自己更謹慎，而不是以「這是我個人的看法」為理由放鬆。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：可以就事論事，不可羞辱人格；先查證，再說話；說話之前，先記得「我們從前也是」（3:3）。</strong>評論任何人——包括作官的、掌權的、公眾人物、教會同工——之前，可以問三個問題：這是查證過的事實嗎？說出來對人有益嗎？我會當著他的面這樣說嗎？三個都通過，再用溫柔的話說出來。</p><p>講台與教會的官方管道不為任何政權、政黨或政治人物背書或攻擊；涉及政治順服的界線，本講義的全卷立場見 ISS00_5。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。基督徒對公共事務看法不同，是正常的；真正危險的不是看法不同，而是在看法不同時忘了對方也是神照自己形像造的人。</p><p>3:2 的「眾人」與 2:11「神救眾人的恩典」是同一條線：恩典向眾人顯明，溫柔也就向眾人顯出。你在網路上的每一句話，都是一扇櫥窗；人透過它看見的，應該是那位恩慈顯明的救主。</p>"]],"con":[],"say":"本講義的立場：3:2「不要毀謗」不是禁止說真話，而是禁止惡意抹黑、散布不實、羞辱人格；可以就事論事，先查證再說，說的話要與人有益。講台與教會的官方管道不為任何政權、政黨或政治人物背書或攻擊；涉及政治的部分，本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有人曾經被網路公審、被斷章取義的影片毀了名聲，聽到這一題會很痛；也有人自己就是常在網路上罵人的人，心裡知道卻停不下來。不要在講台上點名任何公眾人物作例子，也不要嘲笑任何一方的支持者。陪受傷的人說出他的經歷，必要時協助他走法律途徑；陪停不下來的人找出背後的憤怒與恐懼，一起定下具體的網路使用界線。"},{"id":"ISS03_3","t":"3:3「我們從前也是」——信主前的過去，在見證裡要講到多細？","r":"3:3；3:4；提前 1:13--16","ch":[3],"why":"華人教會很重視見證，信主前的故事越戲劇化，好像越能證明恩典大。可是有人在講台上把吸毒、外遇、暴力講得繪聲繪影，台下的人記住了罪，卻忘了救主；也有人在見證裡把前配偶、父母、受害者的事一併公開，叫他們再受傷一次；還有人因為過去太痛，被要求「分享見證」反而再一次受創。3:3 給了一個很有分寸的樣本。","pos":[["【一】經文問的是甚麼","","<p>3:3 列出七項：無知、悖逆、受迷惑、服事各樣私慾和宴樂、常存惡毒嫉妒的心、是可恨的、又是彼此相恨。原文 ἦμεν γάρ ποτε καὶ ἡμεῖς（ēmen gar pote kai hēmeis），「連我們也」——保羅把自己放在清單裡，卻沒有寫任何一項細節；緊接著就是 3:4 的「但」。他在別處說自己的過去，也是同一種寫法：「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（提前 1:13）。經文問的是：見證要怎樣講，才講出這個「但」？</p>"],["詳述說：細節越真實，越顯出恩典的大","","<p>有些教會與福音機構鼓勵詳細的見證：把當年的捆綁講清楚，才讓台下仍在同樣捆綁裡的人知道「我也可以被救」；戒毒、戒賭、更生的事工常常用這樣的見證打開人心。這一說的長處是誠實，不把教會包裝成一群從來沒有犯過錯的人。</p><p><strong>難處：</strong>細節講多了，容易變成罪的展覽，甚至讓台下仍在掙扎的人被勾起試探；見證會不知不覺變成表演，越驚人越受歡迎；故事裡的其他人（配偶、家人、受害者）沒有同意被公開，也可能因此再受傷害。</p>"],["簡述說：照保羅的樣式，點到為止，重點放在恩典","","<p>另一些牧者主張照 3:3 與提前 1:13 的樣式：誠實說出過去是甚麼樣的人，但不鋪陳細節，把篇幅留給神怎樣介入、今天怎樣被聖靈更新。這一說保護了聽眾，也保護了講見證的人和故事裡的其他人。</p><p><strong>難處：</strong>講得太抽象，可能聽起來像一份消毒過的履歷，讓仍在深淵裡的人覺得「他的過去跟我不一樣」；教會若只歡迎「乾淨」的見證，有沉重過去的人會不敢說，也不敢來。</p>"],["場合分層說：公開場合點到為止，小組與個別陪伴可以更深","","<p>還有一種做法是按場合分層：在講台、網路直播等公開場合，點到為止、聚焦恩典；在信任的小組裡、在一對一的陪伴中，為了幫助一位正在同樣處境裡的人，可以講得更具體；涉及別人的部分，先得到對方同意，或把可辨認的資訊拿掉。</p><p><strong>難處：</strong>分層需要智慧，小組也可能有「人人都要分享」的壓力；而且線上聚會常被錄影、截圖，「小場合」不一定真的小，需要事先約定保密的界線。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：照 3:3--5 的樣式作見證——誠實、簡要、落在「但」字上。</strong>說出「我從前也是」，不必鋪陳細節；把篇幅留給「神我們救主的恩慈和他向人所施的慈愛顯明的時候」（3:4），讓會眾記住的是那位照他的憐憫救人的神，不是罪有多精彩。</p><p>別人的故事不是我們的見證材料：涉及配偶、家人、未成年人或受害者的部分，先得到同意或不提。曾經受創的人，沒有義務在任何場合公開他的過去；見證是恩典的果子，不是得救或受洗的門檻。恩典與善行的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你的過去是驚天動地，還是平平淡淡在信徒家庭裡長大，3:3 的「我們」都把你包括在內——沒有一個人是靠自己的好被救的，也沒有一個人壞到恩慈不能顯明。</p><p>如果你的過去還讓你羞愧，你不必在人面前把它攤開才算有見證；你只要知道，在神面前，那筆帳已經照他的憐憫處理了。</p>"]],"con":[],"say":"本講義的立場：見證照 3:3--5 的樣式——誠實、簡要、落在「但」字上，重點是神照他的憐憫救了我們，不是罪有多精彩；涉及別人的部分先得同意或不提；受過創傷的人沒有義務公開過去。恩典與善行的全卷立場見 ISS00_4。","care":"會眾席上可能有受過性侵、家暴或成癮的弟兄姊妹，他們的過去裡有很深的傷，被要求「分享見證」可能是又一次的傷害——不要把見證當作受洗或服事的條件，不要在小組裡要求人人分享。也可能有人的過去牽涉到別人的隱私或法律責任，要先陪他分辨、必要時尋求專業意見。對有前科或沉重過去的人，教會要讓他知道：這裡是醫院，不是展覽館，你不必表演你的過去，也不必藏起來。"},{"id":"ISS03_4","t":"3:5「重生的洗」——受洗才能得救嗎？嬰孩洗禮與信徒洗禮該怎樣看？","r":"3:5；約 3:5；徒 2:38；彼前 3:21","ch":[3],"why":"3:5「藉著重生的洗和聖靈的更新」是教會歷史上討論洗禮最常引用的經文之一。不同宗派從這一節讀出很不一樣的洗禮觀，也因此彼此懷疑、甚至互相否定。會眾席上有從天主教、信義宗、改革宗、浸信會、靈恩派背景來的弟兄姊妹，也有來不及受洗就過世的親人、因家人反對還不能受洗的慕道友。這一題處理不好，會傷人，也會分裂。","pos":[["【一】經文問的是甚麼","","<p>3:4--7 原文是一整句話，唯一的主要動詞是 3:5 的 ἔσωσεν（esōsen）「救了」。救的根據先被否定、再被肯定：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）；救的方法是 διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου（dia loutrou palingenesias kai anakainōseōs pneumatos hagiou）。λουτρόν（loutron）是洗、洗澡盆；παλιγγενεσία（palingenesia）是再一次的出生，新約只出現兩次（另一次在太 19:28）。語法上「重生」與「更新」是否都由同一個 διά 管、是否都屬聖靈，也有不同讀法。經文問的是：這個「洗」指的是水禮嗎？它與得救是甚麼關係？</p>"],["洗禮重生說：神在洗禮中施行重生","","<p>天主教、東正教與部分信義宗傳統認為，3:5 的「洗」就是水禮，神在洗禮中藉著水和道施行重生的恩典；這與約 3:5「人若不是從水和聖靈生的，就不能進神的國」（約 3:5）、徒 2:38 的「受洗，叫你們的罪得赦」（徒 2:38）連在一起讀。這一說強調洗禮是神的作為，不是人的表演，所以也為嬰孩施洗：恩典在人能回應之前就已臨到。</p><p><strong>難處：</strong>若講不好，容易被聽成儀式自動生效，好像水本身有能力；而 3:5 前半明說救我們的是神的憐憫，十字架上的強盜沒有受洗，主卻對他說「今日你要同我在樂園裡了」（路 23:43）。</p>"],["記號與印證說：洗禮是重生的記號，施行重生的是聖靈","","<p>改革宗、聖公會、循道衛理等傳統認為，3:5 的「洗」與水禮有關，但水禮是重生的記號與印證，真正施行重生的是聖靈；洗禮是神立約的記號，正如舊約的割禮。這些傳統多半也為信徒的孩子施洗，視之為立約群體的記號，並期待孩子日後親自承認信仰。</p><p><strong>難處：</strong>記號與實質之間的關係，各宗派的說法細緻程度不同，一般會眾不容易明白；嬰孩洗禮之後若沒有信仰的栽培，記號也可能被當成保險。</p>"],["聖靈潔淨比喻說：「洗」是聖靈潔淨人心的比喻","","<p>許多浸信會、靈恩派與華人獨立教會認為，3:5 的「洗」與水禮沒有直接關係，是聖靈潔淨人心的比喻——這使我們想起結 36:25--27 神說要用清水灑在百姓身上、「賜給你們一個新心，將新靈放在你們裡面」（結 36:26），也使我們想起弗 5:26「用水藉著道，把教會洗淨」。這些傳統多半施行信徒洗禮（浸禮），由能親自承認信仰的人受洗。</p><p><strong>難處：</strong>若講過頭，會把洗禮講成可有可無；而主明明吩咐「奉父、子、聖靈的名給他們施洗」（太 28:19），新約的信徒信了就受洗，沒有拖延。</p>"],["【二】嬰孩洗禮與信徒洗禮","","<p>為嬰孩施洗的教會，看重恩典先於人的回應、立約群體包括信徒的兒女（徒 2:39「這應許是給你們和你們的兒女」的讀法），以及新約中「全家受洗」的記載；施行信徒洗禮的教會，看重洗禮是本人悔改與信心的公開回應，新約的明確例子都是信了才受洗。兩者都有愛主的弟兄姊妹、都有認真的釋經理由，也都同意：洗禮之後需要真實的信心與生命的跟隨。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三讀並陳，不裁判；講台的落點在同一節的前半——「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）。</strong>連洗禮也不是我們所行的義；重生是神的工作，不是儀式的工作，也不是人決志的工作。三種傳統都站得上這個落點。</p><p>本講義不說受洗就自動得救，也不說沒受洗不能得救；不以這一節判定任何宗派的弟兄姊妹有沒有得救，不嘲笑嬰孩洗禮或信徒洗禮任何一方。同時，洗禮是主的吩咐，不是可有可無：信了主的人，在自己所屬的教會裡順服這個吩咐。本講義的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各宗派對洗禮的方式與意義理解不同，都是在基督裡的弟兄姊妹；大家都同意：救恩的根基是基督，「你們得救是本乎恩，也因著信」（弗 2:8）。</p><p>如果你信了主卻還沒有受洗，不要因為害怕而拖延，也不要因為還沒受洗而懷疑自己的得救；如果你很早就受了洗，卻覺得自己離主很遠，洗禮不是一張保險單——今天就可以回到那位照他的憐憫救了你的神面前。</p>"]],"con":[],"say":"本講義的立場：3:5「重生的洗」三讀並陳不裁判；講台落點在「並不是因我們自己所行的義，乃是照他的憐憫」——連洗禮也不是我們所行的義，重生是神的工作。不說受洗就自動得救，也不說沒受洗不能得救，不判定任何宗派。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有家人信了主、卻來不及受洗就過世的人，正在心裡害怕；也有因為家人反對、遲遲不能受洗的慕道友，還有小時候受洗、如今冷淡卻以為自己有保險的人。不要用 3:5 讓第一種人絕望，不要用它給第二種人壓力，也不要讓第三種人安心於一個儀式。對從不同宗派背景轉來的弟兄姊妹，尊重他們原有的洗禮，不嘲諷、不把重新受洗當作參與服事的條件；若教會有自己的做法，私下溫和地說明。"},{"id":"ISS03_5","t":"3:5--6「聖靈的更新……厚厚澆灌」——聖靈的澆灌是一次還是多次？","r":"3:5--6；徒 2:17；徒 2:33；林前 12:13","ch":[3],"why":"3:6 說聖靈是神「厚厚澆灌在我們身上的」，用的是五旬節的同一個字。靈恩與非靈恩的弟兄姊妹在這裡常有不同的讀法：有人認為澆灌在五旬節、在信主時一次完成；有人追求信主以後的第二次經歷。這個差異曾經在華人教會造成很深的分裂，也讓一些人懷疑自己「到底有沒有聖靈」。","pos":[["【一】經文問的是甚麼","","<p>3:6 的 ἐξέχεεν（execheen）「澆灌」是不定過去式，與徒 2:17、33 五旬節的「澆灌」同一個字：「我要將我的靈澆灌凡有血氣的」（徒 2:17）。五旬節那天，聽見門徒說話的人群裡就有克里特人（徒 2:11）。πλουσίως（plousiōs）「厚厚地」是豐豐富富；藉著誰？「藉著耶穌基督－我們救主」（3:6）。經文問的是：這一次「澆灌」，是救贖歷史上一次完成的事、每一位信徒信主時都已經領受，還是信徒可以、也應當一再經歷的事？</p>"],["一次說：五旬節一次澆灌，信徒信主時都已領受","","<p>許多改革宗與福音派認為，3:6 的不定過去式指向五旬節那一次的澆灌，以及每一位信徒信主時的領受：「我們……都從一位聖靈受洗，成了一個身體」（林前 12:13）。保羅寫給全體克里特信徒，說聖靈已經澆灌「在我們身上」，沒有分出兩等信徒；信主以後的經歷，是被聖靈「充滿」，不是另一次的澆灌。</p><p><strong>難處：</strong>這一說若講過頭，可能讓教會不再渴慕聖靈新的工作；而使徒行傳裡同一群人又再一次「都被聖靈充滿，放膽講論神的道」（徒 4:31），撒瑪利亞與以弗所的信徒也有後來的經歷（徒 8:17；19:6）。</p>"],["多次說：信主以後還有聖靈澆灌或充滿的經歷","","<p>聖潔運動與五旬節—靈恩運動傳統認為，信主以後還有一次（或多次）明確的聖靈經歷，常稱為「聖靈的洗」或「第二次祝福」，根據是徒 8、10、19 章的記載，以及教會歷史上一次又一次的復興。這一說的長處是提醒教會：聖靈不是一條教義，是活的神，信徒可以渴慕他更深的同在與能力。</p><p><strong>難處：</strong>若把某一種經歷（例如說方言）當作「有沒有聖靈」的證據，就會把教會分成兩等人，與 3:6「在我們身上」的全體性衝突；保羅也提醒，「我若能說萬人的方言……卻沒有愛」（林前 13:1），甚麼也算不得。</p>"],["一次澆灌、多次充滿說：根基一次立定，經歷不斷更新","","<p>不少中間立場的教會這樣綜合：聖靈的澆灌在五旬節一次成就，每一位信徒信主時都領受了聖靈；同時，信徒要一直「被聖靈充滿」（弗 5:18 是現在式命令），一次又一次地經歷他的更新——3:5 的 ἀνακαίνωσις（anakainōsis）「更新」，就是羅 12:2「心意更新而變化」的「更新」，同一個字，本身就是一個持續的過程。</p><p><strong>難處：</strong>各派對「澆灌」「受洗」「充滿」的用詞不一樣，這個綜合有時只是換了名詞，實際的牧養問題（例如怎樣看待說方言）仍需要各教會在自己的傳統裡面對。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：3:6 的主詞是神，對象是「我們」全體——聖靈是神藉著耶穌基督厚厚澆灌在每一位信徒身上的，不是少數人的專利，也不是偶爾來幫忙的客人。</strong>一次與多次的讀法並陳，不以任何一種經歷作為得救或屬靈等級的門檻，也不嘲笑追求聖靈充滿的弟兄姊妹。</p><p>聖靈的恩賜與經歷，回到哥林多前書講義第 12--14 章的處理；這一類「怎樣理解」的爭議，本講義的全卷立場見 ISS00_9。321 的「聖靈是我的引導」在這裡被經文確認：他是厚厚澆灌的，所以每一天都可以倚靠他。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你沒有某一種特別的經歷，你仍然是聖靈厚厚澆灌的人——3:6 沒有把你排除在外；如果你有過深刻的經歷，那是神的恩典，不是你比別人屬靈的證據。</p><p>這一題最後要問的是：聖靈的更新，有沒有在我的生活裡結出 3:2 的溫柔、3:8 的正經事業？那比任何一次經歷更能說明他在我身上。</p>"]],"con":[],"say":"本講義的立場：3:6 的主詞是神、對象是全體信徒，聖靈是神藉著耶穌基督厚厚澆灌在每一位信徒身上的；澆灌一次或多次並陳，不以任何經歷作得救或屬靈等級的門檻。恩賜與經歷回到哥林多前書講義第 12--14 章；本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有人在靈恩聚會裡被按手、卻沒有「倒下」或說方言，從此懷疑自己沒有聖靈；也有人從靈恩教會轉來，被說成「情緒化」而受傷。不要讓任何一方覺得自己是次等的基督徒，也不要在講台上模仿或嘲諷別的教會的聚會方式。陪懷疑的人回到 3:5--6 的應許，陪受傷的人說出經歷，讓不同背景的弟兄姊妹在同一張桌子上一起禱告。"},{"id":"ISS03_6","t":"3:5、8「並不是因我們自己所行的義」與「留心做正經事業」——保羅與雅各衝突嗎？","r":"3:5--8；雅 2:14--26；弗 2:8--10","ch":[3],"why":"提多書第 3 章一面說「並不是因我們自己所行的義」，一面要信徒「留心做正經事業」；雅各書卻說「人稱義是因著行為，不是單因著信」（雅 2:24）。很多信徒在這裡卡住：到底是靠信還是靠行？有人因此落入律法主義，不停檢查自己做得夠不夠；有人落入廉價恩典，覺得反正得救了，怎麼過都一樣。這是全卷的中心問題之一。","pos":[["【一】經文問的是甚麼","","<p>3:5 的否定極重：οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς（ouk ex ergōn tōn en dikaiosynē ha epoiēsamen hēmeis）——不只是不因壞行為，連「在義中所行的」都不算；3:7 接著說「因他的恩得稱為義」，是保羅在教牧書信裡唯一一次用「稱義」講信徒蒙恩稱義（提前 3:16 同一個動詞說的是基督「被聖靈稱義」）。可是 3:8 緊接著要提多把「這些事」切切實實地講明，「使那些已信神的人留心做正經事業」（3:8）。經文問的是：同一段話裡的「不是因行為」和「要留心行善」，怎樣同時成立？它和雅各書又怎樣對讀？</p>"],["不同敵人說：保羅與雅各面對的是不同的錯誤","","<p>宗教改革以來多數福音派這樣讀：保羅對付的是想靠行為賺得救恩的人（3:5「不是因我們自己所行的義」），雅各對付的是口稱有信、生命卻毫無改變的人（雅 2:14「若有人說自己有信心，卻沒有行為，有甚麼益處呢」）。兩人一個防「行為主義」，一個防「死的信心」；保羅說的「稱義」是在神面前被宣告為義，雅各說的「稱義」是信心在人面前被顯明出來。提多書第 3 章自己就把兩邊放在一起：3:5 是根，3:8 是果。</p><p><strong>難處：</strong>雅 2:24 的措辭仍然很強，「不是單因著信」不容易輕輕帶過；若太快說「兩人講的是不同的事」，可能錯過雅各真正的挑戰：沒有行為的信心，根本不是得救的信心。</p>"],["同一過程說：稱義與成聖都是恩典在人身上的工作","","<p>天主教與東正教傳統多半把稱義理解為一個包括內在更新的過程：神的恩典先臨到，使人能夠回應、行出義來，而這些善行本身也是恩典的果子；3:5 說救我們的是「聖靈的更新」，3:8 說要留心行善，正是同一個恩典的兩面。這一說的長處是不把信心和生命拆開，提醒人恩典是改變人的力量，不只是法庭上的宣告。</p><p><strong>難處：</strong>若稱義的根據包括人身上被更新後的義，就不容易解釋 3:5 那樣徹底的否定——連「在義中所行的」都不算；宗教改革的關切正在這裡：人的確據若建立在自己的進步上，就永遠不知道夠不夠。</p>"],["恩典教導說：恩典本身會教人行善","","<p>另一個從提多書本身出發的讀法，把重點放在 2:11--12：恩典「已經顯明出來，教訓我們」——恩典不只赦免，也像父母一樣教養人。行善不是在恩典之外加上去的條件，而是恩典在人身上必然長出來的樣子；所以保羅可以同時說「不是因行為」與「要留心行善」，雅各也可以說沒有行為的信心是死的。</p><p><strong>難處：</strong>這一說若講得太簡化，可能讓人以為「真信的人自然會行善」，就不再需要勸勉與學習；可是 3:14 偏偏說「我們的人要學習正經事業」——行善是要學的，不是自動的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：得救的根是神的憐憫，不是我們所行的義（3:5）；行善是被救的果子與目的，不是得救的條件（2:14；3:8）——行是果，不是根。</strong>引 3:8 必帶 3:5：兩句都是真的，次序不可顛倒。顛倒過來，就成了想用好行為贖身的律法主義；把 3:8 刪掉，就成了「怎樣活都可以」的廉價恩典。</p><p>保羅與雅各不衝突：一個說信心的根，一個說信心的果；詳見雅各書講義第 2 章。本講義的全卷立場見 ISS00_4。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而會堅固你的信心。如果你常常懷疑自己做得不夠，3:5 告訴你：救恩從來不記在你的帳上；如果你覺得反正得救了、怎麼過都差不多，3:8 告訴你：被救的人會留心做正經事業。</p><p>這一題最後要問的不是「我做得夠不夠」，而是「我行善，是為了證明自己，還是因為他先為我們捨了自己」——前者是有己，後者是無己。</p>"]],"con":[],"say":"本講義的立場：得救的根是神的憐憫，不是我們所行的義（3:5）；行善是被救的果子，不是得救的條件（3:8）——行是果，不是根。引 3:8 必帶 3:5；保羅與雅各不衝突，詳見雅各書講義第 2 章。本講義的全卷立場見 ISS00_4。","care":"會眾席上有兩種人最需要這一題：一種是在律法主義的教會長大、一輩子都在擔心「我做得夠不夠」的人，他們聽到「留心做正經事業」就更焦慮；另一種是長期活在明知的罪裡、用「恩典」安慰自己的人。不要用 3:8 加重第一種人的重擔，也不要用 3:5 讓第二種人安心。陪第一種人一次又一次回到「照他的憐憫」，陪第二種人看見恩典本身會教人、會改變人；兩種人都需要的，是那位為我們捨了自己的主。"},{"id":"ISS03_7","t":"3:9「無知的辯論和家譜」——哪些神學爭論值得辯？","r":"3:9；提前 1:4；提後 2:23","ch":[3],"why":"網路時代神學爭論無所不在：末世時間表、恩賜是否停止、預定與自由意志、各種新奇的解經……有人每天在社群裡辯到深夜，有人看見爭論就退縮，覺得「談神學只會分裂」。3:9 叫提多「遠避」某些爭論，可是保羅自己一生也在為福音爭辯。哪些該辯、哪些該繞過去？這需要一個清楚的分辨標準。","pos":[["【一】經文問的是甚麼","","<p>3:9 列出四樣：μωρὰς ζητήσεις（mōras zētēseis）無知的辯論、γενεαλογίας（genealogias）家譜、ἔρεις（ereis）紛爭、μάχας νομικὰς（machas nomikas）因律法而起的爭競；動詞 περιΐστασο（periistaso）是「繞道走開」。「家譜」多半指當時猶太背景的教師對舊約人物家譜的玄想（這使我們想起提前 1:4「無窮的家譜；這等事只生辯論」），「律法的爭競」則與 1:10「那奉割禮的」相連。保羅給的理由是「這都是虛妄無益的」（3:9），與 3:8「與人有益」正面對照。經文問的是：分辨一場爭論值不值得投入的標準是甚麼？</p>"],["一律避免說：神學爭論只會分裂，基督徒專心愛人就好","","<p>有些弟兄姊妹從 3:9 與提後 2:23「惟有那愚拙無學問的辯論，總要棄絕，因為知道這等事是起爭競的」（提後 2:23）推論：神學爭論本身就是問題，教會只要專心禱告、傳福音、愛人。這一說看見了爭論對教會的傷害，也看見了很多人把辯論當成屬靈的替代品。</p><p><strong>難處：</strong>保羅自己在加拉太書與彼得當面爭辯，猶大書也勸信徒要為「一次交付聖徒的真道」竭力爭辯；提多書第 1 章更要長老「能將純正的教訓勸化人，又能把爭辯的人駁倒」（1:9）。完全不辯，等於讓假教訓長驅直入。</p>"],["核心與次要分層說：為福音的核心爭辯，在次要的事上寬容","","<p>許多福音派採用「神學分層」：第一層是福音的核心（基督的神性、十字架與復活、因恩典得救——正是 3:4--7 與 2:11--14 的內容），必須清楚持守；第二層是影響教會實踐的議題（洗禮方式、教會體制），可以在不同教會中各自持守；第三層是次要的推測（末世細節、某些經文的確切所指），應當寬容、謙卑。</p><p><strong>難處：</strong>哪些屬於核心、哪些屬於次要，各宗派的清單並不一致；分層本身也可能被人拿來把自己在乎的事一律升級成「核心」，把別人在乎的事一律降成「次要」。</p>"],["動機與果效說：看辯論是否與人有益","","<p>還有一種讀法直接從 3:8--9 的對照出發：不是先問題目，而是問這場辯論的動機與果效——是為了真理與人的益處，還是為了贏、為了出名、為了「不義之財」（1:11）？辯完之後，有人更認識基督、更願意行善嗎？同一個題目，對一位真心尋求的慕道友是「有益」，在網路上為了流量的對罵就是「無益」。</p><p><strong>難處：</strong>動機很難從外面判斷，自己也常看不清自己；這一說需要和「分層說」一起用，才不會變成「我覺得有益就辯、我覺得無益就不辯」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：為福音的核心清楚持守，在次要的事上並陳、謙卑、不定案；凡是動機為了贏、果效是分裂、內容是玄想的爭論，照 3:9 繞道走開。</strong>標準就在 3:8--9 的對照裡：與人有益，還是虛妄無益？</p><p>本講義處理 2:13 一位或兩位、3:5 重生的洗、1:6 兒女信主等爭議時，採取的正是這種分層：在根基上站穩，在枝節上並陳。一位真心發問的人不是 3:9 要遠避的對象，而是 3:8 要服事的對象。本講義的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。基督徒在許多問題上看法不同，從使徒時代就是如此；這不表示真理不清楚，而是表示我們都還在學習。核心的福音很清楚：「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫」（3:5）。</p><p>如果你常被網路上的神學爭論弄得心煩意亂，你可以照 3:9 的字面去做：繞道走開。把時間拿去做一件「與人有益」的正經事業，你的信心會比贏一場辯論更穩。</p>"]],"con":[],"say":"本講義的立場：為福音的核心（3:4--7）清楚持守，在次要的事上並陳、謙卑、不定案；動機為了贏、果效是分裂、內容是玄想的爭論，照 3:9 繞道走開。真心發問的人不是要遠避的對象。本講義的全卷立場見 ISS00_9。","care":"會眾席上可能有一位在網路論戰裡受了傷的人，被人貼標籤、被說成異端；也可能有一位正被某個教導吸引、每天沉迷在爭論裡的人。不要在講台上點名任何教會或教導者作嘲笑的對象；不要把提出問題的年輕人說成「愛辯論」。陪受傷的人回到教會的真實關係裡，陪沉迷的人找回禱告與服事的節奏；對真心的疑問，花時間一對一地談。"},{"id":"ISS03_8","t":"3:10「分門結黨的人……就要棄絕他」——教會怎樣處理異議與分裂？","r":"3:10--11；太 18:15--17；提後 2:23--25；加 6:1","ch":[3],"why":"3:10 在教會歷史上常常被用錯：誰提出不同意見、誰質疑領袖、誰揭發財務或同工的問題，就被說成「分門結黨」，從服事名單上消失、在群組裡被封鎖、在走廊上被冷落。另一方面，教會也確實有人自己選一邊、拉一群人、使教會撕裂。怎樣分辨這兩種人？怎樣處理才合乎 3:10 的程序與心意？這一題關係到教會的健康，也關係到許多人的傷。","pos":[["【一】經文問的是甚麼","","<p>αἱρετικὸν ἄνθρωπον（hairetikon anthrōpon）「分門結黨的人」，αἱρετικός（hairetikos）新約只出現這一次，字根 αἱρέομαι（haireomai）是「選擇」：自己選一邊、拉一群人、製造分裂。μετὰ μίαν καὶ δευτέραν νουθεσίαν（meta mian kai deuteran nouthesian）「警戒過一兩次」——νουθεσία（nouthesia）是把人的心思放回正位的勸戒；παραιτοῦ（paraitou）「棄絕他」，與提後 2:23 叫人「棄絕」愚拙辯論的是同一個字。3:11 描寫這等人：ἐξέστραπται（exestraptai）整個翻轉過來，αὐτοκατάκριτος（autokatakritos）自己定了自己的罪。經文問的是：誰是這個人？「棄絕」是逐出，還是不再和他辯論？</p>"],["逐出說：經過勸戒仍不悔改，就要把他從團契中隔開","","<p>不少傳統把 3:10 與太 18:15--17 連在一起讀：先私下勸，再帶一兩個人，再告訴教會，「若是不聽教會，就看他像外邦人和稅吏一樣」（太 18:17）。製造分裂的人在經過程序之後仍不悔改，教會可以把他從團契的事奉與領導中隔開，保護羊群；羅 16:17 也勸信徒「留意躲避」那些離間的人。</p><p><strong>難處：</strong>這一說最容易被濫用：程序被跳過、勸戒變成通知、「分裂」被定義成「不同意領袖」；而且主耶穌說「看他像外邦人和稅吏」，正是他自己最常去接近、去吃飯的一群人——門並沒有關上。</p>"],["不再辯論說：拒絕捲進他無止境的爭論，不是把人趕走","","<p>另一些解經者注意到 παραιτοῦ（paraitou）在教牧書信裡多用在拒絕某種東西或某種請求（提前 4:7；5:11；提後 2:23），所以 3:10 的重點是：提多不要再一場一場地和這個人辯下去，不讓他把聚會變成他的戰場，也不讓他把羊群帶走；這與 3:9「要遠避無知的辯論」一脈相承。這一說保留了人在團契中被挽回的空間。</p><p><strong>難處：</strong>若一個人正在「敗壞人的全家」（1:11），只是「不和他辯論」可能不足以保護羊群；有些情況（例如性侵、詐騙、侵占）需要更明確的處理，甚至依法通報，不是不理他就可以。</p>"],["【二】誰是 3:10 說的人","","<p>不論採哪一讀，經文本身已經畫了輪廓：他不是一個提出問題的人，而是一個「自己選了一邊」並拉人跟隨的人；他已經被勸過一兩次，仍然「明知不是，還是去做」（3:11）。提出不同意見、在會議上表達異議、質疑同工的決定、揭發教會裡的錯誤——這些人都不是 αἱρετικός（hairetikos）。教會若連問題都不能問，生病的反而是教會。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：αἱρετικός 是製造分裂的人，不是提出問題、提出不同意見或揭發問題的人；「警戒過一兩次」是程序，目的是挽回；「棄絕」是不再捲進他的爭論、不讓他帶走羊群，不是許可冷暴力。</strong>逐出與不再辯論兩讀並陳。</p><p>處理的人先照 3:2：不毀謗、不爭競、向眾人大顯溫柔——「不要爭競」先適用在掌權者自己身上。程序要公開透明、有記錄、有申訴的管道；涉及違法的事件依法處理。屬靈權柄不可轄制（回指彼得前書立場五；長老與權柄的全卷立場見 ISS00_3）。門仍然開著：他若回頭，「我們從前也是」（3:3）也是為他預備的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。教會會有分歧，從使徒時代就有；哥林多有人說「我是屬亞波羅的」（林前 1:12），可是被拿來分黨的保羅和亞波羅自己從來沒有分黨——3:13 保羅還吩咐給亞波羅送行。</p><p>如果你曾經因為提出意見而被冷落，請知道：那不是 3:10 的意思，主看見你。如果你正處在一場分裂的中間，這一題最後要問的是：我是在「選一邊、拉一群人」，還是在用溫柔的心，把人的心思放回正位？</p>"]],"con":[],"say":"本講義的立場：3:10 的 αἱρετικός 是自己選邊、拉人、製造分裂的人，不是提出問題、提出不同意見或揭發問題的人；「警戒過一兩次」是程序與挽回，「棄絕」不是許可冷暴力，3:2「不要爭競」先適用在掌權者自己身上。長老與權柄的全卷立場見 ISS00_3。","care":"會眾席上可能有人曾經因為提出意見、揭發問題而被貼上「分門結黨」的標籤，從此不敢再踏進教會；也可能有人正處在教會分裂的傷痛裡，不知道該站哪一邊。不要在講台上影射任何人，不要用這一節回應最近的爭議。陪被冷落的人說出他的經歷，若教會真的處理不當，要願意承認、道歉；陪處在分裂中的人分辨自己的動機，也讓他知道：離開一間教會不等於離開主，留下來也不等於要沉默。"},{"id":"ISS03_9","t":"3:12--14「叫他們沒有缺乏」——教會該怎樣供應同工與宣教士？","r":"3:12--14；林前 9:14；腓 4:16；徒 18:3","ch":[3],"why":"3:13 保羅吩咐提多「趕緊給律師西納和亞波羅送行，叫他們沒有缺乏」。今天的教會也有在外地奔走的同工與宣教士：有的長期領不合理的待遇，被說成「憑信心生活」；有的教會用「奉獻給神的僕人必蒙福」向會眾施壓；國度321空中團契散在各國，也需要一個彼此供應的同工網絡。3:12--14 讓我們看見保羅怎樣安排人、怎樣供應人。","pos":[["【一】經文問的是甚麼","","<p>3:12--13 是一張同工名單：亞提馬（新約只此一次）、推基古（保羅多次託付的信差，徒 20:4）、律師西納、亞波羅。σπουδαίως πρόπεμψον（spoudaiōs propempson）「趕緊送行」——προπέμπω（propempō）在新約常指為傳道的人預備路費與所需，送他上路（這使我們想起羅 15:24「蒙你們送行」）；ἵνα μηδὲν αὐτοῖς λείπῃ（hina mēden autois leipē）「叫他們沒有缺乏」，λείπω（leipō）與 1:5「沒有辦完的」同字根。3:14 接著說「我們的人要學習正經事業，預備所需用的」。經文問的是：教會對同工與宣教士的供應，責任在誰？要供應到甚麼程度？</p>"],["教會供應說：傳福音的人靠福音養生，教會有責任供應","","<p>許多教會根據「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14）與腓立比教會的榜樣——「你們也一次兩次地打發人供給我的需用」（腓 4:16）——認為教會有清楚的責任，給全職同工與差派出去的宣教士合理的待遇與照顧。3:13 的「叫他們沒有缺乏」是一個具體的吩咐，不是可有可無的善意。</p><p><strong>難處：</strong>這一說若落入制度化的大預算，小教會可能負擔不起，大教會又可能把供應變成控制；也有人借此向會眾施壓募款，把奉獻講成換取祝福的交易。</p>"],["帶職事奉說：同工也可以自己做工，不叫人受累","","<p>另一些教會強調保羅自己的樣子：他在哥林多「製造帳棚為業」（徒 18:3），在帖撒羅尼迦「晝夜做工，免得叫你們一人受累」（帖後 3:8）。帶職事奉讓同工不依賴教會的經濟，在職場中作見證，也適合剛起頭、資源有限的教會——正像克里特各城剛剛設立長老的處境。</p><p><strong>難處：</strong>保羅帶職是他自己的選擇，他同時接受腓立比的供應，也明說傳道的人有權柄靠福音養生；若教會用「帶職」作藉口不負責任，同工會在工作與事奉之間耗盡，家人也一起受苦。</p>"],["網絡互助說：跨教會的同工網絡彼此送行、彼此補足","","<p>3:12--13 呈現的不是一間教會養一位同工，而是一個跨城、跨教會的網絡：保羅在尼哥坡里，提多在克里特，推基古或亞提馬來接手，西納和亞波羅路過，由提多與「我們的人」一起供應。今天的網絡型事工、跨國團契，正需要這樣的模式：誰經過、誰缺乏，就由當地的人補上。</p><p><strong>難處：</strong>網絡越鬆散，越容易缺乏透明與問責；誰負責、錢怎麼用、誰照顧同工的家人，都需要清楚的安排，不能只靠熱心。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：「叫他們沒有缺乏」是愛與責任，不是交易；教會要主動看見同工與宣教士的實際需要，給合理的待遇與照顧，財務公開透明；不以奉獻換祝福向會眾施壓，也不以「憑信心」為名讓同工長期缺乏。</strong>帶職與全職都是神所使用的方式，各按處境。</p><p>3:12--13 的名單不硬套成任何職分分類（鐵律五）；這是一群彼此託付、彼此補足的同工。尼哥坡里的位置與保羅的行程，本講義的全卷立場見 ISS00_6；作者與時間線見 ISS00_1。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。教會供應同工的方式各有不同，但方向是一樣的：被憐憫的人，學著「預備所需用的」（3:14）。</p><p>如果你是一位長期缺乏的同工，你的缺乏神看見，你也可以說出來，那不是不屬靈；如果你是一位會友，你不需要很多錢才能參與——一頓飯、一段接送、一封代禱信，都是 3:14 的正經事業，都是果子。</p>"]],"con":[],"say":"本講義的立場：3:13「叫他們沒有缺乏」是愛與責任，不是交易；教會要主動供應同工與宣教士的實際需要、財務透明，不以奉獻換祝福施壓，也不讓同工以「憑信心」為名長期缺乏；名單不硬套成職分分類。尼哥坡里與行程見全卷立場 ISS00_6。","care":"會眾席上可能有一位全職同工，或一位宣教士的家人，長期在經濟上掙扎卻不敢說；也可能有一位經濟困難的會友，聽到「供應同工」就覺得自己又多了一份虧欠。不要在講台上用這一題募款，不要讓奉獻多少成為屬靈與否的標準。牧者與長執要私下關心同工的實際需要，建立透明的制度；也讓每一位會友知道，他用時間、陪伴與禱告補上的缺乏，同樣是果子。"}],"terrain":{"points":[[0.594,80,2,"那無謊言的神","top"],[0.781,60,5,"將那沒有辦完的事都辦整齊了",null],[1.219,22,12,"克里特人常說謊話","bot"],[1.469,10,16,"行事卻和他相背","bot"],[2.133,66,10,"以致凡事尊榮我們救主－神的道",null],[2.2,98,11,"恩典已經顯明出來","top"],[2.667,18,3,"我們從前也是","bot"],[2.8,96,5,"乃是照他的憐憫","top"],[3.0,74,8,"使那些已信神的人留心做正經事業",null],[3.4,62,14,"預備所需用的，免得不結果子",null]]},"tracks":[{"gk":"σωτήρ／σωτήριος／σῴζω","tr":"sōtēr / sōtērios / sōzō","gl":"救主、救人的、救","code":"G4990","root":"σωτήρ——救主、拯救者；σωτήριος——帶來拯救的；σῴζω——救。提多書三章用了八次，而且有一個別卷沒有的節奏：每說一次「神－我們救主」，下一處就說「基督－我們救主」（1:3／1:4；2:10／2:13；3:4／3:6）——同一個稱號，兩位都配得。彼得後書已立 σωτήρ 一條，本卷追的是這個交替","ins":"這個字在提多書走的是一條雙線。1:3 保羅說他傳道的責任是「按著神－我們救主的命令交託了我」；緊接著 1:4，同一個稱號落在另一位身上：「我們的救主基督耶穌」。第二輪在第 2 章：一個奴僕的忠誠，「以致凡事尊榮我們救主－神的道」（2:10）；下一節「救」從稱號變成恩典本身——「神救眾人的恩典已經顯明出來」（2:11），σωτήριος 是形容詞，恩典的本質就是救人。兩節之後是全卷最高的一句：「至大的神和我們救主耶穌基督」（2:13）——照本講義採的一位讀法，救主的稱號與「至大的神」並列在同一位身上（兩位讀法並陳於議題頁）。第三輪在第 3 章：「神－我們救主的恩慈……顯明的時候」（3:4），稱號變成動作：「他便救了我們」（3:5）——不是我們救了自己，連「我們所行的義」都不算在內；最後一站回到基督：「藉著耶穌基督－我們救主厚厚澆灌在我們身上」（3:6）。三輪交替，每一輪都從父神走到基督。在一個把「神與救主」頭銜獻給皇帝的世界裡，克里特的信徒每讀一次這封信，就聽見三次：救主不是凱撒，是那位為我們捨了自己的。","stops":[["1:3","按著神－我們救主的命令交託了我",""],["1:4","願恩惠、平安從父神和我們的救主基督耶穌歸與你",""],["2:10","以致凡事尊榮我們救主－神的道",""],["2:11","因為神救眾人的恩典已經顯明出來","top"],["2:13","並等候至大的神和我們救主耶穌基督的榮耀顯現","top"],["3:4","但到了神－我們救主的恩慈和他向人所施的慈愛顯明的時候",""],["3:5","他便救了我們","top"],["3:6","聖靈就是神藉著耶穌基督－我們救主厚厚澆灌在我們身上的",""]]},{"gk":"ἔργον ＋ καλός／ἀγαθός","tr":"ergon + kalos / agathos","gl":"善事、善行、正經事業","code":"G2041","root":"ἔργον——工作、行為、事業；καλός——美好的、高尚的；ἀγαθός——良善的、有益的。提多書把「善行」（καλὰ ἔργα／ἀγαθὸν ἔργον）講得極密：三章四十六節裡 ἔργον 在七節裡出現八次，其中六處明說是美好、良善的工作（1:16；2:7、14；3:1、8、14）。但同一卷書也說「並不是因我們自己所行的義」（3:5 ἔργων）——行為不能救人，被救的人卻要結果子","ins":"這條線從一個空白開始。1:16 是起點：假師傅「說是認識神，行事卻和他相背……在各樣善事上是可廢棄的」——ἀδόκιμοι，驗不過的錢幣；口裡有神，手上沒有善事。第 2 章把善行分給每一種人：少年婦人「待人有恩」（2:5，ἀγαθάς）、提多「凡事要顯出善行的榜樣」（2:7）、連奴僕的忠誠，原文直譯都是顯出全然美好的信實（2:10 πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν）。2:14 是第一個翻轉：善行的源頭不是我們的決心，是基督「為我們捨了自己……特作自己的子民，熱心為善」——被贖的目的就是熱心為善。3:1 叫人「預備行各樣的善事」，連對作官的都一樣。3:5 是第二個翻轉，同一個字反過來用：「並不是因我們自己所行的義」——ἔργων，行為不能救人。三節之後 3:8 又說「留心做正經事業」（καλῶν ἔργων προΐστασθαι，站在善事的前頭）——兩句都是真的，次序不能顛倒。終點 3:14 說善行要「學習」：μανθανέτωσαν，善行不是天生的，是學會的，目的是「免得不結果子」。這條線從可廢棄的人走到結果子的人，中間站著那位捨己的。","stops":[["1:16","行事卻和他相背……在各樣善事上是可廢棄的","bot"],["2:5","待人有恩",""],["2:7","你自己凡事要顯出善行的榜樣",""],["2:10","要顯為忠誠",""],["2:14","特作自己的子民，熱心為善","top"],["3:1","預備行各樣的善事",""],["3:5","並不是因我們自己所行的義","bot"],["3:8","使那些已信神的人留心做正經事業","top"],["3:14","並且我們的人要學習正經事業",""]]},{"gk":"διδασκαλία／ὑγιαίνω／παιδεύω","tr":"didaskalia / hygiainō / paideuō","gl":"教訓、道理、教導、純正（健康）的、教養","code":"G1319","root":"διδασκαλία／διδαχή——教訓、所教的；διδάσκω——教導；ὑγιαίνω——健康、純正（英文 hygiene 的字根）；παιδεύω——教養孩子、管教。提多書的教訓是一個健康的問題：純正的道理產生健康的生命","ins":"這條線問的是：甚麼樣的教訓是健康的？1:9 長老要「堅守所教真實的道理，就能將純正的教訓勸化人」——ὑγιαινούσῃ，健康的。1:11 是它的反面：假師傅「將不該教導的教導人，敗壞人的全家」——不健康的教導會傳染，從一個人傳到一個家。1:13 的責備有目的：「使他們在真道上純全無疵」，ὑγιαίνωσιν，讓他們恢復健康。2:1 是第 2 章的總綱：「但你所講的總要合乎那純正的道理」；接下來健康落在生活上——老年人「在信心、愛心、忍耐上都要純全無疵」（2:2），老年婦人「用善道教訓人」（2:3，καλοδιδασκάλους，新約只此一次：一位教美善的老師）。提多自己「在教訓上要正直」（2:7）、「言語純全」（2:8 ὑγιῆ），奴僕的忠誠「尊榮我們救主－神的道」（2:10，這裡的「道」原文就是 διδασκαλίαν）。終點是全卷最美的翻轉：「教訓我們」（2:12）用的不是 διδάσκω，是 παιδεύουσα——父母養孩子的那個字。最好的老師不是長老，不是提多，不是保羅，是那已經顯明出來的恩典；它像一位住在家裡的父母，一天一天把人教養成健康的人。","stops":[["1:9","堅守所教真實的道理，就能將純正的教訓勸化人",""],["1:11","將不該教導的教導人，敗壞人的全家","bot"],["1:13","使他們在真道上純全無疵",""],["2:1","但你所講的總要合乎那純正的道理","top"],["2:2","在信心、愛心、忍耐上都要純全無疵",""],["2:3","用善道教訓人",""],["2:7","在教訓上要正直、端莊",""],["2:8","言語純全，無可指責",""],["2:10","以致凡事尊榮我們救主－神的道",""],["2:12","教訓我們除去不敬虔的心和世俗的情慾","top"]]},{"gk":"πίστις／πιστός／πιστεύω","tr":"pistis / pistos / pisteuō","gl":"信心、信實、可信的、信","code":"G4102","root":"πίστις——信心、信實；πιστός——可信的、忠實的、信主的；πιστεύω——信、託付。同一個字根在提多書裡有三張臉：向神的信心、向人的信實、話語的可信。保羅不讓它們分家","ins":"1:1 保羅的使徒職分是為了「神選民的信心」；1:3 同一個字根轉成被動：傳道的責任「交託了我」（ἐπιστεύθην）——神先信任了保羅，保羅才去堅固別人的信心。1:4 提多是「照著我們共信之道」的真兒子——一個希臘人與一個猶太人，因同一個信成了父子。1:6 是全卷最難的一站：「兒女也是信主的」——πιστά 也可以讀作「忠實可靠的」，兩讀並陳，同句後半「沒有人告他們是放蕩不服約束的」才是重點。1:9 長老要堅守「真實的道理」，原文是「可信的話」（πιστοῦ λόγου）；1:13、2:2 信心要「純全無疵」，健康。2:10 是第一個翻轉：一個奴僕「要顯為忠誠」——原文就是 πίστιν，在主人家裡不私拿東西的信實，就是他的信心長出來的樣子。3:8 是第二個翻轉，話語與信徒落在同一節：「這話是可信的……使那些已信神的人留心做正經事業」——可信的話產生信的人，信的人做正經事業。最後一站，信心變成愛：「那些因有信心愛我們的人」（3:15）。信心在提多書從來不是一個人關起門來的事，它一路長成信實、長成善事、長成愛。","stops":[["1:1","憑著神選民的信心與敬虔真理的知識",""],["1:3","按著神－我們救主的命令交託了我",""],["1:4","照著我們共信之道作我真兒子的",""],["1:6","兒女也是信主的","bot"],["1:9","堅守所教真實的道理",""],["1:13","使他們在真道上純全無疵",""],["2:2","在信心、愛心、忍耐上都要純全無疵",""],["2:10","要顯為忠誠","top"],["3:8","這話是可信的……使那些已信神的人留心做正經事業","top"],["3:15","請代問那些因有信心愛我們的人安",""]]}],"lesson":{"1":{"no":1,"vol":"《321提多書講義》第一課·提多書第一章","title":"將那沒有辦完的事都辦整齊了——真、管、潔","chars":5154,"min":60,"deep":8,"dchars":1736,"tchars":1356,"blocks":[["h","一、一隻長歪了四十年的手腕"],["p","弟兄姊妹平安。有一位五十多歲的弟兄，去年秋天去看骨科。他十二歲那年從龍眼樹上摔下來，右手腕斷了。鄉下沒有大醫院，家裡用兩片木板綁一綁，骨頭就長好了。長好了，可是長歪了。四十年來，他提重物就痛，寫字久了就麻，也習慣了。醫生看完片子，說了一句他到今天還記得的話：你的骨頭不是沒有長，是長錯了位置；要好，得重新接正。"],["p","他問醫生：怎麼接？醫生說：把長歪的地方重新打開，擺回原來的位置，上一塊鋼板，然後等。他又問：要等多久？醫生笑了一下，說：骨頭是自己長的，我只負責把它擺正。"],["p","提多書第一章，有一個字就是這位醫生在做的事。保羅說：「我從前留你在克里特，是要你將那沒有辦完的事都辦整齊了，又照我所吩咐你的，在各城設立長老。」（1:5）「辦整齊」這三個字，原文是希臘醫生用來說接正斷骨的字。等一下我們會把它拆開來看。"],["p","照書信三問，先問第一問：克里特的教會遇到甚麼？教會剛起頭，各城還沒有長老；有人說虛空話，有人為錢教導，把人的全家翻倒；連他們自己的詩人都承認有一種說謊的病。骨頭斷了，有些地方已經長歪了。第二問：保羅從福音推出甚麼原則？這一章他還沒開藥方，先說神是誰，再把病說清楚。第三問留給這一課的後半。"],["p","這一課走三步：真、管、潔。真，是那無謊言的神；管，是神的管家；潔，是口與行。我先說清楚一件事：今天我們不是來佩服提多多能幹，也不是來佩服保羅多有魄力。這一章要我們看見的，是那位不放棄一個長歪了的地方、要把斷了的接正的神。"],["d",["「辦整齊」聽起來像整理房間，為甚麼要說成接正斷骨？","因為原文 ἐπιδιορθόω 的字族本來就用在醫療和修正上：希臘醫生用它說把斷骨接正、把脫臼的關節推回去，一般人也用它說把歪了的東西扶直。和合本譯「辦整齊」沒有錯，克里特的確有許多事還沒辦完；可是原文多了一層痛：有東西斷了，或長歪了。這改變我們讀這一章的方式。整理房間，東西本身沒有壞；接骨，是承認真的有傷。保羅沒有假裝克里特沒事，也沒有放棄它。今天你可以這樣用：與其問「我的生活哪裡亂」，不如問「我的生命哪裡長歪了，而我已經習慣了」。說出那一處，就是讓主開始接正的第一步。"]],["h","二、先立一根柱子：那無謊言的神"],["p","一封寫給問題教會的信，保羅卻先用四節經文說神是誰。「神的僕人，耶穌基督的使徒保羅，憑著神選民的信心與敬虔真理的知識」（1:1）。保羅寫了十三封信，只有這一次在開頭自稱「神的僕人」；先是僕人，然後才是使徒。再看「敬虔真理」，原文是那合乎敬虔的真理。真理有一個方向，它一定往敬虔走；讀了很多、家裡的人卻看不出他更溫柔的，讀到的只是關於真理的資料。"],["p","然後是這一章最高的一座山：「盼望那無謊言的神在萬古之先所應許的永生」（1:2）。「無謊言的」原文是 ἀψευδὴς（apseudēs），整本新約只在這裡出現一次，是「不」加上「謊言」。請把第二節和第十二節放在一起聽：第二節，神是無謊言的；第十二節，克里特人常說謊話。原文同一個字根，一正一反，同一封信，相隔十節。保羅先說神是誰，才說克里特人是誰。"],["p","請你留意應許的時間：萬古之先。在克里特人學會說謊以前，在任何一個人失信以前，神已經定意要給人永生。舊約早就這樣說：「神非人，必不致說謊」（民 23:19）。人的失信不能使神失信，應許比人的罪更早。接骨以前，醫生要先找一個不會動的地方固定；這一章會一路走到谷底，可是那個不會動的地方，就是神不說謊。"],["p","「到了日期，藉著傳揚的工夫把他的道顯明了；這傳揚的責任是按著神－我們救主的命令交託了我。」（1:3）「顯明」這個詞請記住，和合本在這封信裡會用三次：道、恩典、慈愛。「交託了我」原文是被動的，和「信」同一個字根：神先信任了一個從前逼迫教會的人，這是神的憐憫，不是保羅的成績。"],["p","然後才是收信人：「現在寫信給提多，就是照著我們共信之道作我真兒子的。」（1:4）提多是誰？「但與我同去的提多，雖是希臘人，也沒有勉強他受割禮」（加 2:3）。一個受過割禮的猶太老人，叫一個沒有受割禮的希臘青年「真兒子」，他們共有的只有共信之道。再留意：第三節說神是「我們救主」，第四節說基督耶穌是「我們的救主」；恩惠、平安是從他來的，不是從保羅或提多來的。"],["d",["神既是「無謊言的神」，為甚麼我禱告很久的事還沒有成就？","1:2 說神不說謊，指的是他對自己所應許的必定信實；這一節裡他應許的，是在萬古之先就定意要給人的永生，並且在基督裡顯明出來。神不說謊，不等於他必須照我們的願望行事。把「神不會說謊」講成「只要宣告，病一定好」，是把自己的願望說成神的應許；沒有實現，人就以為神說了謊。請把兩件事分開：你可以把願望誠實地帶到神面前，也可以為還沒成就的事哭；同時緊緊抓住他確實應許過的事：他不撇下你，他已經為你捨了自己，永生是確定的。禱告很久的人，可以每天讀 1:2 一次，對主說：我不明白，可是我信你不說謊。"]],["h","三、原文亮光：接正、任性、驗不過"],["p","這一章有三個原文字，剛好是一張病歷的三欄：醫生要做的事、病的根、病的樣子。"],["p","第一個字：ἐπιδιορθώσῃ（epidiorthōsē），1:5 的「辦整齊」，整本新約只出現這一次。字典形是 ἐπιδιορθόω，字頭是「再」和「徹底」，字根是「弄直」。希臘醫生用這個字族說把斷骨接正、把脫臼的關節推回去。原文的畫面更痛：有東西斷了。這個字教我們兩件事：斷是真的，你不必在神面前假裝沒事；接骨不是換一副新骨頭，是把原來的擺回原位。保羅還玩了一個字：「我留你」和「沒有辦完的」，原文同一個字根。我把你留下，好叫你把那留下來還缺的接正。"],["p","怎麼接？保羅說：在各城設立長老。克里特古人稱為「百城之島」，原文說的是一城一城地。這座島缺的不是錢，不是會堂，是可以託付的人。接正從找到可託付的人開始。"],["p","第二個字：αὐθάδη（authadē），1:7 的「不任性」。「監督既是神的管家，必須無可指責，不任性，不暴躁，不因酒滋事，不打人，不貪無義之財」（1:7）。這個字是「自己」加上「取悅」：自己高興就好，凡事自己說了算。它排在五個否定詞的第一個，因為前面剛說「神的管家」。管家管主人的錢、照顧主人的人，卻沒有一樣是他自己的。一個管家最危險的，不是能力不夠，是忘了這不是他的家。後面四個否定，其實都是任性長出來的果子。這就是病的根。"],["p","第三個字：ἀδόκιμοι（adokimoi），1:16 的「可廢棄的」。前面一個「不」，後面是「驗過、試過」。古時候的錢幣放上天平、金子放進火裡，驗不過的，就叫這個字。這是病的樣子：「他們說是認識神，行事卻和他相背」（1:16）。「說是認識」原文是公開的告白，「相背」是公開的否認，兩個都是現在式，一直同時發生。放上天平，就露了原形。"],["p","三個字連起來，就是這一章的病歷：病的樣子是口與行分家，驗不過；病的根是自己說了算；而神的作法，是留下人，一城一城地把斷了的接正。"],["d",["我很會帶小組、也很有主見，怎麼分辨自己是有恩賜，還是「任性」？","αὐθάδη 的意思不是有主見，是「自己高興就好」：凡事最後都要照我的意思，聽不進別人的話。有恩賜的人可以很有方向，任性的人卻把方向當成主權。可以用三個問題分辨：有人不同意我，我是先聽完還是先防衛？同工裡有沒有一位可以對我說「不」的人？如果這個小組明天交給別人帶，我是感恩，還是覺得被搶走了？最後一題最準，因為管家知道這不是他的家。實際的作法：這一週在一個你本來會自己拍板的決定上，先問兩位同工的意見，並且照其中一個好建議改一處。這不是失去恩賜，是讓恩賜回到管家的位置。"]],["h","四、管家的家，和一句克里特人的自白"],["p","回到長老的資格。「若有無可指責的人，只作一個婦人的丈夫，兒女也是信主的，沒有人告他們是放蕩不服約束的，就可以設立。」（1:6）「只作一個婦人的丈夫」的幾種讀法，提摩太前書講義第 3 章已經並陳，主軸是一心一意對妻子忠誠。「兒女也是信主的」，原文 πιστά 有兩個讀法：信主的，或忠實可靠的；同一句的後半在解釋它：沒有人告他們放蕩、不服約束。保羅看的是父親管教之下的家有沒有秩序、在鄰舍面前的名聲。成年的兒女還沒有信主，並不自動使父親失去服事的資格。如果今天有父母為還沒有信主的孩子流淚，請聽清楚：這一節不是寫來羞辱你的。"],["p","再數一數 1:6--9 的資格：家庭、品格、自制、待人，幾乎全是生命；「樂意接待遠人」原文是愛陌生人，「好善」原文是愛良善。只有最後一條是能力：「堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人駁倒了。」（1:9）「純正的」原文是健康的。勸化是把跌倒的人扶起來，駁倒是把錯的揭出來，兩樣都要。"],["p","為甚麼一定要能駁倒？因為外面真的有人在爭辯：「這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家。」（1:11）「敗壞人的全家」原文是把整個家翻倒；今天的家，常常是在手機上被一段影片、一門收費的課程翻倒的。「堵住」原文是給馬套上嚼環，可是保羅給提多的工具不是拳頭，是第九節健康的教訓。對付假的，最好的方法是把真的講清楚。"],["p","然後是那一句：「有克里特人中的一個本地先知說：『克里特人常說謊話，乃是惡獸，又饞又懶。』」（1:12）這不是保羅在罵一個民族，是克里特人自己的詩人說的話，傳統上認為是本地詩人厄庇墨尼得斯。保羅兩次強調：他們中間的一個，他們自己的先知。這是一個民族自己承認的病。所以請千萬不要拿這一節去對任何族群、地方、國家的人貼標籤或開玩笑；拿別人的病來取笑，正是聖經要醫治的那種驕傲。保羅自己也沒有站在高處，到了第三章他說：「我們從前也是無知、悖逆、受迷惑」（3:3）。"],["p","保羅接著說：「這個見證是真的。所以，你要嚴嚴地責備他們，使他們在真道上純全無疵」（1:13）。「嚴嚴地」是外科醫生的刀，目的是「純全無疵」，原文又是那個字：健康。然後是潔淨：「在潔淨的人，凡物都潔淨；在污穢不信的人，甚麼都不潔淨，連心地和天良也都污穢了。」（1:15）請一定把這一節聽完。前半句像主耶穌說的，從外面進去的不能污穢人；後半句說連心地和天良也都污穢了。保羅不是拿掉界線，是把界線從盤子移到心裡；這一節不是放縱的許可證。"],["p","第一章停在谷底。可是 1:16 說他們是「悖逆的」，原文 ἀπειθεῖς；第三章說「我們從前也是無知、悖逆」，同一個字。怎麼從谷底上來？不是靠更努力，「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）；也不是怎樣活都可以。第二章說：「他為我們捨了自己，要贖我們脫離一切罪惡，又潔淨我們，特作自己的子民，熱心為善。」（2:14）「特作自己的子民」是神在西乃山對以色列說的話，如今說給一群克里特的外邦人聽。神沒有把福音送到最好的地方，而是送到最難的地方。"],["d",["我的成年孩子不信主，我還可以繼續在教會服事嗎？","可以，請不要因為這一節就悄悄退下來。1:6 的 πιστά 有兩個讀法：信主的，或忠實可靠的；同一句的後半「沒有人告他們是放蕩不服約束的」在解釋它，重點是父親管教之下的家有沒有秩序、在鄰舍面前有沒有好名聲。成年兒女的信仰是他自己在神面前的事，並不自動使父親失去資格，正如「兒子必不擔當父親的罪孽，父親也不擔當兒子的罪孽。」（結 18:20）長老資格的細節，本講義的全卷立場見 ISS00_3。實際上，你可以讓牧者知道你的掙扎，請一兩位同伴固定為孩子禱告；在家裡不急著講道，多一點陪伴與尊重。你的眼淚，神都數過。"]],["d",["「在潔淨的人，凡物都潔淨」，是不是說基督徒甚麼都可以看、可以做？","不是。這一節要一口氣讀完：「在潔淨的人，凡物都潔淨；在污穢不信的人，甚麼都不潔淨，連心地和天良也都污穢了。」（1:15）上下文是 1:14 那些「人的誡命」，多半和吃甚麼、碰甚麼有關；保羅說，潔不潔淨不在盤子上，在心地和良心裡。所以他不是取消界線，是把界線移到更深的地方：問題不再只是這樣東西可不可以碰，而是我的心在這件事上是不是潔淨的。實際的問題可以這樣問：這件事我願意在主面前、在家人面前坦然去做嗎？"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿 1:12 對任何族群、地域、國籍的人貼標籤或開玩笑，或把哪一國、哪一省說成今天的克里特。這是克里特人自己詩人承認的病，保羅引它是為了醫治；而且這群人的結局，是被神特作自己的子民（2:14）。"],["p","第二個偏差，是用 1:6 羞辱兒女還沒有信主、或孩子正在叛逆的父母，暗示家沒管好的人就該退下來；或在講台、小組裡拿某一位同工的孩子當反面例子。成年兒女的信仰是他自己在神面前的事；孩子不是講道的材料，也不是父母的屬靈成績單。"],["p","第三個偏差，是只引 1:15 的前半句，推出心裡潔淨就甚麼都可以看、可以做，把恩典講成放縱的許可證。同一節的後半說「連心地和天良也都污穢了」；界線沒有被取消，只是被移到了更深的地方。"],["p","第四個偏差，是用 1:16 開出一張善行清單，叫人靠好行為證明自己得救；或反過來說行為根本不重要。全卷的藥是照他的憐憫（3:5），而恩典顯明出來就會教人行善；善行是被接正的人長出來的樣子，不是被接正的條件。"],["p","第五個偏差，是把 1:5 和 1:11 講成長老說了算：用「我是神設立的」叫會眾閉口，把提出問題的人一律說成要堵口的人。監督資格的第一個否定詞就是「不任性」；1:11 說的是為錢教導的教師，不是提出問題的人，保羅給的工具也只有健康的教訓。"],["d",["教會裡有人在網路上轉傳奇怪的教導，1:11 說「這些人的口總要堵住」，我們該怎麼做？","先分清楚對象。1:10--11 說的是為錢教導、敗壞人全家的教師，不是提出疑問、或一時被影響的弟兄姊妹。對後者，要用 1:9 的第一個動作：勸化，坐在旁邊把人扶起來，陪他把那段影片和聖經一起看，問他為甚麼被吸引。對前者，保羅的工具也只有一樣：健康的教訓。「堵住」原文是給馬套上嚼環，可是他沒有給提多拳頭、封鎖或公審。小組實際上可以先私下回應，不在群組公開羞辱，再請牧者一起分辨。對付假的，最好的方法是把真的講清楚，並且讓人看見真的活出來。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：在我們的文化裡，有一種謊叫做「做人」。報帳時多算一點，大家都這樣；群組裡回一句「在路上了」，其實還沒出門。這些話像那隻手腕，長歪了很多年，我們也習慣了。1:2 說我們的神是無謊言的神。這不是要你說話刻薄，誠實也可以很溫柔；是要你在一件小事上，不再替自己的形象說謊。斷了的接正，常常從一句話開始。"],["p","第二個問題：華人常說「養不教，父之過」。孩子沒有信主或走了歪路，很多父母在教會裡就抬不起頭，甚至悄悄退出服事。1:6 的重點是家中的秩序與在鄰舍面前的名聲，不是把成年兒女的選擇算在父母頭上；神自己的兒女以色列也悖逆過他。如果你是這樣的父母，請不要一個人扛，讓牧者和一兩位信得過的人陪你禱告。小組也要成為一個父母可以說「我的孩子現在離主很遠」而不被議論的地方。"],["d",["客套話、白色謊言也算說謊嗎？我不想變成講話傷人的人，該怎麼拿捏？","1:2 說我們的神是無謊言的神，這是方向，不是要你把每一句心裡話都直接說出來。誠實和刻薄不一樣：你可以不說，可以說得溫柔，可以選擇時機，可是不必說不真的話。分辨的方法是問：我說這句話，是為了顧到對方，還是為了保護我自己的形象、逃避後果？「在路上了」其實還沒出門、報表上多算的那一點、對家人說「已經處理好了」，多半是後者。實際上，這一週可以練習一句替代的話：與其說「很好」，可以說「我現在不太方便細說，謝謝你關心」。不必一次改完一輩子的習慣，先在一個場合、一個人面前，不再說那一句謊。"]],["h","七、活出321——讓骨頭長好的是主"],["p","這一章照出來的有己，是 1:7 那個「任性」：自己說了算。它常穿著服事的衣服出現；再往前走一步，就是 1:16 的口與行分家：用神的名掩護自己的路。"],["p","耶穌是我的榜樣：耶穌就是那位不說謊的神親自來到人中間，他的口與行從來沒有分家。他說人子來是要服事人，就拿起手巾為門徒洗腳；他不任性，在客西馬尼把自己的意思交給父。「壓傷的蘆葦，他不折斷」（太 12:20），他把斷了的接正。"],["p","聖經是我的準則：1:9 說要「堅守所教真實的道理」，原文是可信的話。不是發明，是抓住已經交下來的。這一週轉傳任何屬靈影片以前，先用這把尺量一量：這是健康的教訓，還是會翻倒人全家的話？"],["p","聖靈是我的引導：這一章沒有直接提聖靈，可是第三章說，神藉著聖靈的更新拯救我們，而且厚厚地澆灌。人能做的是說真話、設立可託付的人，讓骨頭真正長好的是聖靈。"],["p","讓耶穌作王：要讓出來的，是「自己說了算」的那張椅子。監督是神的管家，管的是主人的家。這一週每一次拍板以前，先問一句：這是誰的家？也讓出替自己的形象撒謊的位置。"],["p","讓耶穌得著一切的榮耀：這一章的救主有兩次，一次是神我們救主，一次是我們的救主基督耶穌。我們記得的不該是提多多能幹，而是那位把福音送到最難的地方的主。"],["p","建立屬神的體系：1:5 說「在各城設立長老」。體系從找到可託付的人開始，不是從一棟樓開始；資格幾乎全是生命，這正是先生命、再關係、後事工。國度321空中團契散在好幾個國家、好幾個時區，缺的不是更好的平台，是每一座城都有一位可以託付的同工。再照 1:4 用 235 帶人：把共信之道交給一個和你很不一樣的人。"],["h","八、四種心，誰的骨頭長歪了"],["p","驕傲型的心，讀到 1:16 就想到別人，讀到長老的資格會替別人打分數，卻從來不把自己的名字放上去。這一章要你聽見 3:3 的那個「也」字：我們從前也是。你也是被接正的人，不是來檢查別人骨頭的人。"],["p","恐懼型的心，怕自己就是那個驗不過的人，怕說了真話關係就斷了。1:2 說神在萬古之先就應許了，在你第一次失信以前很久。醫治不是從你的可靠開始，是從他的可靠開始；你可以帶著怕，先更正一句小小的話。"],["p","羞恥型的心，也許想起自己說過的謊、報過的假帳、或是一個沒有管好的家，覺得自己就是 1:16 說的那一種人，沒有資格再談服事。請聽 2:14：他為我們捨了自己，要潔淨我們，特作自己的子民。被接正的骨頭，不必先證明自己從來沒有斷過。"],["p","受傷型的心，也許曾經被人用屬靈的話騙過，被說得很好的人傷過；也許你曾在教會裡因為孩子的事被議論。你很難再相信人，這是可以理解的。那無謊言的神不催你立刻相信任何人；如果你的傷涉及家庭裡的傷害或控制，請告訴一位信得過的人，先顧好安全，必要時讓人陪你找到專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:2 一次，對主說一句：今天我不從自己的可靠開始，我從你的可靠開始。晚上回想今天說過哪一句不真實的話，向神說出來。"],["p","第二，找出一句你最近說過、不完全真實的話，在星期五以前回去更正：上次我說的不完全對，實際是這樣。"],["p","第三，把 1:7--8 的十一個詞抄下來，選一個這一週最需要被接正的，寫在手機備忘錄的第一行；每天看一次。"],["p","第四，這一週約一位比你年輕、或剛信主不久的弟兄姊妹吃一頓飯，不急著教他甚麼，只問他最近在信仰上最卡住的是甚麼。"],["p","第五，為你所在的城市，或空中團契的一個分區，每天指名禱告一次，求主在那裡興起一位可以託付的人。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我的神是無謊言的神，他在萬古之先所應許的，必不落空；我的盼望不在我的可靠，在他的可靠。"],["p","我宣告：我是神的管家，不是這個家的主人；我不再坐在自己說了算的那張椅子上。"],["p","我宣告：我願意讓主把我生命裡長歪的地方接正，從我說出口的話開始，讓我的口與行合一。"],["p","我宣告：我從前也是悖逆的，如今是被他捨己所贖、特作自己子民的人；我要熱心為善，因為他先愛了我。"],["d",["我回去更正一句謊話以後，如果關係因此變糟了怎麼辦？","有可能，接骨的前幾個禮拜常常比長歪的時候更痛。所以請先做三件預備。第一，挑選合適的時間和方式，不要在對方最忙、最累的時候說，也不必公開說；一對一、簡短、具體：上次我說的不完全對，實際是這樣，對不起。第二，事前請一位屬靈同伴為你禱告，說完以後再告訴他結果。第三，只負責自己的那一半：你可以誠實、可以道歉、可以承擔後果，卻不能控制對方的反應。你這樣做不是為了證明自己誠實，是因為那位無謊言的神，已經先對你守了信。"]],["h","十、結語"],["p","我們回到那隻手腕。手術以後，他戴了三個月的護具，前幾個禮拜比四十年來任何一天都痛。回診時他問醫生是不是接錯了，醫生指著片子說：新的骨頭長出來了，位置是對的。半年以後，他第一次可以不痛地抱起自己的孫子。他說，這輩子第一次知道，原來手腕本來應該是這樣的。"],["p","可是這一課的焦點，不在那位弟兄多勇敢，也不在提多多能幹、保羅多有魄力。焦點在那一位：他是無謊言的神，在萬古之先就應許了；他是神我們救主，到了日期把他的道顯明出來；他為我們捨了自己，要把一群長歪了的人接正，特作自己的子民。提多只是上夾板的人，讓骨頭長好的是主。"],["p","我們一起低頭禱告。天父，謝謝你是無謊言的神，在我們學會說謊以前，你已經應許了永生。我們承認，我們裡面有長歪了很多年的地方，有口與行分家、自己說了算的地方。求你把斷了的接正，不從我們的可靠開始，從你的可靠開始。求你在每一座城興起可以託付的人；也求你安慰為兒女流淚的父母，醫治被屬靈的話傷過的人。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最誠實、誰最屬靈，是讓每一個人說出自己長歪的那一個地方，也說出這一週要回去接正的一句話；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是真、管、潔：無謊言的神、神的管家、口與行。席上可能有兒女未信主或叛逆的父母，也可能有被屬靈的話欺騙過的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：醫治從神的可靠開始，不從我的可靠開始；設立同工先看生命，再看能力；潔淨是心的事，口與行要合一。"],["n","1. ★ 你有沒有骨折、扭傷或脫臼的經驗？是在哪裡、怎麼弄的？後來花了多久才好，那個地方有沒有不一樣？"],["n","2. ★★★ 1:2 說神是「無謊言的神」，在萬古之先就應許了永生。請用一句話說：為甚麼保羅要在談克里特的問題以前，先說神不說謊？這對你有甚麼不同？"],["n","3. ★★ 數一數 1:6--9 長老的資格，哪幾條是生命、哪幾條是能力？如果你的教會照這個次序選同工，會和現在有甚麼不一樣？"],["n","4. ★★ 把 1:15 整節讀出來，說一說：為甚麼只引前半句會把保羅的意思倒過來？後半句把界線移到了哪裡？"],["m","帶領提醒：一口氣從 1:1 讀到 1:16；不爭論長老制度、離婚再婚或喝酒，指向議題頁；不讓任何人拿 1:12 對族群或地方開玩笑。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：說出自己生命裡長歪了、而且已經習慣了的那一處，也說出這一週要接正的一步。"],["t","【看】看見自己"],["n","5. ★★★ 說出一個你最容易口與行分家的地方：家裡、公司、網路，還是教會？最近一次是甚麼時候、在誰面前？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:2 和 2:14 兩遍。第二遍讀完，說出一個詞：無謊言、萬古之先、捨了自己、潔淨、子民，哪一個詞對你剛才說的那一處說話？"],["t","【想】想通關卡"],["n","7. ★★★ 你不敢讓主接正的原因是甚麼：怕說了真話關係會斷、怕被人看穿、覺得自己說了算比較安全，還是覺得已經習慣了沒關係？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我從前也是悖逆的，如今我讓那無謊言的神把我接正。」右手邊的人只回一句「他特作你為自己的子民」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要回去更正的一句不完全真實的話：對誰、在哪裡、星期幾、你打算怎麼開口說第一句。"],["m","帶領提醒：這一化可能碰到家庭傷害、兒女叛逆或未信主的父母、被屬靈的話欺騙的經驗。不追問細節，不定罪，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也不拿任何人的孩子當例子；會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個要讓出的決定、一位要陪的人、一座要禱告的城、一位要分享的人。"],["n","10. ★★ 這一週你本來會自己拍板的一個決定是甚麼？你要在哪一天先去問哪兩位同工或家人的意見？"],["n","11. ★★ 說出一座城市或一個空中團契的分區，以及一位在那裡服事、缺少同工的弟兄姊妹的名字；這一週每天幾點，你要為那裡指名禱告？"],["n","12. ★ 像保羅稱提多為真兒子那樣，說出一位比你年輕、或剛信主不久的人的名字，你們這一週哪一天、在哪裡一起吃一頓飯？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：神不說謊，他要把我生命裡斷了的接正。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人的生命都有一個地方長歪了很多年，自己也習慣了。第二句，聖經說神不說謊，他要把斷了的重新接正。第三句，他為我們捨了自己，所以醫治從他的可靠開始，不從我們的可靠開始。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會注意」這類答案；分享兒女光景的父母，小組只代禱、不評論。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要接正的那一句話，是對誰說的。可以只說「一位家人」「一位同事」，不必說名字。"],["p","然後彼此代禱，為三種人指名禱告：一位兒女還
