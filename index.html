<title>321提多書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}

<script>
/* 開機守門員：主程式若沒能在 8 秒內畫出東西，就顯示可診斷的畫面，而不是一片白 */
window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}
setTimeout(function(){
  var m = document.querySelector('main');
  if (!window.__booted && (!m || m.innerHTML.trim().length < 40)){
    var b = document.getElementById('boot');
    if (b) b.style.display = 'flex';
  }
}, 8000);
</script>

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"將那沒有辦完的事都辦整齊了","sub":"真、管、潔","lv":"A","arc":"整","sec":[["1:1--4","盼望那無謊言的神在萬古之先所應許的永生：使徒、真兒子與無謊言的神"],["1:5--9","在各城設立長老：神的管家"],["1:10--14","這些人的口總要堵住：說虛空話的人與克里特人的自白"],["1:15--16","在潔淨的人，凡物都潔淨：口與行分家"]],"serm":{"pts":[["無謊言的神","1:1--4","「盼望那無謊言的神在萬古之先所應許的永生」——一封寫到常說謊之地的信，開頭先說神是誰；真理的目的是敬虔，不是贏得辯論"],["神的管家","1:5--9","「監督既是神的管家，必須無可指責」——把斷了的接正，先從找到可託付的人開始；資格幾乎全是品格，第一條否定詞是「不任性」"],["口與行","1:10--16","「他們說是認識神，行事卻和他相背」——假師傅的病不在口才，在行事；潔淨是心的事，不是食物的事"]]},"q":"教會要選同工，名單攤在桌上：這一位很會講，可是家裡的人很少看見他笑；那一位很忠心，可是兒子已經三年沒有回家。你在心裡默默替每一個名字打分數，忽然想到：如果把自己的名字也放上去，你會給自己幾分？\n我們活在一個說謊很平常的地方：履歷多寫一點、報帳多算一點，對家人說「我很好」，在群組裡說「我在路上了」。最可怕的不是別人說謊，是發現自己早就習慣了，連禱告的時候都在修飾。\n這一章要問的是：在一個連自己都不太敢相信自己的地方，神要從哪裡開始，把斷了的接正？","truth":"神是「無謊言的神」（1:2）：在任何人學會說謊以前，他已經在萬古之先應許了永生；所以他不放棄一個常說謊話的地方，而是留下人、設立可託付的人，把斷了的接正。\n真理的方向是敬虔，口與行分家是病；醫治不是從我們的可靠開始，是從他的可靠開始。","mv":{"t":"盼望那無謊言的神在萬古之先所應許的永生","r":"多1:2"},"card":["這一章是全卷「整・教・行」這場醫治的第一步：整——把斷了的接正。克里特的教會剛起頭，各城還沒有長老，有人為錢教導、敗壞人的全家，連本地的詩人都說他們常說謊話。保羅沒有假裝沒事，也沒有放棄，他走三步——真、管、潔：先說神是誰，那無謊言的神；再說神的家要交給怎樣的人，神的管家；最後指出病在哪裡，口與行分家。全章停在谷底，可是谷底上面，先立好了一根柱子。","這一章的主詞，先是神。神在萬古之先就應許了永生，而且他不說謊（1:2）；到了日期，他藉著傳揚把自己的道顯明出來（1:3）；他把這傳揚的責任交託給一個從前逼迫教會的人——原文是被動的，是神先信任了保羅。神是我們的救主，恩惠、平安從父神和救主基督耶穌而來（1:4）；一個猶太老人和一個希臘青年成了父子，是神造的關係。監督是神的管家（1:7），這個家是神的。神沒有把福音送到最好的地方，而是送到最難的地方。","1:8 長老的資格裡，有一個很少被注意的字：φιλάγαθον（philagathon），和合本譯「好善」，原文是「愛」加上「善」，愛良善。保羅沒有說長老要做很多善事，是說他要愛善。這改變今天的讀法：1:16 說假師傅「在各樣善事上是可廢棄的」，他們的病不是善事做得不夠多，是心裡不愛善。所以醫治不是開一張更長的善行清單，是讓人重新愛上良善。一個會做善事卻不愛善的人，遲早會累、會計算、會要回報；一個愛善的人，善事是他自然長出來的樣子。","這一章照出一個口與行分家的我：在聚會裡說感謝主，在公司裡報帳多算一點；在小組裡分享饒恕，回到家對配偶冷戰三天。它也照出一個任性的我（1:7）：服事也好、帶小組也好，最後都要照我的意思。還有一個讀到克里特人就搖頭、卻忘了自己也常說「我很好」的我；一個看著同工名單替別人打分數、從來不敢把自己的名字放上去的我。","「所以，你要嚴嚴地責備他們，使他們在真道上純全無疵」（1:13）。全章最該被記住的，是這一個「使」：嚴厲有一個目的，叫人健康。「純全無疵」原文就是 1:9「純正」的那個字。保羅承認克里特的病是真的，卻不准提多只當一個揭發者。這一句翻轉我們面對別人錯誤的方式：在群組裡揭穿人、在背後說人，很容易；開口以前先問一句「我說這話，是要他好起來，還是要我自己痛快」，很難。","這一週做一件「接正」的小事：找出一句你最近說過、其實不完全真實的話——對家人說的「已經處理好了」、對主管說的「快好了」、報表上的一個數字——在星期五以前回去更正它，只要說一句：「上次我說的不完全對，實際是這樣。」然後告訴一位你信任的屬靈同伴，請他為你禱告。不是為了證明自己誠實，是因為那位無謊言的神，已經先對你守了信。","最終整合：凌晨一點，廚房的燈還亮著。\n她把那疊信用卡帳單攤在桌上。十一年的婚姻，她一直相信他說的：「沒事，我在處理。」\n她也想起自己說過的謊：在小組裡說「我們家很好」，對媽媽說「他對我很好」，對自己說「再忍一下就會過去」。\n她不知道還能相信誰。連自己，她也不太敢信了。\n手機裡的讀經計畫停在提多書。她點開，第一章第二節：「盼望那無謊言的神在萬古之先所應許的永生」（1:2）。\n萬古之先。在她嫁給他以前，在他第一次說謊以前，在她學會用「我很好」把自己包起來以前。\n那時候，還沒有任何人失信；那時候，神已經應許了。\n帳單還在桌上。明天她要打電話給銀行，也要找一位可以信任的人，把實情說出來。斷了的，不會一夜接好。\n可是她知道，這一次不是從她自己的可靠開始。\n有一位不說謊的，在萬古之先就先說了話；後來他親自來了，說：「我就是道路、真理、生命」（約 14:6）。\n關燈以前，她在那一節旁邊寫了一行小字：他說的，我可以信。"],"self":"這一章照出來的「有己」，是 1:7 那個 αὐθάδη：自己高興就好，自己說了算。它可以穿著服事的衣服出現——帶小組、管奉獻、作同工，可是每一個決定最後都要照我的意思，因為我心裡覺得這個家是我的，不是神的。\n有己也會讓口與行分家：我需要別人看見一個屬靈的我，所以學會了屬靈的說法；在沒有人看見的地方，我照自己的路走。用神的名掩護自己的路，是有己最隱密的樣子。","t321":{"k":"耶穌是我的榜樣：耶穌就是那位不說謊的神親自來到人中間。他的口與行從來沒有分家——他說「人子來，並不是要受人的服事，乃是要服事人」（可 10:45），然後在最後的晚餐拿起手巾為門徒洗腳；他教人要愛仇敵，自己就在十字架上為釘他的人禱告。1:7--8 的監督資格在他身上不是規條，是一個人的樣子：不任性，順從父的旨意；不打人，被罵不還口；不貪財，連枕頭的地方都沒有；樂意接待遠人，和稅吏、罪人同桌吃飯。他也不折斷壓傷的蘆葦，而是把斷了的接正。","g":"讓耶穌作王：這一章要人讓出來的，是「自己說了算」的那張椅子。1:7 監督資格的第一個否定詞就是「不任性」，服事的人最容易坐上這張椅子：小組怎麼帶、錢怎麼用、誰可以上台，最後都是我說了算。保羅提醒，監督是神的管家，管的是主人的家。讓耶穌作王，就是每一次拍板以前先問：這是誰的家？也要讓出另一個位置——替自己的形象撒謊的位置：不必再用「我很好」維持一個屬靈的樣子，因為作王的是那位無謊言的神，不是別人對我的印象。","p":"建立屬神的體系：1:5 說「在各城設立長老」——克里特缺的不是房子，是可以託付的人；而 1:6--9 的資格幾乎全是生命，只有「堅守所教真實的道理」（1:9）這一條是能力，這正是「先生命，再關係，後事工」。教會設立同工時：第一，看一個人在最近的人面前可不可信，不只看他會不會講；第二，用 235 的方式帶人，像保羅稱一個希臘青年為「真兒子」（1:4），把共信之道交給一個和自己很不一樣的人；第三，國度321空中團契散在各國，每一個時區、每一座城，都要有一位被看顧、也能看顧人的同工，不是全靠線上的一個聲音。"},"grp":["【一、破冰】你有沒有骨折、扭傷或脫臼的經驗？是在哪裡、怎麼弄的？後來花了多久才好？好了以後，那個地方有沒有不一樣？","【二、扎心】經文說：「他們說是認識神，行事卻和他相背」（1:16）。說出一個你最容易口與行分家的地方：家裡、公司、網路、教會的哪一個場合？最近一次是甚麼時候、在誰面前？","【三、福音】讀 1:2：「盼望那無謊言的神在萬古之先所應許的永生」（1:2）。在你最近一次失信——對人或對神——以前很久，神已經應許了。如果醫治是從他的可靠開始，不是從你的可靠開始，這一週你可以放下哪一種證明自己的努力？","【四、行動】說出一句你這一週要回去更正的不完全真實的話：對誰、在哪裡、星期幾。或說出一位你要開始陪伴的人，像保羅陪提多那樣：他的名字、你們第一次約見的時間和地點。","【五、代禱】為三種人指名禱告：一位兒女還沒有信主、或孩子正在叛逆、心裡自責的父母，求主安慰他，也求教會不論斷他；一位在剛起頭、缺少同工的地方服事的弟兄姊妹（說出他的名字和城市），求主為他興起可託付的人；一位曾經被人欺騙、現在很難再相信人的人，求那無謊言的神親自醫治他。"],"prac":{"main":"這一週，我讓那無謊言的神，從我說出口的話開始，把我生命裡斷了的地方接正。","items":["對神：每天早上讀 1:2，對主說：「今天我不從自己的可靠開始，我從你的可靠開始。」晚上用三分鐘回想：今天我說過哪一句不完全真實的話？向神說出來，領受他的赦免。","對自己：把 1:7--8 的十一個詞抄下來（不任性、不暴躁、不因酒滋事、不打人、不貪無義之財；樂意接待遠人、好善、莊重、公平、聖潔、自持），不是拿來替別人打分數，是選一個這一週最需要被接正的，寫在手機備忘錄的第一行，每天看一次。","對人：這一週約一位比你年輕、或剛信主不久的弟兄姊妹吃一頓飯，不急著教他甚麼，只問他：「你最近在信仰上最卡住的是甚麼？」像保羅稱提多為真兒子那樣，開始一段屬靈父母與兒女的陪伴。","對生活：在一個你最常口與行分家的場合——報帳、報稅、請假、網路留言、對家人交代行蹤——這一週做一件誠實、但可能吃虧的事。不宣傳、不比較，只是不再說那一句謊。","對使命：這一週轉傳任何屬靈影片或文章以前，先停十秒問：這是健康的教訓，還是會「敗壞人的全家」（1:11）？並且為你所在的城市（或國度321空中團契的一個分區）每天指名禱告，求主在那裡興起一位可託付的人。"]},"safe":["① 用 1:12 對任何族群、地域、國籍的人貼標籤或開玩笑：「某某地方的人就是愛說謊」「我們這裡的人又饞又懶」，或在講台上把某一國、某一省的人說成今天的克里特人。","這是克里特人自己詩人的話，保羅兩次強調是他們自己的先知，是一個民族自己承認的病，不是外人的嘲笑；保羅的落點是醫治——神正是要從這群人裡「特作自己的子民，熱心為善」（2:14）（全卷立場見 ISS00_8；議題見 ISS01_8）。","檢驗標準：會眾席上一位來自那個被點名地方的人聽完，是感到被福音接納，還是覺得自己成了笑話？","② 拿 1:13「嚴嚴地責備」當作講台上羞辱人的許可：點名、冷嘲熱諷、把會眾的軟弱當笑料，還說保羅也是這樣罵克里特人的。","保羅引那句詩，是承認病是真的，不是叫提多罵人；責備有一個目的，「使他們在真道上純全無疵」（1:13），原文是叫他們健康。保羅到了第 3 章還把自己放進去：「我們從前也是無知、悖逆、受迷惑」（3:3）。","檢驗標準：被責備的人聽完，是更想回到神面前、知道自己可以好起來，還是只想離開這間教會？","③ 用 1:6「兒女也是信主的」對兒女還沒有信主或正在叛逆的父母說：家都管不好，就不配服事；或要求同工辭職、停止服事，直到孩子信主為止。","πιστά 有兩讀（信主的／忠實可靠的），同句後半「沒有人告他們是放蕩不服約束的」是解釋——重點是父親管教之下的家有沒有秩序與名聲；成年兒女的信仰是他自己在神面前的事，不自動使父親失去資格（這使我們想起結 18:20；全卷立場見 ISS00_3；議題見 ISS01_5）。","檢驗標準：一位為還沒有信主的成年兒女流淚多年的長輩同工聽完，是更被安慰、更願意繼續服事，還是開始覺得自己應該退下來？","④ 在講台或小組裡把某一位同工的孩子當成反面例子：「你看某某長老的兒子，就是爸爸太忙」；或用 1:6 暗示孩子沒有信主，一定是父母哪裡做錯了。","孩子不是講道的材料，也不是父母的屬靈成績單；聖經裡也有敬虔的父親，兒子卻不行他的道（這使我們想起撒上 8:1--3），神自己的兒女以色列也悖逆過他。把孩子拿來當例子，傷的是兩代人。","檢驗標準：那位同工的孩子如果哪一天坐在會眾席上聽到這篇講道，他會更想認識主，還是更確定教會只是一個議論他的地方？","⑤ 用 1:6「只作一個婦人的丈夫」在講台上點名或暗指離婚再婚、單身、喪偶再婚的弟兄姊妹，說他們次一等、永遠不能服事。","這一句有幾種讀法，提摩太前書講義第 3 章已經並陳，本卷不重開戰場，只取主軸：一心一意對妻子忠誠；它講的是職分資格裡的品格，不是把任何人的過去刻成終身的記號（全卷立場見 ISS00_3；議題見 ISS01_4）。","檢驗標準：一位婚姻破碎過、正在教會裡重新站起來的弟兄姊妹聽完，是更認識神的憐憫，還是覺得自己在這間教會永遠是一個問號？","⑥ 把 1:5「設立長老」講成長老說了算：用「我是神設立的」要求會眾不准發問、不准查帳、不准說不；或把屬靈權柄伸進別人的婚姻、工作、金錢與私生活，用權柄轄制人。","保羅列監督資格的第一個否定詞就是「不任性」（1:7），原文是自己說了算；監督是神的管家，管的是主人的家，不是自己的家。用權柄轄制人的，正是 1:7--8 要排除的那種人（長老、權柄與屬靈虐待回指彼得前書立場五；全卷立場見 ISS00_3）。","檢驗標準：一位對長老的決定有疑問的弟兄姊妹聽完，是更知道可以在愛裡發問，還是更害怕開口？","⑦ 用 1:11「這些人的口總要堵住」去封住提問、查帳或指出問題的人：把批評同工的人一律說成假師傅，在群組裡封鎖、公審、肉搜，或用權勢、威脅讓人閉嘴。","「堵住」原文是給馬套上嚼環，可是保羅給提多的工具只有一樣：1:9 健康的教訓，用真道駁倒錯誤，不是用權勢壓下聲音；而且 1:10--11 說的是為錢教導、敗壞人全家的教師，不是提出問題的弟兄姊妹（議題見 ISS01_7）。","檢驗標準：一位曾經在教會裡指出財務或倫理問題的人聽完，是覺得自己被保護，還是覺得自己被歸進了「那些人」？","⑧ 用 1:10「那奉割禮的」與 1:14「猶太人荒渺的言語」說出輕視猶太人、或輕視任何宗教群體的話，好像問題出在某一個民族。","保羅自己是受過割禮的猶太人；他反對的不是猶太人，是把割禮與人的誡命加在福音上、叫人靠外面的記號稱義的教導。神派去處理這件事的，是一個未受割禮的希臘人，差他去的是一個猶太老人——福音把這兩個人接成了父子（1:4）。","檢驗標準：一位有猶太背景、或從另一個宗教傳統信主的弟兄姊妹聽完，是看見福音的寬廣，還是聽見另一種族群偏見？","⑨ 只引 1:15 前半「在潔淨的人，凡物都潔淨」，推出我心裡潔淨、所以甚麼都可以看可以玩，把恩典講成放縱的許可證。","同一節後半說「連心地和天良也都污穢了」（1:15）：潔淨是心與良心的事，不是食物的事，也不是界線的取消；保羅不是拿掉界線，是指出界線真正畫在哪裡（全卷立場見 ISS00_4；議題見 ISS01_9）。引 1:15 前半，必帶後半。","檢驗標準：會眾聽完，是更渴望讓神潔淨自己的心，還是更放心地照自己的喜好過日子？","⑩ 用 1:16「行事卻和他相背」開出一張善行清單，叫人靠更多好行為證明自己真的得救；或反過來說行為不重要，神只看你信不信。","1:16 的病是口與行分家，可是全卷的藥不是更努力：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5），恩典顯明出來，就會教導人（2:11--12）。善行是被贖的果子，不是得救的條件；拒絕律法主義，也拒絕廉價恩典（全卷立場見 ISS00_4；信心與行為回指雅各書講義第 2 章）。","檢驗標準：會眾聽完，是更被恩典吸引、更樂意行善，還是更會檢查別人的行為，或更放心地不必改變？","⑪ 用處境取消原則：「這是寫給一世紀克里特的，跟今天的教會無關」；或把處境硬搬：說每一個聚會都必須有某一種長老制度、某一種頭銜，否則就不是合聖經的教會。","書信三問要走完：處境是一個剛起頭、各城還沒有長老、假教訓敗壞全家的教會；原則是神的家要交給品格可信、堅守真道的人；今天落在小組長、線上分區同工、家庭聚會帶領人的設立上。長老與監督在 1:5--7 互換，本卷不裁判任何教會體制（全卷立場見 ISS00_3、ISS00_8；議題見 ISS01_3）。","檢驗標準：會眾聽完，是更知道自己的教會要怎樣找到可託付的人，還是只記住一場體制之爭，或覺得這一章只是歷史？","⑫ 用 1:7「不因酒滋事」做兩極的事：一邊說聖經只說不要醉、所以喝多少都沒關係，另一邊把偶爾喝一杯的弟兄姊妹當成不屬靈、不能服事的人。","這個字說的是在酒旁邊失控、傷人；重點是自制與不絆倒人，不是在講台上訂一條全體適用的新律法。會眾裡也有正在戒酒、或家裡有人酗酒而受苦的人（酒的處理回指提摩太前書紅線八；議題見 ISS01_6）。","檢驗標準：一位正在戒酒的人、和一位家裡有酗酒家人的人聽完，是都覺得被顧念，還是一個被縱容、一個被刺傷？","⑬ 用 1:2「那無謊言的神」替自己的願望擔保：「神不會說謊，你只要宣告，病一定好、生意一定成」，把人想要的結果說成神的應許。","1:2 說的應許是永生，是神在萬古之先所應許、在基督裡顯明的；神不說謊，是說他對自己所應許的必定信實，不是說他必須照我們的宣告行事。把自己的願望說成神的應許，等到沒有實現，人會以為是神說了謊。","檢驗標準：一位禱告很久、病還沒有好的弟兄姊妹聽完，是更信靠那位不說謊的神，還是更懷疑神、或更責怪自己信心不夠？","⑭ 把本章講成保羅與提多的英雄故事：「提多多能幹，一個人被留在最難的地方」「你也要像保羅一樣有魄力」；講到最後，會眾記得的是兩位偉人。","這封信一開頭就說神是我們救主，基督耶穌是「我們的救主」（1:4）；保羅先稱自己是神的僕人，提多只是被留下來的僕人，讓骨頭長好的是主（作者的全卷立場見 ISS00_1；議題見 ISS01_1）。","檢驗標準：會眾聽完，是更佩服保羅、更佩服提多，還是更愛那位不放棄克里特、也不放棄他們的主？","⑮ 把 1:5 講成教會增長的指標、321 的口號：「每一城都要趕快設立同工」，因為人手不夠，就把會講、會做事、肯擔任的人推上去；或反過來，因為要求完美，永遠不設立任何人。","1:6--9 的資格幾乎全是生命，只有一條是能力；體系從找到可託付的人開始，不是從填滿名單開始。先讓 1:5 自己講完，321「建立屬神的體系」才在末端認出它，不可把經文當成口號的插圖（全卷立場見 ISS00_3）。","檢驗標準：講完以後，教會選同工時看的是一個人在家裡、在職場可不可信，還是只看他有沒有空、會不會講？","⑯ 把 1:9「把爭辯的人駁倒了」講成鼓勵弟兄姊妹在網路上筆戰、以辯贏人為屬靈，或把每一位意見不同的人都當成要駁倒的對象。","1:9 先說勸化，再說駁倒：勸化是把人扶起來，駁倒是把錯誤揭出來，而這一切從堅守所教真實的道理開始。1:1 說真理的方向是敬虔，不是輸贏——一個辯贏了所有人、家人卻看不出他更溫柔的人，正是 1:16 說的口與行分家。","檢驗標準：會眾聽完，是更想把真道活出來、說話更有恩慈，還是更想去留言區找人吵架？"]},{"n":2,"t":"神救眾人的恩典已經顯明出來","sub":"齡、樣、恩","lv":"A","arc":"教","sec":[["2:1--6","但你所講的總要合乎那純正的道理：老年人、婦人與少年人"],["2:7--8","你自己凡事要顯出善行的榜樣：提多的榜樣"],["2:9--10","以致凡事尊榮我們救主－神的道：僕人的忠誠"],["2:11--15","神救眾人的恩典已經顯明出來：恩典是老師"]],"serm":{"pts":[["各等人的生活","2:1--6","「但你所講的總要合乎那純正的道理」——老年人、婦人、少年人，每一種年齡都有一個樣子；老年婦人帶少年婦人，世代接棒"],["福音的櫥窗","2:7--10","「以致凡事尊榮我們救主－神的道」——提多的榜樣與僕人的忠誠都在替福音妝飾；順服的目的朝外，不是為了誰的權力"],["恩典是老師","2:11--15","「神救眾人的恩典已經顯明出來，教訓我們」——恩典不只赦免，也天天教養；我們等候的是至大的神和我們救主耶穌基督"]]},"q":"你家的群組裡有三代人：爸媽轉來的養生文章、你轉的工作連結、孩子貼的貼圖。一句話說重了，三代人一起沉默；一則「我只是關心她」的消息轉了三手，就成了一場風波。\n星期天我們唱恩典，星期一在辦公室報帳、在廚房回嘴、在群組裡轉話——恩典好像留在教會門口，沒有跟著我們回家。\n這一章要問：恩典只是禮拜天的一首歌，還是一位會跟你回家、從老到少一個一個教，教到你在最沒有人看見的位置上，也能替福音增添榮美的老師？","truth":"神救眾人的恩典已經在耶穌基督身上顯明出來，而且這恩典會教人：「教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日」（2:11--12）。\n所以從老到少、從妻子到奴僕，每一種身份都可以成為福音的櫥窗——不是為了證明自己，是因為那一位「為我們捨了自己」（2:14），又要回來。","mv":{"t":"因為神救眾人的恩典已經顯明出來，教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日，","r":"多2:11-12"},"card":["在全卷「整・教・行」這場醫治裡，第 1 章是「整」——把斷了的骨頭接正；這一章是「教」：2:12 的 παιδεύουσα，恩典像父母教養孩子。藥方從飯桌開始（2:1--10），老年人、老年婦人、少年婦人、少年人、僕人一個一個點名；然後保羅說出藥效從哪裡來（2:11--14）。全章拎起來就是一句：顯明出來的恩典，會把一屋子不同年紀、不同身份的人，一個一個教成福音的櫥窗。","這一章真正的主詞是神的恩典。恩典「已經顯明出來」（2:11），像黎明照出來，不挑地方，連奴隸與克里特人都照到；恩典「教訓我們」（2:12），不是一次宣判，是天天的教養；神的兒子為我們捨了自己，「要贖我們脫離一切罪惡，又潔淨我們，特作自己的子民」（2:14）——買回、洗淨、認領，三個動作都是他做的。人的「熱心為善」排在全句最後，是他工作的結果，不是他工作的條件。","2:10「不可私拿東西」，原文 νοσφιζομένους（nosphizomenous），與徒 5:2 亞拿尼亞「把價銀私自留下幾分」是同一個字。這改變今天的讀法：保羅說的不是搶劫，是「留下一點」——在看起來全然擺上的時候，悄悄留一點給自己。今天它長成多報的十分鐘加班、帶回家的一盒文具、線上會議關掉鏡頭時的另一個視窗。忠誠不是在大事上不犯錯，是在「一點點」上不留後手；福音的榮美，常常就妝飾在這一點點上。","這一章照出一個讀經時總是往外看的我：讀到 2:5 想到妻子該怎樣，讀到 2:9 想到員工該怎樣，讀到 2:15 想到別人該聽我的。它也照出年紀帶來的病：年長了，心裡長出苦毒與固執（2:2）；嘴巴閒了，群組裡多了幾句讒言（2:3）；位置低了，就覺得「反正沒人看見」，私拿一點也無所謂（2:10）。我需要被教，比我以為的多。","「教訓我們除去不敬虔的心和世俗的情慾」（2:12）。「除去」原文是「否認、說不」，與 1:16 假師傅用行為「否認」神同一個字。全章最該被記住的動作，是學會說「不」——對深夜的那個網頁說不，對那句想轉傳的話說不，對報帳單上那一點點說不。可是這個「不」不是咬牙撐出來的：是恩典先對我說了「是」，我才學得會對罪說「不」。","這一週做兩件事。第一，挑一個「沒有人看見的地方」——報帳、打卡、作業、網購退貨、線上會議——在星期五以前，做一次完全不留後手的忠誠。第二，把講章裡的方向反過來：主動約一位比你年長十歲以上的同性弟兄姊妹，週末喝一杯茶或視訊二十分鐘，只問一個問題：「你走過的路上，恩典教會你最重要的一件事是甚麼？」","最終整合：入境大廳，清晨五點半。\n一排人站在欄杆後面，手裡舉著牌子，眼睛都看著同一扇自動門。\n沒有人知道門下一次打開，走出來的是誰；可是每一個人都把自己整理好了——頭髮梳過，孩子的臉擦過，牌子上的名字寫得端端正正。\n等候的人是這個樣子：一面看著門，一面把今天過好。\n保羅說，我們也站在這樣的欄杆後面：「等候所盼望的福，並等候至大的神和我們救主耶穌基督的榮耀顯現」（2:13）。\n牌子上寫的，是全卷最高的稱號。\n可是請你看清楚，我們等的那一位不是陌生人。\n他第一次來的時候，沒有人舉牌子接他；他走的那一天，是「他為我們捨了自己」（2:14）。\n所以等候的人不慌，也不閒。他手裡有一塊牌子，身上也有一個名字——「特作自己的子民」（2:14）；\n連一群自己的詩人都說「常說謊話」的克里特人，都被他寫在名單上。\n門還沒有開。這段時間，恩典蹲在我們旁邊，一件一件地教：有分寸，公義，敬虔；捨己，熱心為善。\n有一天，那扇門會打開。他會走出來，認得每一張他教過的臉。"],"self":"這一章照出來的「有己」，常常藏在讀經的方向裡：每一節順服都是寫給別人的，只有「用各等權柄」是寫給自己的；我想要妻子、員工、會友順服，卻沒有想過自己也該被恩典教。\n有己也藏在善行裡：在看得見的地方作榜樣，在看不見的地方私拿一點；行善是為了被稱讚、為了證明自己比「那些克里特人」強。這一章的出路，是承認我也是那個要被恩典一天一天教的孩子，並且抬頭看那位為我捨了自己的主。","t321":{"k":"耶穌是我的榜樣：2:7 要提多「凡事要顯出善行的榜樣」，τύπος 是模子、是印記；可是模子是照著誰打出來的？2:14 回答：「他為我們捨了自己」。耶穌自己怎樣活出這一章？他在拿撒勒順從父母三十年，在沒有人看見的木匠鋪裡忠心；他在樓上拿起手巾為門徒洗腳，作了最低位置的僕人；他順服，但順服的是父，目的是叫父的名得榮耀——這正是 2:5、2:10 那個朝外的目的。所以提多的榜樣、妻子的良善、僕人的忠誠，都不是自己發明的樣子，是把自己放進他先留下的模子裡。","g":"讓耶穌作王：2:13 給了全卷最高的稱號——至大的神和我們救主耶穌基督。這一章要人讓出的位置，是家裡、公司、教會裡那張「我說了算」的椅子。三段順服都只對順服的一方說話，沒有一句交給丈夫、主人或傳道人一根鞭子；因為真正坐在寶座上的只有一位。讓耶穌作王，丈夫就不必作王，老闆就不會被當成神，傳道人也不必靠聲量取得尊重（2:15）。可以自己檢查：這一週，你在哪一段關係裡最想要對方「聽我的」？那張椅子，現在交還給他。","p":"建立屬神的體系：2:1--10 是一張家庭聚會的座位表——老年人、老年婦人、少年婦人、少年人、僕人，還有站在中間的傳道人。體系不是組織圖，是世代之間的接棒：老年婦人「好指教少年婦人」（2:4），不是等牧師一個人去教。國度321空中團契散在台灣、馬來西亞、新加坡、中國、紐西蘭，每一個小組可以問：我們組裡有沒有一位屬靈父親、一位屬靈母親，正在陪一位年輕的？235 的「3」不是一門課，是一頓一頓的飯、一通一通的電話。而體系的本質，是 2:14 說的一群「自己的子民」：屬於他、熱心為善的一群人。"},"grp":["【一、破冰】你學會騎腳踏車、游泳或煮第一道菜，是誰教你的？那個人教你的時候，最常說的一句話是甚麼？","【二、扎心】2:3 說「不說讒言」，原文與「魔鬼」是同一個字。說出最近一次你在群組、飯桌或電話裡，轉述了一件別人的事——是在哪裡、對誰說的？那時你心裡說的是「我只是關心」，還是別的？如果當事人看到那段對話，你會怎樣？","【三、福音】2:11--12 說恩典「教訓我們」。在你信主以後的日子裡，有沒有一件事是恩典慢慢教會你的——不是你下決心做到的，是你回頭才發現自己變了？那一次你又跌倒的時候，恩典是怎樣待你的？","【四、行動】說出這一週你要在「沒有人看見的地方」顯為忠誠的一件事（報帳、打卡、作業、家務、網購退貨……），哪一天、在哪裡；再說出一位你要去請教的長輩、或要去陪伴的年輕人的名字，以及你們約好的時間。","【五、代禱】為三種人指名禱告：一位在家中受暴力、或在婚姻裡不敢說話的人，求主保護他的安全，也讓教會成為他可以求助的地方；一位在職場被欠薪、被霸凌或被要求做違法事的人，求主給他公義的出路；一位年長的弟兄姊妹，求主讓他的晚年健康、不苦毒，成為年輕人的屬靈父母。"],"prac":{"main":"這一週，我讓顯明出來的恩典教我：在沒有人看見的地方忠誠，在不同世代中間接棒，抬頭等候那位為我捨己的主。","items":["對神：每天早上慢慢讀 2:11--14 一次，那是原文的一個長句；讀完只問一個問題：「主，今天你要教我對哪一件事說『不』？」晚上回來，把那一件事寫在手機記事裡，向他說謝謝或說對不起。","對自己：這七天記下自己「私拿」的時刻——多算的一點時間、帶回家的一支筆、說得好聽一點的報告、假裝在線的會議。週末看一遍，不是為了自責，是把它帶到那位「要贖我們脫離一切罪惡」（2:14）的主面前；能還的還，能改的改。","對人：找一位比你年長十歲以上的同性弟兄姊妹，約一次喝茶或視訊，請他說一段「主怎樣教我」的經歷；如果你自己已經是年長的，就約一位年輕的，先聽他說二十分鐘，不急著給道理。","對生活：在家裡、辦公室、群組裡，這週各刻意做一件「替福音化妝」的小事：準時、誠實報帳、不轉傳未經證實的話、把一句刻薄話換成一句感謝。若你正面對家暴、欠薪或霸凌，這週先把事實與日期記下來，打給一位可信任的同工或求助專線——那不違背 2:5，也不違背 2:9。","對使命：在你的小組裡，為一位還不認識主、卻天天看著你工作的同事或鄰居指名禱告，求主讓他有一天從你的忠誠裡看見「我們救主－神的道」（2:10）有多美；並且問小組：我們能怎樣陪組裡最年輕的那一位？"]},"safe":["① 用 2:11--12 證明「321 八大步驟」：「你看，恩典也是一步一步教的，這就是八個步驟的經文根據」，或把 2:12 的「教訓」講成某一套課程的出處。","保羅的主詞是恩典，不是方法：恩典已經在耶穌基督身上顯明，然後才教訓我們；321 說「改變觀念就改變生命，改變生命就改變生活」，只能在末端認出 2:11--12 這個次序，不能拿經文當理念的插圖（鐵律五）。把恩典講成步驟，會眾記得的是一張流程圖，不是那位為他捨己的主。","檢驗標準：講完 2:11--14，會眾記得的第一個畫面，是一套步驟，還是那位為我們捨了自己的耶穌？","② 用 2:5「順服自己的丈夫」對受暴力的妻子說「你要再順服一點、多禱告，神就會改變他」，或勸她為了「見證」不要報警、不要離開。","保羅在同一節說順服的目的是「免得神的道理被毀謗」——朝外，為了福音的名聲，不是為了丈夫的權力；全段只對妻子說話，沒有一句授權丈夫拿這節去要求妻子。家暴不在順服的範圍：先保護生命、離開危險、依法求助，教會協助通報、陪她找到安全的地方（全卷立場見 ISS00_2、ISS00_5）。叫她留下來忍，正是讓神的道理被毀謗。","檢驗標準：一位正在受家暴的姊妹聽完，是更知道她可以求助、教會會保護她，還是更覺得她應該留下？","③ 用 2:5「料理家務」說「姊妹出外工作就是不順服」「結了婚的姊妹不該接服事、不該帶小組」，把這節講成一道禁足令。","原文 οἰκουργούς 是「在家作工的」，重點是勤勞、不懶惰，不是禁足；箴言末章那位才德的婦人一面管家、一面做買賣。用這一節限制姊妹的工作或服事，是把一個為福音名聲說的勸勉，變成控制一個人的規條；家庭怎樣分工，是每一對夫妻在主面前的自由（議題見 ISS02_3）。","檢驗標準：一位要上班養家、又在帶小組的年輕媽媽聽完，是更被肯定、更知道怎樣愛家，還是更覺得自己在犯罪？","④ 用 2:9--10 說「聖經承認奴隸制，所以那個制度本身沒有問題」；或為了護教，把當時的奴隸制講得很溫和、很人道。","新約沒有為奴隸制背書：同一位保羅把搶人口的列在違背純正道理的罪中（提前 1:10），又勸奴隸「若能以自由，就求自由更好」（林前 7:21）。保羅是在對身在制度裡、沒有選擇的弟兄姊妹說話，告訴他們怎樣在最低的位置尊榮神，不是在替制度說話（議題見 ISS02_5）。","檢驗標準：講完 2:9--10，會眾是更清楚福音的方向是尊嚴與公義，還是聽起來像是聖經默許了人可以擁有人？","⑤ 把 2:9 原封不動套在今天的職場：「員工就是老闆的僕人，被欠薪、被霸凌也要凡事討他喜歡；去申訴、離職、找勞工主管機關都是頂撞。」","δοῦλος 是法律上屬於主人的奴隸，不是簽約受僱、可以辭職的員工；2:10 的重點是「顯為忠誠」——忠誠是品格，不是無條件服從。剝削、霸凌、欠薪與違法的命令是不公義，聖經從來不替它們說話；今天使用勞動法、申訴管道與離職自由，不違背 2:9（全卷立場見 ISS00_5）。","檢驗標準：一位正被欠薪或被主管霸凌的弟兄姊妹聽完，是更知道他可以求助、教會會陪他，還是更覺得他只能閉嘴忍耐？","⑥ 把 2:11--14 講成兩極：一邊說「先把生活整理好，神的恩典才會臨到你」，把善行講成得救的條件；另一邊說「講善行就是律法主義，恩典就是不必管怎麼活」，把恩典講成放縱的許可證。","保羅的次序是：恩典先顯明，然後才教訓（2:11--12）；他先捨了自己、贖、潔淨，最後才是熱心為善（2:14）——善行不是贖價，是被贖的結果；可是恩典本身會教人，真正的恩典不會讓人停在原地（紅線八；全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，是更被恩典吸引、更樂意行善，還是只拿到一張更長的清單——或一張不必改變的許可證？","⑦ 用 2:11「神救眾人的恩典」說「所有人最後都會得救，所以不必傳福音、也不必悔改」；或反過來把「眾人」縮成某一類人，叫人懷疑恩典有沒有照到自己。","恩典向眾人顯明，不等於眾人都已經得救；保羅說神「願意萬人得救，明白真道」（提前 2:4），這是邀請，不是普救論（揀選與「眾人」回指以弗所書立場二；議題見 ISS02_6）。可是邀請是真的：連 2:9 的奴隸、1:12 的克里特人都在「眾人」裡面。","檢驗標準：一位覺得自己太糟的人聽完，是知道恩典也照到他；同時會眾是更願意傳福音，還是更覺得傳不傳都一樣？","⑧ 拿 2:13「至大的神和我們救主耶穌基督」攻擊人：「讀成兩位的人就是否認基督的神性」，或把夏普規則講成信仰的根基，彷彿這個文法一被質疑，基督的神性就保不住。","本講義以一位讀法為主軸（一個冠詞管兩個名詞；2:14 只說「他」；和合本註腳作「或譯：神－我們救主」），並陳兩位讀法；但基督的神性不靠這一節成立——「道就是神」（約 1:1），多馬說「我的主！我的神！」（約 20:28）。爭的是一個冠詞，敬拜的是同一位主（議題見 ISS02_8）。","檢驗標準：一位讀過不同解經書的弟兄姊妹聽完，是更敬拜基督，還是更想去跟人辯論、把讀法不同的人劃出門外？","⑨ 用 2:13 的「等候」推算主再來的日子，把時事新聞排進末世時間表；或叫人因為「主快來了」辭掉工作、不顧家庭、不必再做長遠的事。","保羅沒有給日期，只給方向；προσδεχόμενοι 掛在 2:12「度日」底下——等候不是停下來，是一面自守、公義、敬虔地過日子一面等（主再來與等候回指帖撒羅尼迦前書立場二；議題見 ISS02_9）。算日子的人常常停下了今天該做的善事，而那正是 2:14 他贖我們的目的。","檢驗標準：會眾聽完，是更有盼望地把今天的工作、家庭與善事做好，還是更焦慮、更想知道是哪一天？","⑩ 用 2:15「用各等權柄責備人；不可叫人輕看你」替傳道人或同工的轄制背書：「我是神設立的，你對我有意見，就是輕看神的僕人。」","提多的權柄（ἐπιταγή）是從那交託保羅的命令來的，只能用在「這些事」上——2:1--14 的純正道理與恩典，不是用來管人的私事、壓下不同的聲音；長老「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3），回指彼得前書立場五。怎樣不被輕看？回到 2:7：凡事顯出善行的榜樣（議題見 ISS02_4）。","檢驗標準：一位曾經向同工或牧者提出疑問的弟兄姊妹聽完，是更放心在教會裡說真話，還是更覺得提問就是不順服？","⑪ 把 2:3--4 老年婦人指教少年婦人講成年長的姊妹可以接管年輕媳婦的家：「我是你的屬靈媽媽，你家怎麼帶孩子、要不要上班都要聽我的」；或反過來，只讓年長的姊妹在廚房煮飯，不讓她們教。","σωφρονίζω 是使人清醒、懂分寸，是陪伴與帶領，不是接管別人的婚姻；教的人要先通過 2:3 那一關——不說讒言。另一頭，教會若只讓年長姊妹負責煮飯，就浪費了神給這個家的「用善道教訓人」的老師（議題見 ISS02_2）。","檢驗標準：一位年輕的媽媽聽完，是更想去找一位走過的姊妹談談，還是更怕被教會裡的長輩管？","⑫ 用 2:2--6 製造世代對立：對年長的說「你們老了就是固執、苦毒，該退下來」，或對年輕的說「少年人只要謹守、聽話，輪不到你說話」。","保羅對每一種年齡都用同一個「照樣」（ὡσαύτως）、同一個健康的字：老年人要在信心、愛心、忍耐上健康，少年人要有分寸；到了 2:12，同一個 σώφρων 的字給了「我們」所有人。把經文變成一代人批評另一代的武器，正好落進 2:3 的讒言（議題見 ISS02_1）。","檢驗標準：一位七十歲的弟兄和一位二十歲的弟兄一起聽完，是更想坐在一起吃一頓飯，還是各自更確定對方有問題？","⑬ 用處境取消原則：「2:1--10 是寫給一世紀家庭聚會的，今天的家庭與職場不一樣，這些都不必管了」；或把處境硬搬：「今天的妻子、員工就跟當年的克里特婦人和奴隸一樣，原封不動照做。」","書信三問要走完：處境是一個「常說謊話」的社會裡、剛起頭的家庭教會；原則是恩典已經顯明而且會教人，每一種身份都是福音的櫥窗，順服的目的朝外；今天的落點隨處境——在家裡、辦公室、群組裡活出健康的樣子，同時使用今天有的保護與管道（全卷立場見 ISS00_8）。","檢驗標準：會眾聽完，是知道這一章今天在自己的家和辦公室裡怎樣活，同時也知道自己可以使用的正當保護？","⑭ 用 2:14「特作自己的子民」築牆：「我們是神的珍寶，外面的人都是克里特人」，把子民講成優越感，再拿 1:12 對某個地方、某個族群的人貼標籤開玩笑。","2:14 的子民正是從克里特人中間被贖出來的；1:12 是一個民族自己的詩人承認的病，不是保羅貼的標籤（全卷立場見 ISS00_8）。神在西乃山對以色列說的話，如今說給一群外邦人——子民的記號不是比別人好，是熱心為善，為別人行善。","檢驗標準：一位剛來教會、出身常被人看不起的朋友聽完，是覺得自己也可以被神認領，還是覺得自己又被分到門外？","⑮ 把 2:12「除去不敬虔的心和世俗的情慾」講成一張檢查表：電影、咖啡、衣服長短、手機時數，然後在小組裡互相檢查誰比較「世俗」。","「除去」原文與 1:16 假師傅「行事卻和他相背」同一個字，是向不敬虔說「不」——這個「不」是恩典從裡面教出來的，不是別人從外面貼上去的；保羅給的是三個方向（自守、公義、敬虔），不是一份規條。把恩典的教養講成檢查別人的行為，正是這一卷最該防備的事。","檢驗標準：會眾聽完，是更渴望被恩典教，還是更會檢查別人的行為？","⑯ 把這一章講成提多的成功學：「提多年輕、又是外邦人、常被質疑，還是靠自己的榜樣贏得尊重，你也要像他一樣自強。」","提多的榜樣是 τύπος，是被打出來的模子——打模子的是那位為我們捨了自己的主；保羅寫給提多的每一個「你要」，都掛在 2:11 的「因為」底下。焦點落在提多身上，會眾得到的是一位偶像和一份壓力，失去的是那位教人的恩典（鐵律七）。","檢驗標準：會眾聽完，是更佩服提多，還是更愛那位握著他們的手、天天教他們的主耶穌？"]},{"n":3,"t":"乃是照他的憐憫，藉著重生的洗和聖靈的更新","sub":"柔、憐、果","lv":"A","arc":"行","sec":[["3:1--2","你要提醒眾人：順服與溫柔"],["3:3--7","我們從前也是無知：恩慈和慈愛顯明"],["3:8--11","這話是可信的：正經事業與遠避爭競"],["3:12--15","免得不結果子：同工、送行與問安"]],"serm":{"pts":[["我們從前也是","3:1--3","「我們從前也是無知、悖逆」——向眾人大顯溫柔的理由，是記得自己從哪裡來；順服有界線，溫柔沒有例外"],["照他的憐憫","3:4--7","「並不是因我們自己所行的義，乃是照他的憐憫」——恩慈和慈愛顯明，重生的洗與聖靈的更新；連洗禮也不是我們所行的義"],["學著結果子","3:8--15","「使那些已信神的人留心做正經事業」——行是果不是根；遠避爭競、挽回分裂、給同工送行，學著結果子"]]},"q":"你身邊有沒有一個人，你一想到他就皺眉？群組裡專門唱反調的那一位、把你的好意講成心機的那一位、你明明看見他還在老路上打轉的那一位。你可以對他客氣，可是要你「向眾人大顯溫柔」，你心裡會冒出一句：憑甚麼？\n也許你還有另一種累：信主很多年了，服事不少、好事也做了很多，心裡卻越來越像在交作業——做得少就不安，做得多又覺得沒有人看見。\n這一章要問的是：你行善，是為了證明自己，還是因為你記得自己是怎樣被救的？面對那個難相處的人，你記得的是他現在的樣子，還是你自己從前的樣子？","truth":"「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫」（3:5）：救恩的根在神的憐憫，不在我們的表現；連我們做對的事，都不記在我們的帳上。\n所以已信神的人才能「留心做正經事業」——不是為了被接納而行，是因為已經被接納而行；記得「我們從前也是」的人，才學得會向眾人溫柔。行是果，不是根。","mv":{"t":"他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。","r":"多3:5"},"card":["這一章在全卷「整・教・行」的醫治裡，是最後一步「行」：被醫好的人站起來，學著結果子。第一章把斷了的骨頭接正，第二章恩典像父母一樣教養，第三章病人下了床，開始做「與人有益」的事（3:8）。可是保羅先把根挖出來給人看：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）——行是果，不是根。全章三個詞：柔、憐、果——向眾人溫柔，因為自己蒙了憐憫，所以結出果子。","這一章的主詞，在最關鍵的地方換成了神。3:3 是我們：無知、悖逆、彼此相恨；3:4 一個「但」字之後，動詞全歸給神——神我們救主的恩慈和慈愛顯明了，他救了我們（3:5），他藉著耶穌基督把聖靈厚厚澆灌在我們身上（3:6），他的恩叫我們稱義、成為後嗣（3:7）。父顯明恩慈，子是那管道，聖靈澆灌下來——三一的神一同為一群從前彼此相恨的人工作。人能溫柔、能行善，是因為神先做了這一切。","3:4「恩慈」原文 ἡ χρηστότης（hē chrēstotēs），字根 χρηστός（chrēstos）。主耶穌說「我的軛是容易的」（太 11:30），「容易」就是這個字——合用、合身、不磨人的那一種好；主耶穌說至高者「恩待那忘恩的和作惡的」（路 6:35），「恩待」也是這個字。這改變今天的讀法：神的恩慈不是遠遠地施捨，是貼著人的傷口量身做的好，而且是給忘恩的人的。你要向那個難相處的人顯出的溫柔，也是這一種：不是咬牙忍他，是合著他的難處去待他。","這一章照出一種很體面的不對勁：把自己放在 3:3 那張清單的外面。看見別人無知、悖逆、彼此相恨，我們很快說得出他哪裡錯，卻忘了保羅寫的是「我們從前也是」。另一種不對勁藏在善行裡：服事做得越多，越在意有沒有人看見；人家沒有道謝，心裡就記上一筆。兩種是同一個病——忘了自己是被憐憫找到的人，就開始把恩典當成自己的功勞。","「我們從前也是」（3:3）。這一句拆掉了「我們」和「他們」中間的那道牆。全章最該被記住的動作，就是在你要開口糾正、評論、轉傳之前，先在心裡把這一句說一遍：我從前也是。它不是叫你不分對錯，而是叫你換一個位置說話——不是站在高處判決，是站在蒙憐憫的人中間說話。溫柔不是技巧，是記性；記得自己從哪裡來的人，說出來的真話才帶著憐憫。","這一週做兩件事。第一，寫下一位你最難向他溫柔的人（同事、家人或群組裡的某一位），在他的名字下面寫三行：「我從前也是＿＿」「神曾經怎樣恩待我＿＿」「這週我能為他做的一件與人有益的小事＿＿」，然後去做，不告訴任何人（若那個人正在傷害你，先顧安全，這一項可以等）。第二，照 3:13 的樣子，找一位正在外地服事、剛搬家或剛失業的弟兄姊妹，問一句「你現在缺甚麼？」，具體補上一樣，叫他沒有缺乏。","最終整合：一張存了七年的截圖。\n他是小城一間教會的同工。七年前教會分裂的那一年，有一位弟兄在網路上寫了一長串話罵他：偽善、愛權、說一套做一套。那則留言他截了圖，一直存在手機裡，像存著一張欠條。\n上個月，那位弟兄的太太住院了。小組排的送飯名單傳到他手上——下週三晚上，輪到他。\n那天夜裡，他翻開提多書第三章，本來想找的是那一句「分門結黨的人，警戒過一兩次，就要棄絕他」（3:10）。他的眼睛卻停在上面幾行：「我們從前也是無知、悖逆……常存惡毒嫉妒的心，是可恨的，又是彼此相恨。」（3:3）\n他想起二十歲的自己。那時他也寫過很難聽的話，罵過一位找他談話的老牧者。那位牧者沒有回罵，只是每年他生日，都寄來一張卡片。\n下一句是：「但到了神－我們救主的恩慈和他向人所施的慈愛顯明的時候，他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫」（3:4--5）。\n他忽然明白：那張欠條，神從來沒有向他討過。\n他把截圖刪了。\n週三晚上，他提著一鍋熱湯站在病房門口。那位弟兄抬頭看見他，愣了一下。他沒有提七年前的事，只說：「小組輪到我，今天是排骨湯。」\n那鍋湯不是他的義。那是一個蒙了憐憫的人，學著結出的第一顆果子。"],"self":"這一章照出來的「有己」，是一個站在清單外面的我：別人的無知、悖逆、彼此相恨，我看得清清楚楚，自己那一份卻早就忘了；我對人溫柔不溫柔，是看他配不配，不是看我自己從哪裡被救出來。\n有己也會穿上善行的衣服：服事、奉獻、幫忙，暗暗都在記帳，等人看見、等人道謝、等神加分。3:5 一句話把帳本收走了——並不是因我們自己所行的義；連我的義都不是我的，我還有甚麼可以拿來壓人？","t321":{"k":"耶穌是我的榜樣：3:4 說神的恩慈和慈愛「顯明」了——它不是一個概念，是一個人走進克里特這樣的世界。耶穌活出了 3:2 的每一個字：他「心裡柔和謙卑」（太 11:29），有能力卻不拿來壓人；被罵不還口（彼前 2:23）；在十字架上為釘他的人禱告：「父啊！赦免他們；因為他們所做的，他們不曉得。」（路 23:34）他也活出了 3:1 的界線：在大祭司面前被人打臉，他不咒罵，也不退讓，平靜地說「我若說的是，你為甚麼打我呢」（約 18:23）。更深的是，他不只是溫柔的榜樣——他就是那位「我們救主」；3:6 說聖靈是「藉著耶穌基督」澆灌下來的。我們能向眾人溫柔，是因為他先向我們這些從前悖逆的人溫柔。","g":"讓耶穌作王：這一章要人讓出來的，是「審判席」和「功勞簿」兩個位置。審判席——3:3 把我從審判別人的高處請下來：我不是比克里特人好的人，我是和他們一樣、卻蒙了憐憫的人；當我在心裡把某個人定了罪、轉傳他的錯、在背後說他，我就坐上了只屬於主的位子。功勞簿——3:5 把我的義也收走了：我的服事、我的奉獻、我的正確，都不能拿來向神換取甚麼，也不能拿來向人要求甚麼。讓耶穌作王，就是讓那位照他的憐憫救人的主，來決定誰值得被溫柔對待；他的答案寫在 3:2：眾人。可以自己檢查：這一週，你在心裡審過幾個人？你的善行裡，有幾件是在等人鼓掌？","p":"建立屬神的體系：提多書第 3 章的次序本身就是一個體系——3:5 憐憫是生命，3:2 溫柔是關係，3:8 正經事業是事工；先生命，再關係，後事工。一群人要照這個次序被建造：第一，要有一個說得出「我們從前也是」的文化——同工會和小組裡，見證不只講今天的得勝，也敢講蒙憐憫之前的自己，新來的人才知道這裡是醫院，不是展覽館。第二，要有處理分歧的程序——先私下勸、再勸，目的是挽回（3:10；太 18:15），提出問題的人有正式的管道，不被冷落。第三，要有供應同工的習慣——3:13 叫他們沒有缺乏；國度321空中團契散在各國，為在外地奔走的同工與宣教士預備盤纏和代禱，讓「我們的人」一起學習正經事業（3:14），不是幾個熱心的人包辦。"},"grp":["【一、破冰】你小時候或年輕時，有沒有被一位長輩、老師或陌生人「不照你應得的」善待過？那是甚麼時候、在哪裡、他做了甚麼？你現在想起來是甚麼感覺？","【二、扎心】經文說：「我們從前也是無知、悖逆、受迷惑」（3:3）。說出一位你現在最難向他「大顯溫柔」的人（可以只說稱呼）。如果誠實地看，他身上最讓你受不了的那一點，你從前（或現在）有沒有過？是在甚麼事上？","【三、福音】讀 3:5：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）。你心裡有沒有一筆帳——覺得自己做得夠多，神才會喜悅你；或覺得自己做得太少，神大概不想要你了？聽到「照他的憐憫」，這筆帳今天對你是甚麼意思？","【四、行動】3:14 說「我們的人要學習正經事業，預備所需用的」。說出一個你身邊具體的「所需用的」：是誰、缺甚麼（一頓飯、一段接送、一筆車資、一次陪診）？這一週你要在哪一天、用甚麼方式補上？再說出一位你要主動向他顯出溫柔的人，以及你打算對他說的那一句話。","【五、代禱】為三種人指名禱告：一位還活在 3:3 那張清單裡、讓你覺得很難愛的人，求神我們救主的恩慈也向他顯明；一位在教會分歧或爭論中受了傷的弟兄姊妹（不論他站在哪一邊），求主醫治、挽回；一位在外地奔走的同工或宣教士，求主藉著我們，叫他們沒有缺乏。"],"prac":{"main":"這一週，記得「我們從前也是」，照著神的憐憫向眾人溫柔，並學著做一件與人有益的正經事業。","items":["對神：每天早上讀 3:4--5，用一句話禱告：「主，我今天所行的一切都不是我的義；求你照你的憐憫帶領我。」每天晚上回想：今天神的恩慈在哪一件小事上向我顯明？寫下一件，向他道謝。","對自己：這七天，每次你在心裡評斷一個人、或想轉傳一則嘲諷別人的訊息時，在手機記事本記下時間和原因，並在旁邊寫上「我從前也是」。週末讀一遍，問自己：我的評斷裡，有多少是在護衛真理，有多少是在護衛自己的位置？","對人：選一位你最難溫柔對待的人，這週為他做一件「與人有益」的小事——一句真誠的肯定、一次幫忙、一份小禮物——不告訴別人，也不等他道謝。若你們之間有未解的分歧，先私下用溫和的話約他談一次，不在群組裡公開說。若那個人正在傷害你，先顧自己的安全，這一項可以等。","對生活：給自己的網路生活定一條規矩：評論任何人——包括作官的、掌權的、公眾人物、教會同工——之前，先問三個問題：這是查證過的事實嗎？說出來對人有益嗎？我會當著他的面這樣說嗎？三個都通過才送出；就事論事，不羞辱人格（3:2）。","對使命：照 3:13 的樣子，這一週為一位在外地服事的同工或宣教士做一件具體的事：問他缺甚麼、寄一份奉獻或物資、或寫一封代禱信；也在小組裡提出一個「所需用的」（3:14），讓大家一起學習正經事業，免得不結果子。"]},"safe":["① 用 3:1「順服作官的、掌權的，遵他的命」在講台上替某一個當代政府、政權或政黨背書，要會眾「順服就是支持」；或反過來借著 3:1 的界線，把講台變成攻擊某一個政府、點名政治人物或政策的場合。","3:1 的「遵他的命」原文 πειθαρχεῖν，與彼得在公會前說「順從神，不順從人，是應當的」（徒 5:29）同一個字——順從官長是常態，順從神是界線；同一章緊接著說「不要毀謗，不要爭競，總要和平，向眾人大顯溫柔」（3:2），連作官的也在「眾人」裡面。國度321空中團契散在不同國家、不同制度底下，講台一旦替誰背書或攻擊誰，就把福音綁在一個政權的成敗上（全卷立場見 ISS00_5）。","檢驗標準：活在不同國家、持不同政見的兩位弟兄姊妹一起聽完，是都更清楚順服的界線在哪裡、都被提醒要溫柔，還是有一位覺得講台在替他的對手說話？","② 用 3:2「不要毀謗」叫揭發問題的人閉嘴：「你質疑同工、說出教會裡的錯，就是毀謗，就是不溫柔。」","βλασφημεῖν 是惡意抹黑、羞辱人的名聲，不是陳述查證過的事實；保羅自己在同一封信裡就指出有人「因貪不義之財」（1:11）教導人。把一切批評都叫作毀謗，會保護做錯事的人、傷害說真話的人，也讓教會失去自我更正的能力；該問的是：說的是不是事實？是不是走正當的管道、帶著挽回的心？","檢驗標準：一位曾經向教會指出財務或同工問題的弟兄姊妹聽完，是更知道怎樣用溫柔又誠實的方式說話，還是覺得自己以後最好甚麼都別說？","③ 用 3:3 把見證變成罪的展覽：在講台上把自己信主前的吸毒、外遇、暴力講得繪聲繪影，越驚人越屬靈；或在見證裡把別人（前配偶、家人、受害者）的過去一併公開。","保羅列出 3:3 的清單，沒有一項細節，緊接著就是 3:4 的「但」——重點在神的恩慈顯明，不在罪有多精彩；別人的故事也不是我們的見證材料。講得太細，會讓聽的人記住罪而忘了救主，也可能叫故事裡的另一個人再受傷一次（議題見 ISS03_3）。","檢驗標準：會眾聽完你的見證，記得的是你從前有多壞，還是那位恩慈顯明的救主？故事裡被提到的那個人如果坐在台下，他會不會再受傷一次？","④ 用 3:3「我們從前也是」要求受害者立刻原諒、放下：「大家都是罪人，你也不完全，就不要再追究了」，好讓加害者（包括犯錯的同工）不必承擔後果、很快回到原來的位置。","3:3 是叫每一個人回到蒙憐憫的本位，不是把受害與加害拉平；同一章說要「警戒」（3:10）、要「留心做正經事業」（3:8）——恩典叫人悔改、負責、賠償，不是叫人逃避後果。把「我們都是罪人」講成封口令，是廉價恩典最常見的樣子，會讓受害的人第二次受傷。","檢驗標準：一位被教會同工傷害過的人聽完，是更知道神的憐憫也包括為他伸張公義，還是覺得自己若還在痛，就是不夠屬靈？","⑤ 用 3:5「重生的洗」說受洗就自動得救，好像水會自己生效；或說沒受洗就不能得救，叫還沒受洗的初信者懷疑自己；或在講台上嘲諷嬰孩洗禮、信徒浸禮任何一方，判定某一個宗派的人有沒有得救。","「重生的洗」有三種讀法——神在洗禮中施行重生、洗禮是重生的記號與印證、洗是聖靈潔淨的比喻——三種傳統裡都有愛主的弟兄姊妹，本講義陳列而不裁判。三種讀法都站得上同一節的前半：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）——連洗禮也不是我們所行的義；救人的是神，不是儀式（議題見 ISS03_4；全卷立場見 ISS00_9）。","檢驗標準：一位小時候受了洗、如今冷淡的人，和一位因家人反對還不能受洗的慕道友一起聽完，是都更清楚救他的是照憐憫行事的神，還是一個以為自己有了保險、一個以為自己還沒得救？","⑥ 用 3:5「重生」要求每一個人說出重生的日期、時刻和地點，說不出來就是「還沒有真正重生」；或反過來，拿一張決志卡、一次舉手，當作一個人已經重生的保證，不必再看生命。","3:5 說重生是神「照他的憐憫」做的，是「聖靈的更新」——不是儀式的工作，也不是人決志的工作。有人記得清楚的那一天，有人是在信徒家庭裡慢慢長大，聖靈的工作沒有固定的格式；可是被重生的人，3:8 說會留心做正經事業。","檢驗標準：一位在基督徒家庭長大、說不出哪一天信主的青年聽完，是更確信救他的是神的憐憫，還是開始懷疑自己？一位剛舉手決志的人聽完，是知道接下來要被聖靈更新，還是以為事情已經辦完了？","⑦ 用 3:6「厚厚澆灌」宣稱「沒有說方言、沒有某一種經歷，就是沒有被聖靈澆灌」；或反過來，嘲笑追求聖靈充滿的弟兄姊妹情緒化、不成熟。","3:6 的主詞是神，對象是「我們」——保羅寫給全體克里特信徒，沒有分出有澆灌和沒有澆灌的兩等人；聖靈的恩賜與經歷回到哥林多前書講義第 12--14 章的處理，澆灌一次或多次並陳（議題見 ISS03_5）。拿某一種經歷作門檻，會把教會分成兩等人；嘲笑別人的追求，也一樣。","檢驗標準：靈恩背景與非靈恩背景的兩位弟兄姊妹一起聽完，是都更感謝神厚厚的賜下，還是有一位覺得自己是次等的基督徒？","⑧ 把 3:8「使那些已信神的人留心做正經事業」單獨抽出來，講成一張檢查善行的清單：「你這週服事了幾次、奉獻了多少、帶了幾個人？做得不夠，就要懷疑自己是不是真信」；卻不講 3:5。","保羅要提多切切實實講明的「這些事」，首先是 3:4--7 的福音：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）；3:8 的主詞是「已信神的人」，原文是完成式——行是果，不是根。把 3:8 和 3:5 拆開，就成了行為主義；把 3:8 刪掉，就成了廉價恩典；兩條路都不是保羅的福音（全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，是更被恩典吸引、更樂意行善，還是更會檢查自己和別人的行為、更害怕自己做得不夠？","⑨ 用 3:7「成為後嗣」講成功神學：「你是神的後嗣，就該承受今世的財富、健康、地位；過得不好，是你沒有支取產業。」","3:7 說得很清楚，是「憑著永生的盼望」成為後嗣——產業的內容是永生，憑的是盼望，不是今世的帳戶；這封信寫給的是剛信主、許多還是奴僕的人（2:9）。把後嗣講成發財，會讓貧窮、生病、失業的弟兄姊妹以為自己被神虧待，也讓富足的人以為自己特別蒙愛。","檢驗標準：一位剛失業、或長年病痛的弟兄姊妹聽完，是更確信自己是神家裡的後嗣，還是覺得自己的處境證明他信得不夠？","⑩ 用 3:9「要遠避無知的辯論」拒絕回答真誠的疑問：「信就對了，不要問那麼多」；把查考、研讀、提出神學問題的人，都說成「愛辯論」。","3:9 遠避的是「無知的」「虛妄無益的」爭論——辯完沒有人得益處、只為了贏的那一種；同一章保羅要提多把福音「切切實實地講明」，標準在 3:8--9 的對照裡：與人有益，還是虛妄無益？一位慕道友真心問「為甚麼」，屬於 3:8 的有益，不屬於 3:9 的無益（議題見 ISS03_7）。","檢驗標準：一位腦子裡充滿問題的大學生聽完，是更敢把問題帶到小組裡，還是覺得這間教會不歡迎他思考？","⑪ 用 3:10「分門結黨的人……就要棄絕他」對付提出不同意見、質疑同工決定或揭發問題的人：把他從服事名單上拿掉、在群組裡封鎖、在走廊上裝作看不見，甚至在講台上影射他。","αἱρετικός 的字根是「選擇」：自己選一邊、拉一群人、使教會撕裂的人，不是提出問題的人；「警戒過一兩次」是程序，「警戒」是把人的心思放回正位，目的是挽回（太 18:15）；「棄絕」是不再捲進他無止境的爭論，不是許可冷暴力。3:2「不要爭競……向眾人大顯溫柔」先適用在處理這件事的掌權者自己身上（議題見 ISS03_8）。","檢驗標準：一位曾經在會議上提出異議的弟兄聽完，是更知道他的意見有正式的管道可以表達，還是覺得自己已經被貼上了「分門結黨」的標籤？","⑫ 把 3:1「順服作官的、掌權的，遵他的命」挪到教會裡，要求會眾對長老、牧者無條件服從：「長老就是掌權的，遵他的命就是順服神」；不同意，就是悖逆。","3:1 說的是城裡的官長，不是教會的長老；1:7 給監督的第一條否定詞是「不任性」——不是自己說了算；彼得說長老「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）。屬靈權柄是服事的權柄，不是命令的權柄；把它講成遵命，正是屬靈轄制的入口（回指彼得前書立場五；全卷立場見 ISS00_3）。","檢驗標準：會眾聽完，是更願意和長老一同擺上，還是更不敢在長老面前說出自己的看法？長老們聽完，是更想作榜樣，還是更有理由要求服從？","⑬ 把 3:12--13 的亞提馬、推基古、西納、亞波羅講成 321 五重職份的插圖：「推基古是使徒型、亞波羅是教師型、西納是……」，用一份同工名單證明某一套事工架構。","保羅寫這幾個名字，是在安排行程、託付送信、預備盤纏——亞提馬只出現這一次，名字留下了，故事沒有留下；經文沒有替他們分類。先讓經文講完：這是一群彼此託付、為別人預備「沒有缺乏」的同工；321「無己才能合一」是在末端認出來的，不是硬套進去的（鐵律五）。","檢驗標準：會眾聽完，記得的是一群彼此送行、彼此補足的僕人，還是一張把聖經人物填進去的職份表？","⑭ 用 3:13「叫他們沒有缺乏」向會眾施壓募款：「奉獻給神的僕人，必定加倍蒙福」；或反過來，讓全職同工、宣教士長期領不合理的待遇，說「憑信心生活才屬靈」。","3:13 是保羅吩咐提多主動看見同工的實際需要，「趕緊」補上——是愛與責任，不是交易；3:14 說「預備所需用的」，是供應真實的缺乏，不是撐排場。拿奉獻換祝福，是把憐憫變成買賣；讓同工缺乏卻稱之為屬靈，是把教會的責任推給神（議題見 ISS03_9）。","檢驗標準：一位剛失業、奉獻很少的弟兄聽完，是覺得自己也能用別的方式為同工補缺，還是覺得自己錯過了蒙福的機會？教會的同工聽完，是更被看見，還是更不敢說出自己的需要？","⑮ 用 3:14「免得不結果子」羞辱事工沒有數字的人：拿聚會人數、決志人數、奉獻金額衡量一位同工或一間小教會「有沒有果子」；或對臥病、年老、失業而不能服事的人說「你沒有果子」。","3:14 的果子是「預備所需用的」——供應實際的需要，是一頓飯、一段接送、一份陪伴；果子長在 3:5 的憐憫上，不長在業績表上。把果子講成數字，會讓忠心卻不起眼的人灰心，也讓人為了數字去做事，那又回到了有己。","檢驗標準：一位長年臥床、只能為人禱告的老姊妹聽完，是知道她的禱告也是果子，還是覺得自己已經是「不結果子」的人？","⑯ 用處境取消原則：「3:1 是寫給羅馬帝國底下的克里特人，今天不適用」「3:10 是一世紀的事」；或把處境硬搬：把克里特教會的具體安排，逐字變成今天每一間教會的規條。","書信三問要走完：克里特的處境是剛起頭的教會、羅馬治下難管的島、有人為錢教導而敗壞人的全家；保羅推出的原則是神照他的憐憫救了我們，所以向眾人溫柔、留心做正經事業、遠避無益的爭競；今天的落點在面對政府時、在網路上、在教會有異議時、在供應同工時（全卷立場見 ISS00_8）。","檢驗標準：會眾聽完，是更清楚保羅當時面對甚麼、這原則今天落在自己生活的哪一件事上，還是只帶走一條規矩，或一句「那是古代的事」？"]}],"txt":{"1":["神的僕人，耶穌基督的使徒保羅，憑著神選民的信心與敬虔真理的知識，","盼望那無謊言的神在萬古之先所應許的永生，","到了日期，藉著傳揚的工夫把他的道顯明了；這傳揚的責任是按著神－我們救主的命令交託了我。","現在寫信給提多，就是照著我們共信之道作我真兒子的。願恩惠、平安從父神和我們的救主基督耶穌歸與你！","我從前留你在克里特，是要你將那沒有辦完的事都辦整齊了，又照我所吩咐你的，在各城設立長老。","若有無可指責的人，只作一個婦人的丈夫，兒女也是信主的，沒有人告他們是放蕩不服約束的，就可以設立。","監督既是神的管家，必須無可指責，不任性，不暴躁，不因酒滋事，不打人，不貪無義之財；","樂意接待遠人，好善，莊重，公平，聖潔自持；","堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人駁倒了。","因為有許多人不服約束，說虛空話欺哄人；那奉割禮的更是這樣。","這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家。","有克里特人中的一個本地先知說：「克里特人常說謊話，乃是惡獸，又饞又懶。」","這個見證是真的。所以，你要嚴嚴地責備他們，使他們在真道上純全無疵，","不聽猶太人荒渺的言語和離棄真道之人的誡命。","在潔淨的人，凡物都潔淨；在污穢不信的人，甚麼都不潔淨，連心地和天良也都污穢了。","他們說是認識神，行事卻和他相背；本是可憎惡的，是悖逆的，在各樣善事上是可廢棄的。"],"2":["但你所講的總要合乎那純正的道理。","勸老年人要有節制、端莊、自守，在信心、愛心、忍耐上都要純全無疵。","又勸老年婦人，舉止行動要恭敬，不說讒言，不給酒作奴僕，用善道教訓人，","好指教少年婦人，愛丈夫，愛兒女，","謹守，貞潔，料理家務，待人有恩，順服自己的丈夫，免得神的道理被毀謗。","又勸少年人要謹守。","你自己凡事要顯出善行的榜樣；在教訓上要正直、端莊，","言語純全，無可指責，叫那反對的人，既無處可說我們的不是，便自覺羞愧。","勸僕人要順服自己的主人，凡事討他的喜歡，不可頂撞他，","不可私拿東西，要顯為忠誠，以致凡事尊榮我們救主－神的道。","因為神救眾人的恩典已經顯明出來，","教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日，","等候所盼望的福，並等候至大的神和我們救主耶穌基督的榮耀顯現。","他為我們捨了自己，要贖我們脫離一切罪惡，又潔淨我們，特作自己的子民，熱心為善。","這些事你要講明，勸戒人，用各等權柄責備人；不可叫人輕看你。"],"3":["你要提醒眾人，叫他們順服作官的、掌權的，遵他的命，預備行各樣的善事。","不要毀謗，不要爭競，總要和平，向眾人大顯溫柔。","我們從前也是無知、悖逆、受迷惑、服事各樣私慾，和宴樂，常存惡毒嫉妒的心，是可恨的，又是彼此相恨。","但到了神－我們救主的恩慈和他向人所施的慈愛顯明的時候，","他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。","聖靈就是神藉著耶穌基督－我們救主厚厚澆灌在我們身上的，","好叫我們因他的恩得稱為義，可以憑著永生的盼望成為後嗣。","這話是可信的。我也願你把這些事切切實實地講明，使那些已信神的人留心做正經事業。這都是美事，並且與人有益。","要遠避無知的辯論和家譜的空談，以及紛爭，並因律法而起的爭競，因為這都是虛妄無益的。","分門結黨的人，警戒過一兩次，就要棄絕他。","因為知道這等人已經背道，犯了罪，自己明知不是，還是去做。","我打發亞提馬或是推基古到你那裡去的時候，你要趕緊往尼哥坡里去見我，因為我已經定意在那裡過冬。","你要趕緊給律師西納和亞波羅送行，叫他們沒有缺乏。","並且我們的人要學習正經事業，預備所需用的，免得不結果子。","同我在一處的人都問你安。請代問那些因有信心愛我們的人安。願恩惠常與你們眾人同在！"]},"blk":{"1":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατʼ εὐσέβειαν</p>","lit":"<p>保羅，神的奴僕，又是耶穌基督的使徒，為著神選民的信心，和那合乎敬虔之真理的認識，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Παῦλος δοῦλος θεοῦ</td><td>Paulos doulos theou</td><td>保羅，神的奴僕</td><td>保羅書信裡只有這一次自稱「神的僕人」</td></tr><tr><td>ἀπόστολος δὲ Ἰησοῦ Χριστοῦ</td><td>apostolos de Iēsou Christou</td><td>又是耶穌基督的使徒</td><td>δὲ 把第二個身分接上</td></tr><tr><td>κατὰ πίστιν ἐκλεκτῶν θεοῦ</td><td>kata pistin eklektōn theou</td><td>為著神選民的信心</td><td>使徒職分的方向；信心追蹤第一站</td></tr><tr><td>ἐπίγνωσιν ἀληθείας</td><td>epignōsin alētheias</td><td>真理的認識</td><td>不只知道，是認清</td></tr><tr><td>τῆς κατʼ εὐσέβειαν</td><td>tēs kat' eusebeian</td><td>那合乎敬虔的</td><td>真理有一個方向：敬虔</td></tr></table>","gram":"<p><strong>保羅的開場白在新約裡只有這一次是 Παῦλος δοῦλος θεοῦ（Paulos doulos theou）。</strong>羅 1:1、腓 1:1 都是「基督耶穌的僕人」，這裡卻是「神的僕人」。這個稱呼在舊約是摩西、大衛、眾先知的頭銜；保羅把自己放進那一長串被神差遣的人裡面。接著 ἀπόστολος δὲ Ἰησοῦ Χριστοῦ（apostolos de Iēsou Christou），δὲ（de） 不是轉折，是補上第二個身分：對神是僕人，對人是被基督差遣的使者。</p><blockquote><p>κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας（kata pistin eklektōn theou kai epignōsin alētheias） 的 κατὰ（kata） 怎樣讀，有兩派：一派讀作「按照」，使徒職分符合選民的信心；另一派讀作「為了」，使徒職分的目的是叫選民產生信心、認清真理。和合本「憑著」偏前者。本講義取後者為主：整封信都在講保羅與提多「為了」克里特人的信心作工，「使他們在真道上純全無疵」（1:13）就是這個方向。</p></blockquote><p>最後一個片語 τῆς κατʼ εὐσέβειαν（tēs kat' eusebeian） 用冠詞把「合乎敬虔」掛在「真理」後面：保羅說的真理，是會長出敬虔的那一種。εὐσέβεια（eusebeia） 在新約出現十五次，其中十次在教牧書信，是這三封信的招牌字。</p>","exp":"<p>「神的僕人，耶穌基督的使徒保羅，憑著神選民的信心與敬虔真理的知識」（1:1）。這封信寫給一個被留下來收拾殘局的同工，一開頭卻不急著談問題，先說寫信的人是誰的僕人。保羅在別的信裡常為自己的使徒權柄辯護，這裡沒有：提多不需要被說服。他只是把自己放在正確的位置上，先是僕人，然後才是使徒。</p><p>更值得注意的是「敬虔真理」這個片語。真理不是一套拿來贏得辯論的知識，它有一個方向：敬虔。克里特的問題，第 1 章下半會說得很清楚，正是知識和生活分了家，「他們說是認識神，行事卻和他相背」（1:16）。<strong>保羅在第一節就埋下解藥：真正的真理，一定往敬虔走。</strong>知道很多卻活不出來的，不是知道得太多，是知道錯了方向。</p><p>這也是全卷「整・教・行」的第一筆。第 1 章是「整」：把斷了的接正。從哪裡接起？不是從規條，也不是從組織，是從「真理」與「敬虔」重新接上。321 說「聖經是我的準則」，在這裡的意思很具體：讀經不是為了多一份資料，是為了讓所知道的變成所活出的。一個人讀了十年聖經，如果家裡的人看不出他更溫柔、更誠實，那麼他讀到的不是「敬虔真理」，只是關於真理的資訊。</p>"},{"a":2,"z":3,"star":3,"grk":"<p lang=\"grc\">ἐπʼ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς πρὸ χρόνων αἰωνίων</p><p lang=\"grc\">ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατʼ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,</p>","lit":"<p>在永遠生命的盼望上；這生命是那無謊言的神在永世的時代以先所應許的，</p><p>他卻在自己所定的時候，藉著宣講顯明了他的道；這宣講是照著神我們救主的命令被託付給我的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐπʼ ἐλπίδι ζωῆς αἰωνίου</td><td>ep' elpidi zōēs aiōniou</td><td>在永生的盼望上</td><td>信心與知識站立的地基</td></tr><tr><td>ὁ ἀψευδὴς θεὸς</td><td>ho apseudēs theos</td><td>那無謊言的神</td><td>ἀψευδὴς 新約只此一次</td></tr><tr><td>πρὸ χρόνων αἰωνίων</td><td>pro chronōn aiōniōn</td><td>在永世的時代以先</td><td>提後 1:9 同一片語</td></tr><tr><td>ἐφανέρωσεν δὲ καιροῖς ἰδίοις</td><td>ephanerōsen de kairois idiois</td><td>卻在自己的時候顯明了</td><td>全卷第一次「顯明」</td></tr><tr><td>ἐν κηρύγματι</td><td>en kērygmati</td><td>在宣講裡</td><td>顯明的方式是傳講</td></tr><tr><td>ὃ ἐπιστεύθην ἐγὼ</td><td>ho episteuthēn egō</td><td>這是我被託付的</td><td>被動：神先信任了保羅</td></tr><tr><td>τοῦ σωτῆρος ἡμῶν θεοῦ</td><td>tou sōtēros hēmōn theou</td><td>神我們救主</td><td>救主追蹤第一站</td></tr></table>","gram":"<p><strong>ὁ ἀψευδὴς θεὸς（ho apseudēs theos）「無謊言的神」，新約只出現這一次。</strong>字由否定前綴 a- 加上 ψεῦδος（謊言）的形容詞構成。來 6:18 說神「決不能說謊」，用的是動詞；這裡把它凝成神的一個稱號。這封信是寫到一個連本地詩人都說 Κρῆτες ἀεὶ ψεῦσται（Krētes aei pseustai） 的地方（1:12）：<strong>第 2 節的 ἀψευδὴς（apseudēs） 與第 12 節的 ψεῦσται（pseustai） 同一個字根，一正一反，刺眼地對照。</strong>保羅先說神是誰，才說克里特人是誰。</p><p>πρὸ χρόνων αἰωνίων（pro chronōn aiōniōn） 怎樣理解，各家有兩種讀法：一說指創世以前，三一神在永恆裡的旨意與應許；一說指「古時」，即神對先祖與先知的應許。提後 1:9 用同一片語說恩典「萬古之先，在基督耶穌裡賜給我們」，那裡顯然指時間開始以前。本講義從前者：應許比時間更早，所以時間不能廢掉它。</p><blockquote><p>1:3 以 δέ（de） 轉折：ἐφανέρωσεν δὲ καιροῖς ἰδίοις（ephanerōsen de kairois idiois）。應許在永恆裡，顯明在歷史裡。這是全卷三次「顯明」的第一次，這裡用 φανερόω（phaneroō），2:11 與 3:4 用 ἐπιφαίνω（epiphainō） 的 ἐπεφάνη（epephanē）。句子到這裡受詞換了：應許的是「永生」，顯明的是「他的道」，方式是 ἐν κηρύγματι（en kērygmati）。ὃ ἐπιστεύθην ἐγὼ（ho episteuthēn egō） 是被動式，ἐγὼ（egō） 特意寫出來加重：「我」被託付了；與 πίστιν（pistin） 同字根，神先「信任」了這個人。最後 τοῦ σωτῆρος ἡμῶν θεοῦ（tou sōtēros hēmōn theou） 稱神為救主，1:4 立刻稱基督為救主：全卷三輪交替的第一輪。</p></blockquote>","exp":"<p>「盼望那無謊言的神在萬古之先所應許的永生」（1:2）。這是本章地勢的山峰。一封寫給常說謊之地的信，在還沒提到任何問題以前，先把一位不說謊的神擺在最前面。舊約早就這樣說：「神非人，必不致說謊」（民 23:19）。可是在克里特，這句話不是教義，是一個新聞：人說的話靠不住，生意靠不住，連宗教也靠不住，可是有一位，他說了的就必成就。</p><p>這位神應許的是「永生」，應許的時間是「萬古之先」。換句話說，在克里特人還沒學會說謊以前，在任何一個人失信以前，神已經定意要給人永生。<strong>人的失信不能使神失信；應許比人的罪更早。</strong>這就是 1:2 帶給谷底的人的盼望：第 1 章後半會一路往下走到 1:16，但這一章的開頭已經先立好一根柱子。</p><p>1:3 說這永生的道「到了日期」才顯明。神不急，也不遲。顯明的方法不是神蹟奇事，是「傳揚的工夫」，是有人開口把福音講出來。保羅說這傳揚的責任「交託了我」，原文是「我被信任了」。一個從前逼迫教會的人，竟然被神信任，這本身就是福音最好的說明：不是保羅配得，是神的憐憫。提多聽到這句話一定明白，他自己被留在克里特，也是同一種被信任。</p><p>1:3 稱神為「我們救主」，1:4 又稱基督為「我們的救主」。保羅不覺得需要解釋：父是救主，子也是救主，救恩的源頭與成就是同一件事。321 說「讓耶穌得榮耀」，起點就在這裡：被信任的人，最該記得的不是自己被選上，而是那位先信任他的神是無謊言的。</p>"},{"a":4,"z":4,"star":1,"grk":"<p lang=\"grc\">Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ σωτῆρος ἡμῶν.</p>","lit":"<p>給提多，照著共同的信心作真兒子的：恩典與平安從父神和基督耶穌我們的救主而來。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τίτῳ γνησίῳ τέκνῳ</td><td>Titō gnēsiō teknō</td><td>給提多，真兒子</td><td>γνησίῳ 與提前 1:2 同字：嫡出的、真的</td></tr><tr><td>κατὰ κοινὴν πίστιν</td><td>kata koinēn pistin</td><td>照著共同的信心</td><td>猶太人與希臘人共有的</td></tr><tr><td>χάρις καὶ εἰρήνη</td><td>charis kai eirēnē</td><td>恩典與平安</td><td>SBLGNT 讀法；RP 加 ἔλεος</td></tr><tr><td>Χριστοῦ Ἰησοῦ τοῦ σωτῆρος ἡμῶν</td><td>Christou Iēsou tou sōtēros hēmōn</td><td>基督耶穌我們的救主</td><td>1:3 稱神為救主，這裡稱基督</td></tr></table>","gram":"<p>收信人只有一句：Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν（Titō gnēsiō teknō kata koinēn pistin）。γνησίῳ（gnēsiō） 是「合法嫡出的、真的」，提前 1:2 稱提摩太時用同一個字。κοινὴν πίστιν（koinēn pistin） 的「共同」很有分量：寫信的是受過割禮的猶太人，收信的是未受割禮的希臘人，他們共有的是同一個信心。和合本開頭的「現在」是小字補的，原文沒有動詞。</p><blockquote><p>◆ 經文鑑別：問安語 SBLGNT 與 WH、Treg、NA28 作 χάρις καὶ εἰρήνη（charis kai eirēnē），和合本「恩惠、平安」依此；RP 作 χάρις ἔλεος εἰρήνη（charis eleos eirēnē），加了「憐憫」，與提前 1:2 相同。後者很可能是抄寫者照提摩太前書與提摩太後書的問安補齊的：抄本傾向把相似的經文改得一樣，不會把三項刪成兩項。本講義從 SBLGNT。兩讀的意思沒有衝突，「憐憫」在 3:5 自己會出來。</p></blockquote>","exp":"<p>〔提前〕提前 1:2（提摩太前書講義第 1 章）</p><p>〔加〕加 2:1--3（加拉太書講義第 2 章）</p><p>「現在寫信給提多，就是照著我們共信之道作我真兒子的」（1:4）。提多是誰？加拉太書告訴我們：「與我同去的提多，雖是希臘人，也沒有勉強他受割禮」（加 2:3）。本系列加拉太書講義第 2 章講過，他是保羅帶上耶路撒冷的活見證，證明外邦人不必先成為猶太人才能得救。</p><p>一個猶太老人叫一個希臘青年「真兒子」，兩人中間沒有血緣，沒有同一個文化，也沒有同一套飲食規矩，卻有「共信之道」。這就是 321 說的「235」的「3」：屬靈父母與屬靈兒女。屬靈的傳承不是複製一個像自己的人，是把同一個信心交到一個和自己很不一樣的人手裡。問安的落點仍在主身上：恩惠、平安「從父神和我們的救主基督耶穌」來，不是從保羅來。</p>"},{"a":5,"z":5,"star":3,"grk":"<p lang=\"grc\">Τούτου χάριν ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,</p>","lit":"<p>為這個緣故，我把你留在克里特，好叫你把那些還缺少的再接正，並且一城一城地設立長老，正如我吩咐了你的：</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τούτου χάριν</td><td>Toutou charin</td><td>為這個緣故</td><td>任務句的開頭</td></tr><tr><td>ἀπέλιπόν σε ἐν Κρήτῃ</td><td>apelipon se en Krētē</td><td>我把你留在克里特</td><td>與 τὰ λείποντα 同字根</td></tr><tr><td>τὰ λείποντα</td><td>ta leiponta</td><td>那些還缺少的</td><td>3:13 λείπῃ 首尾呼應</td></tr><tr><td>ἐπιδιορθώσῃ</td><td>epidiorthōsē</td><td>再接正</td><td>新約只此一次；接骨、修直用語；章題</td></tr><tr><td>καταστήσῃς κατὰ πόλιν πρεσβυτέρους</td><td>katastēsēs kata polin presbyterous</td><td>一城一城地設立長老</td><td>κατὰ πόλιν 是分配用法</td></tr><tr><td>ὡς ἐγώ σοι διεταξάμην</td><td>hōs egō soi dietaxamēn</td><td>正如我吩咐了你的</td><td>ἐγώ 加重：不是提多自己的主意</td></tr></table>","gram":"<p><strong>任務句的動詞 ἐπιδιορθώσῃ（epidiorthōsē） 在新約只出現這一次。</strong>它由 ἐπί（epi）「在上面、再」與 διά（dia）「徹底」兩個介系詞前綴與「弄直」的字根組成，字典形是 ἐπιδιορθόω（epidiorthoō）。這個字族在希臘醫學裡用於把斷骨接正、把脫臼的關節復位，在一般用法裡指修正文稿、把歪了的東西扶直。和合本譯「辦整齊」，原文的畫面更痛：有東西斷了，要重新接上。這是本章的章題。</p><p>保羅在這裡玩了一個字：ἀπέλιπόν σε（我把你留下）……ἵνα τὰ λείποντα ἐπιδιορθώσῃ（好叫你把留下來還缺的接正）。兩個字同出 λείπω（leipō）。全卷最後，3:13 吩咐給西納與亞波羅送行 ἵνα μηδὲν αὐτοῖς λείπῃ（hina mēden autois leipē），「叫他們沒有缺乏」（3:13）：<strong>從「缺」開始，到「不缺」結束。</strong></p><blockquote><p>ἵνα（hina） 帶出兩個不定過去式假設語氣：ἐπιδιορθώσῃ（epidiorthōsē） 與 καταστήσῃς（katastēsēs）。第二件事是第一件事的具體內容：接正的方法是設立長老。κατὰ πόλιν（kata polin） 是分配用法，「一城一城地」，徒 14:23 保羅與巴拿巴也是 κατʼ ἐκκλησίαν（kat' ekklēsian） 設立長老。句尾 ὡς ἐγώ σοι διεταξάμην（hōs egō soi dietaxamēn） 把 ἐγώ（egō） 寫出來加重：提多不是自己發明制度，是照吩咐辦事。</p></blockquote>","exp":"<p>〔背景〕徒 27:7--13（使徒行傳講義第 27 章）</p><p>「我從前留你在克里特，是要你將那沒有辦完的事都辦整齊了，又照我所吩咐你的，在各城設立長老」（1:5）。克里特是地中海東部的大島，古人稱它為「百城之島」。使徒行傳只記保羅以囚犯身分坐船經過，船貼著「克里特背風岸」（徒 27:7）行，停在「佳澳」（徒 27:8，一般譯作美港）；保羅勸他們不要再開船，沒有人聽（徒 27:9--11）。福音或許比保羅更早到這裡：五旬節的聽眾裡有「克里特和阿拉伯人」（徒 2:11）。提多書寫的，很可能是保羅第一次羅馬監禁獲釋以後的一段行程，議題頁再談。</p><p>不論福音何時到，保羅留給提多的局面很清楚：信徒散在各城，聚在一個一個的家裡，卻還沒有長老；有人說虛空話，有人為錢教導，有人把整個家翻倒（1:11）。<strong>不是缺錢，不是缺房子，是缺可以託付的人。</strong>保羅不是叫提多把一切都扛起來，而是叫他在每一座城裡找到可以接手的人。</p><p>「接正斷骨」這幅畫告訴我們兩件事。第一，斷了是真的：克里特的教會有傷，保羅不假裝沒事。第二，接骨不是換一副新骨頭，是把原來的骨頭擺回正確的位置，讓它自己長好。醫生不能替病人長骨頭，只能把它扶正、固定、等候。長老的設立就是那塊夾板：不是要取代神在人身上的工作，是給生命一個可以長直的架構。</p><p>這是 321 說的「建立屬神的體系」最具體的一次。體系不是從一棟建築或一份組織圖開始，是從找到人開始：一城一城、一個家一個家地找。今天國度321空中團契的弟兄姊妹散在各國，也是這個處境：不是缺一個更好的平台，是缺在每一個地方可以被託付的人。而那位託付的，最終不是提多，是「神－我們救主」（1:3）。</p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.</p>","lit":"<p>若有人是無可控告的，一個女人的丈夫，有忠信的兒女，不在放蕩或不服約束的控告之中。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἴ τίς ἐστιν ἀνέγκλητος</td><td>ei tis estin anenklētos</td><td>若有人是無可控告的</td><td>1:6、1:7 兩次；總綱</td></tr><tr><td>μιᾶς γυναικὸς ἀνήρ</td><td>mias gynaikos anēr</td><td>一個女人的丈夫</td><td>提前 3:2 同語；四讀見提前講義</td></tr><tr><td>τέκνα ἔχων πιστά</td><td>tekna echōn pista</td><td>有忠信的兒女</td><td>πιστά 兩讀：信主的／忠實可靠的</td></tr><tr><td>μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα</td><td>mē en katēgoria asōtias ē anypotakta</td><td>不在放蕩或不服約束的控告裡</td><td>解釋 πιστά 的內容</td></tr></table>","gram":"<p>1:5 的目的句到 1:6 突然換成條件句：εἴ τίς ἐστιν ἀνέγκλητος（ei tis estin anenklētos）。保羅沒有說「設立甚麼樣的人」，而是列出條件，條件的總綱就是 ἀνέγκλητος（anenklētos），「沒有人可以正式控告的」，1:7 再重複一次。μιᾶς γυναικὸς ἀνήρ（mias gynaikos anēr） 與提前 3:2 一字不差，本卷不重開這個戰場。</p><blockquote><p>◆ τέκνα ἔχων πιστά（tekna echōn pista） 的 πιστά（pista） 有兩讀。<strong>①「信主的」</strong>：πιστός（pistos） 在新約常指信徒（提前 4:3、10），和合本取這一讀。<strong>②「忠實可靠的、守規矩的」</strong>：πιστός（pistos） 的基本意思是可信、可靠，本卷 1:9 πιστοῦ λόγου（pistou logou）、3:8 Πιστὸς ὁ λόγος（Pistos ho logos） 都作「可信的」；平行的經文只說「使兒女凡事端莊順服」（提前 3:4），沒有要求兒女信主。</p></blockquote><p>決定讀法的，是同句後半的 μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα（mē en katēgoria asōtias ē anypotakta）。這是解釋：πιστά（pista） 的反面是 ἀσωτίας（放蕩，路 15:13 浪子 ἀσώτως（asōtōs） 的同字根）與 ἀνυπότακτα（不服約束）。後半對照的是看得見的行為與名聲。本講義兩讀並陳，不在兩讀之間裁判；主軸落在同句後半的解釋：重點是家中的秩序與名聲。和合本句末「就可以設立」是小字補的。</p>","exp":"<p>「若有無可指責的人，只作一個婦人的丈夫，兒女也是信主的，沒有人告他們是放蕩不服約束的，就可以設立」（1:6）。長老的資格從家裡開始。原因不只是道德上的：當時的教會聚在家裡，一個家就是一個聚會。1:11 說假教師「敗壞人的全家」，長老自己的家就是福音的門面。</p><p>「只作一個婦人的丈夫」有四種讀法，本系列提摩太前書講義第 3 章已經並陳過，本卷不重開戰場；主軸是一心一意對妻子忠誠。</p><p>「兒女也是信主的」需要小心讀。原文的 πιστά（pista） 可以是「信主的」，也可以是「忠實可靠的」；同一句後半的「沒有人告他們是放蕩不服約束的」說明了保羅要看的是甚麼：<strong>一個家有沒有秩序，有沒有在鄰舍面前成為福音的笑柄。</strong>這裡說的是還在父親家中、在他管教之下的兒女。成年兒女不信主，不自動使父親失去資格。信心不能代人決定，父親能負責的是家中的秩序與自己的榜樣，不是兒女內心的回應。這使我們想起：「兒子必不擔當父親的罪孽，父親也不擔當兒子的罪孽」（結 18:20）。</p><p>所以這一節不能被拿來羞辱任何一位為兒女流淚的牧者、長老或父母，講台也不應把任何同工的孩子當作反面例子。這一節真正在問的是：這個人在最近的人面前，是不是一個可信的人？家裡的人看得最清楚，他在聚會裡說的，和他在餐桌上做的，是不是同一回事。這和全卷的病症正好相反：假師傅「說是認識神，行事卻和他相背」（1:16）。長老與假師傅的分界，不在誰講得比較好，在誰的家裡看得見他講的道。</p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,</p>","lit":"<p>因為監督作為神的管家，必須是無可控告的；不自以為是，不易怒，不沉湎於酒，不打人，不貪可恥的利，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>δεῖ γὰρ τὸν ἐπίσκοπον</td><td>dei gar ton episkopon</td><td>因為監督必須</td><td>γὰρ 解釋 1:6；長老＝監督</td></tr><tr><td>ὡς θεοῦ οἰκονόμον</td><td>hōs theou oikonomon</td><td>作為神的管家</td><td>管的是主人的家</td></tr><tr><td>μὴ αὐθάδη</td><td>mē authadē</td><td>不任性</td><td>αὐτός＋「取悅」：自己高興就好</td></tr><tr><td>μὴ ὀργίλον</td><td>mē orgilon</td><td>不暴躁</td><td>容易發怒</td></tr><tr><td>μὴ πάροινον</td><td>mē paroinon</td><td>不因酒滋事</td><td>坐在酒旁邊的人</td></tr><tr><td>μὴ πλήκτην</td><td>mē plēktēn</td><td>不打人</td><td>動手的人</td></tr><tr><td>μὴ αἰσχροκερδῆ</td><td>mē aischrokerdē</td><td>不貪無義之財</td><td>1:11 αἰσχροῦ κέρδους 對照</td></tr></table>","gram":"<p><strong>1:5 說 πρεσβυτέρους（長老），1:7 用 γὰρ（gar） 接著說 τὸν ἐπίσκοπον（監督）。</strong>γὰρ（gar） 表示 1:7 是在解釋 1:6 為甚麼要那樣的條件；換句話說，保羅講的是同一群人。在這一段裡，長老與監督是同一群人的兩個稱呼：「長老」講這個人的成熟與身分，「監督」講他的工作是看顧。徒 20:17 保羅請來以弗所的「長老」，到 20:28 稱他們為「監督」，是另一處同樣的互換。τὸν ἐπίσκοπον（ton episkopon） 是單數帶冠詞，指「任何一位監督」這一類人，不是說每城只有一位。</p><p>接下來是五個 μὴ（mē） 開頭的否定：μὴ αὐθάδη（mē authadē）、μὴ ὀργίλον（mē orgilon）、μὴ πάροινον（mē paroinon）、μὴ πλήκτην（mē plēktēn）、μὴ αἰσχροκερδῆ（mē aischrokerdē）。第一個最耐人尋味。αὐθάδη（authadē） 由 αὐτός（自己）與「取悅」的字根組成，3:3 的 ἡδοναῖς（宴樂）就是那個字根。彼後 2:10 用同一個字形容假師傅 αὐθάδεις（authadeis），「任性」。最後一個 αἰσχροκερδῆ（aischrokerdē） 與 1:11 假師傅的 αἰσχροῦ κέρδους χάριν（aischrou kerdous charin） 刻意對照。</p>","exp":"<p>「監督既是神的管家，必須無可指責，不任性，不暴躁，不因酒滋事，不打人，不貪無義之財」（1:7）。管家的比喻是整節的鑰匙。管家住在主人的家裡，管主人的錢，照顧主人的人，卻沒有一樣是他自己的。保羅在提摩太前書說教會是「神的家」：「在神的家中當怎樣行」（提前 3:15）。監督的權柄是真的，但它是借來的；他不是屋主，是被託付的人。</p><p>所以五個否定的第一個是「不任性」。原文的意思是「自己高興就好」，凡事自己說了算，聽不進別人的話。<strong>一個管家最危險的，不是能力不夠，是忘了這不是他的家。</strong>這正是 321 說的「有己」：把自己放在中心，連服事也成了實現自己的舞台。後面四個否定，暴躁、因酒滋事、打人、貪財，其實都是「任性」長出來的果子：一個不受約束的己，遲早會傷人。</p><p>「不因酒滋事」的問題，本系列提摩太前書講義已有處理，這裡只說一句：經文要防備的是失控，不是在辯論一杯酒。「不貪無義之財」則是真假教師的分水嶺之一：四節之後，保羅說假師傅「因貪不義之財，將不該教導的教導人」（1:11）。看一個教導的人，先看他和錢的關係。</p><p>後來的教會怎樣安排長老與監督，各宗派的體制有不同的發展，議題頁陳列，這裡不爭論。經文的重點不在頭銜，在品格：無論叫甚麼名稱，都是替神管家。</p>"},{"a":8,"z":9,"star":2,"grk":"<p lang=\"grc\">ἀλλὰ φιλόξενον, φιλάγαθον, σώφρονα, δίκαιον, ὅσιον, ἐγκρατῆ,</p><p lang=\"grc\">ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.</p>","lit":"<p>反倒要愛陌生人、愛良善、清醒自守、公義、虔誠、自制，</p><p>緊緊抓住那照著教導而可信的話，好叫他有能力，既在那健康的教訓裡勸勉人，又揭露那些反駁的人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀλλὰ φιλόξενον</td><td>alla philoxenon</td><td>反倒要愛陌生人</td><td>ἀλλὰ 從否定轉正面</td></tr><tr><td>φιλάγαθον</td><td>philagathon</td><td>愛良善</td><td>新約只此一次</td></tr><tr><td>σώφρονα</td><td>sōphrona</td><td>清醒自守</td><td>σώφρων 家族全卷第一次</td></tr><tr><td>ἐγκρατῆ</td><td>enkratē</td><td>自制</td><td>管得住自己</td></tr><tr><td>ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου</td><td>antechomenon tou kata tēn didachēn pistou logou</td><td>緊緊抓住那合乎教導的可信的話</td><td>唯一一條講「道」的資格</td></tr><tr><td>ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ</td><td>en tē didaskalia tē hygiainousē</td><td>在那健康的教訓裡</td><td>ὑγιαίνω：健康；追蹤三第一站</td></tr><tr><td>παρακαλεῖν……ἐλέγχειν</td><td>parakalein……elenchein</td><td>勸勉……揭露</td><td>兩個目的：扶起人，指出錯</td></tr></table>","gram":"<p>1:8 以 ἀλλὰ（alla） 轉向正面，一口氣六個形容詞：φιλόξενον（philoxenon）、φιλάγαθον（philagathon）、σώφρονα（sōphrona）、δίκαιον（dikaion）、ὅσιον（hosion）、ἐγκρατῆ（enkratē）。前兩個都以「愛」的字根起頭：愛陌生人，愛良善。σώφρονα（sōphrona） 是全卷第一次出現 σώφρων（sōphrōn） 家族：清醒、有分寸、管得住自己。第 2 章會把這個字發給老年人、少年婦人、少年人，2:12 再說恩典教我們「自守」：<strong>長老先活出來的，就是全教會後來要學的。</strong></p><blockquote><p>1:9 的分詞 ἀντεχόμενον（antechomenon） 是中間語態，「緊緊抓住、靠著不放」。抓住的是 τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου（tou kata tēn didachēn pistou logou），冠詞與名詞之間夾了一個介系詞片語，原文「可信的話」，和合本譯「真實的道理」。目的句 ἵνα δυνατὸς ᾖ（hina dynatos ē） 帶出兩個不定詞，用 καὶ（kai）……καὶ（kai） 並列：παρακαλεῖν（勸化，站在旁邊扶人）與 ἐλέγχειν（駁倒，把錯誤揭露出來）。工具是 τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ（tē didaskalia tē hygiainousē）：ὑγιαίνω（hygiainō） 是「健康」，1:13 ὑγιαίνωσιν（hygiainōsin）、2:1 都會再出現。保羅把教訓當作醫療：健康的教訓叫人健康。</p></blockquote>","exp":"<p>「樂意接待遠人，好善，莊重，公平，聖潔自持；堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人駁倒了」（1:8--9）。數一數 1:6--9 長老的資格：家庭、品格、自制、待人，幾乎全是生命；只有最後一條「善於勸化與駁倒」是能力。</p><p>這個次序本身就是一個教導。321 說「先生命，再關係，後事工」：先問這個人是誰，再問他怎樣待人，最後才問他能做甚麼。克里特不缺會講話的人，那裡「有許多人不服約束，說虛空話欺哄人」（1:10）；缺的是口裡的道與身上的生命對得起來的人。</p><p>第一個正面資格是「樂意接待遠人」，原文是「愛陌生人」。在一個人人自保、彼此提防的社會，教會的領袖要先打開家門。第二個是「好善」，愛良善：不只是做好事，是喜歡好的事。</p><p>1:9 是唯一一條與「道」有關的資格，而它的動詞是「堅守」：不是發明，不是更新，是抓住已經交下來的。這就是 321 說的「聖經是我的準則」。抓住它的目的有兩面：勸化，是把跌倒的人扶起來；駁倒，是把錯誤的東西揭出來。只會勸不會駁，羊會被狼叼走；只會駁不會勸，羊會被牧人嚇走。保羅把兩件事放在同一句裡，用的是同一個工具：健康的教訓。</p>"},{"a":10,"z":11,"star":2,"grk":"<p lang=\"grc\">Εἰσὶν γὰρ πολλοὶ καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ τῆς περιτομῆς,</p><p lang=\"grc\">οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.</p>","lit":"<p>因為有許多人，而且是不服約束的，說空話的，迷惑心思的，尤其是那些出於割禮的，</p><p>必須堵住他們的口；他們傾覆整個整個的家，為了可恥之利的緣故，教導那不該教的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πολλοὶ καὶ ἀνυπότακτοι</td><td>polloi kai anypotaktoi</td><td>許多人，而且不服約束</td><td>◆ καὶ 有無兩讀</td></tr><tr><td>ματαιολόγοι καὶ φρεναπάται</td><td>mataiologoi kai phrenapatai</td><td>說空話的，欺哄人心的</td><td>φρεναπάται 新約只此一次</td></tr><tr><td>οἱ ἐκ τῆς περιτομῆς</td><td>hoi ek tēs peritomēs</td><td>那出於割禮的</td><td>回指加拉太書的割禮之爭</td></tr><tr><td>οὓς δεῖ ἐπιστομίζειν</td><td>hous dei epistomizein</td><td>必須堵住他們的口</td><td>新約只此一次：給馬套上嚼環</td></tr><tr><td>ὅλους οἴκους ἀνατρέπουσιν</td><td>holous oikous anatrepousin</td><td>把整個整個的家翻倒</td><td>家庭教會的處境</td></tr><tr><td>αἰσχροῦ κέρδους χάριν</td><td>aischrou kerdous charin</td><td>為了可恥之利</td><td>與 1:7 對照</td></tr></table>","gram":"<p>1:10 以 γὰρ（gar） 開頭，解釋為甚麼長老必須能「駁倒」：因為外面真的有人在爭辯。◆ 經文鑑別：SBLGNT 與 RP、NA28 作 πολλοὶ καὶ ἀνυπότακτοι（polloi kai anypotaktoi），「許多人，而且是不服約束的」；WH、Treg 與 NIV 無 καὶ（kai），讀作「許多不服約束的人」。有 καὶ（kai） 的讀法較難（「許多而且」在希臘文也有點不順），抄寫者較可能刪去而不是加上，本講義從 SBLGNT。和合本「許多人不服約束」兩讀都容得下，意思差別不大。</p><p>ἀνυπότακτοι（anypotaktoi） 刻意回扣 1:6 的 ἀνυπότακτα（anypotakta）：長老的兒女不可以是那樣，假師傅卻正是那樣。後面兩個名詞都很少見：ματαιολόγοι（mataiologoi） 是「說空話的」，φρεναπάται（phrenapatai） 是「欺騙心思的」，新約只此一次。</p><blockquote><p>1:11 有一個文字遊戲：οὓς δεῖ ἐπιστομίζειν（必須堵住他們的口）……διδάσκοντες ἃ μὴ δεῖ（教導不必須的）。同一個 δεῖ（dei），一個是神要的，一個是神不要的。ἐπιστομίζειν（epistomizein） 原是給馬套上嚼環、勒住馬口；堵口的工具不是權勢，是 1:9 的「駁倒」。</p></blockquote>","exp":"<p>〔加〕加 2:3--5；加 5:2--6（加拉太書講義第 2、5 章）</p><p>「因為有許多人不服約束，說虛空話欺哄人；那奉割禮的更是這樣」（1:10）。本系列加拉太書講義第 2、5 章講過那場割禮之爭：有人要外邦信徒先受割禮、守猶太規矩，才算完全。到了克里特，這股風又吹來了，1:14 說他們傳「猶太人荒渺的言語」。諷刺的是，被派去處理這件事的提多，自己就是那個沒有受割禮的希臘人。</p><p>「這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家」（1:11）。三個病徵：不服約束、說空話、為錢。「敗壞人的全家」原文是把整個家翻倒。當時一個家就是一個聚會，一個假教師進了一個家，倒下的不是一個人，是一整群人。</p><p>今天的「全家」常常是在網路上被翻倒的：一段影片、一個群組、一個收費的課程，就能把一家人帶離純正的道。保羅的方法值得注意。「堵住」不是拳頭，也不是封殺，而是 1:9 說的「駁倒」：用健康的教訓把錯誤揭露出來。<strong>對付假教訓最好的方法，是把真的講清楚。</strong>這也提醒教導的人先省察自己：「為錢」與「為權」都是有己，在別人身上看得見，在自己身上最容易看不見。</p>"},{"a":12,"z":12,"star":3,"grk":"<p lang=\"grc\">εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·</p>","lit":"<p>他們中間的一個人，他們自己的先知，說過：克里特人總是說謊者，惡毒的野獸，懶惰的肚腹。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἶπέν τις ἐξ αὐτῶν</td><td>eipen tis ex autōn</td><td>他們中間有一個人說過</td><td>不是保羅說的</td></tr><tr><td>ἴδιος αὐτῶν προφήτης</td><td>idios autōn prophētēs</td><td>他們自己的先知</td><td>αὐτῶν 兩次：是他們自己的人</td></tr><tr><td>Κρῆτες ἀεὶ ψεῦσται</td><td>Krētes aei pseustai</td><td>克里特人總是說謊者</td><td>與 1:2 ἀψευδὴς 對照</td></tr><tr><td>κακὰ θηρία</td><td>kaka thēria</td><td>惡毒的野獸</td><td>沒有馴服</td></tr><tr><td>γαστέρες ἀργαί</td><td>gasteres argai</td><td>懶惰的肚腹</td><td>只為肚腹活，卻不肯做工</td></tr></table>","gram":"<p><strong>保羅引的是一句六音步詩行，傳統上歸給克里特本地的詩人厄庇墨尼得斯（Epimenides，主前約 600 年）。</strong>他在古代被視為有預言能力的人，所以保羅說 ἴδιος αὐτῶν προφήτης（idios autōn prophētēs）。主前三世紀的詩人卡利馬科斯在《宙斯頌》裡也用過 Κρῆτες ἀεὶ ψεῦσται（Krētes aei pseustai） 這半句，理由是克里特人聲稱宙斯的墳墓在他們島上。這句話在希臘世界流傳到一個程度，希臘人甚至造了動詞 κρητίζω（krētizō），「像克里特人那樣」，意思就是說謊。</p><blockquote><p>保羅的引法有兩個重點。第一，他兩次強調 αὐτῶν（autōn）：εἶπέν τις ἐξ αὐτῶν（eipen tis ex autōn），ἴδιος αὐτῶν προφήτης（idios autōn prophētēs）。是「他們中間的一個」，是「他們自己的」先知，不是外人的嘲諷。第二，ψεῦσται（pseustai） 與 1:2 的 ἀψευδὴς（apseudēs） 同一字根，一封信的頭和身被這個字根釘在一起。保羅引異教詩人並非僅此一次：在雅典的亞略巴古，他也引希臘詩人的話（徒 17:28）。引用一句話，不等於認可那位詩人的全部，只是承認這句話說中了。</p></blockquote>","exp":"<p>「有克里特人中的一個本地先知說：『克里特人常說謊話，乃是惡獸，又饞又懶。』」（1:12）這是本章最容易被講壞的一節。<strong>它不是保羅在罵一個民族，是一個民族自己的詩人說出的自白，是他們自己承認的病。</strong>保羅引用它，是因為克里特的信徒聽得懂：這是他們從小聽到大的話。</p><p>所以講台絕不可以用這一節對任何族群、地域、國籍的人貼標籤或開玩笑。每一個民族都有自己的詩人說過類似的話，每一個文化都有它自己承認的病；拿別人的病來取笑，正是聖經要醫治的那種驕傲。保羅講到同樣的罪，從來不忘記把自己放進去：「我們從前也是無知、悖逆、受迷惑」（3:3）。</p><p>這一節真正震撼人的地方，是它和全卷結局的距離。就在這樣一個地方，連自己的詩人都說「常說謊話」，保羅說神的恩典要把這群人「特作自己的子民，熱心為善」（2:14）。<strong>神沒有把福音送到最好的地方，而是送到最難的地方。</strong>2:14 那一句是神在西乃山對以色列說的話，如今說給一群克里特的外邦人；第 2 章會講滿。</p><p>「又饞又懶」與全卷的主線正好相反：只為肚腹活、卻不肯做工的人，將被教成「留心做正經事業」（3:8）的人。而這不是因為他們先改好了：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）。321 說「反敗為勝」：克里特就是一個反敗為勝的地方。今天任何一個被貼了標籤、自己也承認有病的地方，都不是福音的終點，而是福音的起點。</p>"},{"a":13,"z":14,"star":1,"grk":"<p lang=\"grc\">ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. διʼ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,</p><p lang=\"grc\">μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.</p>","lit":"<p>這見證是真的。為這個緣故，你要鋒利地揭露他們，好叫他們在信心裡健康，</p><p>不留意猶太人的神話，和那些背離真理之人的誡命。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ μαρτυρία αὕτη ἐστὶν ἀληθής</td><td>hē martyria hautē estin alēthēs</td><td>這見證是真的</td><td>保羅承認病是真的</td></tr><tr><td>ἔλεγχε αὐτοὺς ἀποτόμως</td><td>elenche autous apotomōs</td><td>鋒利地揭露他們</td><td>ἀποτόμως 像刀切下去</td></tr><tr><td>ἵνα ὑγιαίνωσιν ἐν τῇ πίστει</td><td>hina hygiainōsin en tē pistei</td><td>好叫他們在信心裡健康</td><td>目的是醫治</td></tr><tr><td>Ἰουδαϊκοῖς μύθοις</td><td>Ioudaikois mythois</td><td>猶太人的神話</td><td>提前 1:4 μύθοις</td></tr></table>","gram":"<p>1:13 先說 ἡ μαρτυρία αὕτη ἐστὶν ἀληθής（hē martyria hautē estin alēthēs），接著 διʼ ἣν αἰτίαν（di' hēn aitian） 帶出命令：ἔλεγχε αὐτοὺς ἀποτόμως（elenche autous apotomōs）。ἔλεγχε（elenche） 是現在式命令語氣，與 1:9 長老要做的 ἐλέγχειν（elenchein） 同字：提多先做，長老接著做。ἀποτόμως（apotomōs） 的字根是「切下」，林後 13:10 保羅說自己不願「嚴厲」，用的是同一個字。這是外科手術的刀，不是劊子手的刀：緊接著 ἵνα ὑγιαίνωσιν ἐν τῇ πίστει（hina hygiainōsin en tē pistei），目的是「健康」。</p><p>αὐτοὺς（autous） 指誰，有兩種讀法：指 1:10--11 的假師傅，或指被他們影響的克里特信徒。因為目的句說「使他們在真道上純全無疵」，又接著說「不聽」荒渺的言語，本講義認為主要指受影響的信徒，也不排除假師傅本人。</p>","exp":"<p>「這個見證是真的。所以，你要嚴嚴地責備他們，使他們在真道上純全無疵」（1:13）。保羅不粉飾克里特的問題，但他立刻把話轉到目的：純全無疵，原文是「健康」。責備如果不是為了醫治，就只是發洩；嚴厲如果沒有盼望，就只是羞辱。</p><p>保羅要他們「不聽猶太人荒渺的言語和離棄真道之人的誡命」（1:14）。主耶穌也責備過同樣的事：「他們將人的吩咐當作道理教導人」（可 7:7）。人的誡命常常看起來比神的道更嚴格、更屬靈，卻把人帶離真理本身。這是下一段潔淨問題的引子。</p><p>這兩節也給今天處理錯誤的人一個分寸。保羅叫提多「嚴嚴地」責備，卻沒有叫他羞辱、標籤或驅逐；刀要下得準，下刀的目的是叫病人好起來。教會面對偏離的人，常常落在兩個極端：一是怕傷和氣，甚麼都不說，任由病情擴散；一是說得很重，卻忘了說話是為了醫治。保羅的路在中間：說真話，為了使人健康。被責備的人若因此回到健康，責備的人也不該記得自己說得多對，只該記得那位醫治的主。</p>"},{"a":15,"z":15,"star":2,"grk":"<p lang=\"grc\">πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.</p>","lit":"<p>凡物對潔淨的人都是潔淨的；但對那些已被玷污又不信的人，沒有一樣是潔淨的，反倒他們的心思和良心都已被玷污了。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πάντα καθαρὰ τοῖς καθαροῖς</td><td>panta kathara tois katharois</td><td>凡物對潔淨的人都潔淨</td><td>καθαρὰ／καθαροῖς 同字重複</td></tr><tr><td>τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις</td><td>tois de memiammenois kai apistois</td><td>但對已被玷污又不信的人</td><td>完成式分詞：一個狀態</td></tr><tr><td>οὐδὲν καθαρόν</td><td>ouden katharon</td><td>沒有一樣潔淨</td><td>問題不在物</td></tr><tr><td>μεμίανται</td><td>memiantai</td><td>已被玷污了</td><td>完成式：污染已經進了裡面</td></tr><tr><td>ὁ νοῦς καὶ ἡ συνείδησις</td><td>ho nous kai hē syneidēsis</td><td>心思和良心</td><td>和合本「心地和天良」</td></tr></table>","gram":"<p>這一節是一個工整的對比句。前半 πάντα καθαρὰ τοῖς καθαροῖς（panta kathara tois katharois），同一個字根重複，像一句格言；後半用 δέ（de） 轉過來：τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν（tois de memiammenois kai apistois ouden katharon）。兩半都用與格指「對某人來說」：潔不潔淨，取決於看的人、用的人。</p><blockquote><p>最後一句用 ἀλλὰ（alla） 往裡推一層：ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις（alla memiantai autōn kai ho nous kai hē syneidēsis）。μεμιαμμένοις（memiammenois） 與 μεμίανται（memiantai） 都是完成式，表示一個已經形成的狀態。καὶ（kai）……καὶ（kai） 把 νοῦς（心思，和合本「心地」）與 συνείδησις（良心，和合本「天良」）都拉進來：<strong>污穢不在食物上，在心地和天良裡。</strong>這句話的後半是前半的鑰匙；只引前半，就把保羅的意思倒過來了。</p></blockquote>","exp":"<p>〔舊約〕利 11:44--47（利未記講義第 11 章）</p><p>「在潔淨的人，凡物都潔淨；在污穢不信的人，甚麼都不潔淨，連心地和天良也都污穢了」（1:15）。上下文很清楚：1:14 那些「人的誡命」，多半與食物、潔淨條例有關。本系列利未記講義第 11 章講過，舊約的潔淨條例有一個目的：「你們要成為聖潔，因為我是聖潔的」（利 11:44）。它們是一間教室，教以色列分別；不是一張菜單，讓人以此自誇。</p><p>主耶穌把這間教室帶到它的終點：「從外面進去的不能污穢人，惟有從裡面出來的乃能污穢人」（可 7:15）。彼得在約帕也聽見：「神所潔淨的，你不可當作俗物」（徒 10:15）。保羅在 1:15 說的是同一件事：潔淨是心的事，不是食物的事。</p><p>但這一節絕不是「甚麼都可以」的許可證。同一節的後半說，污穢的人「連心地和天良也都污穢了」：當心思被污染、良心被弄髒，再潔淨的東西到他手裡都會變質。<strong>保羅不是在放寬界線，是在把界線從盤子移到心裡。</strong>心裡的界線比盤子上的更嚴：一個人可以吃得很「潔淨」，心卻充滿論斷；也可以拿「凡物都潔淨」當藉口，其實是良心早已麻木。兩種人都不在保羅說的「潔淨的人」裡面。</p><p>這也是全卷恩典與善行這條線的第一個警告：恩典不是兩極的任何一端，不是用規條換取潔淨，也不是用自由掩護放縱。下一節會說出這種心的外在結果。</p>"},{"a":16,"z":16,"star":3,"grk":"<p lang=\"grc\">θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.</p>","lit":"<p>他們宣認認識神，卻用行為否認他；他們是可憎的、不順從的，對一切善工都是驗不過的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>θεὸν ὁμολογοῦσιν εἰδέναι</td><td>theon homologousin eidenai</td><td>他們宣認認識神</td><td>口裡的告白</td></tr><tr><td>τοῖς δὲ ἔργοις ἀρνοῦνται</td><td>tois de ergois arnountai</td><td>卻用行為否認</td><td>ὁμολογέω 與 ἀρνέομαι 正面相對</td></tr><tr><td>βδελυκτοὶ</td><td>bdelyktoi</td><td>可憎惡的</td><td>新約只此一次</td></tr><tr><td>ἀπειθεῖς</td><td>apeitheis</td><td>不順從的、悖逆的</td><td>3:3 同一個字形</td></tr><tr><td>πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι</td><td>pros pan ergon agathon adokimoi</td><td>對一切善工都驗不過</td><td>3:1 同一個片語翻轉</td></tr></table>","gram":"<p>全節的骨架是一個 δέ（de） 的對比：θεὸν ὁμολογοῦσιν εἰδέναι（theon homologousin eidenai），τοῖς δὲ ἔργοις ἀρνοῦνται（tois de ergois arnountai）。ὁμολογοῦσιν（homologousin） 是公開的告白，ἀρνοῦνται（arnountai） 是公開的否認；兩個都是現在式，同時發生、持續發生。受詞 θεὸν（theon） 放在句首加重：他們要的就是「認識神」這個名聲。工具與格 τοῖς δὲ ἔργοις（tois de ergois） 是全卷「善工」這條線的起點。</p><blockquote><p>接著三個形容詞：βδελυκτοὶ（可憎惡的）、ἀπειθεῖς（不順從的）、ἀδόκιμοι（驗不過的，指試不過的金屬、不足重的錢幣）。<strong>ἀπειθεῖς（apeitheis） 與「我們從前也是無知、悖逆」（3:3）是同一個字形。</strong>1:16 說「他們」，3:3 說「我們從前也是」，這是全卷最深的伏筆。另一個呼應更工整：1:16 πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι（pros pan ergon agathon adokimoi），3:1 πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους（pros pan ergon agathon hetoimous）：同一個片語，從「驗不過」變成「預備好」。</p></blockquote>","exp":"<p>「他們說是認識神，行事卻和他相背；本是可憎惡的，是悖逆的，在各樣善事上是可廢棄的」（1:16）。這是全卷地勢的最低點。假師傅的病不在口才，不在知識，在行事。他們談神談得很多，生活卻在每一天否認他。約翰說得更直接：「我們若說是與神相交，卻仍在黑暗裡行，就是說謊話」（約壹 1:6）。</p><p>口與行分家的根在哪裡？在 1:7 那個「任性」：自己說了算。一個以自己為中心的人，會用神的名掩護自己的路，用屬靈的話包裝自己的利益（1:11）。321 說「有己」，這裡是它最成熟的樣子：不是不信神，是把神當作自己的招牌。回到本位的人，口與行才會重新合一。</p><p>這一節也不是只寫給假師傅的。任何一個會講道理、會用屬靈詞彙的人，都可能慢慢活成這個樣子：在聚會裡說得很好，在家裡、在職場卻是另一個人。保羅用的試金石很簡單，就是「善事」：不是看一個人說了甚麼，是看他留下甚麼。</p><p>「可廢棄的」原文是「驗不過的」，像一枚放上天平就露出原形的錢幣。可是第 1 章不停在這裡。保羅在 3:1 用同一個片語提醒克里特的信徒，要「預備行各樣的善事」（3:1）；在 3:3 他更說：「我們從前也是無知、悖逆」（3:3）。<strong>1:16 的「他們」，到 3:3 成了「我們」。</strong>保羅沒有站在高處指著克里特人，他承認自己也曾在那裡。</p><p>從谷底怎樣上來？答案不在第 1 章，在第 2、3 章的兩次「顯明」。不是靠更努力地行善：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）；也不是有了恩典就不必改變：恩典顯明出來，正是要「教訓我們」（2:12）。這一章停在谷底，卻不停在絕望，因為它的開頭已經說過：應許永生的，是那無謊言的神（1:2）。</p>"}],"2":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.</p>","lit":"<p>但你，要講那些與健康的教訓相稱的事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Σὺ δὲ</td><td>Sy de</td><td>但你</td><td>與 1:10--16 的假師傅對照</td></tr><tr><td>λάλει</td><td>lalei</td><td>要講</td><td>現在式命令：一直講下去</td></tr><tr><td>ἃ πρέπει</td><td>ha prepei</td><td>那些相稱的事</td><td>合宜、配得上</td></tr><tr><td>τῇ ὑγιαινούσῃ διδασκαλίᾳ</td><td>tē hygiainousē didaskalia</td><td>那健康的教訓</td><td>ὑγιαίνω 是醫學的字：健康</td></tr></table>","gram":"<p><strong>2:1 用一個 Σὺ δὲ（Sy de） 轉了方向。</strong>Σὺ（Sy） 是加重的「你」，希臘文動詞本來已經含著人稱，再寫出代名詞，就是要對照。對照的是誰？是 1:10--16 那些「不服約束，說虛空話欺哄人」的人。他們說是認識神，行事卻和他相背；提多要講的，是另一種東西。δὲ（de） 把兩群人分開：那邊是病，這邊是藥。</p><p>λάλει（lalei） 是現在式命令語氣，不是講一次就算，是持續地講。ἃ πρέπει（ha prepei） 直譯「那些相稱的事」：πρέπει（prepei） 是「合身、合宜」，像一件衣服配得上穿的人。τῇ ὑγιαινούσῃ διδασκαλίᾳ（tē hygiainousē didaskalia） 在教牧書信反覆出現（1:9；提前 1:10），ὑγιαίνω（hygiainō） 是醫生用的字，「健康、無病」。保羅不是只要提多講「對」的道理，是講「健康」的道理；而 2:2 馬上用同一個字形容老年人的信心，2:8 又用 ὑγιῆ（hygiē） 形容提多的言語。健康的教訓，要長出健康的人。</p>","exp":"<p>第 1 章收在全卷最低的地方：「他們說是認識神，行事卻和他相背」（1:16）。病況診斷完了，第 2 章開出處方。處方的第一句很短：「但你所講的總要合乎那純正的道理。」（2:1）</p><p>「合乎」兩個字值得停一下。保羅在這一章沒有給提多一套新的教義，他接下去講的全是生活：老年人怎樣、老年婦人怎樣、少年婦人怎樣、少年人怎樣、僕人怎樣。也就是說，「合乎純正的道理」不只是講台上的內容正確，而是講出來的道理要配得上一種活法。教義與生活之間有一條線，這一節就是那條線的開頭。</p><p>克里特的假師傅「敗壞人的全家」（1:11），他們的教訓讓一個家生病。保羅的處方也從家開始：2:2--10 一連五種人，正好是當時一個家庭聚會裡會坐在一起的人。健康的道理，第一個被檢驗的地方不是神學院，是飯桌。</p><p>今天的提多也一樣。網路上充滿了說得很漂亮、卻叫人越聽越病的話；牧者與小組長不必跟每一個聲音辯論，卻必須持續地講那叫人健康的道。321 說「聖經是我的準則」，這一節替它加了一個字：準則不只量出對錯，也量出健康與否。一個人聽道以後是更會挑剔別人，還是更像基督，就是體溫計。</p>"},{"a":2,"z":2,"star":1,"grk":"<p lang=\"grc\">πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.</p>","lit":"<p>年長的男人要清醒、端莊、心思健全，在信心上、在愛心上、在忍耐上都健康；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>πρεσβύτας</td><td>presbytas</td><td>年長的男人</td><td>不是 1:5 的「長老」πρεσβυτέρους</td></tr><tr><td>νηφαλίους</td><td>nēphalious</td><td>清醒、有節制</td><td>原指不醉酒</td></tr><tr><td>σεμνούς</td><td>semnous</td><td>端莊</td><td>叫人尊重的樣子</td></tr><tr><td>σώφρονας</td><td>sōphronas</td><td>自守</td><td>σώφρων：心思健全、有分寸</td></tr><tr><td>ὑγιαίνοντας</td><td>hygiainontas</td><td>健康的</td><td>與 2:1 同字</td></tr></table>","gram":"<p>2:2 沒有主要動詞，πρεσβύτας（presbytas） 是受格，承接 2:1 的 λάλει（lalei）：「你要講……老年人要如此」。和合本補了「勸」字。πρεσβύτας（presbytas） 是年長的男人，與 1:5 的 πρεσβυτέρους（長老，一個職分）字根相同而意思不同，這裡講的是年齡，不是職分。</p><p>前三個形容詞都是教牧書信的品格字：νηφαλίους（nēphalious） 與 σώφρονας（sōphronas） 在提前 3:2 的監督資格裡出現，σεμνούς（semnous） 則是提前 3:8 對執事的要求。好像保羅說：每一位老弟兄，都該有同工的樣子。最後一個是分詞 ὑγιαίνοντας（hygiainontas），又接回 2:1 的「健康」，後面跟著三個帶冠詞的與格：τῇ πίστει（tē pistei）、τῇ ἀγάπῃ（tē agapē）、τῇ ὑπομονῇ（tē hypomonē）。</p>","exp":"<p>「勸老年人要有節制、端莊、自守，在信心、愛心、忍耐上都要純全無疵。」（2:2）保羅沒有叫老年人去做大事，他要他們健康。年紀大的人最容易得的病，不一定在身體，常常在心裡：苦毒、固執、愛回憶當年。</p><p>這三樣德行很像帖前 1:3 的信、愛、望：「因信心所做的工夫，因愛心所受的勞苦，因盼望我們主耶穌基督所存的忍耐」（帖前 1:3）。這使我們想起，那裡的「盼望」到了這裡換成了「忍耐」。也許這正是老年人的樣子：盼望在漫長的歲月裡，長成了能夠等的忍耐。</p><p>一個教會的空氣，常常是老弟兄定的。他們清醒，年輕人就有榜樣；他們健康，下一代就知道信主幾十年以後可以是甚麼樣子。反過來，一位老弟兄若在會議上說話尖刻、在群組裡動不動就翻舊帳，年輕人學到的不是經歷，是心寒。保羅要的「純全無疵」，原文就是「健康」：信得健康、愛得健康、等得健康。</p>"},{"a":3,"z":3,"star":2,"grk":"<p lang=\"grc\">Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,</p>","lit":"<p>年長的婦人也照樣，舉止要像在聖殿事奉的人，不作毀謗者，也不被許多酒奴役，要作教美善的老師，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πρεσβύτιδας ὡσαύτως</td><td>Presbytidas hōsautōs</td><td>老年婦人也照樣</td><td>ὡσαύτως 把她們與 2:2 並列</td></tr><tr><td>ἐν καταστήματι ἱεροπρεπεῖς</td><td>en katastēmati hieroprepeis</td><td>舉止像在聖殿事奉的</td><td>新約只此一次</td></tr><tr><td>μὴ διαβόλους</td><td>mē diabolous</td><td>不毀謗人</td><td>與「魔鬼」同一個字</td></tr><tr><td>οἴνῳ πολλῷ δεδουλωμένας</td><td>oinō pollō dedoulōmenas</td><td>被許多酒奴役</td><td>完成式分詞：成了癮</td></tr><tr><td>καλοδιδασκάλους</td><td>kalodidaskalous</td><td>教美善的老師</td><td>新約只此一次</td></tr></table>","gram":"<p><strong>ὡσαύτως（hōsautōs）「照樣」是這一章的接榫字。</strong>2:3 與 2:6 各用一次，把老年婦人、少年人與 2:2 的老年人放在同一條線上：同樣的福音，臨到每一種人。</p><p>ἱεροπρεπεῖς（hieroprepeis） 由 ἱερός（神聖的）與 πρέπω（相稱）合成，與 2:1 的 πρέπει（prepei） 同字根：2:1 說教訓要相稱，2:3 說老姊妹的舉止也要相稱，相稱於一個在聖殿裡事奉的人。μὴ διαβόλους（mē diabolous） 用的正是 διάβολος（diabolos），「魔鬼、毀謗者」；保羅在提前 3:11 對「女執事」（另一讀法作執事的妻子）也有同樣要求。δεδουλωμένας（dedoulōmenas） 是完成式被動分詞，「已經被奴役」：不是偶爾喝一杯，是被酒管住了。最後的 καλοδιδασκάλους（kalodidaskalous） 是全段的轉折，前面三樣都是「不要」，這一樣是「要」，而且它引出 2:4 的 ἵνα（hina）。</p>","exp":"<p>「又勸老年婦人，舉止行動要恭敬，不說讒言，不給酒作奴僕，用善道教訓人」（2:3）。保羅給老姊妹的形容很美：她們的一舉一動，像祭司在聖殿裡事奉。這不是說她們要擺出宗教的樣子，是說她們整個人的生活本身就是敬拜。廚房、菜市場、照顧孫子，都可以是殿。</p><p>接著兩個「不」很實際。說讒言與酗酒，在當時是對年長婦人常見的取笑；保羅不取笑，他直說：舌頭可以做魔鬼的工。一句「我只是關心她」的話，傳到第三個人耳朵裡，就成了毀謗。被酒奴役也一樣，不只是酒，任何叫人離不開的東西都是。這一節讓我們看見，老年人並不是自動成熟，老也需要被恩典教。</p><p>最後一個字最重要：「用善道教訓人」。新約只有這裡出現這個字，直譯是「教美善的老師」。保羅沒有叫老年婦人退休，他給了她們一個職分。她們的課堂不一定在講台上，常在客廳、在病床邊、在一通深夜的電話裡。一個教會若只讓年長的姊妹負責煮飯，卻沒有讓她們教，就浪費了神給這個家的老師。被恩典教過的人，才教得出美善；這也是 2:12 要說的：教人的，先被教。</p>"},{"a":4,"z":5,"star":3,"grk":"<p lang=\"grc\">ἵνα σωφρονίζωσι τὰς νέας φιλάνδρους εἶναι, φιλοτέκνους,</p><p lang=\"grc\">σώφρονας, ἁγνάς, οἰκουργούς ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.</p>","lit":"<p>好使她們叫年輕的婦人懂得分寸：要愛丈夫、愛兒女，</p><p>心思健全、純潔、在家勤勞作工、良善，順服自己的丈夫，免得神的道被毀謗。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἵνα σωφρονίζωσι</td><td>hina sōphronizōsi</td><td>好使她們懂分寸</td><td>使人清醒、懂分寸</td></tr><tr><td>τὰς νέας</td><td>tas neas</td><td>那些年輕婦人</td><td>目標是她們</td></tr><tr><td>φιλάνδρους</td><td>philandrous</td><td>愛丈夫的</td><td>phil- 字：可以教的愛</td></tr><tr><td>φιλοτέκνους</td><td>philoteknous</td><td>愛兒女的</td><td>phil- 字成對</td></tr><tr><td>οἰκουργούς</td><td>oikourgous</td><td>在家作工的</td><td>◆ RP 作 οἰκουρούς「看守家的」</td></tr><tr><td>ἀγαθάς</td><td>agathas</td><td>良善的</td><td>追蹤二：善</td></tr><tr><td>ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν</td><td>hypotassomenas tois idiois andrasin</td><td>順服自己的丈夫</td><td>多讀作中間語態：自己甘心擺上</td></tr><tr><td>ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται</td><td>hina mē ho logos tou theou blasphēmētai</td><td>免得神的道被毀謗</td><td>目的朝外</td></tr></table>","gram":"<p><strong>2:4 的 ἵνα（hina） 說明老年婦人「教」的內容。</strong>σωφρονίζωσι（sōphronizōsi） 是 σώφρων（sōphrōn） 家族的動詞，「使人心思健全、懂分寸」。少年婦人不是被管束的對象，是被帶領的學生。下面六個形容詞，兩兩成組，再加一個分詞，一共七樣：φιλάνδρους（
