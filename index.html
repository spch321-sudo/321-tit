philandrous） 與 φιλοτέκνους（philoteknous） 都以 phil- 開頭，是一對愛；σώφρονας（sōphronas） 與 ἁγνάς（hagnas） 是一對品格；οἰκουργούς（oikourgous） 與 ἀγαθάς（agathas） 是一對在家的樣子；最後是分詞 ὑποτασσομένας（hypotassomenas） 與目的子句。</p><blockquote><p>◆ 經文鑑別 2:5：SBLGNT、WH、Treg、NA28 作 οἰκουργούς（oikourgous），「在家作工的」；RP 所根據的拜占庭抄本多數作 οἰκουρούς（oikourous），「看守家的、待在家裡的」。兩字只差一個字母。οἰκουργούς（oikourgous） 在希臘文獻裡極少見，抄寫的人較可能把罕見字改成常見字，而不是反過來；最早的抄本也支持它。本講義從 SBLGNT。和合本譯「料理家務」，與 οἰκουργούς（oikourgous） 相合。這個字的重點是「作工」——勤勞，不懶惰；它不是「禁足在家」，不能拿來禁止姊妹出外工作或服事。箴言末章那位才德的婦人，正是一面管家、一面做買賣的人。</p></blockquote><p>ὑποτασσομένας（hypotassomenas） 是現在式分詞，形式上中間語態與被動語態相同，這裡多數解經家讀作中間語態，「把自己放在……之下」，是自己甘心的擺上，不是被人壓下去。τοῖς ἰδίοις ἀνδράσιν（tois idiois andrasin） 限定了對象：「自己的」丈夫，不是所有男人。最後的 ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται（hina mē ho logos tou theou blasphēmētai） 是整串清單的目的：免得神的道被毀謗。βλασφημῆται（blasphēmētai） 是「褻瀆」的字，提前 6:1 對僕人也用了同一個目的。</p>","exp":"<p>「好指教少年婦人，愛丈夫，愛兒女，謹守，貞潔，料理家務，待人有恩，順服自己的丈夫，免得神的道理被毀謗。」（2:4--5）這兩節要先看清楚是誰在教誰。保羅沒有叫提多去教少年婦人，他叫老年婦人去教。一個男傳道人在克里特的家庭聚會裡挨家指導少婦，會有多少不便，保羅很清楚。他把這份工作交給有經歷的姊妹：屬靈母親帶屬靈女兒，這是世代接棒。</p><p>「愛丈夫，愛兒女」原文是兩個 phil- 字，親情的愛。我們常以為這種愛是天生的，保羅卻說它可以「教」。新婚的妻子不一定知道怎樣愛一個疲倦的丈夫，初為人母的不一定知道怎樣愛一個整夜哭的嬰孩。愛是學會的，而且最好從一個走過這條路的人身上學。</p><p>「順服自己的丈夫」要和最後一句一起讀：「免得神的道理被毀謗」（2:5）。順服的目的是朝外的，為的是福音的名聲，不是為了丈夫的權力。保羅只對妻子說話，沒有一句授權丈夫拿這節去要求妻子；以弗所書講義第 5 章講過，同一位保羅也說「又當存敬畏基督的心，彼此順服」（弗 5:21）。誰拿這節去管人，誰就離開了本位。</p><p><strong>家暴不在順服的範圍。</strong>一位妻子若人身安全受到威脅，聖經沒有叫她忍耐，教會也不可以這樣勸她。先保護生命、離開危險、依法求助；教會要陪她通報、找到安全的地方。叫受暴力的妻子留下來忍，不會使神的道理得榮耀，反而正是讓神的道理被毀謗。彼得前書講義立場三對此已有完整的處理。</p><p>回到克里特：一個「常說謊話」的社會裡，一群妻子愛家、勤勞、良善，鄰舍就看見福音不是空話。這不是要姊妹證明自己夠好，是她們的家成了福音的櫥窗。</p>"},{"a":6,"z":6,"star":1,"grk":"<p lang=\"grc\">Τοὺς νεωτέρους ὡσαύτως παρακάλει σωφρονεῖν·</p>","lit":"<p>年輕的男人，你也照樣要勸他們心思健全；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τοὺς νεωτέρους</td><td>Tous neōterous</td><td>那些較年輕的</td><td>年輕的男人</td></tr><tr><td>ὡσαύτως</td><td>hōsautōs</td><td>照樣</td><td>與 2:3 同一個接榫字</td></tr><tr><td>παρακάλει</td><td>parakalei</td><td>要勸</td><td>現在式命令</td></tr><tr><td>σωφρονεῖν</td><td>sōphronein</td><td>要有分寸</td><td>σώφρων 家族第五次</td></tr><tr><td>σωφρόνως</td><td>sōphronōs</td><td>有分寸地</td><td>2:12 恩典的教導</td></tr></table>","gram":"<p>2:6 是全段最短的一節，給少年人只有一個字：σωφρονεῖν（sōphronein）。這個 σώφρων（sōphrōn） 家族在本卷出現六次：1:8 σώφρονα（監督）、2:2 σώφρονας（老年人）、2:4 σωφρονίζωσι（老年婦人教導）、2:5 σώφρονας（少年婦人）、2:6 σωφρονεῖν（少年人）、2:12 σωφρόνως（恩典教訓我們眾人）。從長老到少年人，從人的勸勉到恩典的教導，同一個字串起整卷書。它的字根是「心思」，σώφρων（sōphrōn） 就是心思保持完整、沒有被沖散的人。παρακάλει（parakalei） 是現在式命令語氣，提多要不斷地勸。</p>","exp":"<p>「又勸少年人要謹守。」（2:6）保羅對老年人說了一串，對少年婦人說了七樣，對少年人只說一個字。不是少年人不重要，是這一個字已經包括了一切。σώφρων（sōphrōn） 很難翻，「自守、謹守、有節制」都只譯出了一面。它的意思是心思健全：知道自己是誰、知道分寸在哪裡、不被衝動牽著走。</p><p>這個字是本卷最有特色的品格字。克里特的病是「又饞又懶」，是被慾望拉著走；σώφρων（sōphrōn） 正是解藥。有趣的是，2:7 緊接著說「你自己」：勸少年人的話一說完，就轉到提多身上（經文沒有說提多幾歲，但這個轉折很自然地把他和少年人放在一起）。他勸別人有分寸，自己就得先成為那個樣子。</p><p>年輕人的分寸，今天常在手機上被試驗：一則訊息要不要回、一句話要不要轉、一個晚上要不要滑到天亮。有分寸不是壓抑，是心裡清醒，知道哪些事值得、哪些事不值得。這份清醒不是靠意志咬牙撐出來的，2:12 會說，它是恩典教出來的。</p>"},{"a":7,"z":8,"star":2,"grk":"<p lang=\"grc\">περὶ πάντα σεαυτὸν παρεχόμενος τύπον καλῶν ἔργων, ἐν τῇ διδασκαλίᾳ ἀφθορίαν σεμνότητα</p><p lang=\"grc\">λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων λέγειν περὶ ἡμῶν φαῦλον.</p>","lit":"<p>在一切事上，把你自己呈現為美好行為的模子；在教訓上要不敗壞、端莊，</p><p>話語健康、無可指摘，好叫那從對面來的人羞愧，沒有甚麼關於我們的壞事可說。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>περὶ πάντα</td><td>peri panta</td><td>在一切事上</td><td>不分場合</td></tr><tr><td>σεαυτὸν παρεχόμενος</td><td>seauton parechomenos</td><td>把你自己呈現出來</td><td>反身代名詞：你自己</td></tr><tr><td>τύπον καλῶν ἔργων</td><td>typon kalōn ergōn</td><td>美好行為的模子</td><td>提前 4:12 同字</td></tr><tr><td>ἀφθορίαν</td><td>aphthorian</td><td>不敗壞、正直</td><td>◆ RP 作 ἀδιαφθορίαν</td></tr><tr><td>λόγον ὑγιῆ ἀκατάγνωστον</td><td>logon hygiē akatagnōston</td><td>健康、無可指摘的話</td><td>接回 2:1</td></tr><tr><td>ἐντραπῇ</td><td>entrapē</td><td>轉過頭來看自己</td><td>自覺羞愧</td></tr><tr><td>περὶ ἡμῶν</td><td>peri hēmōn</td><td>關於我們</td><td>不是「你」，是「我們」</td></tr></table>","gram":"<p>2:7--8 仍是同一句話，主幹是分詞 παρεχόμενος（parechomenos），掛在 2:6 的 παρακάλει（parakalei） 底下：你勸少年人的同時，自己要做出樣子。σεαυτὸν（seauton） 放在前面，加重「你自己」。τύπον（typon） 本是打下去留下的印記、模子；提前 4:12 保羅對提摩太說 τύπος γίνου τῶν πιστῶν（typos ginou tōn pistōn），同一個字。</p><blockquote><p>◆ 經文鑑別 2:7：SBLGNT 作 ἀφθορίαν（aphthorian），「不敗壞、純正」；RP 作 ἀδιαφθορίαν（adiaphthorian），意思相近，又在 σεμνότητα（semnotēta） 後加 ἀφθαρσίαν（aphtharsian），「不朽壞」。ἀφθορίαν（aphthorian） 是新約僅見的字，抄寫的人容易換成較熟悉的字形，再加上一個意思相近的字補強；較短而較難的讀法較可能是原文。本講義從 SBLGNT。兩種讀法的意思沒有實質差別：教訓本身沒有被腐蝕。</p></blockquote><p>2:8 的 ἵνα（hina） 說出目的：ὁ ἐξ ἐναντίας（ho ex enantias），「從對面來的那個人」，就是反對者。ἐντραπῇ（entrapē） 原意是「轉過來」，反對的人找不到把柄，只好轉頭看看自己。注意 περὶ ἡμῶν（peri hēmōn）：保羅說的是「我們」的不是，不是「你」的不是。一個人的言行，牽連整個群體。</p>","exp":"<p>〔提前〕提前 4:12（提摩太前書講義第 4 章）</p><p>「你自己凡事要顯出善行的榜樣；在教訓上要正直、端莊，言語純全，無可指責」（2:7--8）。保羅對每一種人都說了話，最後轉向提多自己。這是全章最尖銳的一句：叫別人有分寸很容易，自己做出樣子很難。</p><p>提摩太前書講義第 4 章講過，保羅對提摩太說「不可叫人小看你年輕」（提前 4:12），又說要「作信徒的榜樣」（提前 4:12）。提多書沒有提到提多的年紀，可是對這兩位同工，保羅給的是同一張藥方：權柄不靠年紀，也不靠出身，靠樣子。提多是一個未受割禮的希臘人，在一群「奉割禮的」教師中間站講台，他的資格常會被質疑。保羅沒有叫他去證明自己的血統，叫他活出樣子。</p><p>「叫那反對的人，既無處可說我們的不是，便自覺羞愧」（2:8）。保羅不期待反對的人消失，他期待他們找不到話說。這是在網路時代也很合用的態度：不必每一則批評都回應，讓生活本身成為回答。而且失敗的代價不是一個人的：傳道人倒下，外人說的是「他們那些基督徒」。</p><p>321 的 920 在這裡被認出來：在每一個「2」面前，活出看得見的樣子。榜樣不是表演，表演只撐得過一場聚會；榜樣是「凡事」，連沒人看見的時候也一樣。提多的榜樣也不是他自己的，2:14 會說，那是照著一位「為我們捨了自己」的主。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,</p><p lang=\"grc\">μὴ νοσφιζομένους, ἀλλὰ πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.</p>","lit":"<p>奴隸們要在一切事上順服自己的主人，要討他們喜歡，不頂嘴，</p><p>不私自挪用，而要顯出全然美好的信實，好叫他們在一切事上妝飾我們救主神的教訓。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Δούλους</td><td>Doulous</td><td>奴隸們</td><td>δοῦλος：不是今天的受僱員工</td></tr><tr><td>ἰδίοις δεσπόταις</td><td>idiois despotais</td><td>自己的主人</td><td>與 2:5 τοῖς ἰδίοις 同樣限定</td></tr><tr><td>μὴ ἀντιλέγοντας</td><td>mē antilegontas</td><td>不頂嘴</td><td>1:9 爭辯的人同字</td></tr><tr><td>μὴ νοσφιζομένους</td><td>mē nosphizomenous</td><td>不私自挪用</td><td>徒 5:2 亞拿尼亞同字</td></tr><tr><td>πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν</td><td>pasan pistin endeiknymenous agathēn</td><td>顯出全然美好的信實</td><td>πίστιν 就是「信心」的字</td></tr><tr><td>κοσμῶσιν</td><td>kosmōsin</td><td>妝飾、裝扮</td><td>κοσμέω：cosmetics 的字根</td></tr></table>","gram":"<p>2:9--10 的句法照 2:2 的樣式：受格 Δούλους（Doulous） 加不定詞 ὑποτάσσεσθαι（hypotassesthai），仍承接 2:1 的 λάλει（lalei），和合本補「勸」字（小字）。接著一正二反一正：εὐαρέστους εἶναι（討喜歡）、μὴ ἀντιλέγοντας（不頂撞）、μὴ νοσφιζομένους（不私拿）、ἀλλὰ πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν（顯出全然美好的信實）。ἀντιλέγοντας（antilegontas） 與 1:9 τοὺς ἀντιλέγοντας（tous antilegontas） 同字；νοσφιζομένους（nosphizomenous） 與徒 5:2 亞拿尼亞「私自留下」的 ἐνοσφίσατο（enosphisato） 同字。πίστιν（pistin） 在這裡是「信實、忠誠」，與「信心」是同一個字。</p><p><strong>2:10 的目的子句是全段的高點。</strong>ἵνα τὴν διδασκαλίαν τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν（hina tēn didaskalian tēn tou sōtēros hēmōn theou kosmōsin en pasin）。κοσμῶσιν（kosmōsin） 是 κοσμέω（kosmeō），「整理、妝飾、裝扮」，英文 cosmetics 由此而來；和合本譯「尊榮」，意思是讓那道顯得美。τοῦ σωτῆρος ἡμῶν θεοῦ（tou sōtēros hēmōn theou）「我們救主－神」是本卷的追蹤字，1:3 稱神為救主，1:4 稱基督為救主；到了 2:10 稱神，2:13 又稱基督，交替前進。ἐν πᾶσιν（en pasin） 首尾呼應：2:9 凡事順服，2:10 凡事妝飾。</p>","exp":"<p>「勸僕人要順服自己的主人，凡事討他的喜歡，不可頂撞他，不可私拿東西，要顯為忠誠，以致凡事尊榮我們救主－神的道。」（2:9--10）先把字看清楚：δοῦλος（doulos） 是奴隸，在法律上屬於主人，不是今天簽合約、領薪水、可以辭職的員工。</p><p><strong>新約並不為奴隸制背書。</strong>同一位保羅把「搶人口」（提前 1:10）列在違背純正道理的罪中；他勸奴隸能得自由就去求自由（林前 7:21），又請腓利門收回阿尼西謀「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）。保羅在這裡不是在評價制度，是在對一群身在制度裡、沒有選擇的弟兄姊妹說話：你們今天怎樣活，才能讓福音被看見？</p><p>他的答案出人意外：一個奴隸的忠誠，可以替神的道「化妝」。在一個奴隸常被看為偷懶、愛偷東西的社會，一個不私拿、不頂嘴、值得信任的奴隸，讓主人第一次想問：這是甚麼樣的神，能把人變成這樣？最卑微的身份，成了福音最亮的櫥窗。這叫每一個覺得自己「位置太低」的人知道，沒有一個位置低到不能榮耀神。</p><p>應用到今天的職場要非常小心。這兩節的重點是「顯為忠誠」——忠誠是品格，不是無條件服從。它不用來要求員工忍受剝削、霸凌、欠薪或違法的命令；這些是不公義，聖經從來不替它們說話。今天的弟兄姊妹有勞動法、有申訴管道、有離職的自由，使用它們不違背 2:9。要做的是另一件事：在可以偷懶的地方不偷懶，在可以多報的地方不多報。321 說「人比事重要，關係比東西重要」，在辦公室裡，每一段關係都是福音的櫥窗。</p>"},{"a":11,"z":12,"star":3,"grk":"<p lang=\"grc\">Ἐπεφάνη γὰρ ἡ χάρις τοῦ θεοῦ σωτήριος πᾶσιν ἀνθρώποις</p><p lang=\"grc\">παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,</p>","lit":"<p>因為神那帶來拯救的恩典，已經向所有的人顯現了，</p><p>教養著我們，好叫我們否認了不敬虔和屬世的慾望之後，在現今的世代有分寸地、公義地、敬虔地活著，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐπεφάνη γὰρ</td><td>Epephanē gar</td><td>因為已經顯現了</td><td>不定過去式：一次照出來</td></tr><tr><td>ἡ χάρις τοῦ θεοῦ σωτήριος</td><td>hē charis tou theou sōtērios</td><td>神那帶來拯救的恩典</td><td>σωτήριος 帶來救恩的</td></tr><tr><td>πᾶσιν ἀνθρώποις</td><td>pasin anthrōpois</td><td>向所有的人</td><td>連奴隸與克里特人都在內</td></tr><tr><td>παιδεύουσα ἡμᾶς</td><td>paideuousa hēmas</td><td>教養著我們</td><td>現在分詞：天天在教</td></tr><tr><td>ἀρνησάμενοι</td><td>arnēsamenoi</td><td>已經否認、拒絕</td><td>與 1:16 ἀρνοῦνται 同字</td></tr><tr><td>σωφρόνως καὶ δικαίως καὶ εὐσεβῶς</td><td>sōphronōs kai dikaiōs kai eusebōs</td><td>有分寸、公義、敬虔地</td><td>對己、對人、對神</td></tr><tr><td>ἐν τῷ νῦν αἰῶνι</td><td>en tō nyn aiōni</td><td>在現今的世代</td><td>與 2:13 的等候對照</td></tr></table>","gram":"<p><strong>2:11--14 在原文是一個長句，主要動詞只有一個：Ἐπεφάνη（Epephanē）。</strong>句子骨架如下：</p><blockquote><p>主幹：Ἐπεφάνη γὰρ ἡ χάρις（因為恩典已經顯明，2:11）<br>└ 分詞一：παιδεύουσα ἡμᾶς（教養我們，2:12）<br>　　└ ἵνα（hina） 子句：ἀρνησάμενοι（arnēsamenoi）……ζήσωμεν（否認不敬虔，有分寸、公義、敬虔地活，2:12）<br>　　　　└ 分詞二：προσδεχόμενοι（等候福與榮耀的顯現，2:13）<br>　　　　　　└ 關係子句：ὃς ἔδωκεν ἑαυτὸν（他捨了自己，2:14）<br>　　　　　　　　└ ἵνα（hina） 子句：λυτρώσηται（lytrōsētai）……καὶ καθαρίσῃ（贖我們、潔淨我們，2:14）</p></blockquote><p>γὰρ（gar） 把整句接回 2:1--10：前面所有的吩咐，理由都在這裡。Ἐπεφάνη（Epephanē） 是 ἐπιφαίνω（epiphainō） 的不定過去式，「顯現、照出來」；路 1:79 撒迦利亞頌用它說晨光「照亮坐在黑暗中死蔭裡的人」。σωτήριος（sōtērios） 是形容詞，「帶來拯救的」；πᾶσιν ἀνθρώποις（pasin anthrōpois） 擺在句尾，連 2:9 的奴隸、1:12 的克里特人都在裡面。</p><p>παιδεύουσα（paideuousa） 是現在分詞，παιδεύω（paideuō） 是父母教養孩子、包括管教的字，來 12:10 用它說「萬靈的父管教我們」。ἀρνησάμενοι（arnēsamenoi） 是不定過去式分詞，與 1:16 τοῖς δὲ ἔργοις ἀρνοῦνται（tois de ergois arnountai） 同一個動詞：假師傅用行為「否認」神，恩典卻教我們「否認」不敬虔。σωφρόνως（sōphronōs）、δικαίως（dikaiōs）、εὐσεβῶς（eusebōs） 三個副詞，對自己、對別人、對神，σώφρων（sōphrōn） 家族在這裡第六次出現。</p>","exp":"<p>「因為神救眾人的恩典已經顯明出來，教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日」（2:11--12）。這是全卷地勢最高的地方。前面十節都是「要」，到這裡保羅說「因為」：我們能夠這樣活，不是因為我們本來就好，是因為有一道光照進來了。</p><p>那道光是一個人。恩典「顯明」，指的是神的兒子道成肉身、住在我們中間、死而復活。在克里特那個連本地詩人都自嘲「常說謊話」的地方，這光並沒有挑地方照。「眾人」也要讀得準：恩典向眾人顯明，不等於眾人都已經得救；提摩太前書講義第 2 章講過，神「願意萬人得救，明白真道」（提前 2:4），這是邀請，不是普救論。</p><p>最動人的是「教訓」這個字。恩典不只是一張赦免令，是一位住在家裡、天天教你的父母。赦免令一次發下來就結束了，父母卻每天陪著你吃飯、學走路、跌倒了扶起來、做錯了管教。恩典也管教：它教我們對不敬虔說「不」。這把兩種誤解同時擋住：恩典不是叫人放縱的許可證，因為恩典本身會教人；恩典也不是要人先變好才給的獎品，因為是恩典先來，教導在後。我們並不是靠行善得救，是被救的人學會行善。</p><p>「否認」這個字在 1:16 剛出現過：假師傅口裡認識神，行事卻否認他。恩典的教導把方向扳正：從前用行為否認神，如今學會否認不敬虔。三個副詞也很完整：對自己有分寸，對人公義，對神敬虔，而且就在「今世」。</p><p>這兩節正是「改變觀念就改變生命，改變生命就改變生活」的經文原型：恩典先教訓我們，然後我們在今世這樣度日。先是被教，後是過日子；次序不能顛倒。</p>"},{"a":13,"z":13,"star":3,"grk":"<p lang=\"grc\">προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ,</p>","lit":"<p>迎候著那有福的盼望，和我們那至大的神與救主耶穌基督之榮耀的顯現；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>προσδεχόμενοι</td><td>prosdechomenoi</td><td>迎候著</td><td>現在分詞：一面活一面等</td></tr><tr><td>τὴν μακαρίαν ἐλπίδα</td><td>tēn makarian elpida</td><td>那有福的盼望</td><td>盼望的內容</td></tr><tr><td>καὶ ἐπιφάνειαν τῆς δόξης</td><td>kai epiphaneian tēs doxēs</td><td>與榮耀的顯現</td><td>與 2:11 ἐπεφάνη 同字根</td></tr><tr><td>τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν</td><td>tou megalou theou kai sōtēros hēmōn</td><td>那至大的神和我們救主</td><td>一個冠詞管兩個名詞</td></tr><tr><td>Ἰησοῦ Χριστοῦ</td><td>Iēsou Christou</td><td>耶穌基督</td><td>◆ WH、Treg 作 Χριστοῦ Ἰησοῦ</td></tr></table>","gram":"<p><strong>2:13 只有一個冠詞。</strong>τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν（tou megalou theou kai sōtēros hēmōn）：冠詞 τοῦ（tou） 放在 μεγάλου θεοῦ（megalou theou） 前面，σωτῆρος（sōtēros） 前面沒有再寫冠詞。兩個單數、指人的普通名詞，由 καὶ（kai） 連接，只用一個冠詞，按希臘文的慣例（十八世紀英國學者格蘭維爾・夏普整理成「夏普規則」）指同一位。這條規則有它的限制：只適用於單數、指人、不是專有名詞的名詞；θεός（theos） 在這裡是否已近乎專名、σωτῆρος ἡμῶν（sōtēros hēmōn） 是否已成固定稱號，學者仍有討論——這正是兩位讀法至今仍有人採用的原因。兩種讀法並陳：</p><p>①<strong>一位</strong>（本講義主軸）：「我們那至大的神和救主耶穌基督」，整個稱號都屬於耶穌。理由：冠詞的結構；新約的 ἐπιφάνειαν（epiphaneian） 一貫指基督的顯現（提前 6:14；提後 4:1、8）；2:14 緊接著只說 ὃς（hos）「他」，捨了自己的只有一位；「神與救主」在當時正是羅馬皇帝崇拜的稱號，保羅把它給了耶穌。和合本的註腳也作「或譯：神－我們救主」。彼後 1:1 τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ（tou theou hēmōn kai sōtēros Iēsou Christou） 是同一個句型，彼得後書講義第 1 章處理過。</p><p>②<strong>兩位</strong>：「至大的神」指父，「我們救主耶穌基督」指子，和合本正文的語序也容許這樣讀。理由：保羅多半分開稱呼父與子，如 1:4 θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ（theou patros kai Christou Iēsou）；θεός（theos） 在保羅書信中多指父。</p><blockquote><p>◆ 經文鑑別 2:13：SBLGNT、NA28、RP 作 Ἰησοῦ Χριστοῦ（Iēsou Christou）；WH、Treg 作 Χριστοῦ Ἰησοῦ（Christou Iēsou）。兩種語序在保羅書信都常見，意思沒有差別，也不影響一位或兩位的判斷。本講義從 SBLGNT。</p></blockquote>","exp":"<p>「等候所盼望的福，並等候至大的神和我們救主耶穌基督的榮耀顯現。」（2:13）恩典教我們在「今世」怎樣活，也教我們往前看。προσδεχόμενοι（prosdechomenoi） 是現在分詞，掛在 2:12 的「度日」底下：等候不是停下來，是一面過日子一面等。等候的人，今天就自守、公義、敬虔。</p><p>這一節把兩次顯現連起來。2:11 恩典「顯明」了，那是第一次顯現，在馬槽、在十字架；2:13 還有一次「顯現」，那是榮耀。第一次顯現是恩典，第二次顯現是榮耀；我們活在兩次顯現中間。保羅沒有給日期，只給方向。帖撒羅尼迦前書講義的立場已經說過：不算日子，只管預備。</p><p>本講義採「一位」的讀法：我們所等候的，是「至大的神和我們救主」耶穌基督。在一個把「神」和「救主」的頭銜獻給皇帝的帝國裡，保羅把這兩個稱號一起放在一個被釘十字架的加利利人身上。這是全卷最高的稱號，也是 321 說「讓耶穌作王」的根據。</p><p>但要說清楚：<strong>基督的神性不靠這一節成立。</strong>一個冠詞的讀法，學者可以繼續討論；信仰的根基不懸在一個文法規則上。就算讀成兩位，新約也明說「道就是神」（約 1:1），多馬也承認「我的主！我的神！」（約 20:28），保羅也稱基督為「在萬有之上，永遠可稱頌的神」（羅 9:5）。所以本講義不拿這一節去攻擊讀法不同的人，也不用它把任何群體劃出門外。爭的是一個冠詞，敬拜的是同一位主。</p><p>當日克里特的信徒聽到這句話，會想起每一座為皇帝立的碑。碑上的「神與救主」會倒，他們等候的那一位會來。</p>"},{"a":14,"z":14,"star":3,"grk":"<p lang=\"grc\">ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.</p>","lit":"<p>他為我們給出了自己，要贖我們脫離一切不法，並為自己潔淨一群屬自己的子民，熱衷於美好的行為。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὃς ἔδωκεν ἑαυτὸν</td><td>hos edōken heauton</td><td>他給出了自己</td><td>不定過去式：十字架一次完成</td></tr><tr><td>ὑπὲρ ἡμῶν</td><td>hyper hēmōn</td><td>為了我們</td><td>代替、為了</td></tr><tr><td>ἵνα λυτρώσηται ἡμᾶς</td><td>hina lytrōsētai hēmas</td><td>要贖我們</td><td>付價買回；詩 130:8</td></tr><tr><td>ἀπὸ πάσης ἀνομίας</td><td>apo pasēs anomias</td><td>脫離一切不法</td><td>1:10 不服約束的根</td></tr><tr><td>καθαρίσῃ ἑαυτῷ</td><td>katharisē heautō</td><td>為自己潔淨</td><td>結 37:23</td></tr><tr><td>λαὸν περιούσιον</td><td>laon periousion</td><td>屬自己的子民</td><td>七十士譯本 出 19:5</td></tr><tr><td>ζηλωτὴν καλῶν ἔργων</td><td>zēlōtēn kalōn ergōn</td><td>熱衷美好行為的</td><td>ζηλωτής：熱心黨人</td></tr></table>","gram":"<p>2:14 的 ὃς（hos） 是關係代名詞，單數，接回 2:13 的耶穌基督；只說「他」，這也是「一位」讀法的理由之一。ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν（edōken heauton hyper hēmōn） 是保羅的老句子，加 1:4 與提前 2:6 都有。接著 ἵνα（hina） 帶兩個不定過去式假設語氣：λυτρώσηται（贖）與 καθαρίσῃ（潔淨），一個是從裡面帶出來，一個是在外面洗乾淨。</p><p><strong>這一節疊了三處舊約。</strong>λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας（lytrōsētai hēmas apo pasēs anomias） 回響詩 130:8（七十士譯本 129:8）「他必救贖以色列脫離一切的罪孽」；καθαρίσῃ（katharisē）……λαὸν（laon） 回響結 37:23「我要潔淨他們，如此，他們要作我的子民」；λαὸν περιούσιον（laon periousion） 則是七十士譯本出 19:5、申 7:6、14:2 的詞，λαὸς περιούσιος（laos periousios），「屬自己的、珍寶般的子民」。這是保羅自己作的連結：神在西乃山對以色列說的話，原封不動地說給一群克里特的外邦人。最後 ζηλωτὴν καλῶν ἔργων（zēlōtēn kalōn ergōn） 是同位語，ζηλωτής（zēlōtēs） 是「熱心黨」的那個字（路 6:15），熱心的對象從民族換成了善行。</p>","exp":"<p>〔舊約〕出 19:5--6；申 7:6（出埃及記講義第 19 章；申命記講義第 7 章）</p><p>「他為我們捨了自己，要贖我們脫離一切罪惡，又潔淨我們，特作自己的子民，熱心為善。」（2:14）長句到這裡落地。恩典為甚麼能教人？因為它不是一套道理，是一位捨了自己的人。保羅說基督「為我們的罪捨己」（加 1:4），也說「他捨自己作萬人的贖價」（提前 2:6）。321 說「無己」，源頭在這裡：先有一位為我們捨己的主，才有能捨己的我們。</p><p>出埃及記講義第 19 章講過，神在西乃山說：「就要在萬民中作屬我的子民」（出 19:5）；申命記講義第 7 章講過，摩西說神揀選以色列，「特作自己的子民」（申 7:6）。和合本在申 7:6 與多 2:14 用的正是同一句話。那時的子民是從埃及被贖出來的奴隸，如今的子民是從各樣罪惡被贖出來的克里特人。1:12 的詩人說「克里特人常說謊話」，那是一個民族自己承認的病；2:14 說這群人成了神的珍寶。神沒有把福音送到最好的地方，而是送到最難的地方。</p><p>次序要看清楚：先是「捨了自己」，然後「贖」與「潔淨」，最後才是「熱心為善」。善行不是贖價，是被贖的結果。這擋住兩個錯：我們不是靠行善得救，因為贖價他已經付了；也不是「反正得救了，怎樣活都可以」，因為他贖我們，正是要我們成為熱心為善的人。善行若是為了證明自己，那是有己；善行若是因為他為我們捨了自己，那是無己。</p><p>一群熱心黨人，熱心的不是推翻羅馬，是行善。今天的 321 空中團契散在各國，同樣是一群被贖、被潔淨、屬於他的人；「建立屬神的體系」的本質，不是先有組織，是先有這樣一群子民。</p>"},{"a":15,"z":15,"star":1,"grk":"<p lang=\"grc\">Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.</p>","lit":"<p>這些事你要講，也要勸，也要帶著全部的命令責備；沒有人可以輕看你。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ταῦτα λάλει</td><td>Tauta lalei</td><td>這些事你要講</td><td>λάλει 回到 2:1</td></tr><tr><td>παρακάλει</td><td>parakalei</td><td>要勸</td><td>與 2:6 同字</td></tr><tr><td>ἔλεγχε</td><td>elenche</td><td>要責備、駁正</td><td>1:9、1:13 同字</td></tr><tr><td>μετὰ πάσης ἐπιταγῆς</td><td>meta pasēs epitagēs</td><td>帶著全部的命令</td><td>1:3 同字</td></tr><tr><td>μηδείς σου περιφρονείτω</td><td>mēdeis sou periphroneitō</td><td>沒有人可以繞過你去想</td><td>提前 4:12 用的是另一個字</td></tr></table>","gram":"<p>2:15 用 λάλει（lalei） 收尾，與 2:1 Σὺ δὲ λάλει（Sy de lalei） 首尾呼應，把整章框起來。三個現在式命令並排：λάλει（lalei）、παρακάλει（parakalei）、ἔλεγχε（elenche），講明、勸勉、駁正。ἐπιταγῆς（epitagēs） 與 1:3 κατʼ ἐπιταγὴν（kat' epitagēn） 同字：保羅的使徒職分是按神的命令交託的，提多的權柄也由那命令而來，不是由他自己。最後 περιφρονείτω（periphroneitō） 是「繞著想、看不起」，與提前 4:12 的 καταφρονείτω（kataphroneitō） 不同字，意思相近：不要讓人把你當空氣。全章以兩個 λάλει（lalei） 開頭收尾，中間夾著 2:11--14 的長句，結構本身就在說：講道的內容，核心是恩典。</p>","exp":"<p>「這些事你要講明，勸戒人，用各等權柄責備人；不可叫人輕看你。」（2:15）「這些事」就是 2:1--14 的全部：各等人的生活，加上那位教人的恩典。提多要講的不只是規矩，是規矩背後的恩典。只講前十節，會變成律法；只講後四節，會變成空話。</p><p>「用各等權柄」容易被聽錯。提多的權柄不是他自己的，是從那交託保羅的命令來的，所以它只能用在「這些事」上，不能用來管別人的私事、壓制不同意見。彼得前書講義立場五說過，長老「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）。權柄的界線，就在所交託的道。</p><p>「不可叫人輕看你」也不是叫提多去爭面子。怎樣不被輕看？回到 2:7：凡事顯出善行的榜樣。一個被恩典教養的傳道人，不必靠聲量取得尊重。整章從「但你所講的」開始，到「這些事你要講明」結束：講的人自己，先站在所講的恩典底下。</p>"}],"3":[{"a":1,"z":1,"star":3,"grk":"<p lang=\"grc\">Ὑπομίμνῃσκε αὐτοὺς ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,</p>","lit":"<p>你要一直提醒他們：要順服執政的、掌權的，要聽從，要向著每一件善工預備好，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὑπομίμνῃσκε</td><td>Hypomimnēske</td><td>你要一直提醒</td><td>現在命令式：他們本來知道，只是會忘</td></tr><tr><td>ἀρχαῖς ἐξουσίαις</td><td>archais exousiais</td><td>執政的、掌權的</td><td>兩個複數名詞並列；RP 加 καὶ</td></tr><tr><td>ὑποτάσσεσθαι</td><td>hypotassesthai</td><td>順服、排在下面</td><td>與 2:5、2:9 同一個字：第三段順服</td></tr><tr><td>πειθαρχεῖν</td><td>peitharchein</td><td>聽從權柄</td><td>與徒 5:29 同字：界線就在這個字上</td></tr><tr><td>πρὸς πᾶν ἔργον ἀγαθὸν</td><td>pros pan ergon agathon</td><td>向著每一件善工</td><td>與 1:16 一字不差</td></tr><tr><td>ἑτοίμους εἶναι</td><td>hetoimous einai</td><td>成為預備好的</td><td>對照 1:16 的 ἀδόκιμοι「可廢棄的」</td></tr></table>","gram":"<p><strong>3:1 是全卷的第三段順服。</strong>Ὑπομίμνῃσκε（Hypomimnēske） 是現在命令式，字義是「使人想起」：提多不是頒布新規矩，是把會眾早就知道、卻容易忘記的事一再提起。賓語 αὐτοὺς（autous） 是全體信徒，和合本作「眾人」。接著兩個不定詞 ὑποτάσσεσθαι（hypotassesthai） 與 πειθαρχεῖν（peitharchein） 之間沒有連接詞，緊緊相連：前者講位置，排在秩序之下；後者講行動，聽從權柄的吩咐。ὑποτάσσεσθαι（hypotassesthai） 正是 2:5 妻子、2:9 僕人用過的字——妻子、僕人、眾人，三段順服到此完整，三段都只對順服的一方說話。</p><p><strong>經文鑑別 3:1。</strong>SBLGNT（與 WH、Treg、NA28）作 ἀρχαῖς ἐξουσίαις（archais exousiais），兩個名詞並列、沒有連接詞；RP 作 ἀρχαῖς καὶ ἐξουσίαις（archais kai exousiais）。和合本「作官的、掌權的」用頓號，兩種讀法都承載得住。沒有連接詞的短讀法比較生硬，抄寫者傾向補上 καὶ（kai） 使句子順暢，反過來刪掉的可能較小；本講義從 SBLGNT，意義不受影響。</p><blockquote><p><strong>順服的界線。</strong>πειθαρχεῖν（peitharchein） 在新約只出現四次，最有名的一次在使徒行傳：彼得在公會前說「順從神，不順從人，是應當的」（徒 5:29），用的就是這個字。同一個字，在保羅筆下是「遵他的命」（3:1），在彼得口中是「不順從人」。兩處並不矛盾：順從官長是常態，順從神是界線。當權柄要求人犯罪、拜偶像或違背良心時，使徒自己已經示範了界線在哪裡。</p></blockquote><p>後半 πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι（pros pan ergon agathon hetoimous einai） 與 1:16 的 πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι（pros pan ergon agathon adokimoi） 一字一字對照，只換了最後一個形容詞：從「可廢棄的」換成「預備好的」。這是全卷「善工」一線的轉折點。</p>","exp":"<p>「你要提醒眾人，叫他們順服作官的、掌權的，遵他的命，預備行各樣的善事。」（3:1）第二章對家裡的每一種人說話，第三章把鏡頭拉到城裡。克里特在羅馬治下，向來以難管出名；一群剛信主的人，很容易把「我們屬天」誤會成「地上的秩序與我無關」。保羅說：提醒他們。這不是新命令，是會被忘記的舊功課。</p><p>這一節的重心不在政府，在「善事」。保羅用的句子和 1:16 一模一樣：那些說虛空話的人「在各樣善事上是可廢棄的」（1:16），蒙恩的人卻要「預備行各樣的善事」（3:1）。同樣是「各樣的善事」，一邊被淘汰，一邊隨時備好。順服掌權的，是這張「預備好」清單的第一項：納稅、守法、在社會秩序裡做好公民，叫外人看見福音不是動亂。三段順服的目的都朝外——「免得神的道理被毀謗」（2:5）——3:1 也是一樣：順服是為了福音的名聲，不是為了任何人的權力。</p><p>但順服有界線。「遵他的命」那個字，正是彼得說「順從神，不順從人，是應當的」（徒 5:29）的字。當權柄命令人拜偶像、作假見證、傷害無辜，使徒的回答已經寫在聖經裡。順服是常態，不是無條件；界線不是由我的好惡劃的，是由神的命令劃的。就算到了必須說「不」的時候，彼得和眾使徒也沒有咒罵公會，他們挨了打，還是溫柔地回去傳道。</p><p>本講義不用這一節為任何當代政權背書，也不用它攻擊任何當代政權。國度321空中團契的弟兄姊妹散在不同的國家，活在不同的制度之下；同一節經文對每一個人說同一件事：做一個預備好行善的公民，在神的界線之內順服，到了神的界線之外，溫柔而堅定地順從神。</p>"},{"a":2,"z":2,"star":2,"grk":"<p lang=\"grc\">μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.</p>","lit":"<p>不毀謗任何一個人，不爭鬥，要寬容，向一切的人顯出一切的溫柔。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μηδένα βλασφημεῖν</td><td>mēdena blasphēmein</td><td>不毀謗任何一人</td><td>與 2:5 βλασφημῆται 同字</td></tr><tr><td>ἀμάχους</td><td>amachous</td><td>不爭鬥的</td><td>字面是「不打架」</td></tr><tr><td>ἐπιεικεῖς</td><td>epieikeis</td><td>寬容的</td><td>肯讓步，不堅持自己每一分權利</td></tr><tr><td>ἐνδεικνυμένους</td><td>endeiknymenous</td><td>顯出來</td><td>現在分詞：持續地展示給人看</td></tr><tr><td>πραΰτητα</td><td>prautēta</td><td>溫柔</td><td>有力量而不用來壓人</td></tr><tr><td>πρὸς πάντας ἀνθρώπους</td><td>pros pantas anthrōpous</td><td>向一切的人</td><td>呼應 2:11 πᾶσιν ἀνθρώποις</td></tr></table>","gram":"<p>3:2 延續 3:1 的不定詞串：μηδένα βλασφημεῖν（mēdena blasphēmein）、ἀμάχους εἶναι（amachous einai）、ἐπιεικεῖς（epieikeis），最後收在一個分詞片語 πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους（pasan endeiknymenous prautēta pros pantas anthrōpous）。先兩個否定，再兩個正面，排成一道階梯。βλασφημεῖν（blasphēmein） 與 2:5 的 βλασφημῆται（blasphēmētai） 同字：我們不要神的道被毀謗，我們也不毀謗任何人；μηδένα（mēdena） 是「沒有一個人」，作官的也在內。</p><p>ἀμάχους（amachous） 字面是「不打架」，與 3:9 的 μάχας（machas）「爭競」同一個字根——同一章前後呼應：對人不打架，對無益的爭論也不打架。ἐπιεικεῖς（epieikeis） 是寬容、讓步。πᾶσαν（pasan） 與 πάντας（pantas） 把整句包起來：全部的溫柔，給全部的人。πρὸς πάντας ἀνθρώπους（pros pantas anthrōpous） 接回 2:11 的 πᾶσιν ἀνθρώποις（pasin anthrōpois）——恩典向眾人顯明，溫柔也就向眾人顯出。πραΰτητα（prautēta） 是 SBLGNT 的拼法，RP 作 πρᾳότητα（praotēta），同一個字。</p>","exp":"<p>「不要毀謗，不要爭競，總要和平，向眾人大顯溫柔。」（3:2）3:1 講對權柄，3:2 講對眾人；前一節有界線，這一節沒有例外。「眾人」包括不信的鄰舍、反對福音的親族，也包括治理我們的人。不毀謗任何人，連自己不同意的官長也在內。</p><p>在網路時代，這一節特別刺人。一句嘲諷的貼文、一張轉傳的梗圖，都可能是毀謗。基督徒可以就事論事地表達看法，可以在公共事務上發聲，卻不可以羞辱人的人格。「總要和平」原文是寬容、肯讓步；「溫柔」不是軟弱，是主耶穌形容自己的那種力量：有力量，而不拿來壓人。保羅說要「大顯」——不是藏在心裡的溫柔，是讓人看得見的溫柔。</p><p>「不要爭競」先適用在誰身上？先適用在有權柄的人身上。提多是被差派來整頓的人，長老是要被設立的人；他們若先成了好爭競的人，整封信就站不住了。溫柔是從上往下流的；帶領的人先放下爭競，會眾才學得會溫柔。</p><p>為甚麼要向眾人大顯溫柔？下一節的第一個字「因為」就是答案：因為我們從前也是。溫柔不是一種策略，是一種記性。321 說先生命、再關係、後事工；3:2 是關係，它的根在 3:5 的憐憫。</p>"},{"a":3,"z":3,"star":3,"grk":"<p lang=\"grc\">ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.</p>","lit":"<p>因為我們從前也曾是無知的、不順從的、被引入迷途的、作奴僕服事各樣私慾和享樂的，在惡毒和嫉妒中度日，是可憎的，彼此恨惡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἦμεν γάρ ποτε καὶ ἡμεῖς</td><td>ēmen gar pote kai hēmeis</td><td>因為我們從前也曾是</td><td>καὶ ἡμεῖς：連我們也在內</td></tr><tr><td>ἀνόητοι</td><td>anoētoi</td><td>無知的</td><td>清單從頭腦開始</td></tr><tr><td>ἀπειθεῖς</td><td>apeitheis</td><td>不順從的</td><td>與 1:16 同字：伏筆揭開</td></tr><tr><td>πλανώμενοι</td><td>planōmenoi</td><td>被引入迷途的</td><td>被動分詞：被牽著走</td></tr><tr><td>δουλεύοντες</td><td>douleuontes</td><td>作奴僕服事</td><td>真正的奴役在裡面</td></tr><tr><td>στυγητοί</td><td>stygētoi</td><td>可憎的</td><td>新約只此一次</td></tr><tr><td>μισοῦντες ἀλλήλους</td><td>misountes allēlous</td><td>彼此恨惡</td><td>清單收在關係的破裂</td></tr></table>","gram":"<p>ἦμεν γάρ ποτε καὶ ἡμεῖς（ēmen gar pote kai hēmeis）：γάρ（gar） 回答 3:2「為甚麼要向眾人大顯溫柔」；ποτε（pote）「從前」等著 3:4 的 ὅτε δὲ（hote de）「但到了……的時候」——一句話的時間切換，切開兩個時代。καὶ ἡμεῖς（kai hēmeis） 是「連我們也」：保羅、提多、會眾全在裡面。</p><p>清單共七項，由形容詞與分詞交錯排成：ἀνόητοι（anoētoi）、ἀπειθεῖς（apeitheis）、πλανώμενοι（planōmenoi）、δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις（douleuontes epithymiais kai hēdonais poikilais）、ἐν κακίᾳ καὶ φθόνῳ διάγοντες（en kakia kai phthonō diagontes）、στυγητοί（stygētoi）、μισοῦντες ἀλλήλους（misountes allēlous）。<strong>ἀπειθεῖς（apeitheis） 與 1:16 同字</strong>：1:16 說「他們」悖逆，3:3 說「我們從前也是」——全卷最深的伏筆在這裡揭開。πλανώμενοι（planōmenoi） 是被動，人以為自己在選路，其實是被牽著走。δουλεύοντες（douleuontes） 與 2:3 的 δεδουλωμένας（dedoulōmenas）、2:9 的 δούλους（doulous） 同一個字根：第二章談的是社會身分的奴僕，3:3 揭露的是心裡的奴役。</p><blockquote><p>κακίᾳ（kakia） 和合本作「惡毒」，註腳「或譯：陰毒」——不只是做壞事，是心裡藏著想傷人的意念；φθόνῳ（phthonō） 是嫉妒。διάγοντες（diagontes）「度日」與 2:12 的「度日」不同字，卻成了對照：從前在惡毒嫉妒中過日子，如今要在今世自守、公義、敬虔地過日子。最後兩項 στυγητοί（stygētoi）、μισοῦντες ἀλλήλους（misountes allēlous） 是被動與主動並列：被人恨，也恨人。罪的終點是關係的瓦解。</p></blockquote>","exp":"<p>「我們從前也是無知、悖逆、受迷惑、服事各樣私慾，和宴樂，常存惡毒嫉妒的心，是可恨的，又是彼此相恨。」（3:3）這是全卷的第二個谷底，也是全卷最深的伏筆揭開的地方。1:16 保羅說那些人「是悖逆的」（1:16）；到了這裡，同一個字回來了，主詞卻換成了「我們」。保羅沒有站在高處指著克里特人，他走下來，站在他們中間。</p><p>清單從頭腦開始（無知），到意志（悖逆），到方向（受迷惑），到慾望（作私慾的奴僕），到心思（惡毒嫉妒），最後到關係（可恨，又彼此相恨）。罪不是一個點，是一條往下走的路，終點是人與人之間的仇恨。第二章勸僕人順服主人；3:3 告訴我們，真正的奴役在裡面——一個在法律上自由的人，也可能是私慾的奴僕。</p><p>1:12 克里特人自己的詩人說他們的同胞常說謊話；3:3 保羅說：我們從前也是。這一節拆掉了「我們」與「他們」之間的牆。猶太人保羅、希臘人提多、克里特本地的信徒，全在同一份清單上。這使我們想起保羅在提前 1:13 的自述：他從前是褻瀆神、逼迫人、侮慢人的。寫這份清單的人，自己的名字就在上面。</p><p>這一節是 3:2 的根。一個人若忘了自己從哪裡來，就很難向「眾人」溫柔；記得的人，看見今天還在悖逆中的人，會說：那是從前的我。321 說謙卑是放下權力、回到本位——3:3 就是回到本位：我不是比別人好的人，我是和他們一樣、卻蒙了憐憫的人。所以溫柔不是姿態，是感恩；記得自己蒙了多少憐憫的人，對別人就不會刻薄。</p>"},{"a":4,"z":4,"star":2,"grk":"<p lang=\"grc\">ὅτε δὲ ἡ χρηστότης καὶ ἡ φιλανθρωπία ἐπεφάνη τοῦ σωτῆρος ἡμῶν θεοῦ,</p>","lit":"<p>但當我們救主神的恩慈和愛人類之情顯現的時候，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὅτε δὲ</td><td>hote de</td><td>但當……的時候</td><td>切斷 3:3 的黑暗</td></tr><tr><td>ἡ χρηστότης</td><td>hē chrēstotēs</td><td>恩慈、仁厚</td><td>神待人的良善</td></tr><tr><td>ἡ φιλανθρωπία</td><td>hē philanthrōpia</td><td>愛人類</td><td>philanthropy 的字根</td></tr><tr><td>ἐπεφάνη</td><td>epephanē</td><td>顯明了</td><td>與 2:11 同字：這個動詞第二次出現</td></tr><tr><td>τοῦ σωτῆρος ἡμῶν θεοῦ</td><td>tou sōtēros hēmōn theou</td><td>我們救主神的</td><td>3:6 改稱耶穌基督為救主</td></tr></table>","gram":"<p><strong>3:4--7 原文是一整句話，主要動詞只有一個：3:5 的 ἔσωσεν（esōsen）。</strong>骨架如下：</p><blockquote><p>ὅτε δὲ（hote de）……ἐπεφάνη（epephanē）——時間（3:4：恩慈和慈愛顯明的時候）<br>　οὐκ ἐξ ἔργων（ouk ex ergōn）……ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος（alla kata to autou eleos）——根據（3:5 前半：不是……乃是）<br><strong>ἔσωσεν ἡμᾶς（esōsen hēmas）</strong>——主幹（3:5：他救了我們）<br>　διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου（dia loutrou palingenesias kai anakainōseōs pneumatos hagiou）——方法（3:5 後半）<br>　　οὗ ἐξέχεεν ἐφʼ ἡμᾶς πλουσίως διὰ Ἰησοῦ Χριστοῦ（hou execheen eph' hēmas plousiōs dia Iēsou Christou）——聖靈的來源（3:6）<br>　ἵνα δικαιωθέντες（hina dikaiōthentes）……κληρονόμοι γενηθῶμεν（klēronomoi genēthōmen）——目的（3:7）</p></blockquote><p>ἔσωσεν（esōsen） 是不定過去式：救恩是一件已經發生的事。主詞是 3:4 的 τοῦ σωτῆρος ἡμῶν θεοῦ（tou sōtēros hēmōn theou）；一句話裡父、子、聖靈都在：父的恩慈顯明，聖靈被澆灌，藉著子。</p><p>ἐπεφάνη（epephanē） 與 2:11 的 Ἐπεφάνη（Epephanē） 同字，是這個動詞在全卷的第二次出現；2:13 的名詞 ἐπιφάνειαν（和合本作「顯現」）與它同字根，夾在這兩次之間。連 1:3 的 φανερόω（phaneroō） 一起算，這是和合本全卷三次「顯明」的第三次。2:11 顯明的是 ἡ χάρις（hē charis），3:4 顯明的是 ἡ χρηστότης（hē chrēstotēs） 與 ἡ φιλανθρωπία（hē philanthrōpia）。這兩個字在當時的碑文裡常用來稱頌施恩的君王；「救主」也是皇帝的頭銜。保羅把整套讚美收回來，歸給真正的那一位。</p>","exp":"<p>「但到了神－我們救主的恩慈和他向人所施的慈愛顯明的時候，」（3:4）3:3 的清單越寫越黑，3:4 一個「但」字把它切斷。改變不是從我們這一邊開始的；不是有一天我們變好了，是有一天神的恩慈顯明了。整句話的主角從第一個字就換了人。</p><p>「他向人所施的慈愛」原文只是一個字：愛人類。英文的 philanthropy 就從這裡來。今天的「慈善家」是捐錢的人；這個字族在新約另外只出現兩次，都在保羅的船難旅程裡：百夫長猶流「寬待」保羅（徒 27:3），用的是副詞；馬耳他的土人待他們「有非常的情分」（徒 28:2），用的才是這個名詞。人偶爾也會這樣待人；到了 3:4，這個字第一次用在神身上，而且是向著 3:3 那份清單上的人。克里特的城市裡有不少為君王與恩主立的碑，稱頌他們仁厚、愛人；保羅說，真正的恩主不在羅馬，是神我們救主。</p><p>這是 2:11 那個動詞的第二次「顯明」。2:11 說「神救眾人的恩典已經顯明出來」（2:11），3:4 說恩慈和慈愛顯明——兩處講的都是耶穌基督第一次來到世上；中間 2:13 等候的「榮耀顯現」，指向他第二次再來。第一次顯現帶來恩典，第二次顯現帶來榮耀，教會活在兩次之間。</p><p>「我們救主」在這幾節來回交替：3:4 稱神為救主，3:6 稱耶穌基督為救主。救恩是父與子一同的工作，聖靈把它帶進人的生命裡。從 3:3 到 3:4 只隔一個字，卻是從黑夜到天亮的距離；天亮不是人努力出來的，是太陽升起來了。</p>"},{"a":5,"z":5,"star":3,"grk":"<p lang=\"grc\">οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,</p>","lit":"<p>不是出於我們自己在義中所行的那些工作，而是照著他的憐憫，他救了我們，藉著重生的洗和聖靈的更新；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ</td><td>ouk ex ergōn tōn en dikaiosynē</td><td>不是出於在義中的工作</td><td>連好的行為也排除</td></tr><tr><td>ἃ ἐποιήσαμεν ἡμεῖς</td><td>ha epoiēsamen hēmeis</td><td>我們自己所行的</td><td>ἡμεῖς 加重：我們</td></tr><tr><td>κατὰ τὸ αὐτοῦ ἔλεος</td><td>kata to autou eleos</td><td>照著他的憐憫</td><td>救恩的標準在神那一邊</td></tr><tr><td>ἔσωσεν ἡμᾶς</td><td>esōsen hēmas</td><td>他救了我們</td><td>全句唯一的主要動詞</td></tr><tr><td>λουτροῦ</td><td>loutrou</td><td>洗、洗澡</td><td>新約另一次在弗 5:26</td></tr><tr><td>παλιγγενεσίας</td><td>palingenesias</td><td>再一次的出生</td><td>新約另一次在太 19:28</td></tr><tr><td>ἀνακαινώσεως</td><td>anakainōseōs</td><td>更新</td><td>羅 12:2 同字</td></tr></table>","gram":"<p>3:5 前半是 οὐκ（ouk）……ἀλλὰ（alla） 的對比。否定的一邊說得很重：不只是 ἐξ ἔργων（ex ergōn），而且是 τῶν ἐν δικαιοσύνῃ（tōn en dikaiosynē）——「在義中所行的」工作，連真正的好行為也被排除；ἡμεῖς（hēmeis） 是多加的代名詞，重音落在「我們自己」。肯定的一邊是 κατὰ τὸ αὐτοῦ ἔλεος（kata to autou eleos）：αὐτοῦ（autou） 放在 ἔλεος（eleos） 前面，重音落在「他的」。主要動詞 ἔσωσεν（esōsen） 夾在中間，兩邊一推一拉。</p><p><strong>經文鑑別 3:5。</strong>SBLGNT 作 ἃ ἐποιήσαμεν（ha epoiēsamen）……τὸ αὐτοῦ ἔλεος（to autou eleos）：關係代名詞用受格，ἔλεος（eleos） 作中性名詞；RP 作 ὧν（hōn）……τὸν αὐτοῦ ἔλεον（ton autou eleon）：關係代名詞被先行詞同化成屬格，ἔλεος（eleos） 作陽性。兩者都是希臘文常見的變化，意義完全不變；本講義從 SBLGNT。</p><blockquote><p><strong>διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου（dia loutrou palingenesias kai anakainōseōs pneumatos hagiou）。</strong>λουτροῦ（loutrou） 是「洗、洗澡」；παλιγγενεσίας（palingenesias） 字面是「再一次的出生」，新約另一次是太 19:28 萬物的復興；ἀνακαινώσεως（anakainōseōs） 是「更新」，這使我們想起「心意更新而變化」（羅 12:2）。語法上有兩個問題要陳列：一個 διά（dia） 是同時管兩個屬格（同一件事的兩面），還是「更新」另為一事？πνεύματος ἁγίου（pneumatos hagiou） 只修飾「更新」，還是「重生」與「更新」都是聖靈的工作？多數解經家認為一個介系詞管兩者，重生與更新都出於聖靈；本講義採這個讀法。</p></blockquote><p><strong>「重生的洗」三讀並陳。</strong>①洗禮重生：λουτροῦ（loutrou） 指水禮，神在洗禮中施行重生（天主教、東正教、部分信義宗）；②記號與印證：水禮是重生的記號與印證，真正施行重生的是聖靈（改革宗、聖公會、循道衛理）；③比喻：「洗」是聖靈潔淨人心的圖畫，與水禮沒有直接關係（許多浸信會、靈恩派、華人獨立教會），這使我們想起結 36:25--27 神用清水潔淨、賜新心新靈的應許。本講義陳列各家讀法，不在其間裁判；三種讀法都同意：施行重生的是神。</p>","exp":"<p>「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。」（3:5）這是全卷的第二座高峰，也是第三章的心臟。3:3 那份清單上的人，怎樣成了 2:14「熱心為善」的子民？保羅的回答只有一個動詞：他救了。</p><p>先看保羅否定了甚麼。他沒有只說「不是因我們的壞行為」，他說「並不是因我們自己所行的義」（3:5）——連我們做對的事、好的事，都不是得救的根據。克里特的那些教師把信仰變成一套守規矩、講家譜的系統；保羅把整套系統放到一邊：救恩不記在我們的帳上。肯定的一邊是「乃是照他的憐憫」（3:5）。憐憫是看見一個人沒有資格，卻仍然伸手。救恩的標準不在我的表現，在他的心腸。</p><p>再看「重生的洗和聖靈的更新」。教會歷史上對「重生的洗」有三種讀法：有的認為神在洗禮中施行重生，有的認為洗禮是重生的記號與印證，有的認為「洗」是聖靈潔淨人心的比喻。這三種傳統裡都有愛主的弟兄姊妹。本講義不在其間裁判，不用這一節判定任何宗派的人有沒有得救；不說受洗就得救，也不說沒受洗不能得救；不嘲笑嬰孩洗禮，也不嘲笑信徒洗禮。</p><p>但這一節自己有一個落點，各傳統都站得上去：連洗禮也不是「自己所行的義」（3:5）。<strong>重生是神的工作，不是儀式的工作，也不是人決志的工作。</strong>救我們的不是水本身，也不是一次舉手；是照他的憐憫行事的神——這一點，三種傳統都會同意。聖靈的「更新」不是修補舊人，是賜下新的生命。321 說「無己」：連我的義都不是我的，我只是一個被憐憫找到的人。</p>"},{"a":6,"z":6,"star":1,"grk":"<p lang=\"grc\">οὗ ἐξέχεεν ἐφʼ ἡμᾶς πλουσίως διὰ Ἰησοῦ Χριστοῦ τοῦ σωτῆρος ἡμῶν,</p>","lit":"<p>這聖靈，他藉著耶穌基督我們的救主，豐富地澆灌在我們身上，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὗ</td><td>hou</td><td>這（聖靈）</td><td>關係代名詞，先行詞是 πνεύματος ἁγίου</td></tr><tr><td>ἐξέχεεν</td><td>execheen</td><td>倒出、澆灌</td><td>與徒 2:33 同一個形</td></tr><tr><td>πλουσίως</td><td>plousiōs</td><td>豐富地</td><td>不是一點一滴</td></tr><tr><td>διὰ Ἰησοῦ Χριστοῦ</td><td>dia Iēsou Christou</td><td>藉著耶穌基督</td><td>澆灌的管道是子</td></tr></table>","gram":"<p>οὗ（hou） 是屬格關係代名詞，先行詞是 3:5 的 πνεύματος ἁγίου（pneumatos hagiou）；照文法本應作受格，被先行詞的屬格「吸引」過去，這在新約很常見。ἐξέχεεν（execheen） 是不定過去式，與徒 2:33 彼得說「就把你們所看見所聽見的，澆灌下來」（徒 2:33）完全同形；徒 2:17 引約珥書則作未來式 ἐκχεῶ（ekcheō）。應許在約珥書是將來，在五旬節成了過去，在 3:6 成了每一位信徒的經歷。πλουσίως（plousiōs）「豐富地」放在動詞後面，和合本譯「厚厚」。διὰ Ἰησοῦ Χριστοῦ τοῦ σωτῆρος ἡμῶν（dia Iēsou Christou tou sōtēros hēmōn）：3:4 稱父為救主，這裡稱子為救主，救主的稱號在兩位之間來回交替。</p>","exp":"<p>〔背景〕徒 2:17--18（使徒行傳講義第 2 章）</p><p>「聖靈就是神藉著耶穌基督－我們救主厚厚澆灌在我們身上的，」（3:6）「澆灌」是倒出來的字。五旬節那天，聖靈從天上澆灌下來，而那天聽見門徒說話的人群中，正好有「克里特和阿拉伯人，都聽見他們用我們的鄉談，講說神的大作為」（徒 2:11）。這使我們想起：克里特的福音也許就是從那一天開始的。保羅用的是約珥書應許、五旬節成就的同一個動詞（徒 2:17、33）：同一位聖靈，如今澆灌在克里特的信徒身上。</p><p>「厚厚」兩個字很重要。聖靈不是偶爾來幫一下忙的客人，是神豐豐富富倒在我們身上的。至於聖靈的澆灌是一次還是多次，靈恩與非靈恩的傳統有不同的理解，本講義指向哥林多前書第 12--14 章的處理，不在這裡展開。兩邊都同意的是：沒有一個信徒是只領到一點點聖靈的。321 說聖靈是我的引導——不是因為我抓住了他，是因為他已經被厚厚地澆灌下來。</p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι γενηθῶμεν κατʼ ἐλπίδα ζωῆς αἰωνίου.</p>","lit":"<p>好叫我們藉著那一位的恩典被稱為義之後，照著永生的盼望成為後嗣。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἵνα</td><td>hina</td><td>好叫</td><td>整句的目的</td></tr><tr><td>δικαιωθέντες</td><td>dikaiōthentes</td><td>被稱為義之後</td><td>不定過去被動分詞</td></tr><tr><td>τῇ ἐκείνου χάριτι</td><td>tē ekeinou chariti</td><td>藉著那一位的恩典</td><td>ἐκείνου 指回神或基督</td></tr><tr><td>κληρονόμοι</td><td>klēronomoi</td><td>後嗣</td><td>承受產業的人</td></tr><tr><td>γενηθῶμεν</td><td>genēthōmen</td><td>可以成為</td><td>RP 作 γενώμεθα</td></tr><tr><td>κατʼ ἐλπίδα ζωῆς αἰωνίου</td><td>kat' elpida zōēs aiōniou</td><td>照著永生的盼望</td><td>與 1:2 首尾呼應</td></tr></table>","gram":"<p>ἵνα（hina） 把整句帶到目的：被救是為了成為後嗣。δικαιωθέντες（dikaiōthentes） 是不定過去被動分詞，「被稱為義」在先，「成為後嗣」在後；這是保羅最核心的字，在教牧書信裡以「因恩稱義」的意思出現只此一次（提前 3:16 同一個動詞指基督「被聖靈稱義」，用法不同）。τῇ ἐκείνου χάριτι（tē ekeinou chariti）：ἐκείνου（ekeinou）「那一位的」，最近的先行詞是 3:6 的耶穌基督，也可能指 3:4 的神；意義相同，恩典是神的。</p><p><strong>異文與譯法。</strong>γενηθῶμεν（genēthōmen） 從 SBLGNT；RP 作 γενώμεθα（genōmetha），同義。κατʼ ἐλπίδα ζωῆς αἰωνίου（kat' elpida zōēs aiōniou） 可以接「後嗣」（照著盼望成為永生的後嗣），也可以接動詞（憑著永生的盼望成為後嗣）；和合本正文取後者，註腳「或譯：可以憑著盼望承受永生」取前者。兩種讀法都說後嗣所承受的是永生。全卷以 ἐπʼ ἐλπίδι ζωῆς αἰωνίου（ep' elpidi zōēs aiōniou） 開始（1:2），在這裡以同一個盼望收束福音總綱。</p>","exp":"<p>〔加〕加 2:16（加拉太書講義第 2 章）</p><p>「好叫我們因他的恩得稱為義，可以憑著永生的盼望成為後嗣。」（3:7）神救我們，不是只把我們從火裡拉出來就算了，是要我們成為後嗣。被稱義是法庭上的宣告：神宣告罪人為義，「如今卻蒙神的恩典，因基督耶穌的救贖，就白白地稱義」（羅 3:24）。成為後嗣是家庭裡的身分：從法庭走進家裡，從被告變成兒子。</p><p>本系列加拉太書講義第 2 章講過，保羅帶著未受割禮的提多上耶路撒冷，守住的正是「人稱義不是因行律法，乃是因信耶穌基督」（加 2:16）這一條。如今提多在克里特面對「那奉割禮的」（1:10），保羅把同一個福音寫給他：不是因我們所行的，是因他的恩。</p><p>全卷從「盼望那無謊言的神在萬古之先所應許的永生」（1:2）開始，在福音總綱的最後一個字又回到永生的盼望。後嗣現在還沒有完全承受產業，卻已經有了名分。321 說得勝者的終點是承受產業；克里特的信徒、今天散在各國的信徒，都是同一份產業的後嗣。</p><p>注意這一節的次序：先「因他的恩得稱為義」，後「成為後嗣」；身分在先，產業在後。一個人不是表現夠好才被收進家裡，是被收進家裡之後，才開始學習像這個家的人。這也為下一節的「留心做正經事業」鋪好了路。</p>"},{"a":8,"z":8,"star":3,"grk":"<p lang=\"grc\">Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·</p>","lit":"<p>這話是可信的；關於這些事，我願你堅定地斷言，好叫那些已經信了神的人，用心專務美好的工作。這些是美好的，並且對人有益；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πιστὸς ὁ λόγος</td><td>Pistos ho logos</td><td>這話是可信的</td><td>教牧書信五句可信的話之一</td></tr><tr><td>διαβεβαιοῦσθαι</td><td>diabebaiousthai</td><td>堅定地斷言</td><td>不是商量，是確定地講</td></tr><tr><td>φροντίζωσιν</td><td>phrontizōsin</td><td>用心、留心</td><td>心思放在上面</td></tr><tr><td>καλῶν ἔργων προΐστασθαι</td><td>kalōn ergōn proistasthai</td><td>站在美好工作的前頭</td><td>帶頭、專心經營</td></tr><tr><td>οἱ πεπιστευκότες θεῷ</td><td>hoi pepisteukotes theō</td><td>已經信了神的人</td><td>完成式：信在先</td></tr><tr><td>ὠφέλιμα</td><td>ōphelima</td><td>有益的</td><td>對照 3:9 ἀνωφελεῖς</td></tr></table>","gram":"<p>Πιστὸς ὁ λόγος（Pistos ho logos） 是教牧書信五句可信的話之一（提前 1:15；3:1；4:9；提後 2:11；多 3:8）。這一句指向前面，蓋章在 3:4--7 的福音總綱上：保羅要提多「切切實實地講明」的，首先是 3:4--7。διαβεβαιοῦσθαι（diabebaiousthai） 是堅定地斷言，不是建議或討論。</p><p>ἵνα（hina） 子句的次序值得細看：主詞 οἱ πεπιστευκότες θεῷ（hoi pepisteukotes theō） 放在句尾，是完成式分詞——「已經信了神的人」，信是已經成立的事；然後才是 φροντίζωσιν καλῶν ἔργων προΐστασθαι（phrontizōsin kalōn ergōn proistasthai）。<strong>次序是先信、後行；3:5 先說「並不是因我們自己所行的義」，3:8 才說「留心做正經事業」。</strong>προΐστασθαι（proistasthai） 字面是「站在前頭」，與提前 3:4 監督「管理」自己家的 προϊστάμενον（proistamenon） 同一個動詞：像經營一個家那樣經營善事。和合本註腳「或譯：留心行善」；也有解經家把 καλῶν ἔργων προΐστασθαι（kalōn ergōn proistasthai） 讀成「從事正當的職業」，和合本「正經事業」的譯法可能也帶著這一層——3:14「預備所需用的」與這個讀法相合。兩讀並陳，不論哪一讀，3:8 都接在 3:5 之後。καλῶν ἔργων（kalōn ergōn） 接回 2:14 的 ζηλωτὴν καλῶν ἔργων（zēlōtēn kalōn ergōn）。</p><p>ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις（tauta estin kala kai ōphelima tois anthrōpois）：經文鑑別 3:8，RP 在 καλὰ（kala） 前加 τὰ（ta），意義不變。善行的受益者是 τοῖς ἀνθρώποις（tois anthrōpois）——與 2:11、3:2 的「眾人」同一條線：恩典向眾人顯明，溫柔向眾人顯出，善行也使眾人得益。ὠφέλιμα（ōphelima） 又與 3:9 的 ἀνωφελεῖς（anōpheleis）「無益」正面對照。</p>","exp":"<p>「這話是可信的。我也願你把這些事切切實實地講明，使那些已信神的人留心做正經事業。這都是美事，並且與人有益。」（3:8）「這話」是剛才那一整句福音：神的恩慈顯明，照他的憐憫救了我們。保羅要提多堅定地講的，首先不是道德規範，是福音。</p><p>這一節是全卷「行」字的高峰，也最容易被聽錯。它必須和 3:5 一起讀：「並不是因我們自己所行的義，乃是照他的憐憫」（3:5），然後才是「留心做正經事業」（3:8）。<strong>行是果，不是根。</strong>兩句都是真的，次序不可顛倒。顛倒過來，就成了靠行善得救的律法主義；把後一句刪掉，就成了「反正得救了怎樣活都可以」的廉價恩典。這兩種都不是保羅的福音。</p><p>「已信神的人」是完成式：信已經成立了，所以要留心行善。「留心」是把心思放上去；「做正經事業」原文是站在善事的前頭——不是被動地等人來叫，是像經營自己的家一樣經營善事。全卷的醫治在這裡看見痊癒的證據：1:16 在各樣善事上是可廢棄的人，如今成了站在善事前頭的人。不是藥被換掉了，是同一帖恩典的藥終於見效。</p><p>「與人有益」說出善行的方向：朝向人，不是朝向自己的履歷。善行若是為了證明自己，那是有己；善行若是因為「他為我們捨了自己」（2:14），那是無己。321 說先生命、再關係、後事工——3:5 的憐憫是生命，3:2 的溫柔是關係，3:8 的正經事業才是事工。次序對了，善行就不再是重擔，而是被愛的人自然長出來的樣子。</p>"},{"a":9,"z":9,"star":1,"grk":"<p lang=\"grc\">μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.</p>","lit":"<p>但愚拙的辯問、家譜、紛爭和關於律法的爭鬥，你要繞開避開，因為它們是無益的、虛空的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μωρὰς δὲ ζητήσεις</td><td>mōras de zētēseis</td><td>但愚拙的辯問</td><td>δὲ 與 3:8 相對</td></tr><tr><td>γενεαλογίας</td><td>genealogias</td><td>家譜</td><td>1:14 猶太人荒渺的言語</td></tr><tr><td>ἔρεις</td><td>ereis</td><td>紛爭</td><td>WH 作單數 ἔριν</td></tr><tr><td>μάχας νομικὰς</td><td>machas nomikas</td><td>關於律法的爭鬥</td><td>與 3:2 ἀμάχους 同字根</td></tr><tr><td>περιΐστασο</td><td>periistaso</td><td>繞開、避開</td><td>現在命令式：持續地繞道</td></tr><tr><td>ἀνωφελεῖς καὶ μάταιοι</td><td>anōpheleis kai mataioi</td><td>無益且虛空</td><td>對照 3:8 ὠφέλιμα</td></tr></table>","gram":"<p>μωρὰς δὲ ζητήσεις（mōras de zētēseis） 的 δὲ（de） 把 3:9 和 3:8 對起來：一邊是「與人有益」的善事，一邊是「無益」的爭論。四樣東西排成一串：ζητήσεις（zētēseis）、γενεαλογίας（genealogias）、ἔρεις（ereis）、μάχας νομικὰς（machas nomikas）。和合本「家譜的空談」的「的空談」是小字，是譯者補上的。μάχας（machas） 與 3:2 的 ἀμάχους（amachous） 同字根：信徒對人不打架，對無益的爭論也不打架。</p><p><strong>經文鑑別 3:9。</strong>SBLGNT 作複數 ἔρεις（ereis）；WH 作單數 ἔριν（erin），意義不變。περιΐστασο（periistaso） 是現在命令式中間語態，字面是「在旁邊繞過去」，提後 2:16 同一形。結尾的 γὰρ（gar） 給理由：ἀνωφελεῖς καὶ μάταιοι（anōpheleis kai mataioi），與 3:8 的 ὠφέλιμα（ōphelima） 正好相反。</p>","exp":"<p>「要遠避無知的辯論和家譜的空談，以及紛爭，並因律法而起的爭競，因為這都是虛妄無益的。」（3:9）克里特的那些教師喜歡談「猶太人荒渺的言語」（1:14），在家譜和律法的細節上翻來覆去。保羅沒有叫提多一場一場去辯贏，他說：繞開走。</p><p>這不是說基督徒不可以談神學。提多自己要「把爭辯的人駁倒了」（1:9）。分辨的標準在 3:8 與 3:9 的對照裡：有益，還是無益？一場討論若使人更認識恩典、更樂意行善，就值得；若只是使人更會辯論、更瞧不起別人，那就是虛妄。網路上的許多神學論戰，問一問這個問題就夠了：辯完之後，有誰得益處？</p><p>3:2 說「不要爭競」，3:9 說遠避「爭競」，兩處同一個字根。不打架的人，不是沒有立場，是知道哪一場仗不值得打，把力氣留給與人有益的事。</p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">αἱρετικὸν ἄνθρωπον μετὰ μίαν καὶ δευτέραν νουθεσίαν παραιτοῦ,</p><p lang=\"grc\">εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.</p>","lit":"<p>一個製造分黨的人，在一次和第二次勸誡之後，要拒絕他，</p><p>因為知道這樣的人已經被扭轉了，並且在犯罪，是自己定了自己罪的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>αἱρετικὸν ἄνθρωπον</td><td>hairetikon anthrōpon</td><td>製造分黨的人</td><td>新約只此一次</td></tr><tr><td>μετὰ μίαν καὶ δευτέραν νουθεσίαν</td><td>meta mian kai deuteran nouthesian</td><td>一次和第二次勸誡之後</td><td>先有程序</td></tr><tr><td>παραιτοῦ</td><td>paraitou</td><td>拒絕、推辭</td><td>現在命令式；提前 4:7 同形</td></tr><tr><td>ἐξέστραπται</td><td>exestraptai</td><td>已被扭轉</td><td>完成被動：整個翻過來</td></tr><tr><td>ἁμαρτάνει</td><td>hamartanei</td><td>在犯罪</td><td>現在式：持續的狀態</td></tr><tr><td>αὐτοκατάκριτος</td><td>autokatakritos</td><td>自己定了自己的罪</td><td>新約只此一次</td></tr></table>","gram":"<p><strong>αἱρετικὸν ἄνθρωπον（hairetikon anthrōpon） 是製造分裂的人。</strong>αἱρετικός（hairetikos） 新約只此一次，字根是 αἱρέομαι（haireomai）「選擇」；同字根的 αἱρέσεις（haireseis） 在加 5:20 是情慾的事之一，和合本譯「異端」，指的是結黨。這個字到了後世教會才漸漸專指「異端」；在保羅這裡，重點不是某一條教義錯了，是一個人自己選一邊、拉一群人、使會眾分裂。分門結黨看的是行為的方向，不是問題的內容。提出問題、表達不同意見、指出同工的錯誤，都不是 αἱρετικός（hairetikos）。</p><p>μετὰ μίαν καὶ δευτέραν νουθεσίαν（meta mian kai deuteran nouthesian）：νουθεσίαν（nouthesian） 字源是「把心思放回正位」，是帶著挽回目的的勸誡（弗 6:4 同字：父親照著主的「教訓和警戒」養育兒女，νουθεσία（nouthesia） 是其中的「警戒」）。先有一次，再有第二次——<strong>這是程序，也是挽回的機會</strong>。παραιτοῦ（paraitou） 是現在命令式，提前 4:7「棄絕那世俗的言語」用的是同一形，提後 2:23 也是。它的意思可以是「推辭、不再理會」（不再和他辯論），也可以指在群體中與他分開；兩讀並陳，本講義以前者為主，後者需要長老群體按程序處理。</p><blockquote><p>3:11 用 εἰδὼς ὅτι（eidōs hoti） 給出理由：ἐξέστραπται（exestraptai） 是完成被動，字面是「整個被翻轉過來」，已經成形的狀態；ἁμαρτάνει（hamartanei） 是現在式，持續地犯罪；ὢν αὐτοκατάκριτος（ōn autokatakritos）「自己定了自己的罪」，新約只此一次：經過兩次勸誡仍然堅持分裂，定他罪的不是教會，是他自己。</p></blockquote>","exp":"<p>「分門結黨的人，警戒過一兩次，就要棄絕他。」（3:10）這一節在教會歷史上常被用錯：誰有不同意見，就被說成分門結黨；誰質疑領袖，就被冷落、被排擠。但經文用的字是「製造分裂的人」——一個自己選邊、拉人、使教會撕裂的人。<strong>提出問題、提出不同意見、質疑同工或揭發錯誤的人，不是 3:10 說的人。</strong>教會若連問題都不能問，生病的反而是教會。</p><p>再看保羅給的程序：「警戒過一兩次」。不是第一次就趕走，是先勸，再勸。「警戒」是把人的心思放回正位的勸告，目的是挽回，不是定罪；這使我們想起主的教導：「他若聽你，你便得了你的弟兄」（太 18:15）。程序之所以存在，是因為神要得著這個人。</p><p>「棄絕他」最可能的意思是：不再和他捲進無止境的爭論，不讓他繼續帶走羊群。它不是許可教會對一個人施以冷暴力，不是叫人在走廊上裝作看不見他，更不是在講台上公開羞辱。3:2 的「不要爭競」「向眾人大顯溫柔」先適用在掌權者自己身上；處理分裂的人，也要用溫柔的方式處理。</p><p>「因為知道這等人已經背道，犯了罪，自己明知不是，還是去做。」（3:11）兩次勸誡之後仍然堅持，這人已經自己定了自己的罪。教會的「棄絕」只是承認一個他自己作的選擇，門仍然開著；他若回頭，3:3 的那句話也是為他預備的：我們從前也是。</p><p>這兩節保護的是會眾，不是領袖的面子。一個教會若用 3:10 讓自己免於被問責，就把經文拿反了；保羅要遠避的是撕裂教會的爭競，不是使教會更健康的提醒。</p>"},{"a":12,"z":13,"star":2,"grk":"<p lang=\"grc\">Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.</p><p lang=\"grc\">Ζηνᾶν τὸν νομικὸν καὶ Ἀπολλῶν σπουδαίως πρόπεμψον, ἵνα μηδὲν αὐτοῖς λείπῃ.</p>","lit":"<p>當我差派亞提馬或推基古到你那裡的時候，你要盡力到尼哥坡里來我這裡，因為我已決定在那裡過冬。</p><p>律法師西納和亞波羅，你要殷勤地為他們送行，好叫他們一無所缺。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀρτεμᾶν</td><td>Artemān</td><td>亞提馬</td><td>新約只此一次</td></tr><tr><td>Τυχικόν</td><td>Tychikon</td><td>推基古</td><td>保羅的信差（徒 20:4；弗 6:21）</td></tr><tr><td>Νικόπολιν</td><td>Nikopolin</td><td>尼哥坡里</td><td>勝利之城，多半在希臘西岸</td></tr><tr><td>παραχειμάσαι</td><td>paracheimasai</td><td>過冬</td><td>冬季停航</td></tr><tr><td>Ζηνᾶν τὸν νομικὸν</td><td>Zēnān ton nomikon</td><td>律法師西納</td><td>與 3:9 νομικὰς 同字</td></tr><tr><td>πρόπεμψον</td><td>propempson</td><td>為他送行</td><td>供應旅費、補給</td></tr><tr><td>λείπῃ</td><td>leipē</td><td>缺乏</td><td>與 1:5 λείποντα 同字根</td></tr></table>","gram":"<p>3:12 Ὅταν πέμψω（Hotan pempsō）……σπούδασον（spoudason）：時間子句加命令。σπούδασον（spoudason）「趕緊」與 3:13 的 σπουδαίως（spoudaiōs） 同字根，兩節都是急事。κέκρικα（kekrika） 是完成式：「我已經定意」，決定已經成立。παραχειμάσαι（paracheimasai）「過冬」——地中海冬季停航，保羅要在尼哥坡里等到開春。</p><p><strong>經文鑑別 3:13。</strong>SBLGNT 作 Ἀπολλῶν（Apollōn）；Treg 與 RP 作 Ἀπολλὼ（Apollō），是同一個名字的另一種受格寫法，意義不變。τὸν νομικὸν（ton nomikon） 可以是羅馬法的法律專家，也可以是摩西律法的教師，兩說並陳；有趣的是它和 3:9 的 μάχας νομικὰς（machas nomikas） 同字：一邊是「因律法而起的爭競」，一邊是一位懂律法、卻在福音裡事奉的同工。</p><p>ἵνα μηδὲν αὐτοῖς λείπῃ（hina mēden autois leipē）：λείπῃ（leipē） 與 1:5 的 τὰ λείποντα（ta leiponta） 同字根。全卷開頭，提多被留下來補足教會「沒有辦完的」；全卷結尾，他要補足同工的「缺乏」。</p>","exp":"<p>「我打發亞提馬或是推基古到你那裡去的時候，你要趕緊往尼哥坡里去見我，因為我已經定意在那裡過冬。」（3:12）提多不是要在克里特待一輩子。保羅會派人來接手，提多再去和保羅會合。推基古是保羅多次託付的同工：保羅帶著捐項往耶路撒冷去的時候，「亞細亞人推基古」是同行的人之一（徒 20:4）；他也替保羅把以弗所書、歌羅西書送到教會（弗 6:21；西 4:7）。亞提馬只在這裡出現一次，名字留下了，故事沒有留下。</p><p>「你要趕緊給律師西納和亞波羅送行，叫他們沒有缺乏。」（3:13）亞波羅這個名字很值得停一下。在哥林多，有人說「我是屬亞波羅的」（林前 1:12），拿他和保羅對立，把兩位僕人當成兩個黨派的招牌。本系列哥林多前書講義第 1、3 章講過這段歷史。多年以後，保羅寫信叫提多好好為亞波羅送行，要他甚麼都不缺。被人拿來分黨的兩位僕人，自己從來沒有分黨。這正是 3:9--10 最好的註腳：遠避爭競的人，會為別人的事工預備盤纏。</p><p>這幾個名字不必硬套成任何職分的分類；他們就是一群彼此託付的同工。321 說無己才能合一——不是因為大家意見都一樣，而是因為沒有人需要別人屬於自己。</p>"},{"a":14,"z":15,"star":2,"grk":"<p lang=\"grc\">μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.</p><p lang=\"grc\">Ἀσπάζονταί σε οἱ μετʼ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ὑμῶν</p>","lit":"<p>而且我們的人也要學習專務美好的工作，為著必需的需要，好叫他們不致不結果子。</p><p>所有與我在一起的人都問你安。你要問候那些在信心中愛我們的人。恩典與你們眾人同在。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μανθανέτωσαν</td><td>manthanetōsan</td><td>要讓他們學習</td><td>第三人稱命令式</td></tr><tr><td>οἱ ἡμέτεροι</td><td>hoi hēmeteroi</td><td>我們的人</td><td>克里特全體信徒</td></tr><tr><td>εἰς τὰς ἀναγκαίας χρείας</td><td>eis tas anankaias chreias</td><td>為著必需的需要</td><td>供應實際的缺乏</td></tr><tr><td>ἄκαρποι</td><td>akarpoi</td><td>不結果子的</td><td>對照 1:16 ἀδόκιμοι</td></tr><tr><td>ἐν πίστει</td><td>en pistei</td><td>在信心中</td><td>愛的根源</td></tr><tr><td>ἡ χάρις μετὰ πάντων ὑμῶν</td><td>hē charis meta pantōn hymōn</td><td>恩典與你們眾人同在</td><td>全卷最後一句</td></tr></table>","gram":"<p>μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι（manthanetōsan de kai hoi hēmeteroi）：μανθανέτωσαν（manthanetōsan） 是第三人稱命令式，「要讓他們學」。<strong>行善是學來的，不是天生的。</strong>καλῶν ἔργων προΐστασθαι（kalōn ergōn proistasthai） 原封不動重複 3:8 的片語；和合本註腳「或譯：要學習行善」。ἵνα μὴ ὦσιν ἄκαρποι（hina mē ōsin akarpoi） 與 1:16 的 ἀδόκιμοι（adokimoi） 前後框住全卷：從在善事上可廢棄的人，到結果子的人。</p><p>3:15 有兩個問安：Ἀσπάζονταί（Aspazontai） 是直述，ἄσπασαι（aspasai） 是命令。τοὺς φιλοῦντας ἡμᾶς ἐν πίστει（tous philountas hēmas en pistei）：愛的根在信心裡。ἡ χάρις μετὰ πάντων ὑμῶν（hē charis meta pantōn hymōn） 的 ὑμῶν（hymōn） 是複數：這封寫給提多一個人的信，是要被全會眾聽見的。和合本「常」與你們同在的「常」是小字，譯者補上。</p><p><strong>經文鑑別 3:15。</strong>SBLGNT（與 WH、Treg、NA28）在 ὑμῶν（hymōn） 結束，沒有 Ἀμήν（Amēn）；RP 加上 Ἀμήν（Amēn）。書信結尾加「阿們」是抄本常見的禮儀性擴充，短讀法較可能是原文；和合本也沒有「阿們」，本講義從 SBLGNT。</p>","exp":"<p>「並且我們的人要學習正經事業，預備所需用的，免得不結果子。」（3:14）全卷最後一個吩咐用的是「學習」。行善不是少數熱心人的天分，是整個群體可以學、應該學的功課。提多要學，長老要學，老年人、少年人、僕人都要學。學的方式就在前面幾節：為推基古預備，為亞波羅送行，「預備所需用的」——看見實際的缺乏，就去補上。</p><p>「免得不結果子」和 1:16「在各樣善事上是可廢棄的」（1:16）把全卷框起來。病人是一群連自己的詩人都說常說謊話的人；痊癒的證據不是他們說得更屬靈，是他們開始結果子。結果子的根，是 3:5 的憐憫；不是先結果子才被接納，是被接納了才結果子。</p><p>「同我在一處的人都問你安。請代問那些因有信心愛我們的人安。願恩惠常與你們眾人同在！」（3:15）全卷的最後一個字是「恩惠」。這封信教人整頓、教人行善、教人遠避爭競，最後卻不是落在「行」上，是落在「恩」上。行善從恩惠開始，也回到恩惠。321 說繁殖——「我們的人要學習」，一代教一代；但每一代學到的第一課，都是同一句：「乃是照他的憐憫」（3:5）。從憐憫開始的群體，才會在恩惠裡結出果子。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《將那沒有辦完的事都辦整齊了》"],["p","弟兄姊妹平安，今天我們開始讀一卷很短的書信，提多書，第一章。"],["p","請你和我一起，到地中海的一個島上去。"],["q","克里特島，南岸，一個小小的海灣。秋天，風很大。"],["p","海灣裡停著一條大船，船上有幾個戴著鎖鍊的囚犯。"],["q","「我們沿岸行走，僅僅來到一個地方，名叫佳澳」（徒 27:8）"],["p","佳澳，有的譯本叫它「美港」。名字好聽，可是不好過冬。"],["p","囚犯裡面有一個人站起來說話。他叫保羅。"],["q","「眾位，我看這次行船，不但貨物和船要受損傷，大遭破壞，連我們的性命也難保。」（徒 27:10）"],["p","沒有人聽他的。"],["q","「但百夫長信從掌船的和船主，不信從保羅所說的。」（徒 27:11）"],["p","那一次，保羅只是從這個島的海邊經過。一個沒有人肯聽的囚犯。"],["p","照最可能的推想，過了幾年，他回來了。這一次，他不是戴著鎖鍊來的。"],["p","他也看見了問題：各城還沒有長老，有人說虛空話，有人為錢教導。"],["p","然後保羅又要離開了。可是這一次，他留下了一個人。"],["q","一個年輕的希臘人，站在碼頭上，看著船開走。"],["p","他叫提多。他沒有受過割禮。"],["q","「但與我同去的提多，雖是希臘人，也沒有勉強他受割禮」（加 2:3）"],["p","他被留在一個島上。這個島，連他們本地的詩人都說："],["q","「克里特人常說謊話，乃是惡獸，又饞又懶。」（1:12）"],["p","如果是你，被留在一個連自己人都說「常說謊話」的地方，你會想甚麼？"],["p","可是我要先說清楚：今天我們不是來佩服提多的，也不是來佩服保羅的。"],["p","這封信要我們看的，是那位把福音送到最難的地方的神。"],["p","這一章有三個詞：真，管，潔。我們走三步：無謊言的神，神的管家，口與行。"],["q","第一步：無謊言的神。"],["p","照常理，寫信給一個問題教會，一開口就該談問題。"],["p","可是保羅沒有。他先花了四節經文，說神是誰。"],["q","「神的僕人，耶穌基督的使徒保羅，憑著神選民的信心與敬虔真理的知識」（1:1）"],["p","請你留意第一個稱呼：神的僕人。"],["p","保羅寫了十三封信，只有這一次，在開頭自稱「神的僕人」。"],["p","他先是僕人，然後才是使徒。先站在主人腳前，才站到人面前。"],["p","再聽「敬虔真理」這四個字，原文是：那合乎敬虔的真理。"],["p","真理有一個方向，它一定往敬虔走。"],["p","真理不是拿來贏辯論的。真理是拿來活的。"],["p","有人讀了十年聖經，辯論誰也講不過他，家裡的人卻看不出他更溫柔。"],["p","保羅會說：你讀到的不是敬虔的真理，只是關於真理的資料。"],["p","然後，是這一章最高的一座山。"],["q","「盼望那無謊言的神在萬古之先所應許的永生」（1:2）"],["p","「無謊言的」，原文是 ἀψευδὴς。整本新約，只在這裡出現一次。"],["p","請你把第二節和第十二節放在一起聽。"],["p","第二節，神是「無謊言的」。第十二節，克里特人「常說謊話」。"],["p","原文是同一個字根。一正一反，同一封信，相隔十節。"],["q","保羅先說神是誰，才說克里特人是誰。"],["p","後面他會把人的病說得很重。可是在最前面，他先立了一根柱子：不管人怎樣，神不說謊。"],["q","「神非人，必不致說謊」（民 23:19）"],["p","再聽他甚麼時候應許的：萬古之先。"],["p","在克里特人學會說謊以前，在任何一個人失信以前，神已經定意要給人永生。"],["p","人的失信，不能使神失信。應許，比人的罪更早。"],["p","也許失信的，是你身邊的人，也許是你自己。"],["p","請你知道，這一章不是從你的可靠開始的。是從他的可靠開始的。"],["q","「到了日期，藉著傳揚的工夫把他的道顯明了」（1:3）"],["p","「顯明」，請你記住這個詞。這封信會用三次。"],["p","這是第一次：神在萬古之先應許，到了日期，就顯明出來。"],["p","保羅說這責任「交託了我」，原文是被動的：我被信任了。"],["p","一個逼迫過教會的人，竟然被神信任。這是神的憐憫。"],["p","提多讀到這裡，一定也明白：他被留在克里特，也是同一種被信任。"],["q","「現在寫信給提多，就是照著我們共信之道作我真兒子的。」（1:4）"],["p","一個受過割禮的猶太老人，叫一個沒有受割禮的希臘青年：我的真兒子。"],["p","他們共有的，只有一樣東西：共信之道。"],["p","屬靈的傳承，不是複製一個像自己的人。"],["p","請你也留意，第三節說神是「我們救主」，第四節說基督耶穌是「我們的救主」。"],["p","恩惠、平安，是從父神和救主基督耶穌來的。不是從保羅來的。"],["p","好，神是誰講清楚了。現在，保羅轉過身來，看著提多。"],["q","第二步：神的管家。"],["q","「我從前留你在克里特，是要你將那沒有辦完的事都辦整齊了，又照我所吩咐你的，在各城設立長老。」（1:5）"],["p","「辦整齊」，原文是 ἐπιδιορθώσῃ。整本新約也只出現這一次。"],["p","這一類的字，希臘的醫生用來說：把斷了的骨頭重新接正。把脫了臼的關節推回去。"],["p","先看一件事：斷，是真的。保羅沒有假裝克里特的教會沒事。"],["p","如果你心裡有一個地方斷了，你不必在神面前假裝沒事。"],["p","再看第二件事：接骨，不是換一副新骨頭。"],["p","醫生只能把骨頭擺回原位，上一塊夾板，然後等。"],["q","讓骨頭長好的，不是醫生。是那位造骨頭的。"],["p","「我留你」和「沒有辦完的」，原文是同一個字根。"],["p","我把你留下，好叫你把那留下來還缺的，接正。"],["p","全卷最後說「叫他們沒有缺乏」：從「缺」開始，到「不缺」結束。"],["p","那麼，怎麼接？保羅說：在各城設立長老。"],["p","克里特，古人叫它「百城之島」。原文說「一城一城地」。"],["p","克里特缺的，不是錢，不是房子，是可以託付的人。"],["p","我們國度321空中團契的弟兄姊妹，散在好幾個國家，好幾個時區。"],["p","我們缺的，也不是一個更好的平台。是在每一個地方，可以被託付的人。"],["q","「兒女也是信主的，沒有人告他們是放蕩不服約束的」（1:6）"],["p","資格的總綱是「無可指責」，原文是沒有人可以正式控告他。"],["p","「只作一個婦人的丈夫」，提摩太前書講義已經把幾種讀法擺出來了。今天我只說主軸：一心一意，對妻子忠誠。"],["p","「兒女也是信主的」，這一句我要很小心地講。"],["p","原文 πιστά 有兩個讀法。可以讀作「信主的」，也可以讀作「忠實可靠的」。"],["p","同一句的後半在解釋它：沒有人告他們是放蕩、不服約束的。"],["p","保羅要看的，是這個家有沒有秩序，有沒有在鄰舍面前成為福音的笑柄。"],["p","這裡說的，是還在父親家中、在他管教之下的兒女。"],["p","成年的兒女還沒有信主，並不自動使父親失去服事的資格。"],["q","「兒子必不擔當父親的罪孽，父親也不擔當兒子的罪孽。」（結 18:20）"],["p","所以今天如果有一位父親、一位母親，為還沒有信主的孩子流淚，請你聽清楚："],["p","這一節不是寫來羞辱你的。你的眼淚，神都數過。"],["p","我也不會在講台上，把任何一位同工的孩子拿來當例子。"],["p","這一節真正問的是：這個人在最近的人面前，是不是一個可信的人？"],["q","「監督既是神的管家，必須無可指責」（1:7）"],["p","請你留意，第五節說「長老」，第七節說「監督」。同一段話，同一群人。"],["p","可是這一節最重要的一個詞，是「神的管家」。"],["p","管家住在主人的家裡，管主人的錢，照顧主人的人。可是沒有一樣是他自己的。"],["q","一個管家最危險的，不是能力不夠，是忘了這不是他的家。"],["p","所以，保羅列了五個「不」。第一個就是：不任性。"],["p","「任性」，原文是 αὐθάδη，「自己」加上「高興」。自己高興就好，自己說了算。"],["p","後面四個：不暴躁，不因酒滋事，不打人，不貪無義之財。"],["p","其實都是「任性」長出來的果子。一個不受約束的己，遲早會傷人。"],["p","然後，保羅轉到正面。"],["q","「樂意接待遠人，好善，莊重，公平，聖潔自持」（1:8）"],["p","「樂意接待遠人」，原文是愛陌生人。在一個人人提防的社會，教會的領袖先打開家門。"],["p","「莊重」，是清醒、有分寸。第二章，這個字會發給全教會。"],["p","長老先活出來的，就是全教會後來要學的。"],["q","「堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人駁倒了。」（1:9）"],["p","家庭、品格、自制、待人，幾乎全是生命。只有最後這一條，是能力。"],["p","而且這條能力的動詞是「堅守」。不是發明，不是更新，是抓住已經交下來的。"],["p","「純正的」，原文是健康的。健康的教訓，叫人健康。"],["p","勸化，是把跌倒的人扶起來；駁倒，是把錯的揭出來。"],["p","只會勸不會駁，羊會被狼叼走。只會駁不會勸，羊會被牧人嚇走。"],["p","為甚麼長老一定要能駁倒人？第十節一開頭就是「因為」。"],["q","第三步：口與行。"],["q","「因為有許多人不服約束，說虛空話欺哄人；那奉割禮的更是這樣。」（1:10）"],["p","諷刺的是，神派去處理這件事的，正是一個沒有受割禮的希臘人。"],["q","「他們因貪不義之財，將不該教導的教導人，敗壞人的全家。」（1:11）"],["p","你聽見了嗎？「因貪不義之財」。第七節長老不可以的，正是他們拿來教導的動機。"],["q","看一個教導的人，先看他和錢的關係。"],["p","「敗壞人的全家」，原文是把整個家翻倒。"],["p","那時候一個家就是一個聚會。倒下的不是一個人，是一整群人。"],["p","今天的家，常常是在手機上被翻倒的。一段影片，一個群組，一個收費的課程。"],["p","那怎麼「堵住」？原文這個字，是給馬套上嚼環。"],["p","可是保羅沒有給提多拳頭。工具就是第九節：用健康的教訓駁倒。"],["q","對付假的，最好的方法，是把真的講清楚。"],["p","然後，就是那一句。"],["q","「有克里特人中的一個本地先知說：『克里特人常說謊話，乃是惡獸，又饞又懶。』」（1:12）"],["p","這一節，是整卷書最容易被講壞的一節。我要很慢地講。"],["p","這不是保羅在罵一個民族。"],["p","這是克里特人自己的詩人說的話。傳統上認為，是幾百年前一位叫厄庇墨尼得斯的本地詩人。"],["p","保羅說了兩次：他們中間的一個，他們自己的先知。是自己人說的，不是外人的嘲笑。"],["q","這是一個民族自己承認的病。"],["p","所以，請你千萬不要拿這一節，去對任何一個族群、地方、國家的人貼標籤，或是開玩笑。"],["p","拿別人的病來取笑，正是聖經要醫治的那種驕傲。"],["p","保羅自己沒有站在高處。到了第三章，他會這樣說："],["q","「我們從前也是無知、悖逆、受迷惑」（3:3）"],["p","請你聽見那個「也」字。保羅把自己放進去了。"],["q","「這個見證是真的。所以，你要嚴嚴地責備他們，使他們在真道上純全無疵」（1:13）"],["p","「嚴嚴地」，原文像一把刀切下去。可是這是外科醫生的刀，不是劊子手的刀。"],["p","「純全無疵」，原文又是那個字：健康。責備的目的，是叫他們好起來。"],["p","責備如果不是為了醫治，就只是發洩。嚴厲如果沒有盼望，就只是羞辱。"],["p","第十四節說到「人的誡命」，多半和吃甚麼、碰甚麼有關。所以第十五節，保羅說："],["q","「在潔淨的人，凡物都潔淨；在污穢不信的人，甚麼都不潔淨，連心地和天良也都污穢了。」（1:15）"],["p","請你一定要把這一節聽完。很多人只引前半句。"],["p","前半句說：在潔淨的人，凡物都潔淨。主耶穌也說過："],["q","「從外面進去的不能污穢人，惟有從裡面出來的乃能污穢人。」（可 7:15）"],["p","可是後半句說：連心地和天良也都污穢了。"],["p","所以這一節絕不是「甚麼都可以」的許可證。"],["q","保羅不是在放寬界線，是把界線從盤子移到心裡。"],["p","有人吃得很「潔淨」，心裡滿了論斷；有人拿「凡物都潔淨」當藉口，良心早已麻木。"],["p","這兩種人，都不在保羅說的「潔淨的人」裡面。"],["p","然後，我們來到這一章的谷底。也是整卷書地勢最低的地方。"],["q","「他們說是認識神，行事卻和他相背；本是可憎惡的，是悖逆的，在各樣善事上是可廢棄的。」（1:16）"],["p","「說是認識」，原文是公開的告白。「相背」，原文是公開的否認。"],["p","假師傅的病，不在口才，不在知識，在行事。"],["p","「可廢棄的」，原文是驗不過的。像一枚錢幣，放上天平，就露出了原形。"],["p","口與行分家的根在哪裡？就在第七節那個「任性」。自己說了算。"],["p","以自己為中心的人，會用神的名掩護自己的路。"],["p","弟兄姊妹，這一節不是只寫給假師傅的。"],["p","任何一個會講道理、會用屬靈詞彙的人，都可能慢慢活成這個樣子。"],["p","在聚會裡說得很好。回到家裡，回到辦公室，是另一個人。"],["p","我站在講台上，最需要聽這一節的，可能就是我自己。"],["p","第一章，就停在這裡。可廢棄的，驗不過的。"],["p","可是請你留意一件事。"],["p","第十六節說他們「悖逆」。這個字，第三章又出現了一次："],["q","「我們從前也是無知、悖逆」（3:3）"],["p","原文是同一個字。第一章說「他們」，第三章說「我們從前也是」。"],["p","第十六節說「在各樣善事上是可廢棄的」，第三章卻說「預備行各樣的善事」。"],["p","同一句話，從驗不過，翻成預備好。"],["p","怎麼從谷底上來？答案不在第一章。在第二章、第三章那兩次「顯明」。"],["q","「因為神救眾人的恩典已經顯明出來」（2:11）"],["p","不是靠更努力地行善。保羅說得很清楚："],["q","「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）"],["p","可是恩典也不是叫我們怎樣活都可以。恩典顯明出來，正是要教訓我們。"],["q","「他為我們捨了自己，要贖我們脫離一切罪惡，又潔淨我們，特作自己的子民，熱心為善。」（2:14）"],["p","「特作自己的子民」，這是神在西乃山上，對以色列人說的話。"],["q","「就要在萬民中作屬我的子民」（出 19:5）"],["p","如今，保羅把這句話，說給一群克里特的外邦人聽。"],["p","說給一群連自己的詩人都說「常說謊話」的人聽。"],["q","神沒有把福音送到最好的地方，而是送到最難的地方。"],["p","而那些又饞又懶的人，結局是：熱心為善。"],["p","不是因為他們先改好了。是因為有一位，為他們捨了自己。"],["p","弟兄姊妹，我們回到克里特南岸的那個海灣。"],["q","船開走了。碼頭上只剩下一個年輕人。"],["p","可是神沒有放棄這個島。"],["p","他把福音帶回來了。他把一個希臘青年留下來了。"],["p","可是提多不是這個島的救主。保羅也不是。"],["p","這封信一開頭就說了：神是「我們救主」，基督耶穌是「我們的救主」。"],["p","提多只是上夾板的人。讓骨頭長好的，是主。"],["p","今天，也許你就是被留在克里特的那個人。"],["p","也許你就是那個島。有一個地方斷了，自己也承認有病。"],["p","我想在這裡輕輕提三件事，都是從這一章自己長出來的。"],["p","第七節的「不任性」，提醒我們有己的人最危險。服事若是自己說了算，就已經離開了管家的本位。"],["p","第五節的「在各城設立」，提醒我們建立屬神的體系，是從找到可託付的人開始，不是從一棟樓開始。"],["p","第四節的「真兒子」，提醒我們屬靈父母與兒女的傳承。把共信之道，交給一個和你很不一樣的人。"],["p","這三件事，不是接正自己的方法，是被接正的人長出來的樣子。"],["p","請你記住這一章最高的那座山。"],["q","「盼望那無謊言的神在萬古之先所應許的永生」（1:2）"],["p","人會說謊。你我也說過謊。可是應許你的那一位，不說謊。"],["p","斷了的地方，他會接正。"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《神救眾人的恩典已經顯明出來》"],["p","弟兄姊妹平安，今天我們一起讀提多書第二章。"],["p","這一章的中間，有一個希臘字，我想先請你聽一聽。"],["q","παιδεύουσα。"],["p","和合本把它翻成四個字：教訓我們。"],["p","可是這個字，原來不是在學校裡用的。它是在家裡用的。"],["p","它是父母養孩子的字。教他吃飯，教他走路，跌倒了扶起來，做錯了管教他。"],["q","一個廚房，晚上七點。媽媽蹲下來，握著孩子的手，教他拿筷子。"],["p","保羅說，神的恩典就是這樣待你的。"],["p","我們常把恩典想成一張赦免令。法官蓋了章，你就可以走了。"],["p","赦免令很好。可是赦免令發下來，事情就結束了。"],["p","保羅說的恩典沒有結束。它跟著你回家，住下來，天天教你。"],["q","恩典不只是一張赦免令。恩典是一位跟你住在一起的老師。"],["p","弟兄姊妹，你今天早上出門前那一句說重了的話，那一個沒忍住的脾氣，"],["p","恩典不是在旁邊記帳。恩典蹲下來，握著你的手，說：再來一次。"],["p","這一章有三個詞：齡，樣，恩。"],["p","我們走三步：各等人的生活，福音的櫥窗，恩典是老師。"],["q","第一步：各等人的生活。"],["p","上一章收在一個很低的地方。"],["q","「他們說是認識神，行事卻和他相背」（1:16）"],["p","嘴裡說一套，腳下走一套。這是克里特教會的病。"],["p","病看完了，第二章開藥方。藥方的第一句很短。"],["q","「但你所講的總要合乎那純正的道理。」（2:1）"],["p","請你聽那個「但你」。那邊是說虛空話的人，這邊是你。"],["p","「純正」這個字，原文是醫生用的字：健康。"],["p","保羅不只要提多講對的道理，他要提多講叫人健康的道理。"],["p","所以接下去，保羅沒有給提多一套新的教義。"],["p","他講的全是生活：老年人，老年婦人，少年婦人，少年人，僕人。"],["q","健康的道理，第一個被檢驗的地方不是神學院，是飯桌。"],["p","先看坐在最前面的老弟兄。"],["q","「勸老年人要有節制、端莊、自守，在信心、愛心、忍耐上都要純全無疵。」（2:2）"],["p","保羅沒有叫老年人去做大事。他要他們健康。"],["p","「純全無疵」，原文又是那個字：健康。信得健康，愛得健康，等得健康。"],["p","年紀大的人最容易生的病，不一定在身體上，常常在心裡。"],["p","苦毒，固執，一開口就是當年。"],["q","「又勸老年婦人，舉止行動要恭敬，不說讒言，不給酒作奴僕，用善道教訓人」（2:3）"],["p","「讒言」這個字，原文就是「魔鬼」那個字。"],["p","一句「我只是關心她」，傳到第三個人耳朵裡，舌頭就在做魔鬼的工。"],["p","然後是最重要的一個字：「用善道教訓人」。"],["p","這個字整本新約只出現這一次。直譯是：教美善的老師。"],["p","保羅沒有叫老姊妹退休。他給了她們一個職分。"],["q","「好指教少年婦人，愛丈夫，愛兒女」（2:4）"],["p","請你看清楚，是誰在教誰。保羅沒有叫提多一個男傳道人挨家挨戶去教少婦。"],["p","他把這份工作，交給走過這條路的姊妹。"],["p","屬靈的母親，帶屬靈的女兒。這是世代接棒。"],["p","我們常以為這種愛是天生的。保羅卻說，它可以教。"],["q","凌晨三點，一個新手媽媽抱著哭了一整夜的嬰孩，自己也哭了。"],["p","愛是學會的。而且最好從一個走過的人身上學。"],["q","「謹守，貞潔，料理家務，待人有恩，順服自己的丈夫，免得神的道理被毀謗。」（2:5）"],["p","這一節，我們要很小心地讀，因為它常常被拿去傷人。"],["p","先看「料理家務」。原文最可靠的讀法，是「在家作工的」。"],["p","重點在「作工」，是勤勞，不懶惰。它不是禁足在家。"],["p","這一節不能拿來限制姊妹出外工作，也不能拿來攔阻姊妹服事。"],["p","再看「順服自己的丈夫」。「自己的」三個字很要緊，不是所有的男人。"],["p","然後請你一定要把這一節最後一句讀完。"],["q","免得神的道理被毀謗。"],["p","順服的目的是朝外的。是為了福音的名聲，不是為了丈夫的權力。"],["p","保羅這一段只對妻子說話，沒有一句授權丈夫拿這節經文去要求妻子。"],["p","同一位保羅，在以弗所書也說過："],["q","「又當存敬畏基督的心，彼此順服。」（弗 5:21）"],["p","誰拿這一節去管人，誰就離開了本位。"],["p","還有一件事，講台上必須說清楚。"],["q","家暴不在順服的範圍。"],["p","如果你在家裡人身安全受到威脅，聖經沒有叫你忍下去，教會也不可以這樣勸你。"],["p","先保護生命，離開危險，依法求助。"],["p","教會要陪你通報，陪你找到一個安全的地方。"],["p","叫一位被打的妻子留下來忍，不會使神的道理得榮耀。"],["p","那正好是讓神的道理被毀謗。"],["p","回到克里特。那是一個連自己的詩人都說「常說謊話」的社會。"],["p","在那樣的地方，一群妻子愛家，勤勞，良善，鄰舍就看見：福音不是空話。"],["p","這不是要姊妹證明自己夠好。是她們的家，成了福音的櫥窗。"],["q","「又勸少年人要謹守。」（2:6）"],["p","對老年人說了一串，對少年婦人說了七樣，對少年人只說一個字。"],["p","原文是 σωφρονεῖν。心思健全，有分寸，不被衝動牽著走。"],["p","這個字和它的同族字，在提多書出現了六次，從長老一路串到少年人。"],["p","請你記住這個字。到了第十二節，它會再回來，而且換了一位老師。"],["p","老年人，老年婦人，少年婦人，少年人。每一種年齡，都有一個樣子。"],["p","可是一個藥方，總要先讓開藥的人自己吃。"],["p","保羅講完少年人，馬上轉過頭來，對提多說：你自己。"],["q","第二步：福音的櫥窗。"],["q","「你自己凡事要顯出善行的榜樣；在教訓上要正直、端莊」（2:7）"],["p","勸別人有分寸的人，自己就得先成為那個樣子。"],["p","「榜樣」這個字，原文是 τύπον，是打下去留下的印記，是模子。"],["p","提多的資格常被人質疑。保羅沒有叫他證明血統，叫他活出樣子。"],["q","「言語純全，無可指責，叫那反對的人，既無處可說我們的不是，便自覺羞愧。」（2:8）"],["p","「自覺羞愧」，原文是轉過頭來：找不到把柄，只好回頭看看自己。"],["p","所以榜樣不是表演。表演撐得過一場聚會，榜樣是「凡事」。"],["p","然後保羅對聚會裡站在最後面的那一群人說話。"],["q","「勸僕人要順服自己的主人，凡事討他的喜歡，不可頂撞他」（2:9）"],["p","這一段比剛才那一段更容易被誤用，所以我們先說它沒有說甚麼。"],["p","「僕人」這個字，原文是奴隸。他在法律上屬於主人。"],["p","他不是今天簽合約、領薪水、可以辭職的員工。"],["q","新約沒有為奴隸制背書。"],["p","同一位保羅，把這樣的事列在違背純正道理的罪裡："],["q","「搶人口」（提前 1:10）"],["p","保羅在這裡不是在替制度說話。他是在對一群身在制度裡、沒有選擇的弟兄姊妹說話："],["p","你們今天怎樣活，才能讓福音被看見？"],["q","「不可私拿東西，要顯為忠誠，以致凡事尊榮我們救主－神的道。」（2:10）"],["p","「顯為忠誠」，原文用的是「信心」那個字。顯出全然美好的信實。"],["p","請你聽清楚：忠誠是品格，不是無條件服從。"],["p","然後是全段最美的一個字，「尊榮」。原文是 κοσμῶσιν。"],["p","它的意思是妝飾、打扮。英文的化妝品，就是從這個字來的。"],["q","一個奴隸的忠誠，可以替神的道化妝。"],["q","克里特，一戶人家的帳房，深夜。主人點錢，一個銅板都沒有少。"],["p","在一個奴隸常被看成偷懶、愛偷東西的社會，主人第一次停下來想："],["p","這是甚麼樣的神，能把一個人變成這樣？"],["p","最低的位置，成了福音最亮的櫥窗。"],["p","弟兄姊妹，沒有一個位置，低到不能尊榮神。"],["p","可是把這兩節帶進今天的辦公室，要非常小心。"],["p","這兩節不能用來要求員工忍受剝削，忍受霸凌，忍受欠薪。"],["p","也不能用來叫人去執行違法的命令。那些是不公義，聖經從來不替它們說話。"],["p","今天的弟兄姊妹有勞動法，有申訴的管道，有離職的自由。"],["q","使用它們，不違背 2:9。"],["p","這兩節真正要問你的，是另一件事。"],["p","在可以偷懶的地方，你不偷懶。在可以多報的地方，你不多報。"],["p","妻子的順服，僕人的忠誠，提多的榜樣，三個人站在三個不同的地方。"],["p","可是他們都朝著同一個方向：免得神的道理被毀謗，凡事尊榮我們救主。"],["q","順服是為了福音的名聲，不是為了任何人的權力。"],["p","講到這裡，你可能會覺得很累。"],["p","老年人要健康，少婦要愛家，少年人要有分寸，傳道人要作榜樣，連奴隸都要忠誠。"],["p","前面十節，全是「要」。"],["p","如果這篇講道停在這裡，我們就只是拿到一張更長的清單。"],["p","可是第十一節的第一個字，原文是「因為」。"],["p","保羅終於要說，這一切是怎麼做得到的。"],["q","第三步：恩典是老師。"],["q","「因為神救眾人的恩典已經顯明出來」（2:11）"],["p","這是整卷提多書最高的地方。"],["p","從這一節到第十四節，在原文是一個長句，主要動詞只有一個：顯明。"],["p","這個字像黎明的光，一下子照出來。"],["q","克里特，清晨。海面還是黑的，東邊的山頭忽然亮了一條線。"],["p","那道光不是一個道理。那道光是一個人。"],["p","神的兒子來了，住在我們中間，死了，又復活了。"],["p","而且這光照向「眾人」。連剛才那個奴隸，都在裡面。"],["q","「教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日」（2:12）"],["p","又回到那個字了：παιδεύουσα。恩典教養我們。"],["p","請你看，這一句同時擋住了兩條歧路。"],["p","一條路說：要先變好，神才給恩典。"],["p","不是。是恩典先來，教導在後。"],["q","我們不是靠行善得救，是被救的人學會行善。"],["p","另一條路說：反正有恩典，怎樣活都沒關係。"],["p","也不是。因為恩典本身會教人。真正的恩典，不會讓一個孩子一直拿不好筷子。"],["p","「除去」這個字，原文是「否認」。第一章剛用過。"],["p","假師傅用行為否認神。恩典卻教我們，向不敬虔說「不」。"],["p","對自己有分寸，對別人公義，對神敬虔。"],["p","還記得給少年人的那個字嗎？「自守」，就是同一個字，第六次出現。"],["p","人的勸勉做不到的，恩典這位老師做得到。"],["p","而且這位老師，不只教我們低頭過日子，也教我們抬頭。"],["q","「等候所盼望的福，並等候至大的神和我們救主耶穌基督的榮耀顯現。」（2:13）"],["p","弟兄姊妹，這一節我們要停下來。"],["p","第十一節說恩典「顯明」了。第十三節說還有一次「顯現」。"],["p","第一次顯現在馬槽，在十字架，那是恩典。"],["p","第二次顯現在將來，那是榮耀。"],["q","我們活在兩次顯現的中間。"],["p","保羅沒有給日期，只給方向。我們不算日子。"],["p","「等候」原文是一面過日子、一面等。等候的人，今天就自守、公義、敬虔。"],["p","然後請你聽這個稱號：至大的神和我們救主耶穌基督。"],["p","在原文裡，「神」和「救主」前面，只有一個冠詞。"],["p","照希臘文的慣例，這樣的寫法多半指同一位。"],["p","所以本講義讀成一位：耶穌基督，就是我們那至大的神和救主。"],["p","和合本的註腳也這樣註：或譯「神－我們救主」。"],["p","下一節只說「他」，捨了自己的只有一位。"],["p","也有敬虔的學者讀成兩位：至大的神是父，我們的救主是耶穌基督。"],["p","因為保羅在別處，常常分開稱呼父與子。"],["q","但基督的神性，不靠這一節成立。"],["p","約翰說「道就是神」，多馬說「我的主！我的神！」"],["p","保羅在羅馬書也稱基督是在萬有之上、永遠可稱頌的神。"],["p","所以我們不拿這一節去攻擊讀法不同的人，也不用它把任何人劃出門外。"],["p","爭的是一個冠詞，敬拜的是同一位主。"],["p","可是弟兄姊妹，請你想一想，克里特的信徒聽到這句話，會想起甚麼。"],["q","城門口，一塊石碑，刻著羅馬皇帝的名字。後面兩個稱號：神，救主。"],["p","保羅把這兩個稱號拿過來，一起放在一個被釘十字架的加利利人身上。"],["p","碑上的「神與救主」會倒。我們等候的那一位，會來。"],["p","這是整卷書最高的稱號。我們常說「讓耶穌作王」，根據就在這裡。"],["p","然後，這一個長句落地了。"],["q","「他為我們捨了自己，要贖我們脫離一切罪惡，又潔淨我們，特作自己的子民，熱心為善。」（2:14）"],["p","恩典為甚麼能教人？因為它不是一套道理。它是一位捨了自己的人。"],["p","老師教你拿筷子，是握著你的手。這一位老師教你，是先把自己給了你。"],["p","請你看次序。先是「捨了自己」，然後是「贖」，然後是「潔淨」。"],["p","最後，才是「熱心為善」。"],["q","善行不是贖價，是被贖的結果。"],["p","贖價他已經付了，所以我們不是靠行善得救。"],["p","他贖我們，正是要我們成為熱心為善的人。所以也不是「反正得救了，怎樣活都可以」。"],["p","還有一句，你可能聽過很多次，卻沒有發現它的分量：特作自己的子民。"],["p","這不是保羅自己發明的話。這是神在西乃山上說的話。"],["q","「就要在萬民中作屬我的子民」（出 19:5）"],["p","出埃及記講義第十九章講過：十誡還沒有頒布，神先告訴他們是誰。申命記講義第七章又說了一次。"],["p","那時候的子民，是從埃及被贖出來的奴隸。"],["p","如今的子民，是從各樣罪惡被贖出來的克里特人。"],["p","上一章說，連他們自己的詩人都說「克里特人常說謊話」。那是一個民族自己承認的病。"],["p","這一章說，神要這群人作他的珍寶。"],["q","神沒有把福音送到最好的地方。他把福音送到最難的地方。"],["q","「這些事你要講明，勸戒人，用各等權柄責備人；不可叫人輕看你。」（2:15）"],["p","「這些事」，就是前面的全部：各等人的生活，加上那位教人的恩典。"],["p","只講前十節，會變成律法。只講後四節，會變成空話。"],["p","「各等權柄」也不是轄制。它只能用在「這些事」上，不能拿來壓下不同的聲音。"],["p","怎樣才不被人輕看？回到第七節：凡事顯出善行的榜樣。"],["p","整章從「但你所講的」開始，到「這些事你要講明」結束。"],["p","講的人自己，先站在所講的恩典底下。"],["p","弟兄姊妹，國度321空中團契常常說一句話：改變觀念就改變生命，改變生命就改變生活。"],["p","讀完這一章，你會發現，這句話在第十一、十二節有一個原型。"],["p","恩典先教訓我們，然後我們在今世自守、公義、敬虔度日。"],["p","先是被教，後是過日子。次序不能顛倒。"],["p","可是我們今天不是來證明一句口號。我們是來看那位教我們的主。"],["p","我們也常說「無己」。這一章告訴我們，無己的源頭不在我們身上。"],["q","先有一位為我們捨己的主，才有能捨己的我們。"],["p","善行若是為了證明自己，那是有己。"],["p","善行若是因為他為我們捨了自己，那是無己。"],["p","讀完這一章，請你不要更佩服提多，也不要只記住一張該做的清單。"],["p","請你更愛那一位，握著你的手、天天教你，又為你捨了自己的主耶穌。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件：找一個比你年輕的弟兄姊妹，請他吃一頓飯，聽他說話。"],["p","第二件：每天晚上睡前，問恩典這位老師一個問題：今天你教了我甚麼？"],["p","如果今天又跌倒了，不要躲。他會蹲下來，握著你的手，說：再來一次。"],["p","然後抬頭看一看東邊。那一位，會再一次顯現。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《乃是照他的憐憫，藉著重生的洗和聖靈的更新》"],["p","弟兄姊妹平安，今天我們一起讀提多書最後一章，第三章。"],["p","今天，我想請收信的人先開口：提多。"],["p","提多沒有留下自己的話。接下來這一段，是我替他說的。"],["p","如果提多開口，讀到這一章第三節，我想他會這樣說。"],["q","克里特，一個晚上。一盞油燈，一卷剛拆開的信。"],["q","「我是提多。我不是猶太人，我是希臘人。」"],["p","「我沒有受過割禮。我的家譜裡，一個先知也沒有。」"],["p","「很多年前，保羅帶我上耶路撒冷。」"],["q","「過了十四年，我同巴拿巴又上耶路撒冷去，並帶著提多同去。」（加 2:1）"],["p","「我知道他為甚麼帶我去。那時有人說，外邦人要先受割禮，才算屬神。」"],["q","「但與我同去的提多，雖是希臘人，也沒有勉強他受割禮」（加 2:3）"],["p","「那一天，我站在使徒面前，甚麼也沒有做。」"],["p","「我就是證據：神接納一個人，不是因為他做了甚麼。」"],["p","「現在，保羅把我留在克里特。各城還沒有長老，有人為了錢教導，敗壞人的全家。」"],["p","「說實話，有些晚上我會想：這些人，怎麼會這樣？」"],["p","「然後，我讀到這一句：」"],["q","「我們從前也是無知、悖逆、受迷惑」（3:3）"],["p","「我停了很久。我們？保羅，你也在裡面？那麼，我呢？」"],["p","「我想起小時候拜過的神像，想起我心裡也有過的嫉妒。」"],["p","「我不是比克里特人好的人。我只是比他們早一點，蒙了憐憫。」"],["p","好，提多先說到這裡。"],["p","那些話是我替他說的。可是他讀到的那一節，是真的寫給他，也寫給我們。"],["p","這一章有三個詞：柔，憐，果。"],["p","全卷三篇：整，教，行。今天是最後一個字：行。"],["p","可是請你聽清楚：這個「行」字，是從「憐」字長出來的。"],["p","我們走三步：我們從前也是，照他的憐憫，學著結果子。"],["q","第一步：我們從前也是。"],["q","「你要提醒眾人，叫他們順服作官的、掌權的，遵他的命，預備行各樣的善事。」（3:1）"],["p","「提醒」，原文 Ὑπομίμνῃσκε，是叫人想起來。"],["p","不是新規矩。是本來知道，只是會忘。"],["p","第二章對家裡的人說話。第三章，把鏡頭拉到城裡。"],["p","一群剛信主的人很容易以為：我屬天，地上的秩序跟我無關。"],["p","保羅說，不是這樣。納稅，守法，做一個預備好行善的人。"],["p","「各樣的善事」，第一章出現過。那裡說，說虛空話的人「在各樣善事上是可廢棄的」。"],["p","到了這裡，同一句話，只換了最後一個詞：預備好的。"],["p","從可廢棄的，到預備好的。這就是這封信要的醫治。"],["p","順服作官的，有沒有界線？有。界線就在「遵他的命」這個字上。"],["p","原文 πειθαρχεῖν。彼得在公會面前，用的就是這個字。"],["q","「順從神，不順從人，是應當的。」（徒 5:29）"],["p","順從官長是常態，順從神是界線。"],["p","當權柄要人拜偶像、作假見證、傷害無辜，使徒的回答已經寫在聖經裡了。"],["p","可是彼得說「不」的那一天，沒有咒罵公會。他們挨了打，回去照樣傳道。"],["p","我們的團契散在不同的國家，活在不同的制度底下。"],["p","講台上，我不替任何政權背書，也不攻擊任何政權。"],["p","同一節經文對每一個人說：在神的界線裡順服；到了界線外，溫柔而堅定地順從神。"],["q","「不要毀謗，不要爭競，總要和平，向眾人大顯溫柔。」（3:2）"],["p","上一節有界線。這一節，沒有例外。"],["p","「不要毀謗」，原文是不毀謗任何一個人。你不同意的那一位，也在內。"],["p","第二章說「免得神的道理被毀謗」，是同一個字。"],["p","我們不要神的道被毀謗；我們自己，也不毀謗任何人。"],["p","今天的毀謗常常不用嘴巴，用手指。一張轉傳的圖，一句嘲諷的留言。"],["p","你可以就事論事。可是不要羞辱人的人格。"],["p","「溫柔」不是軟弱。是有力量，卻不拿來壓人。"],["p","這一句先適用在誰身上？先適用在有權柄的人身上。"],["p","帶領的人先放下爭競，會眾才學得會溫柔。"],["p","可是憑甚麼？憑甚麼要向那個不講理的人溫柔？"],["p","保羅的回答，在下一節的第一個字：因為。"],["q","「我們從前也是無知、悖逆、受迷惑、服事各樣私慾，和宴樂，常存惡毒嫉妒的心，是可恨的，又是彼此相恨。」（3:3）"],["p","這是全卷第二個谷底，也是全卷最深的伏筆揭開的地方。"],["p","「悖逆」這個字，第一章用過。說的是那些口裡認識神、行事卻和他相背的人。"],["p","第一章說「他們」。第三章，同一個字回來了，主詞換成了「我們」。"],["p","原文有兩個小字，καὶ ἡμεῖς，連我們也。"],["p","保羅在裡面，提多在裡面，坐在克里特家庭聚會裡的每一個人，都在裡面。"],["p","寫這份清單的人，自己的名字就在上面："],["q","「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（提前 1:13）"],["p","這份清單像一道往下走的樓梯。"],["p","從頭腦：無知。到意志：悖逆。到方向：受迷惑。"],["p","「受迷惑」是被動的。人以為自己在選路，其實是被牽著走。"],["p","再往下：服事私慾。「服事」原文就是當奴隸。真正的奴役，在裡面。"],["p","最後一階：是可恨的，又是彼此相恨。罪走到最後，是關係碎掉了。"],["p","這一節拆掉了「我們」和「他們」中間的那道牆。"],["p","所以第二節的溫柔，不是一種策略。是一種記性。"],["q","忘了自己從哪裡來的人，很難向眾人溫柔。"],["p","記得的人，看見今天還在悖逆裡的人，心裡會說：那是從前的我。"],["p","如果這一章停在第三節，那就太黑了。"],["p","然後，第四節的第一個字出現了：但。"],["q","第二步：照他的憐憫。"],["q","「但到了神－我們救主的恩慈和他向人所施的慈愛顯明的時候，」（3:4）"],["p","弟兄姊妹，請你在這裡停下來。今天最重要的，就是這四節。"],["p","在原文，從第四節到第七節，是一整句話。"],["p","一整句話裡，只有一個主要動詞，在第五節：他便救了我們。"],["p","改變不是從我們這一邊開始的。"],["p","不是有一天我們變好了。是有一天，神的恩慈顯明了。"],["q","從第三節到第四節，只隔一個字，卻是從黑夜到天亮。"],["p","天亮，不是人努力出來的。是太陽升起來了。"],["p","「顯明」這個字，第二章用過："],["q","「神救眾人的恩典已經顯明出來，」（2:11）"],["p","這是第二次。兩次說的，都是耶穌基督第一次來到世上。"],["p","第一次顯現帶來恩典，第二次顯現帶來榮耀。教會活在兩次中間。"],["p","「他向人所施的慈愛」，原文只有一個字，φιλανθρωπία，愛人類。"],["p","英文的 philanthropy，慈善事業，就從這個字來。"],["p","保羅船難以後，馬耳他島上的人善待他，路加用的也是這個字。人偶爾也會這樣待人。"],["p","可是在這裡，愛人類的是神自己；他愛的，是第三節那份清單上的人。"],["p","克里特的城裡，立著稱頌君王和恩主仁厚愛人的石碑。保羅說，真正的恩主是神我們救主。"],["p","接著，是這一章的山頂。"],["q","「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。」（3:5）"],["p","先看保羅否定了甚麼。"],["p","他沒有只說：不是因為我們的壞行為。他說：並不是因我們自己所行的義。"],["p","原文是「在義中所行的」。連我們做對的事、做好的事，都不算。"],["p","他還多加了一個字，ἡμεῖς，我們自己。"],["q","救恩，不記在我們的帳上。"],["p","那記在誰的帳上？乃是照他的憐憫。"],["p","原文「他的」放在「憐憫」前面，重音落在：他的。"],["p","一邊是我們自己，一邊是他的。動詞夾在中間：他救了我們。"],["p","憐憫，是看見一個人沒有資格，卻仍然伸出手。"],["p","如果提多在這裡再開口，他會說：這一句，我在耶路撒冷就聽懂了。神接納我，照的是他的憐憫。"],["p","接著是教會討論了很久的一句話：重生的洗和聖靈的更新。"],["p","「重生」，原文是再一次的出生。「更新」，就是心意更新而變化的那個字。"],["p","「重生的洗」指甚麼？教會歷史上有三種讀法。"],["p","有的傳統認為，神在洗禮中施行重生。"],["p","有的認為，洗禮是重生的記號和印證，施行重生的是聖靈。"],["p","有的認為，「洗」是聖靈潔淨人心的比喻，和水禮沒有直接關係。這使我們想起："],["q","「我也要賜給你們一個新心，將新靈放在你們裡面」（結 36:26）"],["p","三種傳統裡都有愛主的弟兄姊妹。講義都陳列了，講台上不裁判。"],["p","我們不用這一節判定任何宗派的人有沒有得救。不說受洗就得救，也不說沒受洗不能得救。"],["p","可是這一節自己有一個落點，三種傳統都站得上去，就在前半句。"],["q","連洗禮，也不是我們所行的義。"],["p","重生是神的工作。不是儀式的工作，也不是人決志的工作。"],["p","救我們的不是水本身，也不是一次舉手。是照他的憐憫行事的神；這一點，三種傳統都同意。"],["q","「聖靈就是神藉著耶穌基督－我們救主厚厚澆灌在我們身上的，」（3:6）"],["p","「澆灌」，和五旬節那天是同一個字。那天的人群裡，就有克里特人。"],["p","克里特的福音，也許就是從那一天開始的。"],["p","「厚厚」兩個字很重要。聖靈不是偶爾來幫忙的客人，是神豐豐富富倒在我們身上的。"],["p","請你再聽一次，這一句話裡有誰。"],["p","父神的恩慈顯明了。聖靈澆灌下來。藉著誰？藉著耶穌基督，我們的救主。"],["q","一句話裡，父、子、聖靈，都在為一群從前彼此相恨的人工作。"],["q","「好叫我們因他的恩得稱為義，可以憑著永生的盼望成為後嗣。」（3:7）"],["p","「稱為義」，是法庭上的宣告。「後嗣」，是家裡的身分。"],["p","神不只把我們從被告席上放出來。他把我們帶回家。"],["p","先稱義，後成為後嗣。身分在先，產業在後。"],["p","不是表現夠好，才被收進家裡。是被收進家裡，才開始學習像這個家的人。"],["p","一個被收進家裡的孩子，接下來要學甚麼？學著做這個家裡的事。"],["q","第三步：學著結果子。"],["q","「這話是可信的。我也願你把這些事切切實實地講明，使那些已信神的人留心做正經事業。」（3:8）"],["p","「這話」，就是剛才那一整句：神照他的憐憫救了我們。"],["p","保羅要提多切切實實講明的，首要的是福音。然後，才是正經事業。"],["p","所以這一節，一定要和第五節放在一起讀。"],["q","「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）"],["q","行是果，不是根。"],["p","兩句都是真的。次序不可以顛倒。"],["p","顛倒過來，就成了想用好行為贖身的律法主義。"],["p","把後一句刪掉，就成了「反正已經得救，怎麼過都行」的廉價恩典。"],["p","兩條路，都不是保羅的福音。"],["p","主詞是「那些已信神的人」，原文是完成式：信，已經成立了。"],["p","不是為了被接納而行，是因為已經被接納而行。"],["p","「做正經事業」，原文 προΐστασθαι，字面是站在前頭。"],["p","像經營自己的家一樣經營善事。不是被人叫了才動，是自己帶頭去做。"],["p","第一章在善事上可廢棄的人，現在成了站在善事前頭的人。"],["p","不是藥換掉了。是同一帖恩典的藥，見效了。"],["p","善行若是為了證明自己，那還是有己。"],["p","善行若是因為他先為我們捨了自己，那才是無己。"],["q","「要遠避無知的辯論和家譜的空談，以及紛爭，並因律法而起的爭競，因為這都是虛妄無益的。」（3:9）"],["p","「遠避」，原文是從旁邊繞過去。保羅沒有叫提多一場一場去辯贏。"],["p","這不是說不可以談神學。標準在第八、第九節的對照裡：有益，還是無益？"],["p","網路上很多論戰，只要問一句就夠了：辯完之後，有誰得了益處？"],["q","「分門結黨的人，警戒過一兩次，就要棄絕他。」（3:10）"],["p","這一節在教會歷史上，常常被用錯。"],["p","誰有不同意見，就被說成分門結黨。誰質疑領袖，就被冷落。"],["p","可是原文 αἱρετικός，字根是「選擇」：一個自己選邊、拉人、使教會撕裂的人。"],["p","提出問題的人，不是這一節說的人。"],["p","表達不同意見的人，質疑同工的人，揭發錯誤的人，也都不是。"],["q","教會若連問題都不能問，生病的反而是教會。"],["p","再看程序：警戒過一兩次。不是第一次就趕走，是先勸，再勸。"],["p","「警戒」，是把人的心思放回正位。目的是挽回，不是定罪。"],["q","「他若聽你，你便得了你的弟兄」（太 18:15）"],["p","「棄絕他」，是不再和他捲進沒有止境的爭論，不讓他把羊群帶走。"],["p","它絕不是許可冷暴力。不是在走廊上裝作看不見他，更不是在講台上羞辱他。"],["p","第二節的「向眾人大顯溫柔」，先適用在處理這件事的人身上。"],["p","門仍然開著。他若回頭，第三節那句話也是為他預備的：我們從前也是。"],["p","然後，這封信變得很生活。保羅開始安排人。"],["q","「你要趕緊給律師西納和亞波羅送行，叫他們沒有缺乏。」（3:13）"],["p","亞波羅這個名字，請你停一下。"],["q","哥林多，一間擠滿人的家庭聚會。有人喊出自己的派別。"],["q","「我是屬亞波羅的」（林前 1:12）"],["p","在哥林多，有人把亞波羅和保羅對立起來，當成兩個黨派的招牌。"],["p","多年以後，保羅寫信給提多：好好為亞波羅送行，叫他甚麼都不缺。"],["q","被人拿來分黨的兩位僕人，自己從來沒有分黨。"],["p","遠避爭競的人，會為別人的事工預備盤纏。"],["p","這幾個名字，不必硬套成任何職分的分類。他們就是一群彼此託付的同工。"],["q","「並且我們的人要學習正經事業，預備所需用的，免得不結果子。」（3:14）"],["p","全卷最後一個吩咐，用的是「學習」。行善是學來的，不是天生的。"],["p","怎麼學？為亞波羅送行。看見實際的缺乏，就去補上。"],["p","「免得不結果子」，和第一章「可廢棄的」，把整封信框了起來。"],["p","果子的根，在第五節：憐憫。不是先結果子才被接納，是被接納了才結果子。"],["p","最後一節，全卷最後一個字是甚麼？"],["q","「願恩惠常與你們眾人同在！」（3:15）"],["p","這封信教人整頓，教人行善。最後卻不是落在「行」上，是落在「恩」上。"],["p","這一章的次序很清楚：第五節憐憫，是生命；第二節溫柔，是關係；第八節正經事業，才是事工。"],["p","先生命，再關係，後事工。是這一章本來就這樣走。"],["p","第三節叫我們回到本位，那是謙卑。第五節說連我的義都不是我的，那是無己。"],["q","克里特，深夜。信讀完了，提多把信捲起來。"],["p","如果他再開口，我想他不會說：你們看，我把克里特整頓好了。"],["p","他會說：「我從前也是。可是神我們救主的恩慈，向我顯明了。」"],["p","「所以明天早上，我要回到那些還在悖逆裡的人中間。因為他們，就是從前的我。」"],["p","弟兄姊妹，你不需要更佩服提多，也不需要更佩服保羅。他們都是被憐憫找到的人。"],["p","你需要看見的，是那一位恩慈顯明出來的救主。"],["p","也許今天，你心裡有一個很難溫柔對待的人。先想一想：我們從前也是。"],["p","然後，明天去學一件正經事業。不是為了證明你自己，是因為他已經先救了你。"],["q","「並不是因我們自己所行的義，乃是照他的憐憫」（3:5）"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"作者是使徒保羅嗎？保羅到過克里特嗎？教牧書信的真實性該怎樣看？","r":"1:1--5；3:12--13","ch":[],"why":"一、本講義採使徒保羅；並陳託名說的理由與回應——沿用提摩太前書立場一（提前 ISS00_1），本卷補述：使徒行傳只記保羅以囚犯身份路過克里特的海口，最自然的解法是第一次羅馬監禁獲釋後再訪。提多書開頭用一段在保羅書信裡僅次於羅馬書的長問安自我介紹，信末又提到四個同工的名字與一個過冬的城；可是使徒行傳裡找不到保羅在克里特傳道的記載。若不在開卷講定作者與時間線，讀過一點學術討論的信徒會以為講台在迴避問題，沒讀過的信徒則會在第一次聽見「託名」兩個字時不知所措。","pos":[["【一】經文問的是甚麼","","<p>信一開頭就署名：「神的僕人，耶穌基督的使徒保羅」（1:1）；接著說這是寫給「照著我們共信之道作我真兒子的」提多（1:4）。第一件交代的事是：「我從前留你在克里特，是要你將那沒有辦完的事都辦整齊了，又照我所吩咐你的，在各城設立長老」（1:5）。信末又有具體的行程：「我打發亞提馬或是推基古到你那裡去的時候，你要趕緊往尼哥坡里去見我，因為我已經定意在那裡過冬」（3:12）。</p><p>問題在這裡：使徒行傳記保羅到過克里特，只有一次——他是囚犯，坐著往羅馬的船，「貼著克里特背風岸」（徒 27:7）行過，在一個叫「佳澳」的海口停過（徒 27:8；一般譯作美港），後來船上的人不聽他的勸開船，遇上大風；他在船上說：「你們本該聽我的話，不離開克里特」（徒 27:21）。那一次他沒有時間「在各城設立長老」。教牧書信三卷（提摩太前書、提摩太後書、提多書）的字彙、教會組織、神學重點，又和保羅其他書信有些不同。<strong>經文問的是：這封信真是保羅寫的嗎？如果是，保羅甚麼時候在克里特工作過？</strong></p>"],["使徒保羅親筆（或口授）說","","<p>這是初代教會的主流見解——第二世紀末的愛任紐已明引教牧書信為保羅所寫，穆拉多利殘篇也把提多書列在保羅書信裡（第二世紀的馬吉安不收教牧書信，他的正典本來就刪改許多經卷）——也是歷代多數福音派學者的立場。理由有幾條：信中自稱保羅，而且不只署名，還交代了許多不必要的私人細節——亞提馬、推基古、律師西納、亞波羅、在尼哥坡里過冬（3:12--13）；一個冒名的人很少會編出一個「亞提馬」，而且這個名字在新約別處從未出現。提多是「希臘人」（加 2:3），是保羅派去處理哥林多教會最難的事的人（林後 7:6；8:23），被交付在一個新教會裡「設立長老」，這和使徒行傳裡保羅「在各教會中選立了長老」（徒 14:23）的作法一致。至於字彙不同，主題不同字彙就不同；保羅也常用代筆人（這使我們想起羅 16:22 德提代筆）。</p><p><strong>難處：</strong>教牧書信約有三分之一的字不見於保羅其他書信；「敬虔」「純正的道理」「這話是可信的」這些教牧書信的常見用語，在保羅其他書信裡幾乎見不到。代筆人說可以解釋一部分，但若代筆人的手筆太重，「保羅寫的」到底是指甚麼程度，需要誠實地說明，不能一句「當然是保羅」帶過。</p>"],["保羅授意、門徒成書說（代筆人或保羅身邊的人整理）","","<p>部分學者採取中間的看法：信的內容與權柄來自保羅，但成書的文字出自保羅晚年身邊的一位同工（有人猜是路加，因為提多書的用字與路加福音、使徒行傳頗有相近之處）；或是保羅生前留下的指示，在他殉道前後由門徒整理成信。這派的優點是同時照顧了「信中的保羅自述」與「文字風格的差異」，也符合古代書信常由書記執筆的習慣。</p><p><strong>難處：</strong>這派越往「門徒成書」那一頭走，就越難解釋信中那些極私人、時效極短的吩咐——「你要趕緊往尼哥坡里去見我」（3:12）、「你要趕緊給律師西納和亞波羅送行」（3:13）。這些話在保羅死後再寫出來，沒有意義。所以這一說若要成立，最多只能是「保羅生前、由書記執筆」，那就和第一說相去不遠了。</p>"],["託名說（第二代門徒假託保羅之名所寫）","","<p>今天多數批判學者認為，教牧書信是保羅死後（約主後 80--100 年或更晚）由保羅的追隨者以保羅之名寫成，目的是用使徒的權威回應第二代教會的問題：組織、假教訓、傳承。理由有四：字彙與文體、教會體制看起來較成熟、神學重點轉向「敬虔」與「純正的教訓」、以及與使徒行傳的時間線接不上——最後一條在提多書最明顯：使徒行傳裡找不到保羅在克里特設立教會的空檔。</p><p><strong>難處：</strong>提多書的體制其實很簡單，「長老」與「監督」在同一段裡互換使用（1:5--7），還沒有第二世紀那種一城一位主教的制度；腓立比書早就有「諸位監督，諸位執事」（腓 1:1）。初代教會對冒名的書信相當警覺，保羅自己就提醒過「冒我名的書信」（帖後 2:2）；一封冒名的信要寫得這麼私人、這麼瑣碎，還要被各地教會廣泛接受，很難想像。而且託名說要回答一個倫理問題：一封叫人「不說謊」、開頭稱神為「那無謊言的神」（1:2）的信，用一個假的署名寫成？持託名說的學者回答：古代學派常以老師之名寫作，讀者心知肚明，不算欺騙；但初代教會拒收託名之作的實例，使這個回答不容易成立。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：使徒保羅——沿用提摩太前書立場一（提前 ISS00_1），託名說並陳、理由與回應都講出來。</strong>講台上可以寫「保羅說」。可能有書記協助成文，這不影響這封信的使徒權柄。</p><p>本卷補的是時間線。最自然的排法是：使徒行傳停在保羅在羅馬「住了足足兩年」（徒 28:30）、「放膽傳講神國的道……並沒有人禁止」（徒 28:31）；他在腓立比書、腓利門書裡都盼望獲釋（腓 1:25；門 1:22），初代教會的傳統也支持他獲釋後再旅行：革利免一書說保羅到了「西方的盡頭」，穆拉多利殘篇說他從羅馬往西班牙去。獲釋以後，他與提多到克里特，留下提多收尾，自己往馬其頓、希臘一帶去，打算在尼哥坡里過冬（3:12）；之後再次被捕，寫了提摩太後書——那時「提多往撻馬太去」（提後 4:10）。徒 27 章那個路過克里特的囚犯，幾年後以自由人的身分回來，在那個當年勸人「不離開克里特」的島上，留下一位同工。</p><p>另有學者把克里特之行放在使徒行傳記載的空檔裡（例如以弗所三年之間的一次短行），本講義並陳，不排斥。<strong>講台只講一句：寫這封信的人，曾經也是「無知、悖逆、受迷惑」（3:3）的人；他沒有把自己放在克里特人之上，他說的是「我們從前也是」。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>作者與時間線的學術討論不該動搖你的信心。教會接受提多書為聖經，不是因為某一個學者證明了它的作者，而是因為歷代的教會在這封信裡聽見了福音：「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫」（3:5）。即使在作者問題上持不同看法的學者，也很少否認這兩段福音總綱（2:11--14；3:4--7）是新約最精煉的福音。</p><p>但有一件事該問自己：<strong>我讀這封信，是在研究保羅，還是在聽保羅所傳的那一位？</strong>保羅稱自己是「神的僕人」（1:1），把整封信的開頭放在「那無謊言的神在萬古之先所應許的永生」（1:2）。信的作者是誰值得認真；但信要我們認識的，是「神我們救主」。</p>"]],"con":[],"say":"本講義的全卷立場：提多書的作者是使徒保羅——沿用提摩太前書立場一，託名說並陳；本卷補時間線：使徒行傳只記保羅以囚犯身份路過克里特（徒 27:7--13），最自然的解法是保羅第一次羅馬監禁獲釋後再訪克里特，留下提多，自己往尼哥坡里過冬。講台可以說「保羅說」，但每一處都要落在「神我們救主」身上。","care":"席上會有讀神學院、或在網路上第一次讀到「教牧書信是託名之作」而心裡發慌的年輕人；也會有一聽見「學者說」就覺得受威脅的長輩。牧者要讓前者知道：你可以問，教會不怕這些問題，歷代教會早就面對過；要讓後者知道：誠實列出別人的理由，不等於失去信仰。不要說「懷疑作者的人都是不信派」「讀那些書的人信心有問題」，也不要為了顯得有學問，把託名說講得好像已成定論。陪那位發慌的年輕人一起讀 3:4--7，讓他看見這封信最在乎的，不是作者的名聲，而是神的憐憫。"},{"id":"ISS00_2","t":"性別、家庭與世代傳承——老年婦人教導少年婦人，「順服自己的丈夫」與「料理家務」今天是甚麼意思？","r":"2:2--6","ch":[],"why":"二、沿用提摩太前書立場二與以弗所書講義第 5 章；本卷補述：屬靈母親的職事（2:3--4）、οἰκουργούς「在家作工」是勤勞不是禁足、順服的目的是「免得神的道理被毀謗」；家暴不在順服的範圍。2:4--5 是全卷最容易被拿來「用經文管人」的一段：有人用「料理家務」把姊妹關在家裡，有人用「順服自己的丈夫」叫受暴力的妻子回家忍耐，也有人因為這幾節就把整封信丟在一邊。這一題要在開卷講定，因為它關乎會眾席上最脆弱的人的安全。","pos":[["【一】經文問的是甚麼","","<p>第 2 章是新約最完整的一份生活年齡表：老年人（2:2）、老年婦人（2:3）、少年婦人（2:4--5）、少年人（2:6）。保羅吩咐提多：「又勸老年婦人，舉止行動要恭敬，不說讒言，不給酒作奴僕，用善道教訓人，好指教少年婦人，愛丈夫，愛兒女」（2:3--4）；少年婦人要「謹守，貞潔，料理家務，待人有恩，順服自己的丈夫，免得神的道理被毀謗」（2:5）。</p><p>「料理家務」原文 SBLGNT 作 οἰκουργούς——「在家作工的」，是一個講勤勞的字；另有抄本作 οἰκουρούς——「看守家的」。和合本「料理家務」兩讀都容得下。值得注意的是：提摩太前書說「人若不看顧親屬，就是背了真道」（提前 5:8），箴言 31 章那位才德的婦人在家裡管理，也在外面買田、做生意；「在家作工」從來不是「不准出門」的意思。</p><p><strong>經文問的是：妻子的順服在今天是甚麼意思？是永遠的創造秩序，還是當時的宣教策略？「料理家務」是不是要姊妹留在家裡？老年婦人教導少年婦人，是一件可有可無的事，還是教會的職事？還有一個最實際的問題：受到暴力對待的妻子，這一節對她說甚麼？</strong></p>"],["互補派（夫妻同等尊貴，職分有別；順服是創造秩序的一部分）","","<p>許多改革宗、浸信會與華人福音派教會採這個讀法：男女同樣按神的形像被造、同樣「一同承受生命之恩」（彼前 3:7），但在婚姻裡，丈夫承擔帶領與捨己的責任，妻子以順服回應；這不是價值高低，是角色不同。理由是保羅在以弗所書把夫妻關係放在基督與教會的關係裡講（弗 5:22--33），而以弗所書同一段對丈夫的要求更重：「要愛你們的妻子，正如基督愛教會，為教會捨己」（弗 5:25）。</p><p><strong>難處：</strong>互補派最大的危險，是在講台上只講 2:5 的「順服」，不講同一節的目的「免得神的道理被毀謗」，也不講以弗所書裡丈夫的「捨己」。若這個讀法落到「丈夫說了算」，就違背了它自己的經文根據；而且提多書 2:5 從頭到尾是對妻子說的，沒有一句授權丈夫拿這一節去要求妻子。互補派若不清楚地說出「家暴不在順服的範圍」，就會被施暴的人拿來當擋箭牌。</p>"],["平等派（2:5 是宣教處境下的吩咐，今天的落點是彼此順服）","","<p>部分循道衛理、五旬宗傳統與部分福音派學者採這個讀法：2:5 的關鍵在後半句「免得神的道理被毀謗」——在第一世紀的希臘羅馬社會，妻子不順服丈夫會被看成破壞家庭、敗壞風俗，教會因此被毀謗；保羅要姊妹為了福音的名聲，在當時的家庭結構裡活出好見證。今天的社會看重夫妻平等，同一個原則（不讓福音被毀謗）落在今天，就是夫妻「當存敬畏基督的心，彼此順服」（弗 5:21）。他們也指出，保羅說「或男或女，因為你們在基督耶穌裡都成為一了」（加 3:28）。</p><p><strong>難處：</strong>平等派要回答：保羅在不同書信裡一再講妻子順服丈夫（弗 5:22；西 3:18），而且以弗所書用基督與教會作根據，不只是用社會風俗作根據；若一律說成「當時的策略」，讀者會問：那新約還有哪些吩咐也只是當時的策略？平等派若只講「平等」，不講同一節的「愛丈夫，愛兒女」、「謹守，貞潔」，也會把這一段的生命教導一併丟掉。</p>"],["傳統家庭主婦說（「料理家務」就是姊妹應當留在家中、不宜出外工作）","","<p>這是華人教會講台上常聽到的一種應用：根據 2:5「料理家務」（看守家的），主張已婚姊妹最好留在家中照顧家庭，出外工作、在教會擔任要職都是次好的選擇。這派的優點是重視家庭，提醒忙碌的一代：兒女需要有人陪伴，家不是旅館；它也抓住了 2:4「愛丈夫，愛兒女」的溫度。</p><p><strong>難處：</strong>這一說把一個講勤勞的字讀成了禁足的規條。SBLGNT 的 οἰκουργούς 強調的是「作工」，第一世紀的家庭本來就是生產單位，婦人在家裡紡織、經營、管理僕婢；箴言 31 章的婦人「想得田地就買來」（箴 31:16）。新約裡賣紫色布的呂底亞、和保羅一同製造帳棚的百基拉，都在外面工作，也都被保羅尊重。把 2:5 讀成「姊妹不該出外工作」，會讓單親媽媽、需要養家的妻子、蒙召在職場作見證的姊妹，背上本來不屬於經文的罪疚。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用提摩太前書立場二與以弗所書講義第 5 章——互補派與平等派在這件事上有真誠的不同，講義陳列而不裁判；兩邊都是弟兄姊妹，不論採哪一個讀法，都不可用這段經文貶低姊妹的價值、恩賜或屬靈地位。</strong>本卷補四點。</p><p>第一，<strong>順服的目的朝外</strong>：「免得神的道理被毀謗」（2:5）。順服是為了福音的名聲，不是為了丈夫的權力；這一節只對妻子說話，沒有一句授權丈夫拿它去要求妻子——誰拿這一節去管人，誰就離開了本位（見 ISS00_5）。</p><p>第二，<strong>家暴不在順服的範圍。</strong>遇到身體、言語、經濟、性方面的暴力或控制，教會的第一責任是<strong>先保護生命</strong>：協助她離開危險、就醫、<strong>依法求助</strong>（報警、申請保護令、聯絡家暴防治專線），<strong>教會協助通報</strong>並陪同尋求專業輔導。這不違背 2:5；使徒自己說過「順從神，不順從人，是應當的」（徒 5:29），而施暴本身就是違背神的。</p><p>第三，<strong>οἰκουργούς 是勤勞，不是禁足。</strong>2:5 讚美的是一個用心經營家的人，不是一條限制姊妹出外工作或服事的規定；家要經營，是夫妻兩人的事（弗 5:25；彼前 3:7）。</p><p>第四，<strong>屬靈母親的職事。</strong>2:3--4 是新約少見的「女性帶女性」的門徒訓練：提多是男性同工，保羅沒有叫他直接去教少年婦人，而是叫老年婦人「用善道教訓人」——原文 καλοδιδασκάλους，「教導美善的人」。這是 321「3 屬靈父母兒女」的女性版本：教會的世代傳承，需要一群屬靈母親。</p>"],["【四】這件事該不該影響你的信心","","<p>互補與平等之爭不該影響你的信心。兩邊都承認婚姻是神設立的、都承認丈夫要愛妻子如同基督愛教會、都承認姊妹同樣是「承受生命之恩的」。教會在這件事上有不同的實踐，這是真誠讀經的結果，不是有人不信。</p><p>但有一件事該影響你：<strong>我家裡的樣子，讓人更想認識福音，還是讓「神的道理被毀謗」？</strong>2:5 的眼光不在誰大誰小，在外人看見了甚麼。而這一切的根，是後面那一句：「他為我們捨了自己」（2:14）——在家裡先捨己的那一位，不會拿經文去要求別人捨己。</p>"]],"con":[],"say":"本講義的全卷立場：沿用提摩太前書立場二與以弗所書講義第 5 章——互補派與平等派都是弟兄姊妹，陳列而不裁判。本卷補：2:5 順服的目的是「免得神的道理被毀謗」，不是為了丈夫的權力；οἰκουργούς 是勤勞不是禁足；老年婦人教導少年婦人是屬靈母親的職事；家暴不在順服的範圍——先保護生命、依法求助、教會協助通報。","care":"席上可能就坐著一位每個主日都化了妝來遮傷痕的姊妹，她最怕聽見牧者說「要更順服」；也有被丈夫控制經濟、不准出門工作的妻子；有因為必須養家、沒辦法「留在家裡」而自責的單親媽媽；也有從小看著父親打母親、一聽見「順服」兩個字就全身發緊的年輕人。牧者講這一段，要在講台上清楚說出「家暴不在順服的範圍」，讓需要幫助的人知道可以來找誰；私下陪談時先確認她的安全，協助她就醫、報警、聯絡專線、找安全的住處，教會同工陪同通報。不要說「為了孩子再忍一忍」「是不是你哪裡做得不夠好」「家醜不可外揚」「為他禱告就好」；也不要在沒有確保她安全以前，安排夫妻一起輔導。"},{"id":"ISS00_3","t":"神的家的秩序——長老與監督是同一職分嗎？兒女不信主，父親還能作長老嗎？","r":"1:5--9","ch":[],"why":"三、沿用提摩太前書立場三（提前 ISS00_3）；本卷補述：1:5--7 長老與監督在同一段互換、監督是「神的管家」、1:6 πιστά 兩讀並陳——成年兒女的信仰不自動使父親失去資格。1:6「兒女也是信主的」比提摩太前書 3:4 讀起來更嚴，許多兒女還沒信主、或兒女正在叛逆的牧者與長老，每讀到這一節就覺得自己被判了不合格；另一方面，1:5--7 又是新約裡長老與監督是否同一職分最清楚的一處，牽涉到各宗派的教會體制。兩件事都需要在開卷講定，免得各章各說各話。","pos":[["【一】經文問的是甚麼","","<p>保羅把提多留在克里特，第一件任務是「在各城設立長老」（1:5）。接下來一口氣講資格：「若有無可指責的人，只作一個婦人的丈夫，兒女也是信主的，沒有人告他們是放蕩不服約束的，就可以設立」（1:6）；下一節立刻換了一個字：「監督既是神的管家，必須無可指責，不任性，不暴躁，不因酒滋事，不打人，不貪無義之財」（1:7）。1:5 說「長老」（πρεσβύτερος），1:7 說「監督」（ἐπίσκοπος），中間用「既是」（γάρ，因為）連起來，講的是同一批人。</p><p>1:6 的「信主的」原文是 πιστά。這個字在提多書裡出現過好幾次：1:9「真實的道理」原文是「可信的話」，3:8「這話是可信的」也是同一個字。所以它可以讀成「兒女是信主的」，也可以讀成「兒女是忠實可靠的」。<strong>經文問的是：長老與監督是同一個職分，還是兩個層級？1:6 是要求長老的兒女都必須已經信主嗎？成年兒女不信主，父親是否因此失去長老的資格？</strong></p>"],["長老與監督兩級說（監督是長老之上的獨立職分）","","<p>主教制的教會（天主教、東正教、聖公會等）認為，到了第二世紀初，各城教會已經有一位監督（主教）在眾長老之上，這是使徒傳承的發展；伊格那丟的書信就清楚區分主教、長老、執事三級。提多本人在克里特「在各城設立長老」，似乎也站在眾長老之上，是後來主教職分的雛形。這派的優點是重視教會的秩序與傳承，也提醒我們提多的角色確實特別。</p><p><strong>難處：</strong>在提多書本身，1:5 的「長老」與 1:7 的「監督」用「因為」連在一起，講的是同一批人；使徒行傳也一樣——保羅「打發人往以弗所去，請教會的長老來」（徒 20:17），接著對同一批人說「聖靈立你們作全群的監督」（徒 20:28）。提多是使徒的代表，不是一城的監督；所以本卷可以作為後來體制發展的背景，但不宜把第二世紀的三級制讀進提多書。</p>"],["「兒女必須已經信主」說（1:6 的嚴格讀法）","","<p>照和合本字面讀：長老的兒女必須「是信主的」。理由是長老的家是教會的縮影，「人若不知道管理自己的家，焉能照管神的教會呢？」（提前 3:5）；一個連自己的兒女都沒有帶到主面前的人，怎能帶領全教會？有些教會因此規定：兒女未信主、或已成年仍未受洗的，不按立為長老。這派的優點是認真看待家庭見證，也提醒作父母的：屬靈的傳承從家裡開始。</p><p><strong>難處：</strong>信心是神的恩賜，不是父親可以保證的成果；若把兒女是否信主當作父親的資格，等於把兒女的得救算成父親的業績。以西結書說「兒子必不擔當父親的罪孽，父親也不擔當兒子的罪孽」（結 18:20）。而且同一節後半自己解釋了重點：「沒有人告他們是放蕩不服約束的」——講的是家中的秩序與名聲，不是兒女得救的保證。照嚴格讀法，一個兒女年幼、還不能表達信仰的弟兄也不能作長老，這顯然不是保羅的意思。</p>"],["「兒女忠實可靠」說（πιστά 指品格：受管教、不放蕩）","","<p>許多註釋家主張 πιστά 在這裡是「忠實可靠的」，和同節後半「不是放蕩不服約束的」對照：重點是兒女在家中受到管教、有秩序、有好名聲，與提摩太前書「使兒女凡事端莊順服」（提前 3:4）平行。理由是 πιστός 在教牧書信裡多次作「可信的、可靠的」，而且保羅在列資格時講的幾乎全是可以觀察的品格與行為，不是內心的狀態。</p><p><strong>難處：</strong>這一讀若被推得太遠，會變成「兒女信不信都無所謂，只要乖就好」，把屬靈傳承的分量講輕了；在克里特那個假教訓「敗壞人的全家」（1:11）的處境裡，保羅確實在乎長老的家是不是站在真道上。而且在第一世紀的家庭，家主信主，全家往往一同受洗（這使我們想起徒 16:33），所以「信主的」與「可靠的」在當時的處境裡，距離沒有今天那麼遠。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用提摩太前書立場三——職分的資格幾乎全是品格；品格先於恩賜，生命先於事工；不以本卷裁判主教制、長老制、會眾制。</strong>本卷補三點。</p><p>第一，<strong>1:5--7 長老與監督在同一段互換</strong>，是新約裡兩個稱呼指同一職分最清楚的一處：「長老」說的是成熟，「監督」說的是看顧。各宗派後來的體制發展，是教會歷史的問題，不在本卷定案。</p><p>第二，<strong>監督是「神的管家」</strong>（1:7）——管家管的是主人的家，不是自己的家；所以資格清單的第一個否定詞是「不任性」（αὐθάδης，自己說了算）。這是 321「有己與驕傲」最具體的試金石。</p><p>第三，<strong>1:6 πιστά 兩讀並陳</strong>，以同節後半「沒有人告他們是放蕩不服約束的」為主軸：重點是家中的秩序與名聲。<strong>成年兒女不信主，不自動使父親失去資格</strong>；教會在按立時要看的，是這位弟兄怎樣愛、怎樣管教、怎樣在兒女的軟弱中仍然站在神面前。1:6「只作一個婦人的丈夫」回指提摩太前書講義第 3 章的四讀處理（以「專一忠誠」為主軸），本卷不重開戰場。</p>"],["【四】這件事該不該影響你的信心","","<p>長老與監督是一級還是兩級、πιστά 怎樣翻，這些討論不該影響你的信心；各宗派的教會都在這兩節裡看見同一件事：神的家要交給品格可靠的人。</p><p>但有一件事該問自己：<strong>我是用這一段來檢查別人的家，還是用它來省察自己的心？</strong>資格清單是給提多「設立」人用的，不是給會眾「審判」牧者家庭用的。而清單最深的一條，在 1:7 的「神的管家」：家是神的，兒女也是神的；作父母的盡了本分以後，可以把兒女交在那位「照他的憐憫」（3:5）救人的神手裡。</p>"]],"con":[],"say":"本講義的全卷立場：沿用提摩太前書立場三——職分的資格幾乎全是品格，不以本卷裁判任何教會體制。本卷補：1:5--7 長老與監督在同一段互換，監督是「神的管家」；1:6 πιστά「信主的／忠實可靠的」兩讀並陳，重點是家中的秩序與名聲；成年兒女不信主，不自動使父親失去資格。","care":"席上會有兒女離開教會多年、每次讀到 1:6 就低下頭的長老與牧師；有兒女正在叛逆、不敢在小組裡提家裡事的父母；也有牧者家庭的孩子，從小被人盯著看「牧師的小孩怎麼這樣」，長大後最怕的就是這一節。牧者要先安慰作父母的：兒女的信仰是神的工作，你盡了本分，就把他交給神；再陪他為兒女禱告，不放棄、也不硬逼。不要在講台上把任何同工的孩子當作反面例子，不要說「自己家都管不好還想服事」「孩子不信一定是父母沒做好」；也不要讓牧者的孩子覺得，他的信仰是父親職位的條件。"},{"id":"ISS00_4","t":"恩典與善行——得救不靠行為，為甚麼處處講善行？怎樣走在律法主義與廉價恩典之間？","r":"1:16；2:11--14；3:5--8；3:14","ch":[],"why":"四、本卷新立：得救的根是憐憫，不是行為（3:5）；恩典本身會教人（2:12）；善行是被贖的目的（2:14）；善行是可以學的（3:14）。拒絕行為主義，也拒絕廉價恩典；保羅與雅各不衝突。「善行」「善事」在提多書三章裡一再出現，這是全卷最大的主題，也是華人教會最容易兩邊跌倒的地方：一邊是「做得夠好才算好基督徒」，一邊是「反正得救了，怎樣活都可以」——兩邊都不是提多書的福音。這一題若不在開卷講定，整卷書會被講成一份檢查行為的清單，或被講成一句與生活無關的恩典口號。","pos":[["【一】經文問的是甚麼","","<p>提多書用善行把全卷框起來：開頭的假師傅「說是認識神，行事卻和他相背；本是可憎惡的，是悖逆的，在各樣善事上是可廢棄的」（1:16）；結尾的吩咐是「我們的人要學習正經事業，預備所需用的，免得不結果子」（3:14）。中間兩段福音總綱，一段說「神救眾人的恩典已經顯明出來，教訓我們除去不敬虔的心和世俗的情慾，在今世自守、公義、敬虔度日」（2:11--12），結論是「特作自己的子民，熱心為善」（2:14）；另一段說「他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫」（3:5），三節之後又說「使那些已信神的人留心做正經事業」（3:8）。</p><p><strong>經文問的是：既然得救不靠行為，為甚麼提多書處處講善行？行善不夠的人得救了嗎？恩典是叫人放鬆，還是叫人更嚴格？保羅說「不是因我們自己所行的義」，雅各說「信心沒有行為也是死的」（雅 2:26），兩人衝突嗎？</strong></p>"],["行為主義（善行是保持得救、或證明夠格的條件）","","<p>這種立場很少有人在講台上明說，卻常常在教會生活裡運作：一個人是不是「好基督徒」，看他讀經幾章、聚會幾次、奉獻多少、服事幾項；做得少的人心裡不安，覺得神不太喜悅自己。它的理由看起來很有經文根據：提多書一再要人「留心做正經事業」（3:8），還說不行善的人「在各樣善事上是可廢棄的」（1:16）。這派的優點是認真看待聖潔，不讓恩典變成藉口。</p><p><strong>難處：</strong>它把次序顛倒了。3:5 先說「並不是因我們自己所行的義，乃是照他的憐憫」，3:8 才說「留心做正經事業」；善行是果，不是根。以弗所書說得更清楚：「你們得救是本乎恩，也因著信……也不是出於行為，免得有人自誇」（弗 2:8--9）。行為主義最後養出兩種人：做得到的人變得驕傲、愛檢查別人；做不到的人變得疲倦、不敢回到神面前——兩種都是有己。</p>"],["廉價恩典（得救既是白白的，生命改變就是可有可無的）","","<p>這是另一邊的跌倒：既然得救全是恩典，那麼怎樣活都不影響得救，講善行就是律法主義。有些講台把「恩典」講成只有赦免、沒有改變；信徒聽到的是「你已經被接納了」，卻從來沒聽到「恩典會教你」。這派的優點是保護了恩典的白白，讓被律法壓傷的人得以喘息，也提醒教會不要用行為衡量人的得救。</p><p><strong>難處：</strong>提多書正面擋住了這一條路。2:11--12 說恩典顯明出來的第一件事，就是「教訓我們」——原文 παιδεύουσα，像父母養育孩子那樣天天教；2:14 說基督捨己的目的，是要「特作自己的子民，熱心為善」。不教人改變的「恩典」，不是提多書的恩典。保羅在羅馬書也問過同樣的問題：「我們可以仍在罪中、叫恩典顯多嗎？斷乎不可！」（羅 6:1--2）1:16 的假師傅正是「說是認識神，行事卻和他相背」的人。</p>"],["保羅與雅各衝突說（保羅講因信稱義，雅各講因行為稱義）","","<p>從馬丁路德稱雅各書為「稻草書信」開始，就有人認為保羅與雅各在這件事上說法不同：保羅說「人稱義是因著信，不在乎遵行律法」（羅 3:28），雅各說「人稱義是因著行為，不是單因著信」（雅 2:24）。這派的優點是誠實面對兩段經文表面上的張力，不假裝它不存在。</p><p><strong>難處：</strong>兩人反對的對象不同：保羅反對的是「靠行律法換得稱義」，雅各反對的是「口稱有信、生命沒有改變」——後者正是提多書 1:16 的假師傅。提多書本身就把兩個重點放在同一段裡：3:5 不是因我們所行的義，3:7「因他的恩得稱為義」，3:8 留心做正經事業。保羅自己也說：「我們原是他的工作，在基督耶穌裡造成的，為要叫我們行善」（弗 2:10），又說「惟獨使人生發仁愛的信心才有功效」（加 5:6）。保羅與雅各是站在同一條路的兩邊，各自擋住一個懸崖。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場（本卷新立）：得救的根是憐憫，善行是被贖的果子；拒絕行為主義，也拒絕廉價恩典；保羅與雅各不衝突。</strong>提多書自己說了四件事：①<strong>得救的根是憐憫，不是行為</strong>（3:5）；②<strong>恩典本身會教人</strong>（2:11--12）——恩典不只是赦免的宣告，也是改變的力量；③<strong>善行是被贖的目的</strong>（2:14）——不行善的「恩典」不是提多書的恩典；④<strong>善行是可以學的</strong>（3:14「學習」，μανθανέτωσαν）——行善行得不好的人，需要的是被教、被帶，不是被定罪。</p><p>所以本講義：不以行善的多少衡量一個人是否真得救；也不以「已經得救」作為不改變的理由。引 3:8 必帶 3:5；引 1:15「在潔淨的人，凡物都潔淨」必帶同節後半「連心地和天良也都污穢了」——潔淨是心的事，不是放縱的許可證。也不把 3:8 的「正經事業」講成教會的事工指標：原文 καλῶν ἔργων 是「美好的事」，和合本註腳作「或譯：留心行善」，指的是日常生活裡實在的善，不是報表上的數字。</p><p><strong>321 的落點：「先生命，再關係，後事工」——第 3 章的次序就是 3:5 憐憫（生命）→ 3:2 溫柔（關係）→ 3:8 正經事業（事工）。善行若是為了證明自己，那是有己；善行若是因為「他為我們捨了自己」（2:14），那是無己。捨己的是他，熱心的是我們。</strong>信心與行為的詳細處理，回指雅各書講義第 2 章。</p>"],["【四】這件事該不該影響你的信心","","<p>神學家怎樣描述信心與行為的關係，用詞或有不同，這不該影響你的信心；歷代正統教會都同意：人得救全是神的恩典，得救的人必然結出果子。</p><p>但有一件事該問自己：<strong>我行善，是為了讓神接納我，還是因為神已經接納了我？</strong>前者會越做越累、越做越會比較；後者會越做越自由。如果你這陣子行善行得很疲倦，請回到 3:4 那一句：「神我們救主的恩慈和他向人所施的慈愛顯明的時候」——先被愛，再去愛；先被救，再去行。</p>"]],"con":[],"say":"本講義的全卷立場（本卷新立）：得救的根是神的憐憫，不是我們所行的義（3:5）；恩典顯明出來，就會教我們（2:12）；善行是被贖的目的，不是得救的條件（2:14；3:8）。拒絕行為主義，也拒絕廉價恩典；保羅與雅各不衝突。","care":"席上會有兩種受傷的人：一種是在要求很高的教會長大、永遠覺得自己做得不夠、一聽到「善行」就喘不過氣的人；另一種是曾經被人用「你還有罪，怎麼算得救」審判過，從此不敢談生命改變的人。也會有剛信主、生活還一團亂的新朋友。牧者對前者要先講 3:5，讓他知道接納在先；對後者要溫柔地講 2:12，讓他知道恩典會慢慢教他，不是一夜之間。不要說「你這樣也算基督徒嗎」「行為不好的人大概沒有真得救」，也不要說「反正都蒙恩了，改不改不重要」；更不要把服事的多少，當作衡量一個人屬靈與否的尺。"},{"id":"ISS00_5","t":"順服的界線——在家庭、職場與政府面前，基督徒要順服到甚麼程度？","r":"2:5；2:9--10；3:1--2","ch":[],"why":"五、本卷新立：三段順服都朝外——為了福音的名聲，不是為了任何人的權力；三段都只對順服的一方說話，沒有授權掌權者強迫別人；遇到要求犯罪、違背良心或危害生命時，「順從神，不順從人」（徒 5:29）；家暴與剝削不在順服的範圍。提多書有三段「順服」：妻子（2:5）、僕人（2:9）、作官的（3:1）。這三段在教會歷史上被用來壓迫過婦女、替奴隸制辯護、要求信徒對任何權力閉口；也有人因此把整封信當成壓迫的工具丟掉。這一題要把三段放在一起講清楚。","pos":[["【一】經文問的是甚麼","","<p>三段順服，各有一句朝外的目的。少年婦人要「順服自己的丈夫，免得神的道理被毀謗」（2:5）；僕人要「順服自己的主人，凡事討他的喜歡，不可頂撞他，不可私拿東西，要顯為忠誠，以致凡事尊榮我們救主神的道」（2:9--10）；眾人要「順服作官的、掌權的，遵他的命，預備行各樣的善事。不要毀謗，不要爭競，總要和平，向眾人大顯溫柔」（3:1--2）。</p><p>值得注意的是：三段都只對順服的一方說話；提多書裡沒有一句對丈夫、主人、官長說「你要叫他們順服」。3:1「遵他的命」原文 πειθαρχεῖν，和使徒在公會前說「順從神，不順從人，是應當的」（徒 5:29）是同一個字。<strong>經文問的是：妻子要順服丈夫到甚麼程度？員工要順服老闆到甚麼程度？基督徒要順服政府到甚麼程度？有沒有不可以順服的時候？這幾節能不能拿來要求別人順服？</strong></p>"],["無條件順服說（順服就是不問、不辯、不拒絕）","","<p>這種讀法在講台上常以溫和的方式出現：神既然吩咐順服，順服就不該附加條件；妻子順服丈夫、員工順服老闆、百姓順服政府，即使對方不合理，也要忍耐，把結果交給神。它會引用「在上有權柄的，人人當順服他，因為沒有權柄不是出於神的」（羅 13:1）。這派的優點是認真對待經文的吩咐，也提醒我們：順服常常需要放下自己的意見，這是真實的屬靈功課。</p><p><strong>難處：</st
